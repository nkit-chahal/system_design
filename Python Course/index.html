<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Masterclass Hub</title>
  <meta name="description" content="17-lesson Python masterclass from basics to advanced, including statistics and SQL.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --font-main: 'Inter', -apple-system, sans-serif;
  --font-heading: 'Outfit', var(--font-main);
  --font-mono: 'JetBrains Mono', monospace;
  --bg-body: #0f172a;
  --bg-surface: #1e293b;
  --bg-elevated: #334155;
  --bg-glass: rgba(15, 23, 42, 0.7);
  --bg-card: #1e293b;
  --border: rgba(255, 255, 255, 0.1);
  --border-hover: #3b82f6;
  --text-1: #f8fafc;
  --text-2: #94a3b8;
  --text-3: #64748b;
  --primary: #3b82f6;
  --primary-glow: rgba(59, 130, 246, 0.3);
  --emerald: #10b981;
  --amber: #f59e0b;
  --pink: #ec4899;
  --radius: 12px;
  --tr: 0.3s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="light"] {
  --bg-body: #f8fafc;
  --bg-surface: #ffffff;
  --bg-elevated: #f1f5f9;
  --bg-glass: rgba(255, 255, 255, 0.8);
  --bg-card: #ffffff;
  --border: rgba(148, 163, 184, 0.3);
  --border-hover: #3b82f6;
  --text-1: #0f172a;
  --text-2: #475569;
  --text-3: #94a3b8;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-main);
  background: var(--bg-body);
  color: var(--text-1);
  line-height: 1.6;
  min-height: 100vh;
  transition: background var(--tr), color var(--tr);
}

a { text-decoration: none; color: inherit; }
button { cursor: pointer; font-family: var(--font-main); border: none; background: none; }

/* Header */
.header-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  height: 60px;
  background: var(--bg-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2rem;
}

.brand-area {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.brand-logo {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  color: white;
}

.brand-text h1 {
  font-family: var(--font-heading);
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-1);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.btn-icon {
  width: 38px;
  height: 38px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--text-1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  transition: all var(--tr);
}
.btn-icon:hover {
  background: var(--bg-elevated);
  border-color: var(--border-hover);
  transform: translateY(-2px);
}

/* Layout Wrapper */
.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem 1.5rem 5rem;
}

/* Hero */
.hero {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 2rem;
  margin-bottom: 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: '';
  position: absolute;
  top: -50px; right: -50px;
  width: 200px; height: 200px;
  background: var(--primary-glow);
  filter: blur(80px);
  z-index: 0;
  border-radius: 50%;
}

.hero-content {
  position: relative;
  z-index: 1;
}

.hero h2 {
  font-family: var(--font-heading);
  font-size: 2rem;
  margin-bottom: 0.5rem;
}
.hero p {
  color: var(--text-2);
  max-width: 600px;
}

.prog-box {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.25rem;
  min-width: 300px;
  position: relative;
  z-index: 1;
}

.prog-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.75rem;
  font-weight: 600;
}
.prog-pct {
  font-family: var(--font-mono);
  color: var(--primary);
  font-size: 1.2rem;
}
.prog-bar {
  width: 100%;
  height: 10px;
  background: var(--bg-body);
  border-radius: 10px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #3b82f6, #8b5cf6);
  border-radius: 10px;
  transition: width 0.6s ease;
}

/* Category Headers */
.cat-header {
  font-family: var(--font-heading);
  font-size: 1.5rem;
  margin: 3rem 0 1.5rem;
  padding-bottom: 0.5rem;
  border-bottom: 2px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

/* Lesson Grid */
.lessons-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1.5rem;
}

.lesson-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  transition: all var(--tr);
  position: relative;
  overflow: hidden;
}
.lesson-card:hover {
  transform: translateY(-5px);
  border-color: var(--border-hover);
  box-shadow: 0 12px 30px rgba(0,0,0,0.15);
}

.lesson-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 4px; height: 100%;
  background: var(--card-color, var(--primary));
  opacity: 0.5;
  transition: opacity var(--tr);
}
.lesson-card:hover::before {
  opacity: 1;
}
.lesson-card.done::before {
  background: var(--emerald);
  opacity: 1;
}

.lc-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 1rem;
}
.lc-num {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 700;
  padding: 0.2rem 0.5rem;
  border-radius: 6px;
  background: var(--bg-elevated);
  color: var(--text-2);
  border: 1px solid var(--border);
}
.lc-title {
  font-family: var(--font-heading);
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 1rem;
  flex-grow: 1;
}
.lc-bot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--border);
  padding-top: 1rem;
  margin-top: auto;
}
.lc-time {
  font-size: 0.8rem;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.btn-open {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.4rem 1rem;
  border-radius: 6px;
  background: var(--primary);
  color: white;
  font-size: 0.85rem;
  font-weight: 600;
  transition: all var(--tr);
}
.btn-open:hover {
  background: #2563eb;
  box-shadow: 0 4px 12px var(--primary-glow);
}
.btn-open.done {
  background: var(--bg-elevated);
  border: 1px solid var(--emerald);
  color: var(--emerald);
}
.btn-open.done:hover {
  background: var(--emerald);
  color: white;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-left: 4px solid var(--emerald);
  padding: 1rem 1.5rem;
  border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  z-index: 2000;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.toast.show {
  transform: translateY(0);
  opacity: 1;
}
  </style>
</head>
<body>

  <header class="header-bar">
    <div class="brand-area">
      <div class="brand-logo">🐍</div>
      <div class="brand-text">
        <h1>Python Masterclass</h1>
      </div>
    </div>
    <div class="header-actions">
      <button id="theme-toggle" class="btn-icon" title="Toggle Theme">☀️</button>
    </div>
  </header>

  <div class="wrap">
    <div class="hero">
      <div class="hero-content">
        <h2>From Zero to Python Hero</h2>
        <p>17 interactive lessons covering syntax through advanced Python, plus statistics, hypothesis testing, and SQL analytics.</p>
      </div>
      <div class="prog-box">
        <div class="prog-top">
          <span>Overall Progress</span>
          <span id="prog-pct" class="prog-pct">0%</span>
        </div>
        <div class="prog-bar"><div id="prog-fill" class="prog-fill"></div></div>
        <div style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-3); text-align: right;">
          <span id="prog-count">0/17 Completed</span>
        </div>
      </div>
    </div>

    <div id="course-content"></div>
  </div>

  <div id="toast" class="toast">
    <span>✅</span>
    <span id="toast-msg">Progress saved locally!</span>
  </div>

  <script>
    const PYTHON_LESSONS = [
      { id: "python-course-1", category: "Beginner Series", num: 1, title: "Installation, Syntax & Variables", path: "001 Installation, Syntax & Variables.html", readTimeMin: 8, color: "#10b981" },
      { id: "python-course-2", category: "Beginner Series", num: 2, title: "Operators, Conditionals & User Input", path: "002 Operators, Conditionals & User Input.html", readTimeMin: 10, color: "#10b981" },
      { id: "python-course-3", category: "Beginner Series", num: 3, title: "Loops & Iteration (While, For Loops)", path: "003 Loops & Iteration (While, For Loops).html", readTimeMin: 12, color: "#10b981" },
      { id: "python-course-4", category: "Beginner Series", num: 4, title: "Sequences, Collections & Dictionaries", path: "004 Sequences, Collections & Dictionaries.html", readTimeMin: 15, color: "#10b981" },
      { id: "python-course-5", category: "Beginner Series", num: 5, title: "Functions & Exception Handling", path: "005 Functions & Exception Handling.html", readTimeMin: 14, color: "#10b981" },
      { id: "python-course-6", category: "Intermediate Series", num: 6, title: "File Operations & Logging", path: "006 File Operations & Logging.html", readTimeMin: 12, color: "#3b82f6" },
      { id: "python-course-7", category: "Intermediate Series", num: 7, title: "Classes, Objects & Encapsulation", path: "007 Classes, Objects & Encapsulation.html", readTimeMin: 18, color: "#3b82f6" },
      { id: "python-course-8", category: "Intermediate Series", num: 8, title: "Inheritance & Method Overriding", path: "008 Inheritance & Method Overriding.html", readTimeMin: 15, color: "#3b82f6" },
      { id: "python-course-9", category: "Intermediate Series", num: 9, title: "Multithreading, Synchronization & Queues", path: "009 Multithreading, Synchronization & Queues.html", readTimeMin: 20, color: "#3b82f6" },
      { id: "python-course-10", category: "Intermediate Series", num: 10, title: "Sockets, Network & Database Programming", path: "010 Sockets, Network & Database Programming.html", readTimeMin: 22, color: "#3b82f6" },
      { id: "python-course-11", category: "Intermediate Series", num: 11, title: "Recursion & XML Processing", path: "011 Recursion & XML Processing.html", readTimeMin: 14, color: "#3b82f6" },
      { id: "python-course-12", category: "Advanced Series", num: 12, title: "Magic Methods & Dunder Protocols", path: "012 Magic Methods & Dunder Protocols.html", readTimeMin: 18, color: "#f59e0b" },
      { id: "python-course-13", category: "Advanced Series", num: 13, title: "Decorators & Generators", path: "013 Decorators & Generators.html", readTimeMin: 20, color: "#f59e0b" },
      { id: "python-course-14", category: "Advanced Series", num: 14, title: "Argument Parsing & Type Hinting", path: "014 Argument Parsing & Type Hinting.html", readTimeMin: 15, color: "#f59e0b" },
      { id: "python-course-15", category: "Advanced Series", num: 15, title: "Python Design Patterns - Factory, Singleton, Proxy & Composite", path: "015 Python Design Patterns - Factory, Singleton, Proxy & Composite.html", readTimeMin: 25, color: "#f59e0b" },
      { id: "python-course-16", category: "Advanced Series", num: 16, title: "Statistics, Probability & Hypothesis Testing", path: "016 Statistics, Probability & Hypothesis Testing.html", readTimeMin: 22, color: "#f59e0b" },
      { id: "python-course-17", category: "Advanced Series", num: 17, title: "SQL for Analytics & Product Metrics", path: "017 SQL for Analytics & Product Metrics.html", readTimeMin: 20, color: "#f59e0b" }
    ];

    (function(){
      try {
        const SK_DONE = 'ipmh_done_v2';
        const SK_TH = 'ipmh_th_v2';
        
        let done = new Set(JSON.parse(localStorage.getItem(SK_DONE) || '[]'));
        let theme = localStorage.getItem(SK_TH) || 'dark';

        const $ = id => document.getElementById(id);
        
        function setTheme(t) {
          theme = t;
          document.documentElement.setAttribute('data-theme', t);
          localStorage.setItem(SK_TH, t);
          $('theme-toggle').innerHTML = t === 'dark' ? '☀️' : '🌙';
        }

        $('theme-toggle').addEventListener('click', () => {
          setTheme(theme === 'dark' ? 'light' : 'dark');
        });
        setTheme(theme);

        function showToast(msg) {
          $('toast-msg').textContent = msg;
          $('toast').classList.add('show');
          setTimeout(() => $('toast').classList.remove('show'), 3000);
        }

        function updateProgress() {
          const total = PYTHON_LESSONS.length;
          const count = done.size;
          const pct = Math.round((count / total) * 100);
          
          $('prog-pct').textContent = pct + '%';
          $('prog-fill').style.width = pct + '%';
          $('prog-count').textContent = `${count}/${total} Completed`;
        }

        function render() {
          const container = $('course-content');
          container.innerHTML = '';

          const categories = {};
          PYTHON_LESSONS.forEach(l => {
            if (!categories[l.category]) categories[l.category] = { color: l.color, lessons: [] };
            categories[l.category].lessons.push(l);
          });

          for (const [catName, catData] of Object.entries(categories)) {
            const header = document.createElement('div');
            header.className = 'cat-header';
            header.innerHTML = `<span style="color: ${catData.color}">■</span> ${catName}`;
            container.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'lessons-grid';

            catData.lessons.forEach(l => {
              const isDone = done.has(l.id);
              const card = document.createElement('div');
              card.className = `lesson-card ${isDone ? 'done' : ''}`;
              card.style.setProperty('--card-color', l.color);
              
              card.innerHTML = `
                <div class="lc-top">
                  <span class="lc-num">#${l.num.toString().padStart(2, '0')}</span>
                </div>
                <h3 class="lc-title">${l.title}</h3>
                <div class="lc-bot">
                  <span class="lc-time">⏱️ ${l.readTimeMin} min read</span>
                  <a href="${l.path}" class="btn-open ${isDone ? 'done' : ''}">
                    ${isDone ? 'Review' : 'Start'} ➔
                  </a>
                </div>
              `;
              grid.appendChild(card);
            });

            container.appendChild(grid);
          }
          updateProgress();
        }

        // Allow lessons to call back and mark as done
        window.markLessonDone = function(id) {
          done.add(id);
          localStorage.setItem(SK_DONE, JSON.stringify([...done]));
          render();
          showToast('Lesson marked as completed!');
        };

        render();
      } catch (err) {
        document.getElementById('course-content').innerHTML = `<div style="color:red; padding: 2rem;">Error initializing dashboard: ${err.message}</div>`;
      }
    })();
  </script>
</body>
</html>
