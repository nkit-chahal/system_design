  <text x="458" y="172" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#111">- sample size</text>
  <text x="458" y="194" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#111">- guardrails</text>
  <text x="458" y="216" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#111">- multiple testing</text>
