<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="25" class="title">L2 Regularization vs Decoupled Weight Decay: Adam vs AdamW</text>
  <text x="25" y="45" class="sm" fill="#555">Why standard L2 regularization distorts adaptive learning rates, and how Loshchilov &amp; Hutter decoupled it</text>

  <!-- Left: Standard L2 in Adam -->
  <rect x="25" y="65" width="375" height="245" rx="6" class="red"/>
  <text x="212" y="90" text-anchor="middle" class="b" fill="#b85450">Standard Adam with L2 Regularization</text>
  <text x="212" y="110" text-anchor="middle" class="sm">Penalty term added to loss gradient: g_t + lambda * theta</text>

  <rect x="40" y="125" width="345" height="52" rx="4" class="white"/>
  <text x="50" y="146" class="sm b">Second Moment Distortion:</text>
  <text x="50" y="165" class="sm">v_t = beta2 * v_t-1 + (1 - beta2) * (g_t + lambda * theta)^2</text>

  <rect x="40" y="185" width="345" height="55" rx="4" class="white"/>
  <text x="50" y="206" class="sm b">Resulting Parameter Update:</text>
  <text x="50" y="226" class="sm">theta_t+1 = theta_t - lr * (m_hat / (sqrt(v_hat) + eps))</text>

  <rect x="40" y="248" width="345" height="52" rx="4" class="white"/>
  <text x="50" y="268" class="sm b" fill="#b85450">Flaw: Unequal Weight Decay</text>
  <text x="50" y="287" class="sm">Large gradients inflate v_t, suppressing decay!</text>

  <!-- Right: Decoupled Weight Decay in AdamW -->
  <rect x="420" y="65" width="375" height="245" rx="6" class="green"/>
  <text x="607" y="90" text-anchor="middle" class="b" fill="#05673d">AdamW: Decoupled Weight Decay</text>
  <text x="607" y="110" text-anchor="middle" class="sm">Weight decay decoupled from gradient moments</text>

  <rect x="435" y="125" width="345" height="52" rx="4" class="white"/>
  <text x="445" y="146" class="sm b">Clean Moment Tracking:</text>
  <text x="445" y="165" class="sm">v_t tracks pure loss gradient: g_t^2 (no penalty mix-in)</text>

  <rect x="435" y="180" width="345" height="60" rx="4" class="white"/>
  <text x="445" y="200" class="sm b">Decoupled Parameter Update:</text>
  <text x="445" y="217" class="sm">theta_t+1 = theta_t - lr * (m_hat / (sqrt(v_hat) + eps))</text>
  <text x="500" y="233" class="sm b" fill="#05673d">- lr * lambda * theta_t (Direct weight decay)</text>

  <rect x="435" y="248" width="345" height="52" rx="4" class="white"/>
  <text x="445" y="268" class="sm b" fill="#05673d">Benefit: Uniform Scale-Free Shrinkage</text>
  <text x="445" y="287" class="sm">All weights regularized proportionally to learning rate</text>
</svg>
