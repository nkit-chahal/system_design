<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="25" class="title">Dynamic Range: Why FP16 Needs Loss Scaling and BF16 Does Not</text>
  <text x="25" y="45" class="sm" fill="#555">Gradient underflow in narrow 5-bit exponent vs native 8-bit exponent coverage (illustrative)</text>

  <!-- Left: FP16 with Loss Scaling -->
  <rect x="25" y="65" width="375" height="245" rx="6" class="gray"/>
  <text x="212" y="88" text-anchor="middle" class="b">FP16: 5-Bit Exponent (Max 65,504)</text>
  <text x="212" y="106" text-anchor="middle" class="sm">Min normal: 6.1e-5 (Underflow threshold)</text>

  <!-- Underflow zone -->
  <rect x="40" y="125" width="140" height="95" rx="4" class="red"/>
  <text x="110" y="150" text-anchor="middle" class="sm b" fill="#b85450">Underflow Zone</text>
  <text x="110" y="170" text-anchor="middle" class="sm">&lt; 6.1e-5</text>
  <text x="110" y="195" text-anchor="middle" class="sm">Rounds to 0.0</text>

  <!-- Representable zone -->
  <rect x="185" y="125" width="200" height="95" rx="4" class="green"/>
  <text x="285" y="150" text-anchor="middle" class="sm b" fill="#05673d">Representable FP16</text>
  <text x="285" y="170" text-anchor="middle" class="sm">[6.1e-5, 65,504]</text>
  <text x="285" y="195" text-anchor="middle" class="sm">Shifted by Scaler</text>

  <!-- Shift arrow -->
  <path d="M 110 205 L 110 235 L 240 235" class="edge"/>
  <text x="175" y="250" text-anchor="middle" class="sm b" fill="#005cc5">Multiply Loss by S (e.g. 65,536)</text>

  <rect x="40" y="260" width="345" height="40" rx="4" class="white"/>
  <text x="212" y="284" text-anchor="middle" class="sm" fill="#b85450">Requires GradScaler; skips steps on overflow</text>

  <!-- Right: BF16 Native Range -->
  <rect x="420" y="65" width="375" height="245" rx="6" class="green"/>
  <text x="607" y="88" text-anchor="middle" class="b" fill="#05673d">BF16: 8-Bit Exponent (Same as FP32)</text>
  <text x="607" y="106" text-anchor="middle" class="sm">Min normal: 1.17e-38, Max: 3.39e38</text>

  <!-- Wide coverage bar -->
  <rect x="435" y="125" width="345" height="95" rx="4" class="white"/>
  <text x="607" y="150" text-anchor="middle" class="sm b" fill="#05673d">Universal Dynamic Range</text>
  <text x="607" y="172" text-anchor="middle" class="sm">Gradients down to 1e-38 naturally represented</text>
  <text x="607" y="195" text-anchor="middle" class="sm b" fill="#005cc5">Zero underflow risk for transformer gradients</text>

  <rect x="435" y="235" width="345" height="65" rx="4" class="white"/>
  <text x="607" y="257" text-anchor="middle" class="sm b" fill="#05673d">No Loss Scaling Required</text>
  <text x="607" y="275" text-anchor="middle" class="sm">• No GradScaler code complexity</text>
  <text x="607" y="291" text-anchor="middle" class="sm">• No inter-GPU overflow reduction sync</text>
</svg>
