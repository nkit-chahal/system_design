<svg xmlns="http://www.w3.org/2000/svg" width="840" height="370" viewBox="0 0 840 370" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .b { font-weight: bold; }
    .title { font-size: 16px; font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .edge { fill: none; stroke: #000; stroke-width: 1.2; marker-end: url(#arrow); }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="24" class="title">Incident Triage: Diagnosing and Mitigating a Loss Spike</text>
  <text x="25" y="42" class="sm" fill="#555">Systematic decision flow for on-call engineers when training loss spikes or diverges.</text>

  <!-- Node 0: Alert Trigger -->
  <rect x="25" y="58" width="170" height="42" rx="4" class="red"/>
  <text x="110" y="76" text-anchor="middle" class="b sm">Loss Spike Detected</text>
  <text x="110" y="92" text-anchor="middle" class="sm">Loss &gt; 3σ above moving avg</text>

  <path d="M195,79 L225,79" class="edge"/>

  <!-- Node 1: NaN or Finite? -->
  <rect x="225" y="58" width="165" height="42" rx="4" class="purple"/>
  <text x="307" y="76" text-anchor="middle" class="b sm">1. Is Loss NaN or Inf?</text>
  <text x="307" y="92" text-anchor="middle" class="sm">Step output check</text>

  <!-- Path Yes -> Fatal Underflow -->
  <path d="M307,100 L307,125" class="edge"/>
  <text x="315" y="116" class="sm b">Yes</text>

  <rect x="225" y="125" width="165" height="60" rx="4" class="orange"/>
  <text x="307" y="143" text-anchor="middle" class="b sm">Numerical Overflow</text>
  <text x="307" y="159" text-anchor="middle" class="sm">• Check FP8/FP16 scale</text>
  <text x="307" y="173" text-anchor="middle" class="sm">• Switch to BF16 / clip</text>

  <!-- Path No -> Grad Norm Evaluation -->
  <path d="M390,79 L430,79" class="edge"/>
  <text x="410" y="73" class="sm b">No</text>

  <!-- Node 2: Grad Norm Evaluation -->
  <rect x="430" y="58" width="175" height="42" rx="4" class="blue"/>
  <text x="517" y="76" text-anchor="middle" class="b sm">2. Grad Norm Dynamics</text>
  <text x="517" y="92" text-anchor="middle" class="sm">Single-step vs gradual</text>

  <!-- Branch A: Sudden Spike (Data Batch) -->
  <path d="M517,100 L517,135" class="edge"/>
  <text x="525" y="118" class="sm b">Instant Jump</text>

  <rect x="420" y="135" width="195" height="95" rx="4" class="green"/>
  <text x="517" y="153" text-anchor="middle" class="b sm">Poisoned Data Batch</text>
  <text x="430" y="171" class="sm">• Outlier sequence / spam</text>
  <text x="430" y="187" class="sm">• Malformed tokens</text>
  <text x="430" y="203" class="sm b">• Rewind 100 steps &amp;</text>
  <text x="440" y="219" class="sm b">advance dataloader past batch</text>

  <!-- Branch B: Gradual Growth (Learning Rate / Optimizer) -->
  <path d="M605,79 L660,79" class="edge"/>
  <text x="632" y="72" text-anchor="middle" class="sm b">Gradual</text>

  <rect x="660" y="58" width="165" height="172" rx="4" class="gray"/>
  <text x="742" y="78" text-anchor="middle" class="b sm">Optimizer Instability</text>
  <text x="670" y="98" class="sm">• LR too high</text>
  <text x="670" y="114" class="sm">• Adam β₂ too high</text>
  <text x="670" y="130" class="sm">• Logits drifting</text>
  <text x="670" y="155" class="sm b">Actions:</text>
  <text x="670" y="173" class="sm">• Decay LR by 20%</text>
  <text x="670" y="189" class="sm">• Lower β₂ to 0.95</text>
  <text x="670" y="205" class="sm">• Add logit z-loss</text>
  <text x="670" y="221" class="sm">• Verify QK-Norm active</text>

  <!-- Bottom Explanatory Box -->
  <rect x="25" y="248" width="800" height="105" rx="4" class="white"/>
  <text x="38" y="268" class="b sm">The Golden Rule of Spike Diagnosis:</text>
  <text x="38" y="286" class="sm">• <tspan class="b">Instant single-step spike</tspan> = Data pipeline issue. Never lower the global learning rate for a data corruption bug.</text>
  <text x="38" y="304" class="sm">• <tspan class="b">Progressive multi-step escalation</tspan> = Hyperparameter or architecture instability (LR, Adam β₂, unnormalized attention).</text>
  <text x="38" y="322" class="sm">• Always preserve the bad batch ID and token sequence for offline inspection (Lesson 18, Quality Filtering).</text>
  <text x="38" y="340" class="sm">• Resume from a checkpoint 100 steps prior so Adam's second-moment accumulator flushes corrupted estimates.</text>
</svg>
