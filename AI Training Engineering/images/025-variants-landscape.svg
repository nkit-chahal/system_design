<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">The Direct Preference Optimization Family</text>
  <text x="25" y="48" class="sm" fill="#555">Comparison of mathematical objectives, reference model requirements, and data formats</text>

  <!-- Card 1: DPO -->
  <rect x="25" y="65" width="245" height="130" rx="4" class="gray"/>
  <rect x="35" y="75" width="225" height="26" rx="3" class="blue"/>
  <text x="147" y="93" text-anchor="middle" class="b">DPO (Rafailov et al. 2023)</text>
  <text x="35" y="118" class="sm">• Loss: -log sigma( beta * Delta log-ratio )</text>
  <text x="35" y="136" class="sm">• Data: Pairwise (yw &gt; yl)</text>
  <text x="35" y="154" class="sm">• Reference: Requires pi_ref</text>
  <text x="35" y="172" class="sm">• Risk: Likelihood displacement</text>

  <!-- Card 2: IPO -->
  <rect x="288" y="65" width="245" height="130" rx="4" class="gray"/>
  <rect x="298" y="75" width="225" height="26" rx="3" class="purple"/>
  <text x="410" y="93" text-anchor="middle" class="b">IPO (Azar et al. 2023)</text>
  <text x="298" y="118" class="sm">• Loss: ( Delta log-ratio - 1/(2*tau) )^2</text>
  <text x="298" y="136" class="sm">• Data: Pairwise (yw &gt; yl)</text>
  <text x="298" y="154" class="sm">• Reference: Requires pi_ref</text>
  <text x="298" y="172" class="sm">• Feature: Avoids deterministic collapse</text>

  <!-- Card 3: KTO -->
  <rect x="550" y="65" width="245" height="130" rx="4" class="gray"/>
  <rect x="560" y="75" width="225" height="26" rx="3" class="yellow"/>
  <text x="672" y="93" text-anchor="middle" class="b">KTO (Ethayarajh et al. 2024)</text>
  <text x="560" y="118" class="sm">• Loss: Prospect theory utility</text>
  <text x="560" y="136" class="sm">• Data: Unpaired binary (thumbs up/down)</text>
  <text x="560" y="154" class="sm">• Reference: Requires pi_ref</text>
  <text x="560" y="172" class="sm">• Feature: Works directly on telemetry</text>

  <!-- Card 4: ORPO -->
  <rect x="25" y="205" width="370" height="90" rx="4" class="gray"/>
  <rect x="35" y="215" width="350" height="26" rx="3" class="orange"/>
  <text x="210" y="233" text-anchor="middle" class="b">ORPO (Hong et al. 2024): Monolithic Reference-Free</text>
  <text x="35" y="258" class="sm">• Loss: L_SFT(yw) + lambda * L_OddsRatio(yw, yl)</text>
  <text x="35" y="276" class="sm">• Eliminates pi_ref completely; combines SFT and alignment in one phase.</text>

  <!-- Card 5: SimPO -->
  <rect x="425" y="205" width="370" height="90" rx="4" class="gray"/>
  <rect x="435" y="215" width="350" height="26" rx="3" class="green"/>
  <text x="610" y="233" text-anchor="middle" class="b">SimPO (Meng et al. 2024): Length-Normalized Margin</text>
  <text x="435" y="258" class="sm">• Implicit reward = (beta / |y|) * log pi(y) with target margin gamma.</text>
  <text x="435" y="276" class="sm">• Reference-free: directly penalizes verbosity and out-performs DPO.</text>

  <!-- Bottom Banner -->
  <rect x="25" y="305" width="770" height="42" rx="4" class="purple"/>
  <text x="410" y="331" text-anchor="middle" class="b">Key Trend: Transitioning away from reference models toward length-normalized implicit rewards</text>
</svg>