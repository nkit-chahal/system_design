<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .b { font-weight: bold; }
    .title { font-size: 16px; font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="24" class="title">Goodput Accounting Breakdown: Where Cluster Time is Spent</text>
  <text x="25" y="42" class="sm" fill="#555">Goodput measures the ratio of useful training time to total billed cluster wall-clock time.</text>

  <!-- Stacked Bar of Total Time -->
  <text x="25" y="78" class="b sm">Wall-Clock Time Breakdown (Total Billed GPU Hours = 100%):</text>

  <!-- Total Bar width 790, x=25, y=90, height=44 -->
  <!-- Useful Compute: 86% = 679px -->
  <rect x="25" y="90" width="679" height="44" rx="3" class="green"/>
  <text x="364" y="117" text-anchor="middle" class="b sm">Useful Training Compute: 86.0% (Goodput)</text>

  <!-- Checkpoint I/O Overhead: 4% = 32px -->
  <rect x="704" y="90" width="32" height="44" rx="0" class="blue"/>

  <!-- Failure Relaunch & Sync: 3% = 24px -->
  <rect x="736" y="90" width="24" height="44" rx="0" class="purple"/>

  <!-- Replayed Work: 7% = 55px -->
  <rect x="760" y="90" width="55" height="44" rx="3" class="orange"/>

  <!-- Labels below stacked bar -->
  <g transform="translate(25, 145)">
    <circle cx="10" cy="10" r="5" fill="#82b366"/>
    <text x="22" y="14" class="sm">Useful Compute: <tspan class="b">86.0%</tspan></text>

    <circle cx="180" cy="10" r="5" fill="#6c8ebf"/>
    <text x="192" y="14" class="sm">Checkpoint I/O: <tspan class="b">4.0%</tspan></text>

    <circle cx="330" cy="10" r="5" fill="#9673a6"/>
    <text x="342" y="14" class="sm">Relaunch / Sync: <tspan class="b">3.0%</tspan></text>

    <circle cx="490" cy="10" r="5" fill="#d79b00"/>
    <text x="502" y="14" class="sm">Replayed Work: <tspan class="b">7.0%</tspan></text>
  </g>

  <!-- Calculation Card -->
  <rect x="25" y="180" width="790" height="85" rx="5" class="gray"/>
  <text x="40" y="202" class="b sm">The Analytical Goodput Equation (Lesson 29):</text>
  <text x="40" y="222" class="sm b" fill="#2c5d88">Goodput = T_useful ÷ [ T_useful + N_ckpt × t_save + N_failures × (t_detect + t_relaunch + 0.5 × T_interval) ]</text>
  <text x="40" y="240" class="sm">• Average replayed work per failure is half the checkpoint interval: <tspan class="b">0.5 × T_interval</tspan>.</text>
  <text x="40" y="254" class="sm">• As cluster size grows, failure frequency rises (MTBF shrinks), making fast parallel checkpointing critical.</text>

  <!-- Bottom Explanatory Box -->
  <rect x="25" y="280" width="790" height="55" rx="4" class="white"/>
  <text x="38" y="300" class="b sm">Lab Evaluation Metric:</text>
  <text x="200" y="300" class="sm">In this lab, you will measure each of these four slices directly</text>
  <text x="38" y="318" class="sm">and calculate the exact Goodput percentage achieved by your fault-recovery configuration.</text>
</svg>
