<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">The 6ND Rule: Training FLOPs Breakdown per Token</text>
  <text x="25" y="48" class="sm" fill="#555">Dense matrix multiplication operations per token across forward, backward, and recomputation passes</text>

  <!-- Pass 1: Standard Training (6N FLOPs/token) -->
  <text x="25" y="80" class="b">1. Standard Training (No Recomputation): 6N FLOPs / token</text>

  <!-- Forward bar (2N) -->
  <rect x="25" y="92" width="240" height="50" class="blue"/>
  <text x="145" y="114" text-anchor="middle" class="b">Forward Pass: 2N</text>
  <text x="145" y="132" text-anchor="middle" class="sm">Y = W · X (Activations)</text>

  <!-- Backward Activation Gradient (2N) -->
  <rect x="270" y="92" width="240" height="50" class="orange"/>
  <text x="390" y="114" text-anchor="middle" class="b">Backward (dL/dX): 2N</text>
  <text x="390" y="132" text-anchor="middle" class="sm">dX = (dY) · W^T</text>

  <!-- Backward Weight Gradient (2N) -->
  <rect x="515" y="92" width="240" height="50" class="yellow"/>
  <text x="635" y="114" text-anchor="middle" class="b">Backward (dL/dW): 2N</text>
  <text x="635" y="132" text-anchor="middle" class="sm">dW = X^T · (dY)</text>

  <!-- Sum note -->
  <text x="765" y="122" class="b" fill="#000">= 6N</text>

  <!-- Pass 2: Training with Full Recomputation (8N FLOPs/token) -->
  <text x="25" y="176" class="b">2. Training with Full Activation Recomputation: 8N FLOPs / token (+33% compute)</text>

  <!-- Forward bar (2N) -->
  <rect x="25" y="188" width="180" height="50" class="blue"/>
  <text x="115" y="210" text-anchor="middle" class="b">Forward: 2N</text>
  <text x="115" y="228" text-anchor="middle" class="sm">Layer outputs saved</text>

  <!-- Recompute forward (2N) -->
  <rect x="210" y="188" width="180" height="50" class="red"/>
  <text x="300" y="210" text-anchor="middle" class="b">Recompute: 2N</text>
  <text x="300" y="228" text-anchor="middle" class="sm">Re-eval forward pass</text>

  <!-- Backward Activation Gradient (2N) -->
  <rect x="395" y="188" width="180" height="50" class="orange"/>
  <text x="485" y="210" text-anchor="middle" class="b">Backward: 2N</text>
  <text x="485" y="228" text-anchor="middle" class="sm">dL/dX activation grad</text>

  <!-- Backward Weight Gradient (2N) -->
  <rect x="580" y="188" width="180" height="50" class="yellow"/>
  <text x="670" y="210" text-anchor="middle" class="b">Backward: 2N</text>
  <text x="670" y="228" text-anchor="middle" class="sm">dL/dW weight grad</text>

  <!-- Sum note -->
  <text x="765" y="218" class="b" fill="#b45f06">= 8N</text>

  <!-- Summary container -->
  <rect x="25" y="255" width="765" height="68" rx="6" class="gray"/>
  <text x="40" y="278" class="b">Key Takeaways for LLM Training Engineering:</text>
  <text x="40" y="297" class="sm">• The backward pass inherently requires twice as many FLOPs (4N) as the forward pass (2N).</text>
  <text x="40" y="313" class="sm">• Full recomputation trades 33% extra FLOPs (8N vs 6N) to drastically reduce peak activation VRAM.</text>
</svg>
