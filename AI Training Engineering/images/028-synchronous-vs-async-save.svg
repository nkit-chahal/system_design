<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Top Timeline: Synchronous Checkpointing -->
  <text x="30" y="38" class="lg b">Synchronous Checkpointing (Blocking)</text>

  <!-- Step n -->
  <rect x="30" y="52" width="140" height="42" rx="4" class="orange"/>
  <text x="45" y="78" class="sm b">Train Step n</text>

  <!-- Stall Block -->
  <rect x="175" y="52" width="340" height="42" rx="4" class="red"/>
  <text x="235" y="72" class="b">GPU Stall: Storage I/O (~64s)</text>
  <text x="215" y="87" class="sm">Writing 128.5 GB to shared NFS @ 2 GB/s</text>

  <!-- Step n+1 -->
  <rect x="520" y="52" width="140" height="42" rx="4" class="orange"/>
  <text x="535" y="78" class="sm b">Train Step n+1</text>

  <rect x="670" y="52" width="120" height="42" rx="4" class="red"/>
  <text x="680" y="78" class="sm b">MFU Waste: 3-5%</text>

  <!-- Bottom Timeline: Asynchronous Checkpointing -->
  <text x="30" y="150" class="lg b">Asynchronous Checkpointing (PyTorch DCP async_save)</text>

  <!-- Step n -->
  <rect x="30" y="165" width="140" height="42" rx="4" class="orange"/>
  <text x="45" y="191" class="sm b">Train Step n</text>

  <!-- Brief Staging Transfer -->
  <rect x="175" y="165" width="35" height="42" rx="4" class="yellow"/>
  <text x="180" y="190" class="sm b">0.25s</text>

  <!-- Step n+1 immediately continues -->
  <rect x="215" y="165" width="140" height="42" rx="4" class="orange"/>
  <text x="230" y="191" class="sm b">Train Step n+1</text>

  <!-- Step n+2 -->
  <rect x="360" y="165" width="140" height="42" rx="4" class="orange"/>
  <text x="375" y="191" class="sm b">Train Step n+2</text>

  <!-- Step n+3 -->
  <rect x="505" y="165" width="140" height="42" rx="4" class="orange"/>
  <text x="520" y="191" class="sm b">Train Step n+3</text>

  <rect x="655" y="165" width="135" height="42" rx="4" class="green"/>
  <text x="668" y="191" class="sm b">Zero Compute Stall</text>

  <!-- Background Thread Lane -->
  <path d="M192,207 L192,228" class="edge"/>
  <rect x="175" y="232" width="470" height="42" rx="4" class="blue"/>
  <text x="220" y="252" class="b">Background I/O Thread (CPU to Lustre/S3)</text>
  <text x="215" y="267" class="sm">Staged tensors flushed to disk concurrently without blocking GPUs</text>

  <!-- Bottom Callout Note -->
  <rect x="30" y="285" width="760" height="25" rx="3" class="gray"/>
  <text x="40" y="302" class="sm">GPU stages tensors to CPU pinned memory over PCIe Gen4 (64 GB/s) in 250 ms, then immediately resumes training.</text>
</svg>
