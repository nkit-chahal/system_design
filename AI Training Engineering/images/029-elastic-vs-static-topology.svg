<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Left: Elastic Training (--nnodes min:max) -->
  <rect x="30" y="30" width="350" height="260" rx="8" class="group"/>
  <text x="50" y="58" class="lg b">Elastic Training (--nnodes min:max)</text>

  <rect x="50" y="75" width="310" height="42" rx="4" class="red"/>
  <text x="65" y="96" class="b">Node 14 dies: Cluster contracts</text>
  <text x="65" y="110" class="sm">Cluster shrinks: 32 nodes -&gt; 31 nodes</text>

  <rect x="50" y="128" width="310" height="60" rx="4" class="yellow"/>
  <text x="60" y="148" class="sm b">Algorithmic Perturbations:</text>
  <text x="60" y="166" class="sm">• Global batch drops: 512 -&gt; 496 sequences</text>
  <text x="60" y="182" class="sm">• Gradient noise scale &amp; momentum shift</text>

  <rect x="50" y="198" width="310" height="75" rx="4" class="gray"/>
  <text x="60" y="218" class="sm b">Systems Drawbacks:</text>
  <text x="60" y="236" class="sm">• Requires adjusting learning rate mid-run</text>
  <text x="60" y="254" class="sm">• Triggers tensor re-sharding across 248 ranks</text>
  <text x="60" y="268" class="sm">• Seldom used in production pretraining</text>

  <!-- Right: Static Topology with Hot Spares -->
  <rect x="420" y="30" width="350" height="260" rx="8" class="group"/>
  <text x="440" y="58" class="lg b">Static Topology + Hot Spares</text>

  <rect x="440" y="75" width="310" height="42" rx="4" class="green"/>
  <text x="455" y="96" class="b">Node 14 dies: Swap Spare Node 33</text>
  <text x="455" y="110" class="sm">Topology invariant: 32 nodes preserved</text>

  <rect x="440" y="128" width="310" height="60" rx="4" class="green"/>
  <text x="450" y="148" class="sm b">Algorithmic Invariance:</text>
  <text x="450" y="166" class="sm">• Global batch remains identical: 512 seqs</text>
  <text x="450" y="182" class="sm">• Optimizer momentum &amp; LR schedule intact</text>

  <rect x="440" y="198" width="310" height="75" rx="4" class="gray"/>
  <text x="450" y="218" class="sm b">Systems Benefits (Industry Standard):</text>
  <text x="450" y="236" class="sm">• Identical 256-way FSDP sharding restored</text>
  <text x="450" y="254" class="sm">• Zero loss spike from batch size jumps</text>
  <text x="450" y="268" class="sm">• Used by Meta (Llama 3) &amp; major frontier labs</text>
</svg>
