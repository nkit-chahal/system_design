<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">Attention FLOPs vs Dense Linear FLOPs Across Sequence Lengths</text>
  <text x="25" y="48" class="sm" fill="#555">Per-token FLOPs for Llama 3.1 8B (N = 8.03B, L = 32, h = 4,096). Dense baseline = 6N = 48.2 GFLOPs</text>

  <!-- Legend -->
  <rect x="520" y="20" width="16" height="12" class="blue"/>
  <text x="542" y="31" class="sm">Dense FLOPs (6N)</text>
  <rect x="670" y="20" width="16" height="12" class="orange"/>
  <text x="692" y="31" class="sm">Attention (12Lsh)</text>

  <!-- Row 1: s = 2,048 -->
  <text x="25" y="85" class="b">s = 2,048</text>
  <text x="110" y="85" class="sm" fill="#555">(GPT-3 era)</text>
  <rect x="200" y="70" width="300" height="24" class="blue"/>
  <text x="350" y="87" text-anchor="middle" class="sm">Dense: 48.2 GFLOPs</text>
  <rect x="505" y="70" width="20" height="24" class="orange"/>
  <text x="535" y="87" class="sm b">+3.2 GFLOPs (+6.7%)</text>

  <!-- Row 2: s = 8,192 (Running Scenario) -->
  <text x="25" y="140" class="b">s = 8,192</text>
  <text x="110" y="140" class="sm" fill="#b45f06">(Pretraining baseline)</text>
  <rect x="200" y="125" width="300" height="24" class="blue"/>
  <text x="350" y="142" text-anchor="middle" class="sm">Dense: 48.2 GFLOPs</text>
  <rect x="505" y="125" width="80" height="24" class="orange"/>
  <text x="595" y="142" class="sm b">+12.9 GFLOPs (+26.7%)</text>

  <!-- Row 3: s = 32,768 -->
  <text x="25" y="195" class="b">s = 32,768</text>
  <text x="110" y="195" class="sm" fill="#555">(Long-context)</text>
  <rect x="200" y="180" width="180" height="24" class="blue"/>
  <text x="290" y="197" text-anchor="middle" class="sm">Dense: 48.2 G</text>
  <rect x="385" y="180" width="192" height="24" class="orange"/>
  <text x="585" y="197" class="sm b">+51.5 GFLOPs (+107.0% exceeds dense!)</text>

  <!-- Row 4: s = 131,072 -->
  <text x="25" y="250" class="b">s = 131,072</text>
  <text x="110" y="250" class="sm" fill="#c00">(128K context)</text>
  <rect x="200" y="235" width="90" height="24" class="blue"/>
  <text x="245" y="252" text-anchor="middle" class="sm">48.2 G</text>
  <rect x="295" y="235" width="380" height="24" class="red"/>
  <text x="685" y="252" class="sm b">+206 GFLOPs (+428%)</text>

  <!-- Insight box -->
  <rect x="25" y="278" width="765" height="58" rx="6" class="gray"/>
  <text x="40" y="300" class="b">Engineering Rule:</text>
  <text x="40" y="318" class="sm">For short sequences (s &lt;= 2K), 6ND is accurate within 7%. At s = 8,192, attention adds 26.7% compute,</text>
  <text x="40" y="334" class="sm">and at 32K+ context, quadratic attention compute completely dominates standard dense feed-forward compute.</text>
</svg>
