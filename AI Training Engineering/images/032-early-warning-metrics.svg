<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .b { font-weight: bold; }
    .title { font-size: 16px; font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .card { rx: 5px; stroke-width: 1.2; }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="24" class="title">Four Early-Warning Telemetry Signals for Training Stability</text>
  <text x="25" y="42" class="sm" fill="#555">Real-time metrics that warn of impending numerical divergence steps before the loss curve visibly spikes.</text>

  <!-- Metric 1: Global Gradient Norm -->
  <rect x="25" y="60" width="185" height="210" class="card blue"/>
  <text x="35" y="82" class="b sm">1. Global Grad Norm</text>
  <text x="35" y="98" class="sm" fill="#555">||g||₂ across all params</text>

  <rect x="35" y="112" width="165" height="42" rx="3" class="green"/>
  <text x="45" y="130" class="sm b">Healthy: 0.3 to 1.0</text>
  <text x="45" y="146" class="sm">Bounded updates</text>

  <rect x="35" y="162" width="165" height="42" rx="3" class="orange"/>
  <text x="45" y="180" class="sm b">Warning: 1.5 to 4.0</text>
  <text x="45" y="196" class="sm">Clipping active</text>

  <rect x="35" y="212" width="165" height="46" rx="3" class="red"/>
  <text x="45" y="230" class="sm b">Danger: &gt; 5.0 (or Inf)</text>
  <text x="45" y="246" class="sm">Spike imminent</text>

  <!-- Metric 2: Update-to-Weight Ratio -->
  <rect x="225" y="60" width="185" height="210" class="card purple"/>
  <text x="235" y="82" class="b sm">2. Update-to-Weight</text>
  <text x="235" y="98" class="sm" fill="#555">||ΔW|| / ||W|| per layer</text>

  <rect x="235" y="112" width="165" height="42" rx="3" class="green"/>
  <text x="245" y="130" class="sm b">Healthy: 10⁻⁴ to 10⁻³</text>
  <text x="245" y="146" class="sm">Steady learning</text>

  <rect x="235" y="162" width="165" height="42" rx="3" class="orange"/>
  <text x="245" y="180" class="sm b">Warning: &gt; 10⁻²</text>
  <text x="245" y="196" class="sm">Weights shifting wildly</text>

  <rect x="235" y="212" width="165" height="46" rx="3" class="red"/>
  <text x="245" y="230" class="sm b">Stagnation: &lt; 10⁻⁶</text>
  <text x="245" y="246" class="sm">Vanishing gradients</text>

  <!-- Metric 3: Attention Max Logit & Entropy -->
  <rect x="425" y="60" width="185" height="210" class="card orange"/>
  <text x="435" y="82" class="b sm">3. Attention Logits</text>
  <text x="435" y="98" class="sm" fill="#555">max(q · kᵀ / √d)</text>

  <rect x="435" y="112" width="165" height="42" rx="3" class="green"/>
  <text x="445" y="130" class="sm b">Healthy: &lt; 15.0</text>
  <text x="445" y="146" class="sm">Entropy distributed</text>

  <rect x="435" y="162" width="165" height="42" rx="3" class="orange"/>
  <text x="445" y="180" class="sm b">Warning: 20 to 35</text>
  <text x="445" y="196" class="sm">Entropy compressing</text>

  <rect x="435" y="212" width="165" height="46" rx="3" class="red"/>
  <text x="445" y="230" class="sm b">Danger: &gt; 50.0</text>
  <text x="445" y="246" class="sm">Softmax one-hot collapse</text>

  <!-- Metric 4: Output Logit & Z-Norm -->
  <rect x="625" y="60" width="190" height="210" class="card gray"/>
  <text x="635" y="82" class="b sm">4. Output Logit Norm</text>
  <text x="635" y="98" class="sm" fill="#555">log Σ exp(zᵢ) (log Z)</text>

  <rect x="635" y="112" width="170" height="42" rx="3" class="green"/>
  <text x="645" y="130" class="sm b">Healthy: log Z ≈ 0–5</text>
  <text x="645" y="146" class="sm">Stable partition function</text>

  <rect x="635" y="162" width="170" height="42" rx="3" class="orange"/>
  <text x="645" y="180" class="sm b">Warning: |log Z| &gt; 12</text>
  <text x="645" y="196" class="sm">Logits drifting</text>

  <rect x="635" y="212" width="170" height="46" rx="3" class="red"/>
  <text x="645" y="230" class="sm b">Danger: |log Z| &gt; 25</text>
  <text x="645" y="246" class="sm">BF16 under/overflow</text>

  <!-- Bottom Explanatory Box -->
  <rect x="25" y="280" width="790" height="55" rx="4" class="white"/>
  <text x="38" y="300" class="b sm">Automated Watchdogs:</text>
  <text x="210" y="300" class="sm">Log these four metrics every 10 steps.</text>
  <text x="38" y="318" class="sm">If gradient norm or |log Z| exceeds warning thresholds for 3 consecutive steps, trigger an automated rollback before loss explodes.</text>
</svg>
