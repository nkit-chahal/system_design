<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.xs{font-size:11px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="26" class="title">Network Traffic: Pipeline Parallelism (PP) vs Tensor Parallelism (TP)</text>
  <text x="25" y="44" class="sm" fill="#555">Why PP crosses inter-node InfiniBand fabrics effectively, while TP is strictly confined to intra-node NVLink.</text>

  <!-- Left: Tensor Parallelism (Bad over Inter-Node) -->
  <rect x="25" y="65" width="370" height="200" rx="6" class="red"/>
  <text x="40" y="88" class="b" fill="#900">Tensor Parallelism (TP): High Frequency</text>
  <rect x="40" y="102" width="340" height="42" rx="4" class="white"/>
  <text x="210" y="122" text-anchor="middle" class="sm"><tspan class="b">2 All-Reduces per Layer</tspan> (Attention + MLP)</text>
  <text x="210" y="138" text-anchor="middle" class="xs" fill="#555">32 layers × 2 = 64 All-Reduces per micro-batch!</text>
  <text x="40" y="165" class="sm">• Message size: Small to medium (e.g., 8–32 MB).</text>
  <text x="40" y="185" class="sm">• Frequency: <tspan class="b">Every single matrix multiplication</tspan>.</text>
  <text x="40" y="205" class="sm">• Latency sensitivity: Extremely high (&lt; 2 µs needed).</text>
  <text x="40" y="225" class="sm">• Crossing nodes: Network latency and sync overhead</text>
  <text x="40" y="243" class="sm">  stall GPUs, destroying Model FLOPs Utilization (MFU).</text>

  <!-- Right: Pipeline Parallelism (Good over Inter-Node) -->
  <rect x="420" y="65" width="375" height="200" rx="6" class="green"/>
  <text x="435" y="88" class="b" fill="#2d7600">Pipeline Parallelism (PP): Low Frequency</text>
  <rect x="435" y="102" width="345" height="42" rx="4" class="white"/>
  <text x="607" y="122" text-anchor="middle" class="sm"><tspan class="b">1 P2P Transfer per Stage Boundary</tspan></text>
  <text x="607" y="138" text-anchor="middle" class="xs" fill="#555">Only 3 P2P transfers per micro-batch across 4 stages!</text>
  <text x="435" y="165" class="sm">• Volume: Shape [b, s, h] = <tspan class="b">67.1 MB</tspan> (8B) or 134.2 MB (70B).</text>
  <text x="435" y="185" class="sm">• Frequency: Only once per entire stage (e.g., 8 layers).</text>
  <text x="435" y="205" class="sm">• Transfer time: 67 MB / 50 GB/s = <tspan class="b">1.34 ms</tspan> on InfiniBand.</text>
  <text x="435" y="225" class="sm">• Compute time: 8 layers compute takes ~30–50 ms.</text>
  <text x="435" y="243" class="sm">• Overlap: P2P transfer is easily hidden behind compute!</text>

  <!-- Bottom Comparison Banner -->
  <rect x="25" y="278" width="770" height="48" rx="4" class="gray"/>
  <text x="40" y="298" class="sm"><tspan class="b">Engineering Rule:</tspan> Keep TP inside the node (8 GPUs over 900 GB/s NVLink). When scaling models larger than one node</text>
  <text x="40" y="316" class="sm">(70B+), use Pipeline Parallelism (PP) to partition layers across nodes over 400 Gb/s InfiniBand.</text>
</svg>