<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}.mid{text-anchor:middle}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="25" y="30" class="lg b">Pre-Tokenization Regex: Preventing Degenerate Merges</text>
  <text x="25" y="52" class="sm" fill="#555">Splitting text into atomic lexical units before BPE prevents catastrophic tokenization failures</text>

  <!-- Without Regex -->
  <rect x="25" y="80" width="370" height="230" rx="5" class="red"/>
  <text x="210" y="105" class="b mid" fill="#900">Without Pre-Tokenization Regex</text>

  <rect x="40" y="125" width="340" height="40" rx="3" class="white"/>
  <text x="50" y="142" class="sm b">Punctuation Merges:</text>
  <text x="50" y="157" class="sm fill-red">"hello." and "world!" become single tokens</text>

  <rect x="40" y="175" width="340" height="40" rx="3" class="white"/>
  <text x="50" y="192" class="sm b">Arbitrary Number Merges:</text>
  <text x="50" y="207" class="sm fill-red">"2024" is 1 token, "2025" is 3 tokens</text>

  <text x="40" y="245" class="sm">• Vocabulary memorizes specific numbers</text>
  <text x="40" y="265" class="sm">• Destroys arithmetic and counting ability</text>
  <text x="40" y="285" class="sm">• Whitespace bleeds into preceding words</text>

  <!-- With Regex -->
  <rect x="425" y="80" width="370" height="230" rx="5" class="green"/>
  <text x="610" y="105" class="b mid" fill="#2d572c">With GPT-4 / Llama 3 Regex Splitter</text>

  <rect x="440" y="125" width="340" height="40" rx="3" class="white"/>
  <text x="450" y="142" class="sm b">Clean Punctuation Isolation:</text>
  <text x="450" y="157" class="sm" fill="#2d572c">"hello" + "." (punctuation is never absorbed)</text>

  <rect x="440" y="175" width="340" height="40" rx="3" class="white"/>
  <text x="450" y="192" class="sm b">Consistent 1 to 3 Digit Chunking:</text>
  <text x="450" y="207" class="sm" fill="#2d572c">\p{N}{1,3} groups digits uniformly</text>

  <text x="440" y="245" class="sm">• Isolated English contractions ('s, 're, 't)</text>
  <text x="440" y="265" class="sm">• Preserves leading space encoding (Ġword)</text>
  <text x="440" y="285" class="sm">• Enables consistent multi-digit arithmetic</text>
</svg>