<svg xmlns="http://www.w3.org/2000/svg" width="840" height="370" viewBox="0 0 840 370" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ebf"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .b { font-weight: bold; }
    .title { font-size: 16px; font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .group { fill: none; stroke: #666; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .edge { fill: none; stroke: #000; stroke-width: 1.2; marker-end: url(#arrow); }
    .edge-blue { fill: none; stroke: #6c8ebf; stroke-width: 2; marker-end: url(#arrow-blue); }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="24" class="title">Intra-Node NVLink vs Inter-Node InfiniBand NDR</text>
  <text x="25" y="42" class="sm" fill="#555">Inside a node: full-mesh 900 GB/s NVLink. Between nodes: 8 × 400 Gb/s InfiniBand with GPUDirect RDMA.</text>

  <!-- Node Container -->
  <rect x="25" y="58" width="460" height="225" rx="6" class="group"/>
  <text x="35" y="78" class="b">Node Architecture (8 × H100 SXM5)</text>

  <!-- NVSwitch Fabric Box -->
  <rect x="35" y="92" width="440" height="42" rx="4" class="orange"/>
  <text x="255" y="112" text-anchor="middle" class="b">NVSwitch 3 Fabric (4 On-Board Switches)</text>
  <text x="255" y="127" text-anchor="middle" class="sm">3.6 TB/s bisection bandwidth per node · Non-blocking crossbar</text>

  <!-- GPUs -->
  <g transform="translate(35, 150)">
    <rect x="0" y="0" width="50" height="46" rx="3" class="green"/>
    <text x="25" y="20" text-anchor="middle" class="b sm">GPU 0</text>
    <text x="25" y="36" text-anchor="middle" class="sm">H100</text>
    <path d="M25,-16 L25,0" class="edge"/>

    <rect x="55" y="0" width="50" height="46" rx="3" class="green"/>
    <text x="80" y="20" text-anchor="middle" class="b sm">GPU 1</text>
    <text x="80" y="36" text-anchor="middle" class="sm">H100</text>
    <path d="M80,-16 L80,0" class="edge"/>

    <rect x="110" y="0" width="50" height="46" rx="3" class="green"/>
    <text x="135" y="20" text-anchor="middle" class="b sm">GPU 2</text>
    <text x="135" y="36" text-anchor="middle" class="sm">H100</text>
    <path d="M135,-16 L135,0" class="edge"/>

    <rect x="165" y="0" width="50" height="46" rx="3" class="green"/>
    <text x="190" y="20" text-anchor="middle" class="b sm">GPU 3</text>
    <text x="190" y="36" text-anchor="middle" class="sm">H100</text>
    <path d="M190,-16 L190,0" class="edge"/>

    <rect x="225" y="0" width="50" height="46" rx="3" class="green"/>
    <text x="250" y="20" text-anchor="middle" class="b sm">GPU 4</text>
    <text x="250" y="36" text-anchor="middle" class="sm">H100</text>
    <path d="M250,-16 L250,0" class="edge"/>

    <rect x="280" y="0" width="50" height="46" rx="3" class="green"/>
    <text x="305" y="20" text-anchor="middle" class="b sm">GPU 5</text>
    <text x="305" y="36" text-anchor="middle" class="sm">H100</text>
    <path d="M305,-16 L305,0" class="edge"/>

    <rect x="335" y="0" width="50" height="46" rx="3" class="green"/>
    <text x="360" y="20" text-anchor="middle" class="b sm">GPU 6</text>
    <text x="360" y="36" text-anchor="middle" class="sm">H100</text>
    <path d="M360,-16 L360,0" class="edge"/>

    <rect x="390" y="0" width="50" height="46" rx="3" class="green"/>
    <text x="415" y="20" text-anchor="middle" class="b sm">GPU 7</text>
    <text x="415" y="36" text-anchor="middle" class="sm">H100</text>
    <path d="M415,-16 L415,0" class="edge"/>
  </g>

  <!-- PCIe & Host Info -->
  <rect x="35" y="215" width="440" height="55" rx="4" class="gray"/>
  <text x="45" y="235" class="b sm">Host Subsystem (Dual x86/ARM CPU + 2 TB System RAM)</text>
  <text x="45" y="254" class="sm" fill="#555">PCIe Gen 5 Switch connects GPUs to CPU and NICs. CPU is bypassed by GPUDirect.</text>

  <!-- Inter-Node Network Area -->
  <rect x="525" y="58" width="290" height="225" rx="6" class="group"/>
  <text x="535" y="78" class="b">Inter-Node Fabric (InfiniBand NDR)</text>

  <!-- 8x CX7 NICs -->
  <rect x="540" y="92" width="260" height="48" rx="4" class="blue"/>
  <text x="670" y="112" text-anchor="middle" class="b sm">8 × ConnectX-7 NICs</text>
  <text x="670" y="128" text-anchor="middle" class="sm">400 Gb/s (50 GB/s) per GPU</text>

  <!-- External Switches -->
  <rect x="540" y="165" width="260" height="48" rx="4" class="purple"/>
  <text x="670" y="185" text-anchor="middle" class="b sm">Quantum-2 NDR Leaf Switches</text>
  <text x="670" y="201" text-anchor="middle" class="sm">3.2 Tb/s (400 GB/s) total per node</text>
  <path d="M670,140 L670,165" class="edge"/>

  <rect x="540" y="230" width="260" height="38" rx="4" class="purple"/>
  <text x="670" y="252" text-anchor="middle" class="sm b">Rail-Optimized Spine Switches</text>
  <path d="M670,213 L670,230" class="edge"/>

  <!-- GPUDirect RDMA connection between node and NICs -->
  <path d="M475,173 L540,116" class="edge-blue"/>
  <text x="510" y="156" text-anchor="middle" class="sm b" fill="#2c5d88">GDR</text>

  <!-- Bottom Bandwidth Comparison Summary Box -->
  <rect x="25" y="295" width="790" height="64" rx="6" class="white"/>
  <text x="38" y="315" class="b">Bandwidth Disparity:</text>
  <text x="38" y="333" class="sm">• Intra-Node NVLink: <tspan class="b">900 GB/s</tspan> bidirectional per GPU (450 GB/s unidir). Sub-microsecond latency.</text>
  <text x="38" y="349" class="sm">• Inter-Node InfiniBand: <tspan class="b">400 Gb/s (50 GB/s)</tspan> per GPU. Latency ≈ <tspan class="b">2–5 µs</tspan>. NVLink is <tspan class="b">9× to 18× faster</tspan>.</text>
</svg>
