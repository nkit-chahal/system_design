<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="26" class="title">Lab Setup: Comparing DDP and FSDP2 in PyTorch</text>
  <text x="25" y="46" class="sm" fill="#555">Parallel benchmark architecture evaluating memory footprint, throughput, and communication traces</text>

  <!-- Left Container: DDP Pipeline -->
  <g transform="translate(25, 65)">
    <rect x="0" y="0" width="370" height="215" rx="6" class="blue"/>
    <text x="185" y="25" text-anchor="middle" class="b">Engine A: Distributed Data Parallel (DDP)</text>
    <text x="185" y="44" text-anchor="middle" class="sm" fill="#555">Replicated model states across all GPUs</text>

    <!-- GPU boxes inside DDP -->
    <rect x="25" y="60" width="150" height="75" rx="4" class="white"/>
    <text x="100" y="82" text-anchor="middle" class="sm b">GPU 0 (Rank 0)</text>
    <text x="100" y="100" text-anchor="middle" class="sm">• Full weights (16 B/p)</text>
    <text x="100" y="118" text-anchor="middle" class="sm">• Micro-batch slice</text>

    <rect x="195" y="60" width="150" height="75" rx="4" class="white"/>
    <text x="270" y="82" text-anchor="middle" class="sm b">GPU 1 (Rank 1)</text>
    <text x="270" y="100" text-anchor="middle" class="sm">• Full weights (16 B/p)</text>
    <text x="270" y="118" text-anchor="middle" class="sm">• Micro-batch slice</text>

    <!-- Communication Arrow between GPUs -->
    <path d="M175,100 L195,100" class="edge"/>
    <text x="185" y="155" text-anchor="middle" class="sm b" fill="#1c4587">All-Reduce (Gradients Only)</text>
    <text x="185" y="175" text-anchor="middle" class="sm">• Zero comm in forward pass</text>
    <text x="185" y="195" text-anchor="middle" class="sm">• 2(N-1)/N communication volume</text>
  </g>

  <!-- Right Container: FSDP2 Pipeline -->
  <g transform="translate(425, 65)">
    <rect x="0" y="0" width="370" height="215" rx="6" class="orange"/>
    <text x="185" y="25" text-anchor="middle" class="b">Engine B: Fully Sharded Data Parallel (FSDP2)</text>
    <text x="185" y="44" text-anchor="middle" class="sm" fill="#555">Sharded parameters, gradients, and optimizer states</text>

    <!-- GPU boxes inside FSDP -->
    <rect x="25" y="60" width="150" height="75" rx="4" class="white"/>
    <text x="100" y="82" text-anchor="middle" class="sm b">GPU 0 (Rank 0)</text>
    <text x="100" y="100" text-anchor="middle" class="sm">• 1/N weight shard</text>
    <text x="100" y="118" text-anchor="middle" class="sm">• 1/N Adam states</text>

    <rect x="195" y="60" width="150" height="75" rx="4" class="white"/>
    <text x="270" y="82" text-anchor="middle" class="sm b">GPU 1 (Rank 1)</text>
    <text x="270" y="100" text-anchor="middle" class="sm">• 1/N weight shard</text>
    <text x="270" y="118" text-anchor="middle" class="sm">• 1/N Adam states</text>

    <!-- Communication Arrows -->
    <path d="M175,100 L195,100" class="edge"/>
    <text x="185" y="155" text-anchor="middle" class="sm b" fill="#b45f06">All-Gather (W) + Reduce-Scatter (G)</text>
    <text x="185" y="175" text-anchor="middle" class="sm">• Dynamic gather per layer in fwd/bwd</text>
    <text x="185" y="195" text-anchor="middle" class="sm">• 3(N-1)/N comm volume (1.5x DDP)</text>
  </g>

  <!-- Bottom Annotation Bar -->
  <rect x="25" y="295" width="770" height="35" rx="4" class="gray"/>
  <text x="35" y="317" class="sm"><tspan class="b">Orchestration:</tspan> Launched via torchrun with identical batch sizes and step counts. torch.profiler captures NCCL kernel execution.</text>
</svg>
