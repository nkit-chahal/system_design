<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="25" class="title">Critical Batch Size: Data Efficiency vs Parallel Speedup</text>
  <text x="25" y="45" class="sm" fill="#555">The empirical model of McCandlish et al. (OpenAI, 2018): how gradient noise scale limits batch parallelism</text>

  <!-- Left: Linear Scaling Regime -->
  <rect x="50" y="65" width="280" height="235" rx="6" class="green"/>
  <text x="190" y="88" text-anchor="middle" class="b" fill="#05673d">Regime 1: B &lt; B_crit</text>
  <text x="190" y="106" text-anchor="middle" class="sm">Linear Speedup (Noise Dominated)</text>

  <rect x="65" y="120" width="250" height="52" rx="4" class="white"/>
  <text x="75" y="141" class="sm b">• Gradient noise dominates:</text>
  <text x="75" y="159" class="sm">Doubling batch size halves steps to loss</text>

  <rect x="65" y="180" width="250" height="52" rx="4" class="white"/>
  <text x="75" y="201" class="sm b">• Compute efficiency is constant:</text>
  <text x="75" y="219" class="sm">FLOPs spent to reach target is flat</text>

  <rect x="65" y="240" width="250" height="48" rx="4" class="white"/>
  <text x="75" y="260" class="sm b" fill="#05673d">Action: Scale GPUs</text>
  <text x="75" y="276" class="sm">Add data-parallel nodes freely</text>

  <!-- Middle: Critical Batch Boundary -->
  <rect x="345" y="65" width="130" height="235" rx="6" class="yellow"/>
  <text x="410" y="88" text-anchor="middle" class="b">B approx B_crit</text>
  <text x="410" y="106" text-anchor="middle" class="sm">The Sweet Spot</text>

  <text x="410" y="145" text-anchor="middle" class="sm b">B_noise =</text>
  <text x="410" y="165" text-anchor="middle" class="sm">tr(H * Sigma) / |G|^2</text>

  <rect x="355" y="185" width="110" height="55" rx="4" class="white"/>
  <text x="410" y="206" text-anchor="middle" class="sm b" fill="#d79b00">4M Tokens</text>
  <text x="410" y="226" text-anchor="middle" class="sm">Our 8B Batch</text>

  <text x="410" y="265" text-anchor="middle" class="sm b" fill="#555">Balanced</text>
  <text x="410" y="283" text-anchor="middle" class="sm" fill="#555">throughput</text>

  <!-- Right: Diminishing Returns Regime -->
  <rect x="490" y="65" width="305" height="235" rx="6" class="red"/>
  <text x="642" y="88" text-anchor="middle" class="b" fill="#b85450">Regime 2: B &gt;&gt; B_crit</text>
  <text x="642" y="106" text-anchor="middle" class="sm">Diminishing Returns (Compute Wasted)</text>

  <rect x="505" y="120" width="275" height="52" rx="4" class="white"/>
  <text x="515" y="141" class="sm b">• Gradient variance is exhausted:</text>
  <text x="515" y="159" class="sm">Further batch growth does not reduce steps</text>

  <rect x="505" y="180" width="275" height="52" rx="4" class="white"/>
  <text x="515" y="201" class="sm b">• Compute penalty explodes:</text>
  <text x="515" y="219" class="sm">Total FLOPs to reach target grows linearly</text>

  <rect x="505" y="240" width="275" height="48" rx="4" class="white"/>
  <text x="515" y="260" class="sm b" fill="#b85450">Warning: GPU Starvation</text>
  <text x="515" y="276" class="sm">Adding more data parallelism wastes budget</text>
</svg>
