<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}.mid{text-anchor:middle}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="25" y="30" class="lg b">Special Tokens and Chat Templates in Llama 3</text>
  <text x="25" y="52" class="sm" fill="#555">How structured special tokens separate conversational roles and prevent prompt injection</text>

  <!-- Pretraining stream -->
  <text x="25" y="85" class="b">Pretraining Sequence (Unstructured Document Stream)</text>
  <rect x="25" y="95" width="130" height="30" rx="3" class="purple"/>
  <text x="90" y="115" class="sm b mid">&lt;|begin_of_text|&gt;</text>
  <rect x="160" y="95" width="480" height="30" rx="3" class="blue"/>
  <text x="400" y="115" class="sm mid">Continuous web / code text tokens across document...</text>
  <rect x="645" y="95" width="145" height="30" rx="3" class="red"/>
  <text x="717" y="115" class="sm b mid">&lt;|end_of_text|&gt;</text>

  <!-- Chat / Instruct stream -->
  <text x="25" y="160" class="b">Post-Training Chat Template (Structured Multi-Turn Dialog)</text>

  <!-- System Turn -->
  <rect x="25" y="172" width="765" height="34" rx="3" class="gray"/>
  <rect x="30" y="176" width="125" height="26" rx="2" class="purple"/>
  <text x="92" y="193" class="sm b mid">&lt;|start_header_id|&gt;</text>
  <text x="180" y="193" class="sm b">system</text>
  <rect x="235" y="176" width="125" height="26" rx="2" class="purple"/>
  <text x="297" y="193" class="sm b mid">&lt;|end_header_id|&gt;</text>
  <text x="375" y="193" class="sm">You are a helpful coding assistant.</text>
  <rect x="685" y="176" width="100" height="26" rx="2" class="red"/>
  <text x="735" y="193" class="sm b mid">&lt;|eot_id|&gt;</text>

  <!-- User Turn -->
  <rect x="25" y="214" width="765" height="34" rx="3" class="blue"/>
  <rect x="30" y="218" width="125" height="26" rx="2" class="purple"/>
  <text x="92" y="235" class="sm b mid">&lt;|start_header_id|&gt;</text>
  <text x="180" y="235" class="sm b">user</text>
  <rect x="235" y="218" width="125" height="26" rx="2" class="purple"/>
  <text x="297" y="235" class="sm b mid">&lt;|end_header_id|&gt;</text>
  <text x="375" y="235" class="sm">Write a quicksort in Python.</text>
  <rect x="685" y="218" width="100" height="26" rx="2" class="red"/>
  <text x="735" y="235" class="sm b mid">&lt;|eot_id|&gt;</text>

  <!-- Assistant Turn -->
  <rect x="25" y="256" width="765" height="34" rx="3" class="green"/>
  <rect x="30" y="260" width="125" height="26" rx="2" class="purple"/>
  <text x="92" y="277" class="sm b mid">&lt;|start_header_id|&gt;</text>
  <text x="180" y="277" class="sm b">assistant</text>
  <rect x="235" y="260" width="125" height="26" rx="2" class="purple"/>
  <text x="297" y="277" class="sm b mid">&lt;|end_header_id|&gt;</text>
  <text x="375" y="277" class="sm">def quicksort(arr): ...</text>
  <rect x="685" y="260" width="100" height="26" rx="2" class="red"/>
  <text x="735" y="277" class="sm b mid">&lt;|eot_id|&gt;</text>

  <text x="25" y="320" class="sm" fill="#555">Reserved special tokens are added during tokenizer training; prompt inputs cannot forge them directly.</text>
</svg>