<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Left: Learned Reward Model -->
  <rect x="30" y="25" width="350" height="270" rx="8" class="group"/>
  <text x="50" y="52" class="lg b">Learned Reward Model (Bradley-Terry)</text>
  <rect x="50" y="75" width="130" height="45" rx="6" class="purple"/>
  <text x="65" y="103">Prompt + Output</text>
  <path d="M180,97 L215,97" class="edge"/>
  <rect x="220" y="75" width="140" height="45" rx="6" class="yellow"/>
  <text x="232" y="95" class="b">Neural RM (8B)</text>
  <text x="242" y="112" class="sm">Softmax scalar</text>
  <path d="M290,120 L290,150" class="edge"/>
  <rect x="220" y="155" width="140" height="45" rx="6" class="red"/>
  <text x="234" y="175" class="b">Reward Hacking</text>
  <text x="231" y="192" class="sm">Exploits RM blindspots</text>
  <rect x="50" y="215" width="310" height="65" rx="6" class="gray"/>
  <text x="60" y="235" class="sm b">Key Properties:</text>
  <text x="60" y="253" class="sm">• Subjective tasks (creative writing, tone)</text>
  <text x="60" y="271" class="sm">• Prone to length bias and reward saturation</text>

  <!-- Right: Verifiable Programmatic Rewards -->
  <rect x="420" y="25" width="350" height="270" rx="8" class="group"/>
  <text x="440" y="52" class="lg b">Verifiable Rewards (Deterministic)</text>
  <rect x="440" y="75" width="130" height="45" rx="6" class="purple"/>
  <text x="455" y="103">Prompt + Output</text>
  <path d="M570,97 L605,97" class="edge"/>
  <rect x="610" y="75" width="140" height="45" rx="6" class="blue"/>
  <text x="625" y="95" class="b">Code / Compiler</text>
  <text x="628" y="112" class="sm">SymPy, Unit Tests</text>
  <path d="M680,120 L680,150" class="edge"/>
  <rect x="610" y="155" width="140" height="45" rx="6" class="green"/>
  <text x="625" y="175" class="b">Ground Truth</text>
  <text x="627" y="192" class="sm">Exact binary score</text>
  <rect x="440" y="215" width="310" height="65" rx="6" class="gray"/>
  <text x="450" y="235" class="sm b">Key Properties:</text>
  <text x="450" y="253" class="sm">• Objective tasks (math answers, code execution)</text>
  <text x="450" y="271" class="sm">• Immune to RM drift; zero neural model memory</text>
</svg>
