<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .lg { font-size: 16px; }
    .b { font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .yellow { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .group { fill: none; stroke: #000; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .edge { fill: none; stroke: #000; stroke-width: 1.2; marker-end: url(#arrow); }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Left: Ring All-Reduce -->
  <rect x="25" y="15" width="355" height="225" rx="6" class="gray"/>
  <text x="202" y="38" text-anchor="middle" class="b">Ring All-Reduce (High Bandwidth)</text>

  <!-- Ring topology nodes -->
  <circle cx="202" cy="70" r="18" class="blue"/>
  <text x="202" y="75" text-anchor="middle" class="sm b">R0</text>

  <circle cx="282" cy="115" r="18" class="blue"/>
  <text x="282" y="120" text-anchor="middle" class="sm b">R1</text>

  <circle cx="202" cy="160" r="18" class="blue"/>
  <text x="202" y="165" text-anchor="middle" class="sm b">R2</text>

  <circle cx="122" cy="115" r="18" class="blue"/>
  <text x="122" y="120" text-anchor="middle" class="sm b">R3</text>

  <!-- Ring edges -->
  <path d="M 220 70 Q 275 75 280 97" class="edge"/>
  <path d="M 280 133 Q 275 155 220 160" class="edge"/>
  <path d="M 184 160 Q 130 155 124 133" class="edge"/>
  <path d="M 124 97 Q 130 75 184 70" class="edge"/>

  <text x="202" y="200" text-anchor="middle" class="sm">Latency: 2 * (N - 1) network hops</text>
  <text x="202" y="218" text-anchor="middle" class="sm b">Near 100% link utilization for large S</text>

  <!-- Right: Tree All-Reduce -->
  <rect x="420" y="15" width="355" height="225" rx="6" class="gray"/>
  <text x="597" y="38" text-anchor="middle" class="b">Tree All-Reduce (Low Latency)</text>

  <!-- Tree topology nodes -->
  <circle cx="597" cy="70" r="18" class="orange"/>
  <text x="597" y="75" text-anchor="middle" class="sm b">Root</text>

  <circle cx="517" cy="115" r="18" class="purple"/>
  <text x="517" y="120" text-anchor="middle" class="sm b">N1</text>

  <circle cx="677" cy="115" r="18" class="purple"/>
  <text x="677" y="120" text-anchor="middle" class="sm b">N2</text>

  <circle cx="477" cy="160" r="18" class="blue"/>
  <text x="477" y="165" text-anchor="middle" class="sm b">L1</text>

  <circle cx="557" cy="160" r="18" class="blue"/>
  <text x="557" y="165" text-anchor="middle" class="sm b">L2</text>

  <circle cx="637" cy="160" r="18" class="blue"/>
  <text x="637" y="165" text-anchor="middle" class="sm b">L3</text>

  <circle cx="717" cy="160" r="18" class="blue"/>
  <text x="717" y="165" text-anchor="middle" class="sm b">L4</text>

  <!-- Tree edges -->
  <path d="M 580 80 L 530 102" class="edge"/>
  <path d="M 614 80 L 664 102" class="edge"/>
  <path d="M 505 130 L 485 145" class="edge"/>
  <path d="M 529 130 L 549 145" class="edge"/>
  <path d="M 665 130 L 645 145" class="edge"/>
  <path d="M 689 130 L 709 145" class="edge"/>

  <text x="597" y="200" text-anchor="middle" class="sm">Latency: 2 * log2(N) network hops</text>
  <text x="597" y="218" text-anchor="middle" class="sm b">Faster for small payloads (control, scalars)</text>

  <!-- Bottom: NCCL Heuristic Switch -->
  <rect x="25" y="250" width="750" height="38" rx="4" class="yellow"/>
  <text x="400" y="268" text-anchor="middle" class="b">NCCL Heuristic Selection (auto)</text>
  <text x="400" y="282" text-anchor="middle" class="sm">Switches from Tree to Ring as buffer size exceeds crossover threshold (typically 256 KB to 4 MB)</text>
</svg>