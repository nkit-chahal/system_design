<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">GPU Memory: Full FSDP (8 GPUs) versus LoRA (1 GPU)</text>
  <text x="25" y="48" class="sm" fill="#555">Memory layout for Llama 3.1 8B fine-tuning across our customer support post-training scenario</text>

  <!-- Left: One GPU in an 8-GPU FSDP Node -->
  <rect x="25" y="70" width="370" height="250" rx="6" class="gray"/>
  <text x="210" y="93" text-anchor="middle" class="b">Full Fine-Tuning: 1 of 8 GPUs (FSDP)</text>
  <text x="210" y="110" text-anchor="middle" class="sm" fill="#555">All 8.03B parameters trained with mixed-precision Adam</text>

  <!-- Memory Bar Container: 80 GB total (310 px wide) -->
  <rect x="55" y="125" width="310" height="36" class="white"/>
  <!-- Sharded states: 16.06 GB = 62 px -->
  <rect x="55" y="125" width="62" height="36" class="orange"/>
  <!-- Activations: 1.5 GB = 6 px -->
  <rect x="117" y="125" width="8" height="36" class="blue"/>
  <!-- Comms: 2.5 GB = 10 px -->
  <rect x="125" y="125" width="12" height="36" class="purple"/>
  <!-- Free: 60 GB = 230 px -->
  <text x="245" y="148" text-anchor="middle" class="sm" fill="#888">Free Headroom (~60 GB)</text>

  <!-- Labels -->
  <text x="55" y="180" class="sm b" fill="#d79b00">• Sharded States (16.1 GB):</text>
  <text x="70" y="196" class="sm">128.5 GB ÷ 8 GPUs (Weights, Grads, Adam m, v)</text>

  <text x="55" y="218" class="sm b" fill="#1c4587">• Activations (~1.5 GB):</text>
  <text x="70" y="234" class="sm">FlashAttention-2, seq len 2,048, micro-batch 2</text>

  <text x="55" y="256" class="sm b" fill="#9673a6">• Buffers &amp; Comms (~2.5 GB):</text>
  <text x="70" y="272" class="sm">All-Gather / Reduce-Scatter communication buffers</text>

  <text x="55" y="300" class="sm b" fill="#274e13">Peak Footprint: ~20.1 GB (Leaves &gt; 70% Headroom on H100)</text>

  <!-- Right: LoRA on 1 GPU -->
  <rect x="425" y="70" width="370" height="250" rx="6" class="gray"/>
  <text x="610" y="93" text-anchor="middle" class="b">LoRA (r=16): Single GPU</text>
  <text x="610" y="110" text-anchor="middle" class="sm" fill="#555">Base weights frozen in BF16; 0.2% parameters trained</text>

  <!-- Memory Bar Container: 80 GB total (310 px wide) -->
  <rect x="455" y="125" width="310" height="36" class="white"/>
  <!-- Frozen weights: 16.06 GB = 62 px -->
  <rect x="455" y="125" width="62" height="36" class="green"/>
  <!-- LoRA states: 0.3 GB = 3 px -->
  <rect x="517" y="125" width="4" height="36" class="orange"/>
  <!-- Activations: 1.5 GB = 6 px -->
  <rect x="521" y="125" width="8" height="36" class="blue"/>
  <!-- Free: 62 GB = 236 px -->
  <text x="645" y="148" text-anchor="middle" class="sm" fill="#888">Free Headroom (~62 GB)</text>

  <!-- Labels -->
  <text x="455" y="180" class="sm b" fill="#274e13">• Frozen Weights (16.1 GB):</text>
  <text x="470" y="196" class="sm">8.03B params × 2 bytes (BF16, no gradients)</text>

  <text x="455" y="218" class="sm b" fill="#d79b00">• Adapter States (~0.3 GB):</text>
  <text x="470" y="234" class="sm">Rank 16 weights (32 MB) + Adam states (250 MB)</text>

  <text x="455" y="256" class="sm b" fill="#1c4587">• Activations (~1.5 GB):</text>
  <text x="470" y="272" class="sm">Forward activations for backprop through adapters</text>

  <text x="455" y="300" class="sm b" fill="#274e13">Peak Footprint: ~17.9 GB (Fits on a single 24 GB GPU)</text>
</svg>