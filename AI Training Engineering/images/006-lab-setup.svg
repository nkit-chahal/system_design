<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">Lab Setup: Memory Accounting and Profiling Pipeline</text>
  <text x="25" y="48" class="sm" fill="#555">From analytical prediction to instrumented runtime profiling and snapshot visualization</text>

  <!-- Step 1: Analytical Predictor -->
  <rect x="25" y="80" width="165" height="150" rx="6" class="blue"/>
  <text x="107" y="105" text-anchor="middle" class="b">1. Predictor</text>
  <text x="107" y="125" text-anchor="middle" class="sm">predict_memory.py</text>
  <line x1="40" y1="135" x2="175" y2="135" stroke="#6c8ebf" stroke-width="1"/>
  <text x="35" y="155" class="sm">• 16 B/param static</text>
  <text x="35" y="173" class="sm">• Megatron-LM act law</text>
  <text x="35" y="191" class="sm">• FlashAttn &amp; CKP</text>
  <text x="35" y="209" class="sm">• Workspace budgets</text>

  <!-- Arrow 1 to 2 -->
  <line x1="190" y1="155" x2="225" y2="155" class="edge"/>

  <!-- Step 2: Training Script -->
  <rect x="230" y="80" width="175" height="150" rx="6" class="orange"/>
  <text x="317" y="105" text-anchor="middle" class="b">2. Training Script</text>
  <text x="317" y="125" text-anchor="middle" class="sm">train_gpt.py (nanoGPT)</text>
  <line x1="245" y1="135" x2="390" y2="135" stroke="#d79b00" stroke-width="1"/>
  <text x="240" y="155" class="sm">• GPT-2 small / 1B</text>
  <text x="240" y="173" class="sm">• Mixed precision BF16</text>
  <text x="240" y="191" class="sm">• Grad accumulation</text>
  <text x="240" y="209" class="sm">• Checkpointing toggle</text>

  <!-- Arrow 2 to 3 -->
  <line x1="405" y1="155" x2="440" y2="155" class="edge"/>

  <!-- Step 3: Instrumentation & Snapshots -->
  <rect x="445" y="80" width="175" height="150" rx="6" class="purple"/>
  <text x="532" y="105" text-anchor="middle" class="b">3. Instrumentation</text>
  <text x="532" y="125" text-anchor="middle" class="sm">CUDA Profiling Hooks</text>
  <line x1="460" y1="135" x2="605" y2="135" stroke="#9673a6" stroke-width="1"/>
  <text x="455" y="155" class="sm">• max_memory_alloc</text>
  <text x="455" y="173" class="sm">• memory_allocated()</text>
  <text x="455" y="191" class="sm">• _record_memory_history</text>
  <text x="455" y="209" class="sm">• _dump_snapshot()</text>

  <!-- Arrow 3 to 4 -->
  <line x1="620" y1="155" x2="655" y2="155" class="edge"/>

  <!-- Step 4: Verification & Viz -->
  <rect x="660" y="80" width="135" height="150" rx="6" class="green"/>
  <text x="727" y="105" text-anchor="middle" class="b">4. Verification</text>
  <text x="727" y="125" text-anchor="middle" class="sm">Visualizer &amp; Table</text>
  <line x1="675" y1="135" x2="780" y2="135" stroke="#82b366" stroke-width="1"/>
  <text x="670" y="155" class="sm">• pytorch.org/</text>
  <text x="680" y="173" class="sm">memory_viz</text>
  <text x="670" y="191" class="sm">• Predicted vs</text>
  <text x="680" y="209" class="sm">measured table</text>

  <!-- Bottom banner explaining workflow -->
  <rect x="25" y="255" width="770" height="60" rx="6" class="gray"/>
  <text x="40" y="278" class="sm"><tspan class="b">Lab Execution Flow:</tspan> 1. Calculate analytical limits -&gt; 2. Execute instrumented runs under varied batch sizes -&gt;</text>
  <text x="40" y="298" class="sm">3. Record memory event pickles -&gt; 4. Upload snapshot to PyTorch visualizer and account for discrepancies.</text>
</svg>
