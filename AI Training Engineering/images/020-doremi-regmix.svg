<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">Automated Mixture Optimization: DoReMi vs RegMix</text>
  <text x="25" y="48" class="sm" fill="#555">Replacing combinatorial brute-force tuning with proxy dynamics and empirical regression</text>

  <!-- Left Container: DoReMi (Group DRO) -->
  <rect x="25" y="65" width="370" height="255" rx="6" class="gray"/>
  <text x="210" y="90" text-anchor="middle" class="b">DoReMi: Minimax Optimization</text>
  <text x="210" y="108" text-anchor="middle" class="sm" fill="#555">Xie et al., 2023 (arXiv:2305.10429)</text>

  <!-- Step 1 Reference Model -->
  <rect x="45" y="122" width="330" height="42" rx="4" class="white"/>
  <text x="210" y="140" text-anchor="middle" class="sm"><tspan class="b">Step 1:</tspan> Train small Reference Model (280M)</text>
  <text x="210" y="156" text-anchor="middle" class="sm" fill="#555">Trained with uniform domain mixture</text>

  <path d="M 210 164 L 210 180" class="edge"/>

  <!-- Step 2 Proxy Group DRO -->
  <rect x="45" y="180" width="330" height="52" rx="4" class="purple"/>
  <text x="210" y="200" text-anchor="middle" class="sm"><tspan class="b">Step 2:</tspan> Proxy Model with Group DRO</text>
  <text x="210" y="218" text-anchor="middle" class="sm">Dynamically upweights domains with high excess loss</text>

  <path d="M 210 232 L 210 250" class="edge"/>

  <!-- Step 3 Final Weights -->
  <rect x="45" y="250" width="330" height="54" rx="4" class="green"/>
  <text x="210" y="270" text-anchor="middle" class="sm"><tspan class="b">Outcome:</tspan> 2.6× faster to target accuracy</text>
  <text x="210" y="288" text-anchor="middle" class="sm">Domain weights scale directly to 8B model</text>

  <!-- Right Container: RegMix (Data Mixing Laws) -->
  <rect x="425" y="65" width="370" height="255" rx="6" class="gray"/>
  <text x="610" y="90" text-anchor="middle" class="b">RegMix: Data Mixture as Regression</text>
  <text x="610" y="108" text-anchor="middle" class="sm" fill="#555">Liu et al., 2024 (arXiv:2407.01492)</text>

  <!-- Step 1 Random Mixtures -->
  <rect x="445" y="122" width="330" height="42" rx="4" class="white"/>
  <text x="610" y="140" text-anchor="middle" class="sm"><tspan class="b">Step 1:</tspan> Sample 256–512 Dirichlet Mixtures</text>
  <text x="610" y="156" text-anchor="middle" class="sm" fill="#555">Train tiny proxy models (1M–10M parameters)</text>

  <path d="M 610 164 L 610 180" class="edge"/>

  <!-- Step 2 Regression Fit -->
  <rect x="445" y="180" width="330" height="52" rx="4" class="blue"/>
  <text x="610" y="200" text-anchor="middle" class="sm"><tspan class="b">Step 2:</tspan> Fit Regression Model</text>
  <text x="610" y="218" text-anchor="middle" class="sm">Maps domain mixture vector α to validation loss</text>

  <path d="M 610 232 L 610 250" class="edge"/>

  <!-- Step 3 Simulation & Scaling -->
  <rect x="445" y="250" width="330" height="54" rx="4" class="orange"/>
  <text x="610" y="270" text-anchor="middle" class="sm"><tspan class="b">Outcome:</tspan> Simulates millions of mixes</text>
  <text x="610" y="288" text-anchor="middle" class="sm">Uses ~10% compute of DoReMi; finds global optimum</text>
</svg>