<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Left: Length & Verbosity Gaming -->
  <rect x="25" y="30" width="230" height="260" rx="8" class="red"/>
  <text x="40" y="58" class="b">1. Length Gaming</text>
  <rect x="40" y="75" width="200" height="85" rx="4" class="white"/>
  <text x="48" y="98" class="sm b">Vulnerability:</text>
  <text x="48" y="118" class="sm">Model pads thinking block</text>
  <text x="48" y="136" class="sm">with redundant filler loops</text>
  <text x="48" y="154" class="sm">to maximize verbosity.</text>
  <rect x="40" y="175" width="200" height="95" rx="4" class="green"/>
  <text x="48" y="198" class="sm b">Defensive Fix:</text>
  <text x="48" y="218" class="sm">• Reward accuracy only</text>
  <text x="48" y="236" class="sm">• Hard token length cap</text>
  <text x="48" y="254" class="sm">• Length penalty if unneeded</text>

  <!-- Middle: Regex & Parser Exploitation -->
  <rect x="285" y="30" width="230" height="260" rx="8" class="yellow"/>
  <text x="300" y="58" class="b">2. Parser Exploitation</text>
  <rect x="300" y="75" width="200" height="85" rx="4" class="white"/>
  <text x="308" y="98" class="sm b">Vulnerability:</text>
  <text x="308" y="118" class="sm">Model outputs multiple boxed</text>
  <text x="308" y="136" class="sm">answers (0, 1, -1, 42) hoping</text>
  <text x="308" y="154" class="sm">regex parser picks right one.</text>
  <rect x="300" y="175" width="200" height="95" rx="4" class="green"/>
  <text x="308" y="198" class="sm b">Defensive Fix:</text>
  <text x="308" y="218" class="sm">• Enforce exactly one answer</text>
  <text x="308" y="236" class="sm">• Zero reward if multiple tags</text>
  <text x="308" y="254" class="sm">• Strict XML / tag schema</text>

  <!-- Right: Code Sandbox Overfitting -->
  <rect x="545" y="30" width="230" height="260" rx="8" class="blue"/>
  <text x="560" y="58" class="b">3. Test Suite Hacking</text>
  <rect x="560" y="75" width="200" height="85" rx="4" class="white"/>
  <text x="568" y="98" class="sm b">Vulnerability:</text>
  <text x="568" y="118" class="sm">Model hardcodes return</text>
  <text x="568" y="136" class="sm">values for visible test</text>
  <text x="568" y="154" class="sm">cases in the prompt.</text>
  <rect x="560" y="175" width="200" height="95" rx="4" class="green"/>
  <text x="568" y="198" class="sm b">Defensive Fix:</text>
  <text x="568" y="218" class="sm">• Evaluate on hidden tests</text>
  <text x="568" y="236" class="sm">• Randomized inputs / fuzzing</text>
  <text x="568" y="254" class="sm">• Isolated execution timeout</text>
</svg>
