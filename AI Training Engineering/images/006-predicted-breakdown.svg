<svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="26" class="title">Predicted Memory Breakdown: GPT-2 Small vs 1B Parameter Model</text>
  <text x="25" y="46" class="sm" fill="#555">Analytical component sizing based on Lesson 3 formulations (BF16 mixed-precision AdamW)</text>

  <!-- Left Column: GPT-2 Small (124M params, b=8, s=1024) -->
  <g transform="translate(25, 65)">
    <rect x="0" y="0" width="370" height="235" rx="6" class="gray"/>
    <text x="185" y="24" text-anchor="middle" class="b" fill="#b45f06">GPT-2 Small (124M params, b=8, s=1024)</text>
    <text x="185" y="42" text-anchor="middle" class="sm" fill="#555">Total Predicted Peak: 6.47 GB (Uncheckpointed FlashAttn)</text>

    <!-- Stacked bar container -->
    <g transform="translate(15, 55)">
      <!-- Total width 340 px. 6.47 GB total. Scale: 340 / 6.47 = 52.55 px per GB -->
      <!-- Static: 1.99 GB -> 105 px -->
      <!-- Act: 2.57 GB -> 135 px -->
      <!-- Logits: 1.65 GB -> 86 px -->
      <!-- Scratch: 0.26 GB -> 14 px -->
      <rect x="0" y="0" width="105" height="36" class="orange"/>
      <text x="52" y="23" text-anchor="middle" class="sm b">Static 1.99G</text>

      <rect x="105" y="0" width="135" height="36" class="blue"/>
      <text x="172" y="23" text-anchor="middle" class="sm b">Act 2.57G</text>

      <rect x="240" y="0" width="86" height="36" class="purple"/>
      <text x="283" y="23" text-anchor="middle" class="sm b">Logits 1.65G</text>

      <rect x="326" y="0" width="14" height="36" class="yellow"/>
    </g>

    <!-- Details -->
    <text x="20" y="115" class="sm"><tspan class="b">• Static (16 B/param):</tspan> 1,991 MB</text>
    <text x="32" y="132" class="sm">Weights 249M, Grads 249M, Master 498M, Adam 996M</text>
    <text x="20" y="152" class="sm"><tspan class="b">• Dynamic Activations:</tspan> 2,567 MB (34sbh linear)</text>
    <text x="32" y="169" class="sm" fill="#274e13">With activation checkpointing: drops to 516 MB</text>
    <text x="20" y="189" class="sm"><tspan class="b">• Logits Projection Buffer:</tspan> 1,647 MB (8×1024×50257×4)</text>
    <text x="20" y="209" class="sm"><tspan class="b">• Ephemeral Workspaces:</tspan> 262 MB (cuBLAS / SDPA)</text>
    <text x="20" y="226" class="sm" fill="#b45f06"><tspan class="b">Target Hardware:</tspan> Fits comfortably on 8 GB consumer GPU</text>
  </g>

  <!-- Right Column: 1B Model on H100 (1.0B params, b=8, s=2048) -->
  <g transform="translate(425, 65)">
    <rect x="0" y="0" width="370" height="235" rx="6" class="gray"/>
    <text x="185" y="24" text-anchor="middle" class="b" fill="#1c4587">1B Parameter Model (1.00B params, b=8, s=2048)</text>
    <text x="185" y="42" text-anchor="middle" class="sm" fill="#555">Total Predicted Peak: 29.27 GB (Checkpointed FlashAttn)</text>

    <!-- Stacked bar container -->
    <g transform="translate(15, 55)">
      <!-- Total width 340 px. 29.27 GB total. Scale: 340 / 29.27 = 11.616 px per GB -->
      <!-- Static: 16.00 GB -> 186 px -->
      <!-- Act: 3.29 GB -> 38 px -->
      <!-- Logits: 8.41 GB -> 98 px -->
      <!-- Scratch: 1.57 GB -> 18 px -->
      <rect x="0" y="0" width="186" height="36" class="orange"/>
      <text x="93" y="23" text-anchor="middle" class="sm b">Static States 16.00 GB</text>

      <rect x="186" y="0" width="38" height="36" class="green"/>
      <text x="205" y="23" text-anchor="middle" class="sm b">3.3G</text>

      <rect x="224" y="0" width="98" height="36" class="purple"/>
      <text x="273" y="23" text-anchor="middle" class="sm b">Logits 8.41G</text>

      <rect x="322" y="0" width="18" height="36" class="yellow"/>
    </g>

    <!-- Details -->
    <text x="20" y="115" class="sm"><tspan class="b">• Static (16 B/param):</tspan> 16.00 GB (14.90 GiB)</text>
    <text x="32" y="132" class="sm">Weights 2.0G, Grads 2.0G, Master 4.0G, Adam 8.0G</text>
    <text x="20" y="152" class="sm"><tspan class="b">• Checkpointed Activations:</tspan> 3.29 GB (32 layers, s=2048)</text>
    <text x="32" y="169" class="sm" fill="#900">Uncheckpointed activations would take 25.0 GB</text>
    <text x="20" y="189" class="sm"><tspan class="b">• Logits Projection Buffer:</tspan> 8.41 GB (8×2048×128256×4)</text>
    <text x="20" y="209" class="sm"><tspan class="b">• Ephemeral Workspaces:</tspan> 1.57 GB (cuBLAS GEMM scratch)</text>
    <text x="20" y="226" class="sm" fill="#1c4587"><tspan class="b">Target Hardware:</tspan> Uses 29.3 GB of 80 GB H100 (50.7 GB headroom)</text>
  </g>

  <!-- Legend at bottom -->
  <g transform="translate(60, 320)">
    <rect x="0" y="0" width="18" height="14" class="orange"/>
    <text x="26" y="12" class="sm">Model &amp; Adam States</text>

    <rect x="180" y="0" width="18" height="14" class="blue"/>
    <text x="206" y="12" class="sm">Activations</text>

    <rect x="300" y="0" width="18" height="14" class="green"/>
    <text x="326" y="12" class="sm">Checkpointed Act</text>

    <rect x="460" y="0" width="18" height="14" class="purple"/>
    <text x="486" y="12" class="sm">Logits Buffer</text>

    <rect x="590" y="0" width="18" height="14" class="yellow"/>
    <text x="616" y="12" class="sm">GEMM Workspace</text>
  </g>
</svg>
