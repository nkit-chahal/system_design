<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.xs{font-size:11px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="26" class="title">Global Batch Arithmetic and the DP-PP Scaling Tension</text>
  <text x="25" y="44" class="sm" fill="#555">Global Batch Tokens = DP × m × b × s. Scaling DP reduces micro-batch count m, inflating PP bubble overhead.</text>

  <!-- Formula Boxes across the width -->
  <!-- Box 1: DP -->
  <rect x="25" y="65" width="175" height="110" rx="6" class="blue"/>
  <text x="112" y="88" text-anchor="middle" class="b">Data Parallel (DP)</text>
  <text x="112" y="110" text-anchor="middle" class="title">DP = 32</text>
  <text x="112" y="132" text-anchor="middle" class="xs">Independent model replicas</text>
  <text x="112" y="148" text-anchor="middle" class="xs">synchronizing gradients</text>
  <text x="112" y="164" text-anchor="middle" class="xs" fill="#555">Scales with cluster size</text>

  <text x="207" y="125" text-anchor="middle" class="title">×</text>

  <!-- Box 2: m (Accumulation steps) -->
  <rect x="220" y="65" width="175" height="110" rx="6" class="orange"/>
  <text x="307" y="88" text-anchor="middle" class="b">Accumulation (m)</text>
  <text x="307" y="110" text-anchor="middle" class="title">m = 16</text>
  <text x="307" y="132" text-anchor="middle" class="xs">Micro-batches per step</text>
  <text x="307" y="148" text-anchor="middle" class="xs">Controls pipeline bubble:</text>
  <text x="307" y="164" text-anchor="middle" class="xs b">Bubble ≈ (p − 1)/(m+p−1)</text>

  <text x="402" y="125" text-anchor="middle" class="title">×</text>

  <!-- Box 3: b (Micro-batch size) -->
  <rect x="415" y="65" width="175" height="110" rx="6" class="green"/>
  <text x="502" y="88" text-anchor="middle" class="b">Micro-batch (b)</text>
  <text x="502" y="110" text-anchor="middle" class="title">b = 1</text>
  <text x="502" y="132" text-anchor="middle" class="xs">Sequences per GPU step</text>
  <text x="502" y="148" text-anchor="middle" class="xs">Constrained by GPU memory</text>
  <text x="502" y="164" text-anchor="middle" class="xs" fill="#555">Often b = 1 for long context</text>

  <text x="597" y="125" text-anchor="middle" class="title">×</text>

  <!-- Box 4: s (Seq Len) -->
  <rect x="610" y="65" width="185" height="110" rx="6" class="purple"/>
  <text x="702" y="88" text-anchor="middle" class="b">Sequence Length (s)</text>
  <text x="702" y="110" text-anchor="middle" class="title">s = 8,192</text>
  <text x="702" y="132" text-anchor="middle" class="xs">Tokens per sequence</text>
  <text x="702" y="148" text-anchor="middle" class="xs">Fixed by pretraining spec</text>
  <text x="702" y="164" text-anchor="middle" class="xs" fill="#555">Modern default: 8,192</text>

  <!-- Total Result Box -->
  <rect x="25" y="190" width="770" height="50" rx="6" class="gray"/>
  <text x="410" y="212" text-anchor="middle" class="sm">Global Batch: <tspan class="b">32 × 16 × 1 × 8,192 = 4,194,304 tokens</tspan> (512 sequences of 8,192)</text>
  <text x="410" y="230" text-anchor="middle" class="xs" fill="#555">Per-replica batch: m × b = 16 sequences = 131,072 tokens per optimizer step.</text>

  <!-- Tension Explanation Box -->
  <rect x="25" y="250" width="770" height="75" rx="4" class="red"/>
  <text x="40" y="272" class="b" fill="#900">The Scaling Tension: Why Pipeline Parallelism Limits Cluster Growth</text>
  <text x="40" y="292" class="sm">• If cluster expands 4× (DP grows from 32 to 128) under a fixed 4M token batch, accumulation steps must shrink to <tspan class="b">m = 4</tspan>.</text>
  <text x="40" y="310" class="sm">• With p = 8, dropping m to 4 blows up the pipeline bubble from 17.9% to <tspan class="b">63.6%</tspan>, wasting almost two-thirds of cluster compute!</text>
</svg>