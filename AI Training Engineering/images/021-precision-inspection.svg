<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">Inspection of Filtered Documents: Precision Audit</text>
  <text x="25" y="48" class="sm" fill="#555">Distinguishing true low-quality web spam from catastrophic false-positive deletions</text>

  <!-- Left: True Positives (Desirable Rejections) -->
  <rect x="25" y="70" width="375" height="205" rx="6" class="gray"/>
  <rect x="35" y="80" width="355" height="30" rx="4" class="red"/>
  <text x="212" y="100" text-anchor="middle" class="b">True Positives: Correctly Discarded Spam</text>

  <rect x="35" y="120" width="355" height="142" rx="4" class="white"/>
  <text x="45" y="142" class="sm b" fill="#b85450">• Cookie &amp; Navigation Menus:</text>
  <text x="55" y="158" class="sm">"Accept all cookies | Home | About | Privacy Policy | Sign in..."</text>
  <text x="45" y="180" class="sm b" fill="#b85450">• SEO Keyword Stuffing:</text>
  <text x="55" y="196" class="sm">"cheap flights cheap hotels cheap rental cars cheap tickets..."</text>
  <text x="45" y="218" class="sm b" fill="#b85450">• Machine Translation Scrapes:</text>
  <text x="55" y="234" class="sm">Garbled token mixtures, incoherent syntax, repetitive glyph loops</text>

  <!-- Right: False Positives (Disastrous Deletions) -->
  <rect x="420" y="70" width="375" height="205" rx="6" class="gray"/>
  <rect x="430" y="80" width="355" height="30" rx="4" class="green"/>
  <text x="607" y="100" text-anchor="middle" class="b">False Positives: High-Value Content at Risk</text>

  <rect x="430" y="120" width="355" height="142" rx="4" class="white"/>
  <text x="440" y="142" class="sm b" fill="#274e13">• LaTeX &amp; Mathematical Proofs:</text>
  <text x="450" y="158" class="sm">Rejected by symbol-ratio filters due to \, {, }, ^, and _ symbols</text>
  <text x="440" y="180" class="sm b" fill="#274e13">• Source Code Blocks &amp; Dictionaries:</text>
  <text x="450" y="196" class="sm">Rejected by terminal punctuation filters (code lacks periods)</text>
  <text x="440" y="218" class="sm b" fill="#274e13">• Scientific Tables &amp; Gene Sequences:</text>
  <text x="450" y="234" class="sm">Rejected by mean-word-length and repetitive-character filters</text>
</svg>