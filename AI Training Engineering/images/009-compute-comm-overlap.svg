<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">Step 4: Communication Overlap Verification (Compute vs Network)</text>
  <text x="25" y="48" class="sm" fill="#555">Verifying that data-parallel All-Reduce hides completely behind backward pass computation</text>

  <!-- Timeline Area: Step total = 1,995 ms (760px wide, 0.38px per ms) -->
  <!-- Forward Pass: 665 ms (253px) -->
  <rect x="25" y="80" width="253" height="46" class="blue"/>
  <text x="151" y="102" text-anchor="middle" class="b">Forward Pass</text>
  <text x="151" y="118" text-anchor="middle" class="sm">665 ms (2N compute)</text>

  <!-- Backward Pass: 1,330 ms (507px) -->
  <rect x="282" y="80" width="507" height="46" class="orange"/>
  <text x="535" y="102" text-anchor="middle" class="b">Backward Pass (Math)</text>
  <text x="535" y="118" text-anchor="middle" class="sm">1,330 ms (4N activation &amp; weight gradients)</text>

  <!-- Overlapped All-Reduce Communication Stream -->
  <!-- Comm starts after initial backward buckets produce gradients (e.g., at ms 1,100) -->
  <rect x="380" y="136" width="244" height="40" class="green"/>
  <text x="502" y="156" text-anchor="middle" class="b" fill="#274e13">All-Reduce Communication</text>
  <text x="502" y="170" text-anchor="middle" class="sm" fill="#274e13">642 ms (32 GB over 50 GB/s InfiniBand)</text>

  <!-- Bracket / Status arrow -->
  <line x1="624" y1="156" x2="789" y2="156" stroke="#82b366" stroke-dasharray="3 3"/>
  <text x="706" y="150" text-anchor="middle" class="sm b" fill="#274e13">Hides in math!</text>

  <!-- Two Comparison Cards -->
  <rect x="25" y="192" width="370" height="78" rx="6" class="gray"/>
  <text x="40" y="214" class="b">Step Arithmetic (16,384 tokens/GPU):</text>
  <text x="40" y="234" class="sm">• Step compute: 16,384 × 6 × 8.03B = <tspan class="b">7.89e14 FLOPs</tspan></text>
  <text x="40" y="252" class="sm">• Compute duration: 7.89e14 ÷ (989 TF × 0.40) = <tspan class="b">1,995 ms</tspan></text>

  <rect x="425" y="192" width="370" height="78" rx="6" class="green"/>
  <text x="440" y="214" class="b" fill="#274e13">Network Verification:</text>
  <text x="440" y="234" class="sm">• All-Reduce volume: 2 × (255/256) × 16.06 GB = <tspan class="b">32.12 GB</tspan></text>
  <text x="440" y="252" class="sm">• All-Reduce duration: 32.12 GB ÷ 50 GB/s = <tspan class="b">642 ms &lt; 1,330 ms</tspan></text>

  <!-- Explanatory footer -->
  <rect x="25" y="280" width="770" height="48" rx="6" class="gray"/>
  <text x="40" y="300" class="b">Conclusion:</text>
  <text x="40" y="316" class="sm">Communication takes only 48% of the backward pass duration. With bucketed all-reduce, network overhead is 100% hidden.</text>
</svg>
