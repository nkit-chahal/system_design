<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .lg { font-size: 16px; }
    .b { font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .yellow { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .group { fill: none; stroke: #000; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .edge { fill: none; stroke: #000; stroke-width: 1.2; marker-end: url(#arrow); }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="410" y="24" text-anchor="middle" class="lg b">Static Memory Scaling for Llama 3.1 8B across GPU Counts (GB per GPU)</text>

  <!-- Left Section: N = 8 GPUs (1 Node) -->
  <rect x="40" y="45" width="345" height="215" rx="5" class="gray"/>
  <text x="212" y="68" text-anchor="middle" class="b">Cluster Size: N = 8 GPUs (1 Node)</text>

  <!-- DDP bar -->
  <rect x="60" y="85" width="220" height="24" rx="3" class="red"/>
  <text x="170" y="101" text-anchor="middle" class="sm b">Baseline DDP: 128.5 GB</text>
  <text x="310" y="101" class="sm b" fill="#b85450">OOM</text>

  <!-- ZeRO-1 bar -->
  <rect x="60" y="120" width="135" height="24" rx="3" class="blue"/>
  <text x="127" y="136" text-anchor="middle" class="sm">ZeRO-1: 44.2 GB</text>
  <text x="210" y="136" class="sm b" fill="#2b5797">Fits</text>

  <!-- ZeRO-2 bar -->
  <rect x="60" y="155" width="100" height="24" rx="3" class="purple"/>
  <text x="110" y="171" text-anchor="middle" class="sm">ZeRO-2: 30.1 GB</text>
  <text x="175" y="171" class="sm b" fill="#2b5797">Fits</text>

  <!-- ZeRO-3 bar -->
  <rect x="60" y="190" width="60" height="24" rx="3" class="green"/>
  <text x="90" y="206" text-anchor="middle" class="sm">16.1 GB</text>
  <text x="135" y="206" class="sm b" fill="#2b5797">ZeRO-3 (Fits)</text>

  <text x="212" y="245" text-anchor="middle" class="sm">H100 Limit: 80 GB (visible ~79.6 GiB)</text>

  <!-- Right Section: N = 256 GPUs (32 Nodes) -->
  <rect x="415" y="45" width="365" height="215" rx="5" class="gray"/>
  <text x="597" y="68" text-anchor="middle" class="b">Cluster Size: N = 256 GPUs (32 Nodes)</text>

  <!-- DDP bar -->
  <rect x="435" y="85" width="230" height="24" rx="3" class="red"/>
  <text x="550" y="101" text-anchor="middle" class="sm b">Baseline DDP: 128.5 GB</text>
  <text x="690" y="101" class="sm b" fill="#b85450">OOM</text>

  <!-- ZeRO-1 bar -->
  <rect x="435" y="120" width="110" height="24" rx="3" class="blue"/>
  <text x="490" y="136" text-anchor="middle" class="sm">ZeRO-1: 32.5 GB</text>
  <text x="560" y="136" class="sm b" fill="#2b5797">Fits</text>

  <!-- ZeRO-2 bar -->
  <rect x="435" y="155" width="70" height="24" rx="3" class="purple"/>
  <text x="470" y="171" text-anchor="middle" class="sm">16.5 GB</text>
  <text x="520" y="171" class="sm b" fill="#2b5797">ZeRO-2 (Fits)</text>

  <!-- ZeRO-3 bar -->
  <rect x="435" y="190" width="20" height="24" rx="3" class="green"/>
  <text x="445" y="206" text-anchor="middle" class="sm b"></text>
  <text x="470" y="206" class="sm b" fill="#2b5797">ZeRO-3: 0.50 GB (99.6% reduction)</text>

  <text x="597" y="245" text-anchor="middle" class="sm">Massive headroom remaining for activations</text>

  <!-- Bottom Key insight -->
  <rect x="40" y="275" width="740" height="32" rx="4" class="yellow"/>
  <text x="410" y="296" text-anchor="middle" class="sm b">ZeRO-3 scales static state memory inversely with N (16 Psi / N), completely eliminating static memory limits</text>
</svg>