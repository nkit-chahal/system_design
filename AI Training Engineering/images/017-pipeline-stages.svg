<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}.mid{text-anchor:middle}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="25" y="30" class="lg b">The Pretraining Data Pipeline: From Raw Web to GPU Shards</text>
  <text x="25" y="52" class="sm" fill="#555">End-to-end transformation of petabytes of raw crawl archives into packed binary token shards</text>

  <!-- Row 1: Ingestion & Text Extraction -->
  <rect x="25" y="80" width="165" height="75" rx="5" class="blue"/>
  <text x="107" y="105" class="b mid">1. Raw Web &amp; Code</text>
  <text x="107" y="124" class="sm mid">Common Crawl WARC</text>
  <text x="107" y="141" class="sm mid">GitHub, arXiv, books</text>

  <line x1="190" y1="117" x2="225" y2="117" class="edge"/>

  <rect x="230" y="80" width="165" height="75" rx="5" class="orange"/>
  <text x="312" y="105" class="b mid">2. HTML Extraction</text>
  <text x="312" y="124" class="sm mid">Trafilatura parsing</text>
  <text x="312" y="141" class="sm mid">Strip ads, nav, scripts</text>

  <line x1="395" y1="117" x2="430" y2="117" class="edge"/>

  <rect x="435" y="80" width="165" height="75" rx="5" class="purple"/>
  <text x="517" y="105" class="b mid">3. Language ID</text>
  <text x="517" y="124" class="sm mid">fastText classifier</text>
  <text x="517" y="141" class="sm mid">Keep target languages</text>

  <line x1="600" y1="117" x2="635" y2="117" class="edge"/>

  <rect x="640" y="80" width="155" height="75" rx="5" class="yellow"/>
  <text x="717" y="105" class="b mid">4. Quality Filters</text>
  <text x="717" y="124" class="sm mid">Gopher heuristics</text>
  <text x="717" y="141" class="sm mid">Perplexity &amp; classifiers</text>

  <!-- Turn from Row 1 to Row 2 -->
  <path d="M 717 155 L 717 185 L 717 215" class="edge"/>

  <!-- Row 2: Dedup, Tokenization, Packing -->
  <rect x="640" y="220" width="155" height="75" rx="5" class="red"/>
  <text x="717" y="245" class="b mid">5. Deduplication</text>
  <text x="717" y="264" class="sm mid">MinHash LSH &amp; exact</text>
  <text x="717" y="281" class="sm mid">Remove mirror pages</text>

  <line x1="640" y1="257" x2="605" y2="257" class="edge"/>

  <rect x="435" y="220" width="165" height="75" rx="5" class="purple"/>
  <text x="517" y="245" class="b mid">6. Safety &amp; PII</text>
  <text x="517" y="264" class="sm mid">Mask email, IP, phone</text>
  <text x="517" y="281" class="sm mid">Domain blocklists</text>

  <line x1="435" y1="257" x2="400" y2="257" class="edge"/>

  <rect x="230" y="220" width="165" height="75" rx="5" class="orange"/>
  <text x="312" y="245" class="b mid">7. Tokenize &amp; Pack</text>
  <text x="312" y="264" class="sm mid">Byte-level BPE</text>
  <text x="312" y="281" class="sm mid">Pack to 8,192 tokens</text>

  <line x1="230" y1="257" x2="195" y2="257" class="edge"/>

  <rect x="25" y="220" width="165" height="75" rx="5" class="green"/>
  <text x="107" y="245" class="b mid">8. Sharded Files</text>
  <text x="107" y="264" class="sm mid">Binary uint32 arrays</text>
  <text x="107" y="281" class="sm mid">Streamed to 256 GPUs</text>

  <!-- Flow labels -->
  <text x="110" y="322" class="sm" fill="#666">~20 TB raw web text</text>
  <text x="435" y="322" class="sm" fill="#666">Drop ~80% noise</text>
  <text x="645" y="322" class="sm" fill="#666">Yields 1T tokens (4 TB)</text>
</svg>