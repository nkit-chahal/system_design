<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Chart Title -->
  <text x="40" y="35" class="lg b">Young / Daly Optimal Checkpoint Interval (Illustrative)</text>
  <text x="40" y="55" class="sm gray">Trade-off between checkpoint save overhead and lost recomputation upon failure</text>

  <!-- Axes -->
  <line x1="90" y1="260" x2="740" y2="260" stroke="#000" stroke-width="1.2"/>
  <line x1="90" y1="260" x2="90" y2="70" stroke="#000" stroke-width="1.2"/>

  <!-- Axis Labels -->
  <text x="350" y="295" class="b">Checkpoint Interval tau (hours)</text>
  <text x="35" y="170" class="b" text-anchor="middle" transform="rotate(-90 35 170)">Wasted Compute Fraction</text>

  <!-- Curve 1: Checkpoint Cost (delta / tau) - Red curve -->
  <path d="M110,85 Q135,210 280,240 T720,255" fill="none" stroke="#b85450" stroke-width="2.2"/>
  <text x="135" y="115" class="sm b" fill="#b85450">Save Overhead (delta / tau)</text>
  <text x="135" y="132" class="sm gray">Too frequent: I/O stalls GPUs</text>

  <!-- Curve 2: Lost Work upon failure (tau / (2*M)) - Blue curve -->
  <path d="M90,255 L720,135" fill="none" stroke="#6c8ebf" stroke-width="2.2"/>
  <text x="560" y="145" class="sm b" fill="#6c8ebf">Lost Work (tau / 2M)</text>
  <text x="560" y="162" class="sm gray">Too rare: massive rollback</text>

  <!-- Curve 3: Total Wasted Time (Sum) - Green curve -->
  <path d="M110,90 Q150,225 350,215 Q520,210 720,125" fill="none" stroke="#82b366" stroke-width="3"/>
  <text x="410" y="195" class="sm b" fill="#05673d">Total Overhead Curve</text>

  <!-- Optimal Interval Line -->
  <line x1="335" y1="75" x2="335" y2="260" stroke="#000" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="335" cy="217" r="5" fill="#82b366" stroke="#05673d" stroke-width="2"/>

  <rect x="250" y="70" width="170" height="42" rx="4" class="green"/>
  <text x="260" y="90" class="sm b">Optimal tau = sqrt(2*delta*M)</text>
  <text x="260" y="105" class="sm">Minimizes total waste</text>

  <!-- Ticks -->
  <text x="85" y="275" class="sm">0</text>
  <text x="200" y="275" class="sm">1.5h</text>
  <text x="325" y="275" class="sm b">3.15h</text>
  <text x="500" y="275" class="sm">6.0h</text>
  <text x="680" y="275" class="sm">10.0h</text>
</svg>
