<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">Data-Constrained Scaling: Repeating Data Across Epochs</text>
  <text x="25" y="48" class="sm" fill="#555">Empirical findings from Muennighoff et al. (2023) on multi-epoch pretraining penalties</text>

  <!-- Three Region Blocks -->
  <!-- Region 1: 1 - 4 Epochs (Safe) -->
  <rect x="25" y="70" width="245" height="190" rx="6" class="green"/>
  <text x="40" y="96" class="b" fill="#274e13">1 to 4 Epochs</text>
  <text x="40" y="118" class="sm">• <tspan class="b">Negligible penalty</tspan></text>
  <text x="40" y="136" class="sm">• Test loss tracks unique data</text>
  <text x="40" y="154" class="sm">• Minimal memorization risk</text>
  <text x="40" y="172" class="sm">• Safe strategy when high-quality</text>
  <text x="40" y="188" class="sm">  tokens are scarce</text>
  <rect x="35" y="202" width="225" height="46" rx="4" class="white"/>
  <text x="45" y="222" class="sm b" fill="#274e13">Safe Pretraining Regime</text>
  <text x="45" y="238" class="sm">Loss degradation &lt; 0.01</text>

  <!-- Region 2: 4 - 16 Epochs (Diminishing Returns) -->
  <rect x="285" y="70" width="245" height="190" rx="6" class="yellow"/>
  <text x="300" y="96" class="b" fill="#7f6000">4 to 16 Epochs</text>
  <text x="300" y="118" class="sm">• <tspan class="b">Diminishing returns</tspan></text>
  <text x="300" y="136" class="sm">• Marginal utility decays fast</text>
  <text x="300" y="154" class="sm">• Requires higher regularization</text>
  <text x="300" y="172" class="sm">• Compute efficiency drops</text>
  <text x="300" y="188" class="sm">  by 30% to 50%</text>
  <rect x="295" y="202" width="225" height="46" rx="4" class="white"/>
  <text x="305" y="222" class="sm b" fill="#7f6000">Sub-Optimal Efficiency</text>
  <text x="305" y="238" class="sm">Better to scale model size</text>

  <!-- Region 3: 16+ Epochs (Plateau / Overfitting) -->
  <rect x="545" y="70" width="250" height="190" rx="6" class="red"/>
  <text x="560" y="96" class="b" fill="#900">16+ Epochs</text>
  <text x="560" y="118" class="sm">• <tspan class="b">Severe value decay</tspan></text>
  <text x="560" y="136" class="sm">• Marginal return nears zero</text>
  <text x="560" y="154" class="sm">• Heavy verbatim memorization</text>
  <text x="560" y="172" class="sm">• Risk of loss divergence</text>
  <text x="560" y="188" class="sm">  and reasoning degradation</text>
  <rect x="555" y="202" width="230" height="46" rx="4" class="white"/>
  <text x="565" y="222" class="sm b" fill="#900">Failure / Stagnation Zone</text>
  <text x="565" y="238" class="sm">Additional FLOPs wasted</text>

  <!-- Bottom Explanatory Banner -->
  <rect x="25" y="275" width="770" height="60" rx="6" class="gray"/>
  <text x="40" y="298" class="b">Engineering Recommendation:</text>
  <text x="40" y="318" class="sm">If high-quality clean tokens are limited, you can safely repeat the dataset up to 4 epochs without meaningful</text>
  <text x="40" y="334" class="sm">loss degradation. Beyond 4 epochs, spend compute on synthetic data generation or filtering rather than raw repeats.</text>
</svg>
