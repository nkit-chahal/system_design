<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .lg { font-size: 16px; }
    .b { font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .yellow { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .group { fill: none; stroke: #000; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .edge { fill: none; stroke: #000; stroke-width: 1.2; marker-end: url(#arrow); }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="400" y="24" text-anchor="middle" class="lg b">PyTorch Architecture: FSDP1 Monolith versus FSDP2 Composable DTensor</text>

  <!-- Left: FSDP1 -->
  <rect x="30" y="45" width="350" height="220" rx="6" class="gray"/>
  <text x="205" y="70" text-anchor="middle" class="b">FSDP1: FlatParameter Monolith</text>

  <rect x="50" y="85" width="310" height="40" rx="3" class="red"/>
  <text x="205" y="103" text-anchor="middle" class="sm b">FlatParameter Buffer</text>
  <text x="205" y="119" text-anchor="middle" class="sm">Flattens W_q, W_k, W_v, W_o into 1D buffer</text>

  <rect x="50" y="135" width="310" height="70" rx="3" class="white"/>
  <text x="205" y="155" text-anchor="middle" class="sm b">Architectural Drawbacks:</text>
  <text x="205" y="172" text-anchor="middle" class="sm">* Complex parameter reconstruction logic</text>
  <text x="205" y="189" text-anchor="middle" class="sm">* Incompatible with torch.compile graph capture</text>

  <text x="205" y="240" text-anchor="middle" class="sm b" fill="#b85450">Monolithic module wrapper class</text>

  <!-- Right: FSDP2 -->
  <rect x="420" y="45" width="350" height="220" rx="6" class="gray"/>
  <text x="595" y="70" text-anchor="middle" class="b">FSDP2: Composable DTensor (fully_shard)</text>

  <rect x="440" y="85" width="310" height="40" rx="3" class="green"/>
  <text x="595" y="103" text-anchor="middle" class="sm b">Native DTensor per Parameter</text>
  <text x="595" y="119" text-anchor="middle" class="sm">W_q, W_k, W_v, W_o sharded along dim=0</text>

  <rect x="440" y="135" width="310" height="70" rx="3" class="white"/>
  <text x="595" y="155" text-anchor="middle" class="sm b">Architectural Advantages:</text>
  <text x="595" y="172" text-anchor="middle" class="sm">* Zero tensor flattening: original shapes preserved</text>
  <text x="595" y="189" text-anchor="middle" class="sm">* Seamless composition with torch.compile</text>

  <text x="595" y="240" text-anchor="middle" class="sm b" fill="#2b5797">In-place composable functional API</text>

  <!-- Bottom Callout -->
  <rect x="30" y="275" width="740" height="32" rx="4" class="purple"/>
  <text x="400" y="296" text-anchor="middle" class="sm b">FSDP2 applies fully_shard(layer, mesh=device_mesh) bottom-up, keeping DTensors native to PyTorch autograd</text>
</svg>