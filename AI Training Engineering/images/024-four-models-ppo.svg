<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">RLHF with PPO: The Four-Model Ecosystem</text>
  <text x="25" y="48" class="sm" fill="#555">InstructGPT design: Policy, Reference Model, Reward Model, and Value Critic interacting in training loops</text>

  <!-- Prompt Input -->
  <rect x="25" y="105" width="100" height="45" rx="4" class="purple"/>
  <text x="75" y="132" text-anchor="middle" class="b">Prompt x</text>

  <!-- Path to Policy -->
  <path d="M125 127 L165 127" class="edge"/>

  <!-- 1. Policy Model -->
  <rect x="165" y="80" width="150" height="95" rx="4" class="orange"/>
  <text x="240" y="103" text-anchor="middle" class="b">1. Policy pi_phi</text>
  <text x="240" y="122" text-anchor="middle" class="sm">Trainable Generator</text>
  <text x="240" y="140" text-anchor="middle" class="sm">Weights + Grads + Adam</text>
  <text x="240" y="160" text-anchor="middle" class="sm b" fill="#d79b00">128.5 GB (8B)</text>

  <!-- Rollout y -->
  <path d="M315 127 L365 127" class="edge"/>
  <rect x="365" y="110" width="80" height="35" rx="3" class="yellow"/>
  <text x="405" y="132" text-anchor="middle" class="b sm">Rollout y</text>

  <!-- Distribution from Rollout to Ref, RM, Critic -->
  <path d="M445 127 L495 85" class="edge"/>
  <path d="M445 127 L495 145" class="edge"/>
  <path d="M445 127 L495 210" class="edge"/>

  <!-- 2. Reference Model -->
  <rect x="495" y="65" width="150" height="50" rx="4" class="blue"/>
  <text x="570" y="86" text-anchor="middle" class="b">2. Reference pi_ref</text>
  <text x="570" y="104" text-anchor="middle" class="sm">Frozen Base (16.1 GB)</text>

  <!-- 3. Reward Model -->
  <rect x="495" y="125" width="150" height="50" rx="4" class="green"/>
  <text x="570" y="146" text-anchor="middle" class="b">3. Reward Model r_psi</text>
  <text x="570" y="164" text-anchor="middle" class="sm">Frozen Scorer (16.1 GB)</text>

  <!-- 4. Value Model (Critic) -->
  <rect x="495" y="185" width="150" height="65" rx="4" class="orange"/>
  <text x="570" y="206" text-anchor="middle" class="b">4. Critic V_omega</text>
  <text x="570" y="224" text-anchor="middle" class="sm">Trainable Value Estimator</text>
  <text x="570" y="242" text-anchor="middle" class="sm b" fill="#d79b00">128.5 GB (8B)</text>

  <!-- Right: Combined GAE / PPO Update Engine -->
  <rect x="675" y="65" width="120" height="185" rx="6" class="gray"/>
  <text x="735" y="90" text-anchor="middle" class="b">PPO Engine</text>
  <text x="735" y="115" text-anchor="middle" class="sm">• KL Penalty</text>
  <text x="735" y="135" text-anchor="middle" class="sm">• Total Reward</text>
  <text x="735" y="155" text-anchor="middle" class="sm">• GAE Adv</text>
  <text x="735" y="180" text-anchor="middle" class="sm b">Updates:</text>
  <text x="735" y="202" text-anchor="middle" class="sm">Policy grad</text>
  <text x="735" y="222" text-anchor="middle" class="sm">Critic grad</text>

  <!-- Paths into PPO Engine -->
  <path d="M645 90 L675 90" class="edge"/>
  <path d="M645 150 L675 150" class="edge"/>
  <path d="M645 210 L675 210" class="edge"/>

  <!-- Backward feedback loop to Policy -->
  <path d="M735 250 L735 285 L240 285 L240 175" class="edge"/>
  <text x="480" y="278" text-anchor="middle" class="sm b" fill="#b85450">PPO Clipped Policy &amp; Value Gradient Updates</text>

  <!-- Bottom Explanatory Banner -->
  <rect x="25" y="302" width="770" height="42" rx="4" class="red"/>
  <text x="410" y="327" text-anchor="middle" class="b">Holding four 8B models concurrently requires 289.1 GB static memory before activations</text>
</svg>