<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">MinHash and Locality-Sensitive Hashing (LSH)</text>
  <text x="25" y="48" class="sm" fill="#555">Fuzzy near-duplicate removal using k-shingles, hash signatures, and banded buckets</text>

  <!-- Step 1: Document Shingling -->
  <rect x="25" y="70" width="165" height="150" rx="6" class="blue"/>
  <text x="107" y="93" text-anchor="middle" class="b">1. Word 5-Shingles</text>
  <text x="35" y="116" class="sm">Document text parsed</text>
  <text x="35" y="132" class="sm">into overlapping word</text>
  <text x="35" y="148" class="sm">n-grams (shingles):</text>
  <rect x="35" y="158" width="145" height="48" rx="4" class="white"/>
  <text x="42" y="176" class="sm">{"the quick brown",</text>
  <text x="42" y="194" class="sm"> "quick brown fox", ...}</text>

  <path d="M 190 145 L 220 145" class="edge"/>

  <!-- Step 2: MinHash Signature -->
  <rect x="220" y="70" width="175" height="150" rx="6" class="orange"/>
  <text x="307" y="93" text-anchor="middle" class="b">2. MinHash Signatures</text>
  <text x="230" y="116" class="sm">Apply M = 128 hash</text>
  <text x="230" y="132" class="sm">functions; record min</text>
  <text x="230" y="148" class="sm">hash value for each:</text>
  <rect x="230" y="158" width="155" height="48" rx="4" class="white"/>
  <text x="238" y="176" class="sm">Sig = [h1_min, h2_min,</text>
  <text x="238" y="194" class="sm">       ..., h128_min]</text>

  <path d="M 395 145 L 425 145" class="edge"/>

  <!-- Step 3: LSH Banding -->
  <rect x="425" y="70" width="175" height="150" rx="6" class="purple"/>
  <text x="512" y="93" text-anchor="middle" class="b">3. LSH Banding</text>
  <text x="435" y="116" class="sm">Split 128 hashes into</text>
  <text x="435" y="132" class="sm">b = 16 bands of</text>
  <text x="435" y="148" class="sm">r = 8 rows each:</text>
  <rect x="435" y="158" width="155" height="48" rx="4" class="white"/>
  <text x="443" y="176" class="sm">Band 1: [h1 ... h8]</text>
  <text x="443" y="194" class="sm">Band 16: [h121 ... h128]</text>

  <path d="M 600 145 L 630 145" class="edge"/>

  <!-- Step 4: Bucketing & Clustering -->
  <rect x="630" y="70" width="165" height="150" rx="6" class="green"/>
  <text x="712" y="93" text-anchor="middle" class="b">4. Duplicate Clustered</text>
  <text x="640" y="116" class="sm">Docs colliding in ≥ 1</text>
  <text x="640" y="132" class="sm">band are candidate</text>
  <text x="640" y="148" class="sm">near-duplicates.</text>
  <text x="640" y="172" class="sm b">Jaccard Threshold:</text>
  <text x="640" y="194" class="sm b" fill="#274e13">s ≈ (1/b)^(1/r) ≈ 0.70</text>

  <!-- Math Explanation Panel below -->
  <rect x="25" y="235" width="770" height="85" rx="6" class="gray"/>
  <text x="40" y="258" class="b">Locality-Sensitive Hashing Collision Probability Formula</text>
  <text x="40" y="280" class="sm">Probability of two documents with Jaccard similarity <tspan class="b">s</tspan> sharing at least one band: <tspan class="b">P(collision) = 1 - (1 - s^r)^b</tspan></text>
  <text x="40" y="302" class="sm">For b = 16, r = 8: similarity s = 0.85 yields P &gt; 0.999 (caught); similarity s = 0.50 yields P &lt; 0.06 (ignored without full scan).</text>
</svg>