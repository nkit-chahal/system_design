<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .axis{stroke:#444;stroke-width:1.2;fill:none}
    .grid{stroke:#eee;stroke-width:1;stroke-dasharray:3 3}
    .reserved-line{stroke:#999;stroke-width:1.5;stroke-dasharray:5 4;fill:none}
    .alloc-fill{fill:#dae8fc;stroke:#6c8ebf;stroke-width:2}
    .peak-pt{fill:#b85450;stroke:#000;stroke-width:1.5}
    .callout{fill:#f5f5f5;stroke:#999;stroke-width:1;rx:4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title & Subtitle -->
  <text x="25" y="26" class="title">Memory Snapshot: Allocation Timeline in PyTorch</text>
  <text x="25" y="46" class="sm" fill="#555">Active vs reserved memory profile across one step (pytorch.org/memory_viz)</text>

  <!-- Legend placed top right away from title -->
  <g transform="translate(540, 26)">
    <line x1="0" y1="6" x2="24" y2="6" class="reserved-line"/>
    <text x="30" y="10" class="sm">Reserved (Allocator)</text>
    <rect x="160" y="-1" width="16" height="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/>
    <text x="182" y="10" class="sm">Allocated</text>
  </g>

  <!-- Horizontal Grid Lines -->
  <line x1="80" y1="290" x2="760" y2="290" class="axis"/>
  <text x="70" y="294" text-anchor="end" class="sm">0 GB</text>

  <line x1="80" y1="229" x2="760" y2="229" class="grid"/>
  <text x="70" y="233" text-anchor="end" class="sm">2 GB</text>

  <line x1="80" y1="167" x2="760" y2="167" class="grid"/>
  <text x="70" y="171" text-anchor="end" class="sm">4 GB</text>

  <line x1="80" y1="106" x2="760" y2="106" class="grid"/>
  <text x="70" y="110" text-anchor="end" class="sm">6 GB</text>

  <!-- Y-axis line -->
  <line x1="80" y1="65" x2="80" y2="290" class="axis"/>

  <!-- Reserved Memory Line (dashed) -->
  <path d="M80,240 L160,210 L220,180 L350,81 L760,81" class="reserved-line"/>

  <!-- Allocated Memory Curve (Fill polygon) -->
  <polygon points="80,290 80,282 140,282 160,229 200,229 360,150 390,91 420,135 580,229 640,229 760,229 760,290" class="alloc-fill"/>

  <!-- Peak point marker -->
  <circle cx="390" cy="91" r="5" class="peak-pt"/>
  <text x="402" y="88" class="b" fill="#900">Peak: 6.47 GB</text>

  <!-- Phase Markers & Vertical Separators -->
  <line x1="200" y1="290" x2="200" y2="295" class="axis"/>
  <text x="140" y="310" text-anchor="middle" class="sm">Adam Init</text>

  <line x1="390" y1="290" x2="390" y2="295" class="axis"/>
  <text x="295" y="310" text-anchor="middle" class="sm">Forward Pass</text>

  <line x1="580" y1="290" x2="580" y2="295" class="axis"/>
  <text x="485" y="310" text-anchor="middle" class="sm">Backward Pass</text>

  <line x1="760" y1="290" x2="760" y2="295" class="axis"/>
  <text x="670" y="310" text-anchor="middle" class="sm">Opt Step</text>

  <!-- Explanatory Callout Boxes with Arrows -->
  <!-- Callout 1: Adam moments creation -->
  <g transform="translate(95, 160)">
    <rect x="0" y="0" width="135" height="48" class="callout"/>
    <text x="8" y="18" class="sm b">Moments Created</text>
    <text x="8" y="35" class="sm">m, v allocate on step 0</text>
  </g>
  <line x1="162" y1="208" x2="162" y2="225" class="edge"/>

  <!-- Callout 2: Peak Backward/Logits -->
  <g transform="translate(390, 118)">
    <rect x="0" y="0" width="165" height="54" class="callout"/>
    <text x="8" y="18" class="sm b">Watermark: Logits + Act</text>
    <text x="8" y="34" class="sm">Saved activations coexist</text>
    <text x="8" y="48" class="sm">with vocab logits buffer</text>
  </g>

  <!-- Callout 3: Deallocation in backward -->
  <g transform="translate(585, 150)">
    <rect x="0" y="0" width="165" height="52" class="callout"/>
    <text x="8" y="18" class="sm b">Layer-by-Layer Release</text>
    <text x="8" y="34" class="sm">Activations freed as grads</text>
    <text x="8" y="48" class="sm">accumulate into tensors</text>
  </g>
  <line x1="585" y1="180" x2="550" y2="200" class="edge"/>

  <!-- Bottom Annotation Bar -->
  <rect x="25" y="335" width="770" height="35" rx="4" class="gray"/>
  <text x="35" y="357" class="sm"><tspan class="b">Visualizer Insight:</tspan> The snapshot reveals that the peak occurs exactly when cross-entropy begins backprop, not at the end of the step.</text>
</svg>
