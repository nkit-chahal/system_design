<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .lg { font-size: 16px; }
    .b { font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .yellow { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .group { fill: none; stroke: #000; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .edge { fill: none; stroke: #000; stroke-width: 1.2; marker-end: url(#arrow); }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="410" y="24" text-anchor="middle" class="lg b">FSDP Layer Prefetching and Stream Overlap</text>

  <!-- Container -->
  <rect x="30" y="45" width="760" height="205" rx="6" class="gray"/>

  <!-- Time axis -->
  <path d="M 170 65 L 750 65" class="edge"/>
  <text x="760" y="70" class="sm">Time --&gt;</text>

  <!-- Compute Stream -->
  <text x="50" y="105" class="b">GPU Compute</text>

  <rect x="170" y="90" width="130" height="28" rx="3" class="orange"/>
  <text x="235" y="109" text-anchor="middle" class="sm b">Compute Layer L</text>

  <rect x="310" y="90" width="130" height="28" rx="3" class="orange"/>
  <text x="375" y="109" text-anchor="middle" class="sm b">Compute Layer L+1</text>

  <rect x="450" y="90" width="130" height="28" rx="3" class="orange"/>
  <text x="515" y="109" text-anchor="middle" class="sm b">Compute Layer L+2</text>

  <rect x="590" y="90" width="130" height="28" rx="3" class="orange"/>
  <text x="655" y="109" text-anchor="middle" class="sm b">Compute Layer L+3</text>

  <!-- Comm Stream -->
  <text x="50" y="165" class="b">NCCL Comm</text>

  <rect x="170" y="150" width="130" height="28" rx="3" class="purple"/>
  <text x="235" y="169" text-anchor="middle" class="sm b">Prefetch Layer L+1</text>

  <rect x="310" y="150" width="130" height="28" rx="3" class="purple"/>
  <text x="375" y="169" text-anchor="middle" class="sm b">Prefetch Layer L+2</text>

  <rect x="450" y="150" width="130" height="28" rx="3" class="purple"/>
  <text x="515" y="169" text-anchor="middle" class="sm b">Prefetch Layer L+3</text>

  <rect x="590" y="150" width="130" height="28" rx="3" class="purple"/>
  <text x="655" y="169" text-anchor="middle" class="sm b">Prefetch Layer L+4</text>

  <!-- Dependency arrows: prefetch ready before compute -->
  <path d="M 295 150 L 315 125" class="edge"/>
  <path d="M 435 150 L 455 125" class="edge"/>
  <path d="M 575 150 L 595 125" class="edge"/>

  <text x="410" y="210" text-anchor="middle" class="sm">Asynchronous All-Gather executes on NCCL stream while Compute stream runs GEMMs</text>
  <text x="410" y="230" text-anchor="middle" class="sm b">When Layer L completes, Layer L+1 weights are already present in HBM without stalls</text>

  <!-- Bottom Explanatory callout -->
  <rect x="30" y="260" width="760" height="30" rx="4" class="green"/>
  <text x="410" y="280" text-anchor="middle" class="sm b">Forward prefetch and backward prefetch completely conceal communication if Layer GEMM time &gt; All-Gather time</text>
</svg>