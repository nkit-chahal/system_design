<svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .edge-back{fill:none;stroke:#b85450;stroke-width:1.4;stroke-dasharray:4 3;marker-end:url(#arrow-red)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="25" class="title">Computation Graph of a 2-Layer Network</text>
  <text x="25" y="45" class="sm" fill="#555">Forward DAG construction (black solid) and reverse topological backpropagation (red dashed)</text>

  <!-- Input x -->
  <rect x="25" y="115" width="70" height="42" rx="5" class="gray"/>
  <text x="60" y="141" text-anchor="middle" class="b">Input x</text>

  <!-- W1 -->
  <rect x="25" y="170" width="70" height="42" rx="5" class="purple"/>
  <text x="60" y="196" text-anchor="middle" class="b">W1</text>

  <!-- Forward Node 1: Linear 1 (z1 = W1 x) -->
  <rect x="145" y="135" width="100" height="52" rx="6" class="blue"/>
  <text x="195" y="156" text-anchor="middle" class="b">Linear 1</text>
  <text x="195" y="174" text-anchor="middle" class="sm">z1 = W1 x</text>

  <!-- Forward Node 2: Activation (a1 = relu(z1)) -->
  <rect x="290" y="135" width="100" height="52" rx="6" class="blue"/>
  <text x="340" y="156" text-anchor="middle" class="b">ReLU</text>
  <text x="340" y="174" text-anchor="middle" class="sm">a1 = relu(z1)</text>

  <!-- Upper parameters: W2 and Target y at y=68 -->
  <rect x="370" y="68" width="65" height="40" rx="5" class="purple"/>
  <text x="402" y="93" text-anchor="middle" class="b">W2</text>

  <!-- Forward Node 3: Linear 2 (y_hat = W2 a1) -->
  <rect x="435" y="135" width="105" height="52" rx="6" class="blue"/>
  <text x="487" y="156" text-anchor="middle" class="b">Linear 2</text>
  <text x="487" y="174" text-anchor="middle" class="sm">y_hat = W2 a1</text>

  <!-- Target y -->
  <rect x="520" y="68" width="65" height="40" rx="5" class="gray"/>
  <text x="552" y="93" text-anchor="middle" class="b">Target y</text>

  <!-- Forward Node 4: Loss -->
  <rect x="585" y="135" width="105" height="52" rx="6" class="yellow"/>
  <text x="637" y="156" text-anchor="middle" class="b">Loss (L)</text>
  <text x="637" y="174" text-anchor="middle" class="sm">0.5 (y_hat - y)^2</text>

  <!-- Forward Edges -->
  <path d="M 95 136 L 143 150" class="edge"/>
  <path d="M 95 185 L 143 170" class="edge"/>
  <path d="M 245 161 L 288 161" class="edge"/>
  <path d="M 390 161 L 433 161" class="edge"/>
  <path d="M 402 108 L 445 137" class="edge"/>
  <path d="M 540 161 L 583 161" class="edge"/>
  <path d="M 552 108 L 600 137" class="edge"/>

  <!-- Backward Seed: dL/dL = 1 -->
  <rect x="715" y="135" width="80" height="52" rx="6" class="red"/>
  <text x="755" y="156" text-anchor="middle" class="b">dL / dL</text>
  <text x="755" y="174" text-anchor="middle" class="sm">= 1.0</text>
  <path d="M 715 161 L 692 161" class="edge-back"/>

  <!-- Backward Pass Nodes on Lower Row -->
  <!-- dL/dy_hat -->
  <rect x="585" y="225" width="105" height="48" rx="6" class="red"/>
  <text x="637" y="246" text-anchor="middle" class="b">dL / dy_hat</text>
  <text x="637" y="263" text-anchor="middle" class="sm">= y_hat - y</text>

  <!-- dL/da1 -->
  <rect x="435" y="225" width="105" height="48" rx="6" class="red"/>
  <text x="487" y="246" text-anchor="middle" class="b">dL / da1</text>
  <text x="487" y="263" text-anchor="middle" class="sm">= W2.T (dL/dy_hat)</text>

  <!-- dL/dW2 -->
  <rect x="435" y="295" width="105" height="45" rx="5" class="orange"/>
  <text x="487" y="315" text-anchor="middle" class="b">dL / dW2</text>
  <text x="487" y="331" text-anchor="middle" class="sm">= (dL/dy_hat) a1.T</text>

  <!-- dL/dz1 -->
  <rect x="290" y="225" width="100" height="48" rx="6" class="red"/>
  <text x="340" y="246" text-anchor="middle" class="b">dL / dz1</text>
  <text x="340" y="263" text-anchor="middle" class="sm">= dL/da1 * relu'</text>

  <!-- dL/dW1 -->
  <rect x="145" y="295" width="100" height="45" rx="5" class="orange"/>
  <text x="195" y="315" text-anchor="middle" class="b">dL / dW1</text>
  <text x="195" y="331" text-anchor="middle" class="sm">= (dL/dz1) x.T</text>

  <!-- Backward Edges -->
  <path d="M 637 187 L 637 223" class="edge-back"/>
  <path d="M 585 249 L 542 249" class="edge-back"/>
  <path d="M 487 273 L 487 293" class="edge-back"/>
  <path d="M 435 249 L 392 249" class="edge-back"/>
  <path d="M 290 249 L 247 298" class="edge-back"/>

  <!-- Legend -->
  <rect x="25" y="245" width="105" height="95" rx="5" class="gray"/>
  <text x="77" y="263" text-anchor="middle" class="b sm">Legend</text>
  <text x="35" y="283" class="sm" fill="#005cc5">Solid: Forward</text>
  <text x="35" y="303" class="sm" fill="#b85450">Dashed: Backprop</text>
  <text x="35" y="323" class="sm" fill="#d79b00">Orange: Grad W</text>
</svg>
