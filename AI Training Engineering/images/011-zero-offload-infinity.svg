<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .lg { font-size: 16px; }
    .b { font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .yellow { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .group { fill: none; stroke: #000; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .edge { fill: none; stroke: #000; stroke-width: 1.2; marker-end: url(#arrow); }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="400" y="24" text-anchor="middle" class="lg b">Memory Hierarchy Offloading: ZeRO-Offload and ZeRO-Infinity</text>

  <!-- GPU Tier -->
  <rect x="40" y="45" width="220" height="180" rx="5" class="orange"/>
  <text x="150" y="70" text-anchor="middle" class="b">GPU HBM3 (80 GB)</text>
  <rect x="55" y="85" width="190" height="30" rx="3" class="white"/>
  <text x="150" y="105" text-anchor="middle" class="sm">Active Layer Weights (BF16)</text>
  <rect x="55" y="125" width="190" height="30" rx="3" class="white"/>
  <text x="150" y="145" text-anchor="middle" class="sm">Forward &amp; Bwd Activations</text>
  <rect x="55" y="165" width="190" height="40" rx="3" class="white"/>
  <text x="150" y="183" text-anchor="middle" class="sm b">Compute Engine</text>
  <text x="150" y="198" text-anchor="middle" class="sm">Tensor Cores (3.35 TB/s)</text>

  <!-- PCIe Bus arrows -->
  <path d="M 260 110 L 300 110" class="edge"/>
  <path d="M 300 150 L 260 150" class="edge"/>
  <text x="280" y="100" text-anchor="middle" class="sm b">Grads</text>
  <text x="280" y="170" text-anchor="middle" class="sm b">Weights</text>

  <!-- CPU Tier -->
  <rect x="300" y="45" width="230" height="180" rx="5" class="blue"/>
  <text x="415" y="70" text-anchor="middle" class="b">Host CPU DRAM (512+ GB)</text>
  <rect x="315" y="85" width="200" height="30" rx="3" class="white"/>
  <text x="415" y="105" text-anchor="middle" class="sm">FP32 Master Weights (4 B/p)</text>
  <rect x="315" y="125" width="200" height="30" rx="3" class="white"/>
  <text x="415" y="145" text-anchor="middle" class="sm">FP32 Adam m &amp; v (8 B/p)</text>
  <rect x="315" y="165" width="200" height="40" rx="3" class="white"/>
  <text x="415" y="183" text-anchor="middle" class="sm b">CPU Adam Optimizer</text>
  <text x="415" y="198" text-anchor="middle" class="sm">AVX-512 Update Engine</text>

  <!-- NVMe Arrow -->
  <path d="M 530 135 L 565 135" class="edge"/>

  <!-- NVMe Tier -->
  <rect x="565" y="45" width="195" height="180" rx="5" class="purple"/>
  <text x="662" y="70" text-anchor="middle" class="b">NVMe SSD (ZeRO-Infinity)</text>
  <rect x="580" y="85" width="165" height="50" rx="3" class="white"/>
  <text x="662" y="105" text-anchor="middle" class="sm b">Massive Storage</text>
  <text x="662" y="123" text-anchor="middle" class="sm">Trillion-param states</text>
  <rect x="580" y="145" width="165" height="60" rx="3" class="white"/>
  <text x="662" y="165" text-anchor="middle" class="sm b">Async Prefetching</text>
  <text x="662" y="182" text-anchor="middle" class="sm">Overlapped with</text>
  <text x="662" y="196" text-anchor="middle" class="sm">GPU execution</text>

  <!-- Bottom Explanatory callout -->
  <rect x="40" y="245" width="720" height="42" rx="4" class="yellow"/>
  <text x="400" y="264" text-anchor="middle" class="b">Offloading Trade-off: Expands memory capacity at the cost of PCIe bus bottlenecks</text>
  <text x="400" y="280" text-anchor="middle" class="sm">Suitable for single-node fine-tuning (Stage 5); avoided in high-throughput pretraining clusters</text>
</svg>