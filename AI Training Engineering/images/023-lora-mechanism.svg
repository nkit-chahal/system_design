<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">LoRA: Low-Rank Adaptation of Pretrained Weights</text>
  <text x="25" y="48" class="sm" fill="#555">Decomposing parameter updates into two low-rank matrices: delta W = (alpha / r) * B * A</text>

  <!-- Input x -->
  <rect x="30" y="140" width="80" height="45" rx="4" class="purple"/>
  <text x="70" y="167" text-anchor="middle" class="b">Input x</text>

  <!-- Fork arrows -->
  <path d="M110 162 L180 162 L180 110 L230 110" class="edge"/>
  <path d="M110 162 L180 162 L180 220 L230 220" class="edge"/>

  <!-- Frozen Base Weight W0 -->
  <rect x="230" y="80" width="180" height="60" rx="4" class="blue"/>
  <text x="320" y="105" text-anchor="middle" class="b">Frozen Weight W0</text>
  <text x="320" y="125" text-anchor="middle" class="sm">d x k (no grads / no Adam)</text>

  <!-- Trainable Adapter: Matrix A -->
  <rect x="230" y="195" width="140" height="50" rx="4" class="orange"/>
  <text x="300" y="217" text-anchor="middle" class="b">Matrix A (r x k)</text>
  <text x="300" y="235" text-anchor="middle" class="sm">Init: Gaussian N(0, 1/r)</text>

  <!-- Arrow A -> B -->
  <path d="M370 220 L420 220" class="edge"/>

  <!-- Trainable Adapter: Matrix B -->
  <rect x="420" y="195" width="140" height="50" rx="4" class="orange"/>
  <text x="490" y="217" text-anchor="middle" class="b">Matrix B (d x r)</text>
  <text x="490" y="235" text-anchor="middle" class="sm">Init: Exact Zero (0)</text>

  <!-- Scaling block -->
  <path d="M560 220 L610 220" class="edge"/>
  <rect x="610" y="200" width="90" height="40" rx="4" class="yellow"/>
  <text x="655" y="225" text-anchor="middle" class="b">Scale: alpha/r</text>

  <!-- Add operator circle -->
  <circle cx="730" cy="162" r="18" class="gray"/>
  <text x="730" y="167" text-anchor="middle" class="b">+</text>

  <!-- Paths to add operator -->
  <path d="M410 110 L730 110 L730 144" class="edge"/>
  <path d="M700 220 L730 220 L730 180" class="edge"/>

  <!-- Arrow to output -->
  <path d="M748 162 L780 162" class="edge"/>

  <!-- Output label -->
  <text x="785" y="167" class="b">h</text>

  <!-- Explanatory footer box -->
  <rect x="30" y="270" width="760" height="52" rx="4" class="gray"/>
  <text x="45" y="291" class="sm">• At step 0: B = 0 ensures delta W = 0, exactly preserving base model predictions before any update.</text>
  <text x="45" y="309" class="sm">• Memory savings: 16 bytes/param are stored only for A and B (rank r &lt;&lt; min(d, k)); base W0 stays frozen in BF16.</text>
</svg>