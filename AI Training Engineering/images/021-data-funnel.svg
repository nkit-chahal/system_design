<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">Pipeline Attrition Funnel: Documents and Tokens (Illustrative)</text>
  <text x="25" y="48" class="sm" fill="#555">Typical retention rates measured across 10,000 raw Common Crawl web documents</text>

  <!-- Funnel Stage Bars -->
  <!-- Stage 1: Raw Ingest (100%) width 480 px -->
  <text x="25" y="88" class="sm b">1. Raw Ingest</text>
  <rect x="160" y="72" width="480" height="24" class="blue"/>
  <text x="650" y="89" class="sm b">10,000 docs (100%) · 8.2M tok</text>

  <!-- Stage 2: Language Filter (82%) width 394 px -->
  <text x="25" y="128" class="sm b">2. Language Filter</text>
  <rect x="160" y="112" width="394" height="24" class="purple"/>
  <text x="650" y="129" class="sm b">8,200 docs (82.0%) · 6.9M tok</text>

  <!-- Stage 3: Heuristic Quality (58%) width 278 px -->
  <text x="25" y="168" class="sm b">3. Quality Heuristics</text>
  <rect x="160" y="152" width="278" height="24" class="orange"/>
  <text x="650" y="169" class="sm b">5,800 docs (58.0%) · 4.9M tok</text>

  <!-- Stage 4: Exact Dedup (51%) width 245 px -->
  <text x="25" y="208" class="sm b">4. Exact Deduplication</text>
  <rect x="160" y="192" width="245" height="24" class="yellow"/>
  <text x="650" y="209" class="sm b">5,100 docs (51.0%) · 4.3M tok</text>

  <!-- Stage 5: MinHash LSH (44%) width 211 px -->
  <text x="25" y="248" class="sm b">5. MinHash Near-Dedup</text>
  <rect x="160" y="232" width="211" height="24" class="green"/>
  <text x="650" y="249" class="sm b">4,400 docs (44.0%) · 3.7M tok</text>

  <!-- Bottom Summary Card -->
  <rect x="25" y="275" width="770" height="45" rx="4" class="gray"/>
  <text x="40" y="295" class="b">Net Pipeline Yield: ~44% of Documents, ~45% of Raw Tokens Retained</text>
  <text x="40" y="311" class="sm">To produce 1 Trillion clean tokens, the upstream pipeline must ingest approximately 2.22 Trillion raw web tokens.</text>
</svg>