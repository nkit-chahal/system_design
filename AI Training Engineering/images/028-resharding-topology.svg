<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Left: Original Layout (32 GPUs) -->
  <rect x="30" y="30" width="220" height="255" rx="8" class="orange"/>
  <text x="45" y="58" class="b">Save Layout: 32 GPUs</text>
  <text x="45" y="78" class="sm">FSDP Shard Factor = 32</text>

  <rect x="45" y="95" width="190" height="40" rx="4" class="white"/>
  <text x="55" y="120" class="sm">Shard 0: [0 : N/32]</text>

  <rect x="45" y="145" width="190" height="40" rx="4" class="white"/>
  <text x="55" y="170" class="sm">Shard 1: [N/32 : 2N/32]</text>

  <rect x="45" y="195" width="190" height="40" rx="4" class="white"/>
  <text x="55" y="220" class="sm">Shard 31: [31N/32 : N]</text>

  <rect x="45" y="245" width="190" height="25" rx="3" class="yellow"/>
  <text x="55" y="262" class="sm">32 DistCP Shard Files</text>

  <!-- Middle: DCP Resharding Engine -->
  <path d="M250,157 L315,157" class="edge"/>

  <rect x="320" y="75" width="180" height="165" rx="8" class="blue"/>
  <text x="335" y="105" class="b">DCP Planner &amp;</text>
  <text x="335" y="125" class="b">Metadata Index</text>
  <rect x="330" y="140" width="160" height="85" rx="4" class="white"/>
  <text x="338" y="162" class="sm">Maps global tensor</text>
  <text x="338" y="180" class="sm">coordinates to target</text>
  <text x="338" y="198" class="sm">rank memory slices</text>
  <text x="338" y="216" class="sm">on the fly</text>

  <path d="M500,157 L565,157" class="edge"/>

  <!-- Right: Restart Layout (64 GPUs) -->
  <rect x="570" y="30" width="220" height="255" rx="8" class="green"/>
  <text x="585" y="58" class="b">Load Layout: 64 GPUs</text>
  <text x="585" y="78" class="sm">FSDP Shard Factor = 64</text>

  <rect x="585" y="95" width="190" height="35" rx="4" class="white"/>
  <text x="595" y="118" class="sm">Rank 0: reads [0 : N/64]</text>

  <rect x="585" y="135" width="190" height="35" rx="4" class="white"/>
  <text x="595" y="158" class="sm">Rank 1: reads [N/64 : 2N/64]</text>

  <rect x="585" y="175" width="190" height="35" rx="4" class="white"/>
  <text x="595" y="198" class="sm">Rank 2: reads [2N/64 : 3N/64]</text>

  <rect x="585" y="215" width="190" height="35" rx="4" class="white"/>
  <text x="595" y="238" class="sm">... (64 ranks loaded)</text>

  <rect x="585" y="255" width="190" height="20" rx="3" class="yellow"/>
  <text x="595" y="270" class="sm">Zero offline conversion needed</text>
</svg>
