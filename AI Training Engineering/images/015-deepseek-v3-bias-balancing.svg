<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.xs{font-size:11px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="26" class="title">DeepSeek-V3: Auxiliary-Loss-Free Balancing with Dynamic Biases</text>
  <text x="25" y="44" class="sm" fill="#555">Balancing expert workloads dynamically without injecting conflicting auxiliary loss gradients into model weights.</text>

  <!-- Container Box 1: Biased Top-K Selection -->
  <rect x="25" y="65" width="245" height="205" rx="6" class="blue"/>
  <text x="147" y="88" text-anchor="middle" class="b">1. Biased Routing Selection</text>
  <rect x="35" y="100" width="225" height="38" rx="4" class="white"/>
  <text x="147" y="123" text-anchor="middle" class="sm b">Selection Score = s_i + b_i</text>
  <text x="40" y="155" class="xs">• s_i: Raw affinity score</text>
  <text x="40" y="171" class="xs">  (dot product x^T · e_i)</text>
  <text x="40" y="189" class="xs">• b_i: Expert-specific dynamic bias</text>
  <text x="40" y="207" class="xs">• <tspan class="b">Top-K chosen by s_i + b_i</tspan></text>
  <text x="40" y="225" class="xs">• Raises threshold for overloaded</text>
  <text x="40" y="241" class="xs">  experts; lowers for idle experts.</text>
  <text x="40" y="260" class="xs" fill="#555">Controls routing destination only</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 270 165 L 295 165" class="edge"/>

  <!-- Container Box 2: Clean Gating Values -->
  <rect x="295" y="65" width="245" height="205" rx="6" class="green"/>
  <text x="417" y="88" text-anchor="middle" class="b">2. Clean Gating Weights</text>
  <rect x="305" y="100" width="225" height="38" rx="4" class="white"/>
  <text x="417" y="123" text-anchor="middle" class="sm b">Gate Weight = Softmax(s_i)</text>
  <text x="310" y="155" class="xs">• <tspan class="b">Crucial distinction:</tspan> Bias b_i</text>
  <text x="310" y="171" class="xs">  is omitted from gating weights!</text>
  <text x="310" y="189" class="xs">• Expert outputs are scaled strictly</text>
  <text x="310" y="207" class="xs">  by original unbiased affinity s_i.</text>
  <text x="310" y="225" class="xs">• Prevents bias terms from</text>
  <text x="310" y="241" class="xs">  distorting output representation.</text>
  <text x="310" y="260" class="xs" fill="#2d7600">Zero representation distortion</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 540 165 L 565 165" class="edge"/>

  <!-- Container Box 3: Dynamic Bias Updates -->
  <rect x="565" y="65" width="230" height="205" rx="6" class="purple"/>
  <text x="680" y="88" text-anchor="middle" class="b">3. Step-by-Step Bias Update</text>
  <rect x="575" y="100" width="210" height="38" rx="4" class="white"/>
  <text x="680" y="123" text-anchor="middle" class="sm b">Δb_i = −γ × (Load_i − Target)</text>
  <text x="580" y="155" class="xs">• Measured across entire batch</text>
  <text x="580" y="171" class="xs">• Overloaded expert → decrease b_i</text>
  <text x="580" y="189" class="xs">• Underloaded expert → increase b_i</text>
  <text x="580" y="207" class="xs">• <tspan class="b">NO backprop gradients:</tspan></text>
  <text x="580" y="225" class="xs">  Biases adjust via PID feedback;</text>
  <text x="580" y="241" class="xs">  zero loss gradient conflict!</text>
  <text x="580" y="260" class="xs" fill="#6a329f">Pure algorithmic control</text>

  <!-- Bottom Explanatory Banner -->
  <rect x="25" y="285" width="770" height="50" rx="4" class="gray"/>
  <text x="40" y="306" class="sm"><tspan class="b">The DeepSeek Breakthrough:</tspan> Traditional auxiliary loss degrades the primary language modeling loss by forcing conflicting</text>
  <text x="40" y="324" class="sm">gradients into router weights. Auxiliary-loss-free balancing achieves near-perfect load balance without penalizing model accuracy.</text>
</svg>