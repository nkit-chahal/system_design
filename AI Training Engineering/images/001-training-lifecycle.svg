<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text{font-size:13px;fill:#000}
    .sm{font-size:11px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Top row: main pretraining & post-training lifecycle -->

  <!-- Box 1: Data Pipeline -->
  <rect x="15" y="55" width="125" height="90" rx="6" class="blue"/>
  <text x="77" y="78" text-anchor="middle" class="b">Data Pipeline</text>
  <text x="77" y="98" text-anchor="middle" class="sm">dedup &amp; filter</text>
  <text x="77" y="116" text-anchor="middle" class="sm">curriculum mix</text>
  <text x="77" y="134" text-anchor="middle" class="sm">Lessons 17, 18, 20</text>
  <path d="M140,100 L163,100" class="edge"/>

  <!-- Box 2: Tokenizer -->
  <rect x="165" y="55" width="115" height="90" rx="6" class="purple"/>
  <text x="222" y="78" text-anchor="middle" class="b">Tokenizer</text>
  <text x="222" y="98" text-anchor="middle" class="sm">BPE vocabulary</text>
  <text x="222" y="116" text-anchor="middle" class="sm">sequence packing</text>
  <text x="222" y="134" text-anchor="middle" class="sm">Lesson 19</text>
  <path d="M280,100 L303,100" class="edge"/>

  <!-- Group: Distributed Cluster Parallelism -->
  <rect x="305" y="25" width="355" height="150" rx="6" class="group"/>
  <text x="320" y="45" class="b">Distributed Parallelism (Lessons 10–16, 30)</text>

  <!-- Box 3a: Forward & Backward Passes -->
  <rect x="318" y="55" width="155" height="105" rx="6" class="orange"/>
  <text x="395" y="78" text-anchor="middle" class="b">Model &amp; Autograd</text>
  <text x="395" y="98" text-anchor="middle" class="sm">forward: 2ND FLOPs</text>
  <text x="395" y="116" text-anchor="middle" class="sm">backward: 4ND FLOPs</text>
  <text x="395" y="134" text-anchor="middle" class="sm">recompute: +2ND</text>
  <text x="395" y="150" text-anchor="middle" class="sm">Lessons 2, 3, 5</text>
  <path d="M473,107 L493,107" class="edge"/>

  <!-- Box 3b: Optimizer & Sharding -->
  <rect x="495" y="55" width="152" height="105" rx="6" class="orange"/>
  <text x="571" y="78" text-anchor="middle" class="b">Optimizer &amp; FSDP</text>
  <text x="571" y="98" text-anchor="middle" class="sm">16 bytes / param</text>
  <text x="571" y="116" text-anchor="middle" class="sm">ZeRO-3 state shard</text>
  <text x="571" y="134" text-anchor="middle" class="sm">all-reduce sync</text>
  <text x="571" y="150" text-anchor="middle" class="sm">Lessons 4, 11</text>
  <path d="M660,100 L683,100" class="edge"/>

  <!-- Box 4: In-Flight Eval -->
  <rect x="685" y="55" width="125" height="90" rx="6" class="green"/>
  <text x="747" y="78" text-anchor="middle" class="b">In-Flight Eval</text>
  <text x="747" y="98" text-anchor="middle" class="sm">validation loss</text>
  <text x="747" y="116" text-anchor="middle" class="sm">benchmarks &amp; drift</text>
  <text x="747" y="134" text-anchor="middle" class="sm">Lessons 34, 35</text>
  <path d="M810,100 L833,100" class="edge"/>

  <!-- Box 5: Post-Training -->
  <rect x="835" y="55" width="112" height="90" rx="6" class="green"/>
  <text x="891" y="78" text-anchor="middle" class="b">Post-Training</text>
  <text x="891" y="98" text-anchor="middle" class="sm">SFT instruction</text>
  <text x="891" y="116" text-anchor="middle" class="sm">DPO &amp; GRPO</text>
  <text x="891" y="134" text-anchor="middle" class="sm">Lessons 22–27</text>

  <!-- Lower row: Checkpoints and Cluster Resilience -->

  <!-- Checkpoint Store -->
  <rect x="305" y="210" width="165" height="75" rx="6" class="gray"/>
  <text x="387" y="233" text-anchor="middle" class="b">Checkpoints &amp; I/O</text>
  <text x="387" y="252" text-anchor="middle" class="sm">async write to storage</text>
  <text x="387" y="270" text-anchor="middle" class="sm">Lessons 28, 29, 33</text>

  <!-- Scheduling & Stability -->
  <rect x="495" y="210" width="165" height="75" rx="6" class="gray"/>
  <text x="577" y="233" text-anchor="middle" class="b">Cluster Health</text>
  <text x="577" y="252" text-anchor="middle" class="sm">Slurm &amp; loss spikes</text>
  <text x="577" y="270" text-anchor="middle" class="sm">Lessons 31, 32</text>

  <!-- Edges to lower systems -->
  <path d="M360,175 L360,208" class="edge"/>
  <text x="315" y="196" class="sm">save</text>
  <path d="M420,210 L420,177" class="edge"/>
  <text x="425" y="196" class="sm">resume</text>

  <path d="M577,210 L577,177" class="edge"/>
  <text x="583" y="196" class="sm">monitor</text>

  <!-- Bottom banner: handoff to inference -->
  <rect x="15" y="315" width="932" height="40" rx="4" class="white"/>
  <text x="481" y="340" text-anchor="middle" class="sm">Handoff to AI Inference Engineering: weights cast to BF16 / FP8, KV cache sized, deployed to vLLM / SGLang (Inference Lessons 1–35)</text>
</svg>