<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .b { font-weight: bold; }
    .title { font-size: 16px; font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .edge { fill: none; stroke: #000; stroke-width: 1.2; marker-end: url(#arrow); }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="24" class="title">Kubernetes Training Stack: Operators, Kueue, and Gang Scheduling</text>
  <text x="25" y="42" class="sm" fill="#555">Kubernetes bridges cloud-native orchestration with HPC semantics using Custom Resources and batch controllers.</text>

  <!-- Layer 1: Custom Resource Layer (Top) -->
  <rect x="25" y="58" width="790" height="58" rx="4" class="purple"/>
  <text x="40" y="80" class="b sm">1. Workload Specification Layer (Custom Resource Definitions):</text>
  <text x="40" y="100" class="sm">• <tspan class="b">PyTorchJob</tspan> (Kubeflow Training Operator) / <tspan class="b">TrainJob</tspan> (Kubeflow Trainer v2) · <tspan class="b">JobSet</tspan> (SIG-Apps multi-job groups)</text>

  <path d="M420,116 L420,135" class="edge"/>

  <!-- Layer 2: Queueing & Multi-Tenancy (Kueue) -->
  <rect x="25" y="135" width="790" height="64" rx="4" class="orange"/>
  <text x="40" y="157" class="b sm">2. Queue Management &amp; Multi-Tenancy (Kueue):</text>
  <text x="40" y="174" class="sm">• Enforces team quotas (LocalQueue &amp; ClusterQueue) · Holds jobs in suspended state (<tspan class="b">suspend: true</tspan>)</text>
  <text x="40" y="189" class="sm">• Manages preemption, borrowing across cohorts, and fair sharing before pods are instantiated</text>

  <path d="M420,199 L420,218" class="edge"/>

  <!-- Layer 3: Gang Scheduling (Volcano / Kueue) -->
  <rect x="25" y="218" width="790" height="58" rx="4" class="green"/>
  <text x="40" y="238" class="b sm">3. Gang Scheduling &amp; Topology Binding (Volcano / Coscheduling):</text>
  <text x="40" y="255" class="sm">• PodGroup abstraction: validates that all 32 node pods (256 GPUs) can be bound concurrently</text>
  <text x="40" y="269" class="sm">• Enforces topology-aware placement: schedules pods within same switch domain when possible</text>

  <path d="M420,276 L420,295" class="edge"/>

  <!-- Layer 4: Hardware & Device Plugins (Bottom) -->
  <rect x="25" y="295" width="790" height="52" rx="4" class="gray"/>
  <text x="40" y="315" class="b sm">4. Hardware Abstraction (NVIDIA GPU &amp; Network Operators):</text>
  <text x="40" y="333" class="sm">NVIDIA Container Toolkit · K8s Device Plugin (<tspan class="b">nvidia.com/gpu: 8</tspan>) · Network Operator (InfiniBand RDMA / SR-IOV)</text>
</svg>
