<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="26" class="title">State Sharding: Balancing VRAM Footprint vs Interconnect Bandwidth</text>
  <text x="25" y="44" class="sm" fill="#555">Model states for Llama 3.1 8B (128.5 GB total) across 256 H100 GPUs (32 nodes × 8 GPUs)</text>

  <!-- 3 Comparison Panels (width 240 each, gaps 20, total x from 25 to 795) -->
  <!-- Panel 1: DDP (No Sharding) -->
  <rect x="25" y="60" width="240" height="230" rx="6" class="red"/>
  <text x="145" y="84" text-anchor="middle" class="b" fill="#900">DDP (No Sharding)</text>
  <text x="145" y="102" text-anchor="middle" class="sm">Replicate states on all GPUs</text>

  <rect x="40" y="115" width="210" height="40" rx="4" class="white"/>
  <text x="145" y="132" text-anchor="middle" class="sm">Model States per GPU:</text>
  <text x="145" y="148" text-anchor="middle" class="b" fill="#c00">128.5 GB (OOM!)</text>

  <text x="40" y="178" class="sm">• Exceeds 80 GB H100 limit</text>
  <text x="40" y="196" class="sm">• Cannot initialize model</text>
  <text x="40" y="214" class="sm">• Ring all-reduce at step end</text>
  <text x="40" y="232" class="sm">• Unusable for 8B model</text>

  <rect x="40" y="246" width="210" height="34" rx="4" fill="#fff" stroke="#b85450" stroke-width="1"/>
  <text x="145" y="268" text-anchor="middle" class="b" fill="#c00">Status: Impossible</text>

  <!-- Panel 2: Intra-Node FSDP (8 GPUs) - Selected! -->
  <rect x="285" y="60" width="245" height="230" rx="6" class="green"/>
  <text x="407" y="84" text-anchor="middle" class="b" fill="#274e13">Intra-Node FSDP (8 GPUs)</text>
  <text x="407" y="102" text-anchor="middle" class="sm">Shard inside node, DDP across nodes</text>

  <rect x="300" y="115" width="215" height="40" rx="4" class="white"/>
  <text x="407" y="132" text-anchor="middle" class="sm">Model States per GPU:</text>
  <text x="407" y="148" text-anchor="middle" class="b" fill="#274e13">16.1 GB (Fits easily)</text>

  <text x="300" y="178" class="sm">• Sharded over 8 intra-node GPUs</text>
  <text x="300" y="196" class="sm">• All-gathers stay on NVLink</text>
  <text x="300" y="214" class="sm">• <tspan class="b">900 GB/s</tspan> local bandwidth</text>
  <text x="300" y="232" class="sm">• DDP gradient sync over IB</text>

  <rect x="300" y="246" width="215" height="34" rx="4" fill="#fff" stroke="#82b366" stroke-width="1"/>
  <text x="407" y="268" text-anchor="middle" class="b" fill="#274e13">Chosen: Optimal MFU</text>

  <!-- Panel 3: Full FSDP (256 GPUs) -->
  <rect x="550" y="60" width="245" height="230" rx="6" class="gray"/>
  <text x="672" y="84" text-anchor="middle" class="b">Full FSDP (256 GPUs)</text>
  <text x="672" y="102" text-anchor="middle" class="sm">Shard across entire cluster</text>

  <rect x="565" y="115" width="215" height="40" rx="4" class="white"/>
  <text x="672" y="132" text-anchor="middle" class="sm">Model States per GPU:</text>
  <text x="672" y="148" text-anchor="middle" class="b">0.50 GB (502 MB)</text>

  <text x="565" y="178" class="sm">• Massive VRAM waste (~65 GB idle)</text>
  <text x="565" y="196" class="sm">• Every layer all-gathers over IB</text>
  <text x="565" y="214" class="sm">• <tspan class="b">50 GB/s</tspan> InfiniBand (18× slower!)</text>
  <text x="565" y="232" class="sm">• Heavy network latency stall</text>

  <rect x="565" y="246" width="215" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1"/>
  <text x="672" y="268" text-anchor="middle" class="b" fill="#666">Status: Bandwidth Bound</text>

  <!-- Bottom Summary Note -->
  <rect x="25" y="298" width="770" height="42" rx="4" class="white"/>
  <text x="410" y="315" text-anchor="middle" class="sm">Full sharding over 256 GPUs wastes VRAM and floods the 400 Gb/s InfiniBand fabric.</text>
  <text x="410" y="331" text-anchor="middle" class="sm"><tspan class="b">Intra-node sharding</tspan> keeps heavy layer all-gathers on high-speed 900 GB/s NVLink.</text>
</svg>