<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.xs{font-size:11px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="26" class="title">Router Collapse vs Switch Transformer Load Balancing Loss</text>
  <text x="25" y="44" class="sm" fill="#555">Without balancing, routers collapse onto a few popular experts. The auxiliary loss penalizes uneven token allocation.</text>

  <!-- Left Box: Router Collapse -->
  <rect x="25" y="65" width="370" height="195" rx="6" class="red"/>
  <text x="40" y="88" class="b" fill="#900">Pathology: Router Collapse</text>
  <text x="40" y="112" class="sm">• Self-reinforcing positive feedback loop:</text>
  <!-- Bar chart showing extreme imbalance -->
  <rect x="40" y="125" width="180" height="22" rx="3" class="white"/><text x="45" y="141" class="xs b">Expert 0: 60% of tokens</text>
  <rect x="40" y="152" width="120" height="22" rx="3" class="white"/><text x="45" y="168" class="xs b">Expert 1: 35% of tokens</text>
  <rect x="40" y="179" width="30" height="22" rx="3" class="white"/><text x="45" y="195" class="xs b">Exp 2: 4%</text>
  <rect x="40" y="206" width="20" height="22" rx="3" class="white"/><text x="45" y="222" class="xs b">Exp 3: 1%</text>
  <text x="40" y="248" class="xs" fill="#900">Result: Experts 2 and 3 starve; GPUs idle; capacity is wasted.</text>

  <!-- Right Box: Switch Transformer Aux Loss -->
  <rect x="420" y="65" width="375" height="195" rx="6" class="green"/>
  <text x="435" y="88" class="b" fill="#2d7600">Remedy: Switch Transformer Auxiliary Loss</text>
  <rect x="435" y="102" width="345" height="40" rx="4" class="white"/>
  <text x="607" y="126" text-anchor="middle" class="sm b">L_aux = α · E · Σ (f_i · P_i)</text>
  <text x="435" y="160" class="sm">• <tspan class="b">f_i</tspan>: Fraction of tokens dispatched to expert i (count).</text>
  <text x="435" y="180" class="sm">• <tspan class="b">P_i</tspan>: Average router softmax probability for expert i.</text>
  <text x="435" y="200" class="sm">• <tspan class="b">Differentiability:</tspan> Gradients flow through P_i into W_g.</text>
  <text x="435" y="220" class="sm">• <tspan class="b">Equilibrium:</tspan> Minimized when all f_i = 1/E and P_i = 1/E.</text>
  <text x="435" y="248" class="xs" fill="#2d7600">Forces equal workload distribution across all available experts.</text>

  <!-- Bottom Explanatory Banner -->
  <rect x="25" y="270" width="770" height="55" rx="4" class="gray"/>
  <text x="40" y="292" class="sm"><tspan class="b">Why the product f_i · P_i is clever:</tspan> While token routing decisions f_i are non-differentiable argmax operations,</text>
  <text x="40" y="310" class="sm">the average probability P_i is smooth and differentiable, providing continuous gradient feedback to correct imbalance.</text>
</svg>