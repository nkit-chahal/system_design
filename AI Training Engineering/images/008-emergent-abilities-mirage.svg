<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">The Emergent Abilities Debate: Sharp Jump vs Smooth Progress</text>
  <text x="25" y="48" class="sm" fill="#555">How metric choice creates the illusion of unpredictable emergence (Schaeffer et al., NeurIPS 2023)</text>

  <!-- Left Chart: Nonlinear Metric (Exact Match) -->
  <rect x="25" y="70" width="370" height="195" rx="6" class="orange"/>
  <text x="40" y="96" class="title" fill="#b45f06">Discontinuous Metric (Exact Match)</text>
  <!-- Mini axes -->
  <line x1="60" y1="210" x2="360" y2="210" stroke="#000" stroke-width="1.2"/>
  <line x1="60" y1="210" x2="60" y2="120" stroke="#000" stroke-width="1.2"/>
  <text x="210" y="228" text-anchor="middle" class="sm">Compute / Parameters (Log)</text>
  <text x="48" y="165" text-anchor="middle" transform="rotate(-90 48 165)" class="sm">Accuracy (%)</text>
  <!-- Hockey stick curve -->
  <path d="M 60,208 L 240,208 Q 280,205 320,135" fill="none" stroke="#b45f06" stroke-width="2.5"/>
  <text x="235" y="145" class="sm b" fill="#900">"Emergent" Jump</text>
  <text x="70" y="248" class="sm" fill="#555">• Appears at 0% until a sudden threshold</text>
  <text x="70" y="260" class="sm" fill="#555">• Created by multi-step string equality</text>

  <!-- Right Chart: Continuous Metric (Cross-Entropy / Edit Distance) -->
  <rect x="425" y="70" width="370" height="195" rx="6" class="green"/>
  <text x="440" y="96" class="title" fill="#274e13">Continuous Metric (Token Probabilities)</text>
  <!-- Mini axes -->
  <line x1="460" y1="210" x2="760" y2="210" stroke="#000" stroke-width="1.2"/>
  <line x1="460" y1="210" x2="460" y2="120" stroke="#000" stroke-width="1.2"/>
  <text x="610" y="228" text-anchor="middle" class="sm">Compute / Parameters (Log)</text>
  <text x="448" y="165" text-anchor="middle" transform="rotate(-90 448 165)" class="sm">Log Prob</text>
  <!-- Smooth linear curve -->
  <line x1="460" y1="195" x2="740" y2="135" stroke="#274e13" stroke-width="2.5"/>
  <text x="590" y="145" class="sm b" fill="#274e13">Smooth Power Law</text>
  <text x="470" y="248" class="sm" fill="#555">• Competence improves continuously</text>
  <text x="470" y="260" class="sm" fill="#555">• Predictable extrapolation from small models</text>

  <!-- Bottom Explanatory Banner -->
  <rect x="25" y="280" width="770" height="55" rx="6" class="gray"/>
  <text x="40" y="302" class="b">Scientific Takeaway:</text>
  <text x="40" y="322" class="sm">Language models do not undergo phase transitions. Strict 0/1 metrics mask smooth power-law gains beneath the surface.</text>
</svg>
