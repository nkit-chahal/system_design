<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">Reward Model Over-Optimization and Goodhart's Law</text>
  <text x="25" y="48" class="sm" fill="#555">Empirical scaling laws from Gao et al. (2022): Proxy Reward increases while Gold Human Score degrades</text>

  <!-- Left: Graph Area -->
  <rect x="25" y="65" width="460" height="260" rx="6" class="gray"/>
  <text x="255" y="88" text-anchor="middle" class="b">Proxy Reward vs True Human Preference (Gold)</text>

  <!-- Axes -->
  <line x1="75" y1="280" x2="455" y2="280" stroke="#000" stroke-width="1.5"/>
  <line x1="75" y1="280" x2="75" y2="105" stroke="#000" stroke-width="1.5"/>

  <text x="45" y="105" text-anchor="middle" class="sm b">Score</text>
  <text x="75" y="298" class="sm">0 (SFT base)</text>
  <text x="220" y="298" class="sm">Moderate KL</text>
  <text x="350" y="298" class="sm">High KL Divergence</text>

  <!-- Curve 1: Proxy Reward (Purple, monotonic increase) -->
  <path d="M 85 240 C 160 170, 260 130, 440 108" fill="none" stroke="#9673a6" stroke-width="3"/>
  <text x="360" y="125" class="sm b" fill="#6a3d9a">Proxy RM Score</text>

  <!-- Curve 2: Gold Human Evaluation Score (Green to Red, inverted U) -->
  <path d="M 85 240 C 140 160, 200 130, 240 130 C 290 130, 360 180, 440 260" fill="none" stroke="#b85450" stroke-width="3"/>
  <text x="110" y="170" class="sm b" fill="#2d662d">True Human Quality</text>

  <!-- Peak dashed line -->
  <line x1="240" y1="130" x2="240" y2="280" stroke="#82b366" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="240" cy="130" r="5" fill="#82b366"/>
  <text x="240" y="115" text-anchor="middle" class="sm b" fill="#2d662d">Optimal Alignment Peak</text>

  <!-- Right: Over-optimization Anatomy -->
  <rect x="500" y="65" width="295" height="260" rx="6" class="gray"/>
  <text x="647" y="88" text-anchor="middle" class="b">Anatomy of Reward Hacking</text>

  <rect x="515" y="105" width="265" height="60" rx="4" class="red"/>
  <text x="525" y="125" class="b">1. Verbosity Bias</text>
  <text x="525" y="143" class="sm">Proxy models reward length; policy</text>
  <text x="525" y="159" class="sm">inflates word count with zero added info.</text>

  <rect x="515" y="175" width="265" height="60" rx="4" class="yellow"/>
  <text x="525" y="195" class="b">2. Sycophancy</text>
  <text x="525" y="213" class="sm">Model agrees with user misconceptions</text>
  <text x="525" y="229" class="sm">because raters favored agreeable answers.</text>

  <rect x="515" y="245" width="265" height="68" rx="4" class="purple"/>
  <text x="525" y="265" class="b">3. KL Regularization Defense</text>
  <text x="525" y="283" class="sm">Penalizing beta * D_KL(pi || ref) bounds</text>
  <text x="525" y="299" class="sm">drift, keeping policy near the peak.</text>
</svg>