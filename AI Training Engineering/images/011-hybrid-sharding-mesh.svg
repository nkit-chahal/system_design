<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .lg { font-size: 16px; }
    .b { font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .yellow { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .group { fill: none; stroke: #000; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .edge { fill: none; stroke: #000; stroke-width: 1.2; marker-end: url(#arrow); }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="410" y="24" text-anchor="middle" class="lg b">Hybrid Sharded Data Parallel (HSDP): 2D Device Mesh Topology</text>

  <!-- Node 0 -->
  <rect x="30" y="45" width="225" height="215" rx="5" class="gray"/>
  <text x="142" y="68" text-anchor="middle" class="b">Node 0 (8 GPUs)</text>
  <rect x="45" y="80" width="195" height="120" rx="4" class="white"/>
  <text x="142" y="100" text-anchor="middle" class="sm b">Intra-Node Shard (N=8)</text>
  <text x="142" y="118" text-anchor="middle" class="sm">Static State: 16.1 GB / GPU</text>
  <rect x="55" y="130" width="175" height="30" rx="3" class="purple"/>
  <text x="142" y="150" text-anchor="middle" class="sm b">NVLink 900 GB/s All-Gather</text>
  <text x="142" y="180" text-anchor="middle" class="sm">High-frequency layer gathers stay local</text>
  <text x="142" y="235" text-anchor="middle" class="sm b" fill="#2b5797">Replicate Shard Unit</text>

  <!-- Node 1 -->
  <rect x="295" y="45" width="225" height="215" rx="5" class="gray"/>
  <text x="407" y="68" text-anchor="middle" class="b">Node 1 (8 GPUs)</text>
  <rect x="310" y="80" width="195" height="120" rx="4" class="white"/>
  <text x="407" y="100" text-anchor="middle" class="sm b">Intra-Node Shard (N=8)</text>
  <text x="407" y="118" text-anchor="middle" class="sm">Static State: 16.1 GB / GPU</text>
  <rect x="320" y="130" width="175" height="30" rx="3" class="purple"/>
  <text x="407" y="150" text-anchor="middle" class="sm b">NVLink 900 GB/s All-Gather</text>
  <text x="407" y="180" text-anchor="middle" class="sm">High-frequency layer gathers stay local</text>
  <text x="407" y="235" text-anchor="middle" class="sm b" fill="#2b5797">Replicate Shard Unit</text>

  <!-- Ellipsis and Node 31 -->
  <text x="545" y="150" text-anchor="middle" class="lg b">. . .</text>

  <rect x="570" y="45" width="220" height="215" rx="5" class="gray"/>
  <text x="680" y="68" text-anchor="middle" class="b">Node 31 (8 GPUs)</text>
  <rect x="585" y="80" width="190" height="120" rx="4" class="white"/>
  <text x="680" y="100" text-anchor="middle" class="sm b">Intra-Node Shard (N=8)</text>
  <text x="680" y="118" text-anchor="middle" class="sm">Static State: 16.1 GB / GPU</text>
  <rect x="595" y="130" width="170" height="30" rx="3" class="purple"/>
  <text x="680" y="150" text-anchor="middle" class="sm b">NVLink 900 GB/s All-Gather</text>
  <text x="680" y="180" text-anchor="middle" class="sm">High-frequency layer gathers stay local</text>
  <text x="680" y="235" text-anchor="middle" class="sm b" fill="#2b5797">Replicate Shard Unit</text>

  <!-- Inter-Node InfiniBand Connection across nodes -->
  <path d="M 255 155 L 295 155" class="edge"/>
  <path d="M 520 155 L 535 155" class="edge"/>
  <path d="M 555 155 L 570 155" class="edge"/>

  <!-- Inter-node collective label -->
  <rect x="90" y="270" width="640" height="55" rx="4" class="green"/>
  <text x="410" y="290" text-anchor="middle" class="b">Inter-Node Dimension: dp_replicate = 32 (InfiniBand NDR 400 Gb/s per GPU)</text>
  <text x="410" y="312" text-anchor="middle" class="sm">Only synchronizes sharded gradients (2.0 GB per GPU) once per step. Zero weight all-gathers cross nodes!</text>
</svg>