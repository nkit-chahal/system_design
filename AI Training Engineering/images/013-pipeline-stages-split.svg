<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .edge-back{fill:none;stroke:#b85450;stroke-width:1.2;stroke-dasharray:4 3;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">Partitioning a Transformer into Pipeline Stages</text>
  <text x="25" y="48" class="sm" fill="#555">Splitting 32 layers across 4 pipeline stages (p = 4). Forward activations flow right; backward gradients flow left.</text>

  <!-- Stage 0: GPU 0 -->
  <rect x="25" y="70" width="175" height="210" rx="6" class="blue"/>
  <text x="112" y="94" text-anchor="middle" class="b">Stage 0 (GPU 0)</text>
  <rect x="35" y="105" width="155" height="32" rx="4" class="yellow"/>
  <text x="112" y="126" text-anchor="middle" class="sm">Token Embedding</text>
  <rect x="35" y="145" width="155" height="50" rx="4" class="white"/>
  <text x="112" y="166" text-anchor="middle" class="sm">Layers 0 to 7</text>
  <text x="112" y="184" text-anchor="middle" class="sm" fill="#555">(8 Transformer blocks)</text>
  <rect x="35" y="205" width="155" height="30" rx="4" class="gray"/>
  <text x="112" y="225" text-anchor="middle" class="sm">Input: Token IDs [b, s]</text>
  <text x="112" y="265" text-anchor="middle" class="sm" fill="#555">In-flight act. peak: p = 4</text>

  <!-- P2P Comm 0 -> 1 -->
  <path d="M 200 135 L 225 135" class="edge"/>
  <text x="212" y="125" text-anchor="middle" class="sm" fill="#000">Act.</text>
  <path d="M 225 180 L 200 180" class="edge-back"/>
  <text x="212" y="200" text-anchor="middle" class="sm" fill="#b85450">Grad.</text>

  <!-- Stage 1: GPU 1 -->
  <rect x="225" y="70" width="175" height="210" rx="6" class="orange"/>
  <text x="312" y="94" text-anchor="middle" class="b">Stage 1 (GPU 1)</text>
  <rect x="235" y="120" width="155" height="75" rx="4" class="white"/>
  <text x="312" y="148" text-anchor="middle" class="sm">Layers 8 to 15</text>
  <text x="312" y="168" text-anchor="middle" class="sm" fill="#555">(8 Transformer blocks)</text>
  <rect x="235" y="205" width="155" height="30" rx="4" class="gray"/>
  <text x="312" y="225" text-anchor="middle" class="sm">P2P: Hidden [b, s, h]</text>
  <text x="312" y="265" text-anchor="middle" class="sm" fill="#555">In-flight act. peak: 3</text>

  <!-- P2P Comm 1 -> 2 -->
  <path d="M 400 135 L 425 135" class="edge"/>
  <text x="412" y="125" text-anchor="middle" class="sm" fill="#000">Act.</text>
  <path d="M 425 180 L 400 180" class="edge-back"/>
  <text x="412" y="200" text-anchor="middle" class="sm" fill="#b85450">Grad.</text>

  <!-- Stage 2: GPU 2 -->
  <rect x="425" y="70" width="175" height="210" rx="6" class="orange"/>
  <text x="512" y="94" text-anchor="middle" class="b">Stage 2 (GPU 2)</text>
  <rect x="435" y="120" width="155" height="75" rx="4" class="white"/>
  <text x="512" y="148" text-anchor="middle" class="sm">Layers 16 to 23</text>
  <text x="512" y="168" text-anchor="middle" class="sm" fill="#555">(8 Transformer blocks)</text>
  <rect x="435" y="205" width="155" height="30" rx="4" class="gray"/>
  <text x="512" y="225" text-anchor="middle" class="sm">P2P: Hidden [b, s, h]</text>
  <text x="512" y="265" text-anchor="middle" class="sm" fill="#555">In-flight act. peak: 2</text>

  <!-- P2P Comm 2 -> 3 -->
  <path d="M 600 135 L 625 135" class="edge"/>
  <text x="612" y="125" text-anchor="middle" class="sm" fill="#000">Act.</text>
  <path d="M 625 180 L 600 180" class="edge-back"/>
  <text x="612" y="200" text-anchor="middle" class="sm" fill="#b85450">Grad.</text>

  <!-- Stage 3: GPU 3 -->
  <rect x="625" y="70" width="175" height="210" rx="6" class="green"/>
  <text x="712" y="94" text-anchor="middle" class="b">Stage 3 (GPU 3)</text>
  <rect x="635" y="105" width="155" height="50" rx="4" class="white"/>
  <text x="712" y="126" text-anchor="middle" class="sm">Layers 24 to 31</text>
  <text x="712" y="144" text-anchor="middle" class="sm" fill="#555">(8 Transformer blocks)</text>
  <rect x="635" y="160" width="155" height="32" rx="4" class="yellow"/>
  <text x="712" y="181" text-anchor="middle" class="sm">RMSNorm + LM Head</text>
  <rect x="635" y="200" width="155" height="30" rx="4" class="red"/>
  <text x="712" y="220" text-anchor="middle" class="sm">Cross-Entropy Loss</text>
  <text x="712" y="265" text-anchor="middle" class="sm" fill="#555">In-flight act. peak: 1</text>

  <!-- Bottom Legend and Commentary -->
  <rect x="25" y="295" width="775" height="50" rx="4" class="gray"/>
  <text x="40" y="316" class="sm"><tspan class="b">Communication:</tspan> Forward pass sends activation tensor of shape [b, s, h] (67 MB in BF16 for 8B, b=1, s=8192).</text>
  <text x="40" y="334" class="sm">Backward pass sends activation gradient dL/dX of identical shape [b, s, h] in reverse direction.</text>
</svg>