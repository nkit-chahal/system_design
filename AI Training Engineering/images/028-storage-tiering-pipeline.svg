<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Tier 1: Local Node NVMe -->
  <rect x="25" y="40" width="225" height="240" rx="8" class="orange"/>
  <text x="40" y="68" class="b">Tier 1: Local NVMe SSD</text>
  <text x="40" y="88" class="sm">Bandwidth: &gt; 10 GB/s per node</text>
  <rect x="40" y="105" width="195" height="40" rx="4" class="white"/>
  <text x="50" y="130" class="sm">Staged async buffers</text>
  <rect x="40" y="155" width="195" height="40" rx="4" class="white"/>
  <text x="50" y="180" class="sm">Transient shard writes</text>
  <rect x="40" y="205" width="195" height="60" rx="4" class="gray"/>
  <text x="50" y="225" class="sm b">Retention: 0-1 saves</text>
  <text x="50" y="243" class="sm">Overwritten every step;</text>
  <text x="50" y="258" class="sm">lost if node reboots</text>

  <!-- Arrow 1 to 2 -->
  <path d="M250,160 L285,160" class="edge"/>

  <!-- Tier 2: Shared Cluster Parallel File System -->
  <rect x="290" y="40" width="240" height="240" rx="8" class="blue"/>
  <text x="305" y="68" class="b">Tier 2: Shared Lustre / GPFS</text>
  <text x="305" y="88" class="sm">Bandwidth: 20-50 GB/s cluster</text>
  <rect x="305" y="105" width="210" height="40" rx="4" class="white"/>
  <text x="315" y="130" class="sm">step_1000/ (Active save)</text>
  <rect x="305" y="155" width="210" height="40" rx="4" class="white"/>
  <text x="315" y="180" class="sm">step_900/, step_800/</text>
  <rect x="305" y="205" width="210" height="60" rx="4" class="yellow"/>
  <text x="315" y="225" class="sm b">Retention: Rolling Last 3</text>
  <text x="315" y="243" class="sm">Older saves auto-pruned;</text>
  <text x="315" y="258" class="sm">fast failure recovery</text>

  <!-- Arrow 2 to 3 -->
  <path d="M530,160 L565,160" class="edge"/>

  <!-- Tier 3: Cloud Object Storage -->
  <rect x="570" y="40" width="225" height="240" rx="8" class="green"/>
  <text x="585" y="68" class="b">Tier 3: Cloud S3 Archive</text>
  <text x="585" y="88" class="sm">Bandwidth: 5-10 GB/s egress</text>
  <rect x="585" y="105" width="195" height="40" rx="4" class="white"/>
  <text x="595" y="130" class="sm">step_5000/ (Milestone)</text>
  <rect x="585" y="155" width="195" height="40" rx="4" class="white"/>
  <text x="595" y="180" class="sm">step_10000/ (Milestone)</text>
  <rect x="585" y="205" width="195" height="60" rx="4" class="gray"/>
  <text x="595" y="225" class="sm b">Retention: Permanent</text>
  <text x="595" y="243" class="sm">Divergence rollbacks,</text>
  <text x="595" y="258" class="sm">evaluations, model weights</text>
</svg>
