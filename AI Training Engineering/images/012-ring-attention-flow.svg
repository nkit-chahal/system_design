<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .lg { font-size: 16px; }
    .b { font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .yellow { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .group { fill: none; stroke: #000; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .edge { fill: none; stroke: #000; stroke-width: 1.2; marker-end: url(#arrow); }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="410" y="24" text-anchor="middle" class="lg b">Ring Attention / Context Parallelism: Pipelined Ring Execution</text>

  <!-- 4 GPUs in a ring -->
  <!-- GPU 0 Top -->
  <rect x="330" y="45" width="160" height="70" rx="5" class="gray"/>
  <text x="410" y="65" text-anchor="middle" class="b">GPU 0 (Tokens 0..s/4)</text>
  <rect x="345" y="75" width="130" height="18" rx="2" class="orange"/>
  <text x="410" y="89" text-anchor="middle" class="sm">Query Q0 (Stationary)</text>
  <rect x="345" y="95" width="130" height="16" rx="2" class="blue"/>
  <text x="410" y="108" text-anchor="middle" class="sm">KV Blocks (Circulating)</text>

  <!-- GPU 1 Right -->
  <rect x="590" y="130" width="170" height="70" rx="5" class="gray"/>
  <text x="675" y="150" text-anchor="middle" class="b">GPU 1 (Tokens s/4..s/2)</text>
  <rect x="605" y="160" width="140" height="18" rx="2" class="orange"/>
  <text x="675" y="174" text-anchor="middle" class="sm">Query Q1 (Stationary)</text>
  <rect x="605" y="180" width="140" height="16" rx="2" class="blue"/>
  <text x="675" y="193" text-anchor="middle" class="sm">KV Blocks (Circulating)</text>

  <!-- GPU 2 Bottom -->
  <rect x="330" y="215" width="160" height="70" rx="5" class="gray"/>
  <text x="410" y="235" text-anchor="middle" class="b">GPU 2 (Tokens s/2..3s/4)</text>
  <rect x="345" y="245" width="130" height="18" rx="2" class="orange"/>
  <text x="410" y="259" text-anchor="middle" class="sm">Query Q2 (Stationary)</text>
  <rect x="345" y="265" width="130" height="16" rx="2" class="blue"/>
  <text x="410" y="278" text-anchor="middle" class="sm">KV Blocks (Circulating)</text>

  <!-- GPU 3 Left -->
  <rect x="60" y="130" width="170" height="70" rx="5" class="gray"/>
  <text x="145" y="150" text-anchor="middle" class="b">GPU 3 (Tokens 3s/4..s)</text>
  <rect x="75" y="160" width="140" height="18" rx="2" class="orange"/>
  <text x="145" y="174" text-anchor="middle" class="sm">Query Q3 (Stationary)</text>
  <rect x="75" y="180" width="140" height="16" rx="2" class="blue"/>
  <text x="145" y="193" text-anchor="middle" class="sm">KV Blocks (Circulating)</text>

  <!-- Ring edges for KV block passing -->
  <path d="M 490 80 Q 570 80 590 135" class="edge"/>
  <text x="560" y="105" class="sm b" fill="#2b5797">Pass KV</text>

  <path d="M 675 200 Q 570 250 490 250" class="edge"/>
  <text x="560" y="240" class="sm b" fill="#2b5797">Pass KV</text>

  <path d="M 330 250 Q 250 250 230 195" class="edge"/>
  <text x="250" y="240" class="sm b" fill="#2b5797">Pass KV</text>

  <path d="M 145 130 Q 250 80 330 80" class="edge"/>
  <text x="250" y="105" class="sm b" fill="#2b5797">Pass KV</text>

  <!-- Center Mechanism Box -->
  <rect x="250" y="135" width="320" height="60" rx="4" class="white"/>
  <text x="410" y="155" text-anchor="middle" class="sm b">Compute Overlap Mechanism:</text>
  <text x="410" y="172" text-anchor="middle" class="sm">Compute Attention(Q_i, KV_k)</text>
  <text x="410" y="188" text-anchor="middle" class="sm" fill="#2b5797">while sending KV_k to neighbor in ring</text>

  <!-- Bottom Callout -->
  <rect x="50" y="295" width="720" height="34" rx="4" class="green"/>
  <text x="410" y="316" text-anchor="middle" class="sm b">Enables exact attention across millions of tokens without holding full sequence KV cache on any single GPU</text>
</svg>