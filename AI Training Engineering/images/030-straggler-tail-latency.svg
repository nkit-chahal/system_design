<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .b { font-weight: bold; }
    .title { font-size: 16px; font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .barrier { stroke: #b85450; stroke-width: 2; stroke-dasharray: 4 3; }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="24" class="title">The Straggler Problem: Synchronous Collectives Magnify Tail Latency</text>
  <text x="25" y="42" class="sm" fill="#555">In synchronous training across 256 GPUs, one degraded link or throttled GPU stalls the entire cluster at the collective barrier.</text>

  <!-- Main container -->
  <rect x="25" y="58" width="790" height="215" rx="5" class="gray"/>

  <!-- Barrier Label at Top -->
  <text x="590" y="78" text-anchor="middle" class="sm b" fill="#990000">Collective Barrier (520 ms)</text>

  <!-- Rank 0 (Normal) -->
  <text x="40" y="105" class="b sm">GPU 0 (Healthy):</text>
  <rect x="170" y="90" width="300" height="24" rx="3" class="green"/>
  <text x="320" y="106" text-anchor="middle" class="sm">Forward &amp; Backward Compute: 400 ms</text>
  <rect x="470" y="90" width="120" height="24" rx="3" class="red"/>
  <text x="530" y="106" text-anchor="middle" class="sm b">Wait: 120 ms</text>
  <rect x="590" y="90" width="75" height="24" rx="3" class="orange"/>
  <text x="627" y="106" text-anchor="middle" class="sm">Sync: 30 ms</text>

  <!-- Rank 1..254 (Normal) -->
  <text x="40" y="145" class="b sm">GPUs 1–254 (Healthy):</text>
  <rect x="170" y="130" width="300" height="24" rx="3" class="green"/>
  <text x="320" y="146" text-anchor="middle" class="sm">Forward &amp; Backward Compute: 400 ms</text>
  <rect x="470" y="130" width="120" height="24" rx="3" class="red"/>
  <text x="530" y="146" text-anchor="middle" class="sm b">Wait: 120 ms</text>
  <rect x="590" y="130" width="75" height="24" rx="3" class="orange"/>
  <text x="627" y="146" text-anchor="middle" class="sm">Sync: 30 ms</text>

  <!-- Rank 255 (Straggler) -->
  <text x="40" y="185" class="b sm" fill="#990000">GPU 255 (Straggler):</text>
  <rect x="170" y="170" width="420" height="24" rx="3" class="purple"/>
  <text x="380" y="186" text-anchor="middle" class="sm b">Delayed Execution (Link Drops / Thermal Throttle): 520 ms</text>
  <rect x="590" y="170" width="75" height="24" rx="3" class="orange"/>
  <text x="627" y="186" text-anchor="middle" class="sm">Sync: 30 ms</text>

  <!-- Barrier Line -->
  <line x1="590" y1="84" x2="590" y2="210" class="barrier"/>

  <!-- Timeline ticks at bottom -->
  <line x1="170" y1="210" x2="665" y2="210" stroke="#666" stroke-width="1"/>
  <line x1="170" y1="210" x2="170" y2="215" stroke="#666"/>
  <text x="170" y="228" text-anchor="middle" class="sm">0 ms</text>
  <line x1="470" y1="210" x2="470" y2="215" stroke="#666"/>
  <text x="470" y="228" text-anchor="middle" class="sm">400 ms</text>
  <line x1="590" y1="210" x2="590" y2="215" stroke="#666"/>
  <text x="590" y="228" text-anchor="middle" class="sm">520 ms</text>
  <line x1="665" y1="210" x2="665" y2="215" stroke="#666"/>
  <text x="665" y="228" text-anchor="middle" class="sm">550 ms</text>

  <text x="40" y="255" class="sm" fill="#555">All 255 healthy GPUs cannot proceed with all-reduce until rank 255 reaches the collective barrier.</text>

  <!-- Summary impact box -->
  <rect x="25" y="286" width="790" height="60" rx="4" class="white"/>
  <text x="38" y="306" class="b sm">Cluster Impact:</text>
  <text x="38" y="324" class="sm">• 255 GPUs sit 100% idle for 120 ms each step = <tspan class="b">30.6 GPU-seconds wasted per step</tspan>.</text>
  <text x="38" y="339" class="sm">• Step time inflates from 430 ms to 550 ms: a <tspan class="b">28% slowdown</tspan> across the entire $100k training run.</text>
</svg>
