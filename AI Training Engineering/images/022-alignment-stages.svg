<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">The Complete Post-Training Alignment Spectrum</text>
  <text x="25" y="48" class="sm" fill="#555">From unsupervised foundation knowledge to supervised imitation and reinforcement learning</text>

  <!-- Stage 1: Pretraining -->
  <rect x="25" y="70" width="175" height="150" rx="6" class="blue"/>
  <text x="112" y="94" text-anchor="middle" class="b">1. Pretraining</text>
  <text x="112" y="112" text-anchor="middle" class="sm" fill="#444">Foundation Weights</text>
  <line x1="35" y1="120" x2="190" y2="120" stroke="#6c8ebf" stroke-width="1"/>
  <text x="35" y="140" class="sm">• 1T to 15T tokens</text>
  <text x="35" y="158" class="sm">• 256 H100s, ~5.5 days</text>
  <text x="35" y="176" class="sm">• Learns world facts,</text>
  <text x="35" y="192" class="sm">  grammar &amp; reasoning</text>
  <text x="35" y="210" class="sm">• Cost: ~$101,000</text>

  <path d="M 200 145 L 225 145" class="edge"/>

  <!-- Stage 2: SFT (This Lesson) -->
  <rect x="225" y="70" width="175" height="150" rx="6" class="orange"/>
  <text x="312" y="94" text-anchor="middle" class="b">2. SFT (Lesson 22)</text>
  <text x="312" y="112" text-anchor="middle" class="sm" fill="#444">Supervised Fine-Tuning</text>
  <line x1="235" y1="120" x2="390" y2="120" stroke="#d79b00" stroke-width="1"/>
  <text x="235" y="140" class="sm">• 50k conversations</text>
  <text x="235" y="158" class="sm">• 8 H100s, ~25 mins</text>
  <text x="235" y="176" class="sm">• Format, assistant style,</text>
  <text x="235" y="192" class="sm">  JSON schemas, roles</text>
  <text x="235" y="210" class="sm">• Cost: ~$10</text>

  <path d="M 400 145 L 425 145" class="edge"/>

  <!-- Stage 3: Preference Tuning -->
  <rect x="425" y="70" width="175" height="150" rx="6" class="purple"/>
  <text x="512" y="94" text-anchor="middle" class="b">3. DPO (Lesson 25)</text>
  <text x="512" y="112" text-anchor="middle" class="sm" fill="#444">Preference Optimization</text>
  <line x1="435" y1="120" x2="590" y2="120" stroke="#9673a6" stroke-width="1"/>
  <text x="435" y="140" class="sm">• 20k pairwise tuples</text>
  <text x="435" y="158" class="sm">• 8 H100s, ~30 mins</text>
  <text x="435" y="176" class="sm">• Resolves ambiguity,</text>
  <text x="435" y="192" class="sm">  penalizes sycophancy</text>
  <text x="435" y="210" class="sm">• Cost: ~$12</text>

  <path d="M 600 145 L 625 145" class="edge"/>

  <!-- Stage 4: Verifiable RL -->
  <rect x="625" y="70" width="170" height="150" rx="6" class="green"/>
  <text x="710" y="94" text-anchor="middle" class="b">4. GRPO (Lesson 26)</text>
  <text x="710" y="112" text-anchor="middle" class="sm" fill="#444">Verifiable Rewards</text>
  <line x1="635" y1="120" x2="785" y2="120" stroke="#82b366" stroke-width="1"/>
  <text x="635" y="140" class="sm">• Rule/compiler reward</text>
  <text x="635" y="158" class="sm">• 8 to 32 H100s</text>
  <text x="635" y="176" class="sm">• Self-exploration for</text>
  <text x="635" y="192" class="sm">  multi-step deduction</text>
  <text x="635" y="210" class="sm">• Cost: ~$100–$500</text>

  <!-- Bottom Explanatory Card -->
  <rect x="25" y="235" width="770" height="65" rx="4" class="gray"/>
  <text x="40" y="258" class="b">The Superficial Alignment Hypothesis (Zhou et al., 2023)</text>
  <text x="40" y="278" class="sm">Pretraining provides 99% of knowledge and capabilities. SFT teaches the model when and how to surface</text>
  <text x="40" y="294" class="sm">those capabilities in user interactions using masked completion losses.</text>
</svg>