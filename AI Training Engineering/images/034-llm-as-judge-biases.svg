<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .b { font-weight: bold; }
    .title { font-size: 16px; font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .box { rx: 5px; stroke-width: 1.2; }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="24" class="title">The Three Systematic Biases of LLM-as-a-Judge (Zheng et al., 2023)</text>
  <text x="25" y="42" class="sm" fill="#555">Evaluating open-ended generation with automated judges introduces systematic distortion if unmitigated.</text>

  <!-- 3 Bias Cards -->
  <!-- 1. Position Bias -->
  <rect x="25" y="60" width="250" height="210" class="box orange"/>
  <text x="35" y="82" class="b sm">1. Position Bias</text>
  <text x="35" y="98" class="sm" fill="#555">Order sensitivity in pairwise judging</text>

  <rect x="35" y="112" width="230" height="52" rx="3" class="white"/>
  <text x="45" y="130" class="sm b">The Distortion:</text>
  <text x="45" y="146" class="sm">Judges favor Answer A over B</text>
  <text x="45" y="160" class="sm">up to 60–70% of the time.</text>

  <rect x="35" y="172" width="230" height="85" rx="3" class="green"/>
  <text x="45" y="190" class="sm b" fill="#274e13">Required Mitigation:</text>
  <text x="45" y="208" class="sm">• Run pair in both orders:</text>
  <text x="55" y="224" class="sm">(A, B) and (B, A)</text>
  <text x="45" y="242" class="sm">• Only count win if consistent</text>

  <!-- 2. Verbosity Bias -->
  <rect x="295" y="60" width="250" height="210" class="box purple"/>
  <text x="305" y="82" class="b sm">2. Verbosity / Length Bias</text>
  <text x="305" y="98" class="sm" fill="#555">Conflating length with quality</text>

  <rect x="305" y="112" width="230" height="52" rx="3" class="white"/>
  <text x="315" y="130" class="sm b">The Distortion:</text>
  <text x="315" y="146" class="sm">Verbose, repetitive text scores</text>
  <text x="315" y="160" class="sm">higher than concise truth.</text>

  <rect x="305" y="172" width="230" height="85" rx="3" class="green"/>
  <text x="315" y="190" class="sm b" fill="#274e13">Required Mitigation:</text>
  <text x="315" y="208" class="sm">• Explicit conciseness penalty</text>
  <text x="315" y="224" class="sm">• Length-controlled win-rates</text>
  <text x="315" y="242" class="sm">• Strip filler boilerplate</text>

  <!-- 3. Self-Preference Bias -->
  <rect x="565" y="60" width="250" height="210" class="box blue"/>
  <text x="575" y="82" class="b sm">3. Self-Preference Bias</text>
  <text x="575" y="98" class="sm" fill="#555">Favoring familiar stylistic habits</text>

  <rect x="575" y="112" width="230" height="52" rx="3" class="white"/>
  <text x="585" y="130" class="sm b">The Distortion:</text>
  <text x="585" y="146" class="sm">An LLM judge awards +5% to</text>
  <text x="585" y="160" class="sm">+15% to its own model family.</text>

  <rect x="575" y="172" width="230" height="85" rx="3" class="green"/>
  <text x="585" y="190" class="sm b" fill="#274e13">Required Mitigation:</text>
  <text x="585" y="208" class="sm">• Never evaluate with own model</text>
  <text x="585" y="224" class="sm">• Multi-judge diverse panel</text>
  <text x="585" y="242" class="sm">• Human audit calibration</text>

  <!-- Bottom Explanatory Box -->
  <rect x="25" y="284" width="790" height="52" rx="4" class="white"/>
  <text x="38" y="304" class="b sm">Citation:</text>
  <text x="95" y="304" class="sm">Zheng et al., 2023 ("Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena").</text>
  <text x="38" y="322" class="sm">Pairwise judging with position swapping achieves &gt; 80% agreement with humans, matching inter-human annotator agreement.</text>
</svg>
