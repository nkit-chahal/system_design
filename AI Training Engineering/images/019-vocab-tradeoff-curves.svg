<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}.mid{text-anchor:middle}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="25" y="30" class="lg b">Vocabulary Size Trade-Offs: Compression vs Parameter Tax</text>
  <text x="25" y="52" class="sm" fill="#555">Larger vocabularies compress text and save sequence context, but inflate embedding matrices</text>

  <!-- Left: Compression Benefits -->
  <rect x="25" y="80" width="370" height="230" rx="5" class="blue"/>
  <text x="210" y="105" class="b mid">Compression Gain (Chars / Token)</text>

  <!-- Bar 1: 32k -->
  <text x="40" y="135" class="sm b">32,000 Vocab (Llama 2)</text>
  <rect x="40" y="145" width="220" height="22" rx="3" class="gray"/>
  <text x="270" y="161" class="sm">3.6 chars/tok (English)</text>

  <!-- Bar 2: 128k -->
  <text x="40" y="195" class="sm b">128,256 Vocab (Llama 3)</text>
  <rect x="40" y="205" width="260" height="22" rx="3" class="green"/>
  <text x="310" y="221" class="sm b" fill="#2d572c">4.2 chars/tok (+17%)</text>

  <text x="40" y="255" class="sm">• Code compression: +43% fewer tokens</text>
  <text x="40" y="275" class="sm">• Non-Latin scripts: +70% fewer tokens</text>
  <text x="40" y="295" class="sm">• 1T tokens packs ~20% more raw knowledge</text>

  <!-- Right: Parameter & Memory Tax -->
  <rect x="420" y="80" width="375" height="230" rx="5" class="red"/>
  <text x="607" y="105" class="b mid">Parameter &amp; Memory Tax (d = 4,096)</text>

  <!-- Metric 1: 32k -->
  <rect x="435" y="125" width="345" height="42" rx="3" class="white"/>
  <text x="445" y="143" class="sm b">32k Vocab:</text>
  <text x="530" y="143" class="sm">131M params/matrix</text>
  <text x="445" y="160" class="sm" fill="#555">262M untied (3.3% of 8B) · 4.2 GB Adam states</text>

  <!-- Metric 2: 128k -->
  <rect x="435" y="175" width="345" height="42" rx="3" class="orange"/>
  <text x="445" y="193" class="sm b">128k Vocab:</text>
  <text x="530" y="193" class="sm b">525M params/matrix</text>
  <text x="445" y="210" class="sm" fill="#7d4b00">1.05B untied (13.1% of 8B) · 16.8 GB Adam states</text>

  <!-- Metric 3: 256k -->
  <rect x="435" y="225" width="345" height="42" rx="3" class="white"/>
  <text x="445" y="243" class="sm b">256k Vocab:</text>
  <text x="530" y="243" class="sm">1,048M params/matrix</text>
  <text x="445" y="260" class="sm" fill="#900">2.10B untied (26.1% of 8B) · 33.6 GB Adam states</text>

  <text x="607" y="295" class="sm b mid" fill="#900">128k is the sweet spot balancing compression and memory</text>
</svg>