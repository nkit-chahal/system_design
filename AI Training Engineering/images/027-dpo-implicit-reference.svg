<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Left: Naive Full DPO (Two Full Models) -->
  <rect x="30" y="30" width="350" height="260" rx="8" class="group"/>
  <text x="50" y="58" class="lg b">Naive Full-Parameter DPO</text>

  <rect x="50" y="80" width="310" height="45" rx="4" class="orange"/>
  <text x="65" y="102" class="b">Policy Model (Active)</text>
  <text x="65" y="117" class="sm">Weights + Grads + Adam: 128.5 GB</text>

  <rect x="50" y="140" width="310" height="45" rx="4" class="red"/>
  <text x="65" y="162" class="b">Reference Model (Duplicate)</text>
  <text x="65" y="177" class="sm">Explicit frozen copy: 16.1 GB</text>

  <rect x="50" y="205" width="310" height="65" rx="4" class="red"/>
  <text x="60" y="225" class="sm b">Memory Bottleneck:</text>
  <text x="60" y="243" class="sm">Requires hosting two separate model instances.</text>
  <text x="60" y="261" class="sm">Severe OOM risk on consumer / single GPUs.</text>

  <!-- Right: PEFT LoRA DPO (Implicit Reference) -->
  <rect x="420" y="30" width="350" height="260" rx="8" class="group"/>
  <text x="440" y="58" class="lg b">PEFT LoRA DPO (ref_model=None)</text>

  <rect x="440" y="80" width="310" height="50" rx="4" class="blue"/>
  <text x="455" y="102" class="b">Frozen Base Model (16.1 GB)</text>
  <text x="455" y="120" class="sm">Single shared instance in GPU VRAM</text>

  <rect x="440" y="140" width="145" height="45" rx="4" class="green"/>
  <text x="450" y="160" class="b">Policy Pass</text>
  <text x="450" y="176" class="sm">Adapter ENABLED</text>

  <rect x="605" y="140" width="145" height="45" rx="4" class="purple"/>
  <text x="615" y="160" class="b">Reference Pass</text>
  <text x="615" y="176" class="sm">Adapter DISABLED</text>

  <rect x="440" y="205" width="310" height="65" rx="4" class="green"/>
  <text x="450" y="225" class="sm b">Memory Optimization:</text>
  <text x="450" y="243" class="sm">Base weights loaded once. Setting ref_model=None</text>
  <text x="450" y="261" class="sm">disables adapter during ref forward. Zero duplication!</text>
</svg>
