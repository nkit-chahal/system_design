<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .bubble{fill:#fff;stroke:#ccc;stroke-width:1;stroke-dasharray:3 3}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">Naive Pipeline Execution (No Micro-Batching)</text>
  <text x="25" y="48" class="sm" fill="#555">With a single full batch, only one GPU computes at any moment. Idle time is (p − 1) / p = 75%.</text>

  <!-- Left stage labels -->
  <text x="25" y="85" class="b">Stage 0 (GPU 0)</text>
  <text x="25" y="125" class="b">Stage 1 (GPU 1)</text>
  <text x="25" y="165" class="b">Stage 2 (GPU 2)</text>
  <text x="25" y="205" class="b">Stage 3 (GPU 3)</text>

  <!-- Time slots header -->
  <!-- Origin x=145, y=65 -->
  <!-- Slot 1: F0 -->
  <rect x="145" y="65" width="70" height="30" rx="3" class="blue"/>
  <text x="180" y="85" text-anchor="middle" class="b">F</text>

  <!-- Idle slots GPU 0 -->
  <rect x="220" y="65" width="455" height="30" rx="3" class="bubble"/>
  <text x="447" y="84" text-anchor="middle" class="sm" fill="#999">IDLE BUBBLE (waiting for backward pass to return)</text>

  <!-- B0 on GPU 0 -->
  <rect x="680" y="65" width="105" height="30" rx="3" class="red"/>
  <text x="732" y="85" text-anchor="middle" class="b">B</text>

  <!-- GPU 1 -->
  <rect x="145" y="105" width="70" height="30" rx="3" class="bubble"/>
  <rect x="220" y="105" width="70" height="30" rx="3" class="blue"/>
  <text x="255" y="125" text-anchor="middle" class="b">F</text>
  <rect x="295" y="105" width="275" height="30" rx="3" class="bubble"/>
  <rect x="575" y="105" width="100" height="30" rx="3" class="red"/>
  <text x="625" y="125" text-anchor="middle" class="b">B</text>
  <rect x="680" y="105" width="105" height="30" rx="3" class="bubble"/>

  <!-- GPU 2 -->
  <rect x="145" y="145" width="145" height="30" rx="3" class="bubble"/>
  <rect x="295" y="145" width="70" height="30" rx="3" class="blue"/>
  <text x="330" y="165" text-anchor="middle" class="b">F</text>
  <rect x="370" y="145" width="95" height="30" rx="3" class="bubble"/>
  <rect x="470" y="145" width="100" height="30" rx="3" class="red"/>
  <text x="520" y="165" text-anchor="middle" class="b">B</text>
  <rect x="575" y="145" width="210" height="30" rx="3" class="bubble"/>

  <!-- GPU 3 -->
  <rect x="145" y="185" width="220" height="30" rx="3" class="bubble"/>
  <rect x="370" y="185" width="70" height="30" rx="3" class="blue"/>
  <text x="405" y="205" text-anchor="middle" class="b">F</text>
  <rect x="445" y="185" width="100" height="30" rx="3" class="red"/>
  <text x="495" y="205" text-anchor="middle" class="b">B (Loss)</text>
  <rect x="550" y="185" width="235" height="30" rx="3" class="bubble"/>

  <!-- Arrows between activations -->
  <path d="M 215 85 L 220 115" class="edge"/>
  <path d="M 290 125 L 295 155" class="edge"/>
  <path d="M 365 165 L 370 195" class="edge"/>
  <!-- Gradients -->
  <path d="M 445 195 L 470 165" class="edge"/>
  <path d="M 570 155 L 575 130" class="edge"/>
  <path d="M 675 115 L 680 90" class="edge"/>

  <!-- Bottom note -->
  <rect x="25" y="235" width="765" height="35" rx="4" class="red"/>
  <text x="40" y="257" class="sm" fill="#900"><tspan class="b">Inefficiency:</tspan> Adding GPUs provides almost zero speedup. Total step time equals 1 GPU sequential time; 3 of 4 GPUs sit completely idle.</text>
</svg>