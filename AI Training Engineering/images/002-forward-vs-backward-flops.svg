<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">The 6ND Rule: Why Backward Costs Twice the Forward Pass</text>
  <text x="25" y="48" class="sm" fill="#555">Matrix multiplication (GEMM) counts for a linear projection Y = XW across training phases</text>

  <!-- Left: Forward Pass Box (1 GEMM) -->
  <rect x="25" y="65" width="240" height="235" rx="6" class="blue"/>
  <text x="145" y="90" text-anchor="middle" class="b">Forward Pass: 1 GEMM</text>
  <text x="145" y="112" text-anchor="middle" class="sm">Layer projection: Y = X @ W</text>

  <rect x="40" y="125" width="210" height="75" rx="4" class="white"/>
  <text x="50" y="145" class="sm b">GEMM 1 (Output Activation):</text>
  <text x="50" y="165" class="sm">X: [B, Din]  x  W: [Din, Dout]</text>
  <text x="50" y="185" class="sm">FLOPs = 2 * B * Din * Dout</text>

  <rect x="40" y="215" width="210" height="65" rx="4" class="white"/>
  <text x="145" y="238" text-anchor="middle" class="b" fill="#005cc5">Forward Total:</text>
  <text x="145" y="263" text-anchor="middle" class="title" fill="#005cc5">2ND FLOPs</text>

  <!-- Middle: Backward Pass Box (2 GEMMs) -->
  <rect x="280" y="65" width="310" height="235" rx="6" class="orange"/>
  <text x="435" y="90" text-anchor="middle" class="b">Backward Pass: 2 GEMMs (2x Cost)</text>
  <text x="435" y="112" text-anchor="middle" class="sm">Two gradients must be calculated simultaneously</text>

  <rect x="295" y="125" width="280" height="65" rx="4" class="white"/>
  <text x="305" y="145" class="sm b">GEMM 2 (Activation Gradient):</text>
  <text x="305" y="163" class="sm">dL/dX = (dL/dY) @ W.T  --&gt; [B, Din]</text>
  <text x="305" y="181" class="sm">FLOPs = 2 * B * Dout * Din (Propagate back)</text>

  <rect x="295" y="195" width="280" height="65" rx="4" class="white"/>
  <text x="305" y="215" class="sm b">GEMM 3 (Weight Gradient):</text>
  <text x="305" y="233" class="sm">dL/dW = X.T @ (dL/dY)  --&gt; [Din, Dout]</text>
  <text x="305" y="251" class="sm">FLOPs = 2 * Din * B * Dout (Update weights)</text>

  <text x="435" y="285" text-anchor="middle" class="b" fill="#b85450">Backward Total: 4ND FLOPs</text>

  <!-- Right: Total Summary Box -->
  <rect x="605" y="65" width="190" height="235" rx="6" class="green"/>
  <text x="700" y="90" text-anchor="middle" class="b">Step Total</text>
  <text x="700" y="112" text-anchor="middle" class="sm">Per parameter &amp; token</text>

  <rect x="618" y="125" width="164" height="65" rx="4" class="white"/>
  <text x="700" y="148" text-anchor="middle" class="sm b">Standard Training:</text>
  <text x="700" y="172" text-anchor="middle" class="title" fill="#05673d">6ND</text>

  <rect x="618" y="200" width="164" height="85" rx="4" class="yellow"/>
  <text x="700" y="222" text-anchor="middle" class="sm b">With Checkpointing:</text>
  <text x="700" y="244" text-anchor="middle" class="sm">Recomputes forward (2ND)</text>
  <text x="700" y="268" text-anchor="middle" class="title" fill="#d79b00">8ND</text>
</svg>
