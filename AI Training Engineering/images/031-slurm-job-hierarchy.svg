<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .b { font-weight: bold; }
    .title { font-size: 16px; font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .edge { fill: none; stroke: #000; stroke-width: 1.2; marker-end: url(#arrow); }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="24" class="title">Slurm Scheduling Architecture and Multi-Factor Priority</text>
  <text x="25" y="42" class="sm" fill="#555">Centralized daemon coordinates queues, backfill scheduling, fair-share decay, and exclusive node dispatch.</text>

  <!-- Left: Slurm Controller & Queue Priority -->
  <rect x="25" y="58" width="460" height="215" rx="5" class="gray"/>
  <text x="40" y="80" class="b">Slurm Central Controller (slurmctld)</text>
  <text x="40" y="96" class="sm" fill="#555">Evaluates incoming sbatch jobs and calculates dynamic priority score</text>

  <!-- Multi-factor Priority Equation Box -->
  <rect x="40" y="108" width="430" height="85" rx="4" class="white"/>
  <text x="50" y="128" class="b sm">Multi-Factor Priority Formula:</text>
  <text x="50" y="146" class="sm b" fill="#2c5d88">Priority = Weight_Age × Age + Weight_FS × FairShare + Weight_QOS × QOS</text>
  <text x="50" y="164" class="sm">• <tspan class="b">FairShare</tspan>: Exponential decay of team's past GPU-hours vs allocated share.</text>
  <text x="50" y="180" class="sm">• <tspan class="b">Backfill</tspan>: Launches short small jobs in empty holes without delaying top job.</text>

  <!-- Partitions & QOS -->
  <rect x="40" y="202" width="205" height="58" rx="4" class="orange"/>
  <text x="142" y="222" text-anchor="middle" class="b sm">Partitions (Queues)</text>
  <text x="142" y="238" text-anchor="middle" class="sm">batch · interactive · debug</text>
  <text x="142" y="252" text-anchor="middle" class="sm">Defines max runtime &amp; nodes</text>

  <rect x="260" y="202" width="210" height="58" rx="4" class="purple"/>
  <text x="365" y="222" text-anchor="middle" class="b sm">QOS (Quality of Service)</text>
  <text x="365" y="238" text-anchor="middle" class="sm">preemptible · standard · prod</text>
  <text x="365" y="252" text-anchor="middle" class="sm">Controls preemption rules</text>

  <!-- Edge from Controller to Compute Nodes -->
  <path d="M485,160 L515,160" class="edge"/>

  <!-- Right: Compute Node Fabric -->
  <rect x="520" y="58" width="295" height="215" rx="5" class="gray"/>
  <text x="535" y="80" class="b">Compute Nodes (slurmd)</text>
  <text x="535" y="96" class="sm" fill="#555">Exclusive hardware allocations</text>

  <!-- Node 0 -->
  <rect x="535" y="112" width="265" height="42" rx="3" class="green"/>
  <text x="545" y="130" class="b sm">Node 0: 8 × H100 SXM</text>
  <text x="545" y="146" class="sm">slurmd active · Exclusive allocation</text>

  <!-- Node 1 -->
  <rect x="535" y="162" width="265" height="42" rx="3" class="green"/>
  <text x="545" y="180" class="b sm">Node 1: 8 × H100 SXM</text>
  <text x="545" y="196" class="sm">slurmd active · Exclusive allocation</text>

  <!-- Node N-1 -->
  <rect x="535" y="212" width="265" height="48" rx="3" class="blue"/>
  <text x="545" y="230" class="b sm">Node 31: 8 × H100 SXM</text>
  <text x="545" y="246" class="sm">slurmd active · Multi-node step sync</text>

  <!-- Bottom Explanatory Box -->
  <rect x="25" y="284" width="790" height="52" rx="4" class="white"/>
  <text x="38" y="304" class="b sm">Why HPC Standardized on Slurm:</text>
  <text x="260" y="304" class="sm">Sub-millisecond launch latency, robust backfill scheduling,</text>
  <text x="38" y="322" class="sm">and deterministic hardware pinning across tens of thousands of GPUs without Kubernetes control-plane overhead.</text>
</svg>
