<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" width="740" height="380">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="740" height="380" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="370" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">Harness Brittleness: Same Frozen Weights, Different Reported Scores</text>
  <text x="370" y="44" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">Illustrative variation in MMLU accuracy across harness prompt formats and scoring protocols</text>

  <!-- Left: 4 Evaluation Levers -->
  <rect x="25" y="65" width="280" height="235" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.5"/>
  <text x="35" y="88" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333333">Evaluation Protocol Variables</text>
  <line x1="35" y1="98" x2="295" y2="98" stroke="#cccccc" stroke-width="1"/>

  <!-- Lever 1 -->
  <rect x="35" y="108" width="260" height="40" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
  <text x="45" y="124" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1d447a">1. Exemplar Count (Few-Shot)</text>
  <text x="45" y="138" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444444">0-shot vs 5-shot format demonstration</text>

  <!-- Lever 2 -->
  <rect x="35" y="155" width="260" height="40" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="45" y="171" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#274e13">2. Scoring Metric Mechanism</text>
  <text x="45" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444444">Logit choice vs text regex parsing</text>

  <!-- Lever 3 -->
  <rect x="35" y="202" width="260" height="40" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="45" y="218" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#8c6b00">3. Reasoning Strategy</text>
  <text x="45" y="232" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444444">Direct token vs Chain-of-Thought</text>

  <!-- Lever 4 -->
  <rect x="35" y="249" width="260" height="40" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="45" y="265" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5c2d91">4. Prompt &amp; Chat Templates</text>
  <text x="45" y="279" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444444">System prompt and delimiter syntax</text>

  <!-- Right: Score Impact Horizontal Bar Chart -->
  <rect x="330" y="65" width="385" height="235" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <text x="522" y="88" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">Reported Score (Frozen 8B Checkpoint)</text>
  <line x1="340" y1="98" x2="705" y2="98" stroke="#cccccc" stroke-width="1"/>

  <!-- Bar 1: 0-shot Generative -->
  <text x="345" y="122" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">0-shot Generative (regex)</text>
  <rect x="500" y="110" width="130" height="18" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
  <text x="640" y="123" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#990000">54.2%</text>

  <!-- Bar 2: 5-shot Generative -->
  <text x="345" y="157" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">5-shot Generative</text>
  <rect x="500" y="145" width="145" height="18" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
  <text x="655" y="158" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#b45f06">61.0%</text>

  <!-- Bar 3: 5-shot Logit Likelihood -->
  <text x="345" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">5-shot Logit Likelihood</text>
  <rect x="500" y="180" width="160" height="18" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
  <text x="670" y="193" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1d447a">66.4%</text>

  <!-- Bar 4: 5-shot CoT + System Prompt -->
  <text x="345" y="227" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">5-shot CoT + System</text>
  <rect x="500" y="215" width="175" height="18" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="685" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#274e13">72.8%</text>

  <!-- Spread Indicator -->
  <line x1="500" y1="248" x2="675" y2="248" stroke="#b85450" stroke-width="1.5"/>
  <line x1="500" y1="244" x2="500" y2="252" stroke="#b85450" stroke-width="1.5"/>
  <line x1="675" y1="244" x2="675" y2="252" stroke="#b85450" stroke-width="1.5"/>
  <text x="587" y="266" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b85450">18.6 percentage point spread</text>
  <text x="587" y="282" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">(Identical model weights across runs)</text>

  <!-- Bottom Takeaway -->
  <rect x="25" y="315" width="690" height="50" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="370" y="334" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#8c6b00">The Reproducibility Imperative</text>
  <text x="370" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444444">Never report raw benchmark scores without exact harness commit, prompt template,</text>
  <text x="370" y="367" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444444">few-shot exemplar count, and scoring function (e.g. logit likelihood vs generation parsing).</text>
</svg>