<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">Likelihood Displacement: The Hidden Failure Mode of DPO</text>
  <text x="25" y="48" class="sm" fill="#555">DPO minimizes loss by crushing rejected likelihoods while unintentionally depressing chosen likelihoods</text>

  <!-- Left: Schematic Trajectory Graph -->
  <rect x="25" y="65" width="460" height="260" rx="6" class="gray"/>
  <text x="255" y="88" text-anchor="middle" class="b">Absolute Log-Likelihood Dynamics During Training</text>

  <!-- Axes -->
  <line x1="75" y1="280" x2="455" y2="280" stroke="#000" stroke-width="1.5"/>
  <line x1="75" y1="280" x2="75" y2="105" stroke="#000" stroke-width="1.5"/>

  <text x="45" y="105" text-anchor="middle" class="sm b">log pi</text>
  <text x="75" y="298" class="sm">Step 0</text>
  <text x="255" y="298" class="sm">Mid Training</text>
  <text x="400" y="298" class="sm">Late Steps</text>

  <!-- Curve 1: Chosen log pi (Starts high, unexpectedly drops!) -->
  <path d="M 85 130 C 180 145, 280 165, 430 185" fill="none" stroke="#2d662d" stroke-width="3"/>
  <text x="170" y="145" class="sm b" fill="#2d662d">Chosen log pi(yw) drops!</text>

  <!-- Curve 2: Rejected log pi (Drops much faster!) -->
  <path d="M 85 160 C 180 200, 280 235, 430 265" fill="none" stroke="#b85450" stroke-width="3"/>
  <text x="170" y="255" class="sm b" fill="#b85450">Rejected log pi(yl) crashes</text>

  <!-- Margin annotation bracket inside graph -->
  <line x1="435" y1="185" x2="435" y2="265" stroke="#9673a6" stroke-width="2"/>
  <text x="420" y="215" text-anchor="end" class="sm b" fill="#6a3d9a">Delta grows</text>

  <!-- Right: Why It Happens & Mitigation -->
  <rect x="500" y="65" width="295" height="260" rx="6" class="gray"/>
  <text x="647" y="88" text-anchor="middle" class="b">Why Likelihood Displaces</text>

  <rect x="515" y="105" width="265" height="65" rx="4" class="red"/>
  <text x="525" y="123" class="b">Relative Margin Fallacy</text>
  <text x="525" y="141" class="sm">DPO only optimizes (yw - yl).</text>
  <text x="525" y="157" class="sm">Crushing yl is easier than boosting yw.</text>

  <rect x="515" y="180" width="265" height="65" rx="4" class="yellow"/>
  <text x="525" y="198" class="b">Consequence: Lower Fluency</text>
  <text x="525" y="216" class="sm">Model unlearns desirable phrasing;</text>
  <text x="525" y="232" class="sm">perplexity on reference text degrades.</text>

  <rect x="515" y="255" width="265" height="60" rx="4" class="green"/>
  <text x="525" y="273" class="b">The Fix: DPO + NLL Loss</text>
  <text x="525" y="291" class="sm">Add alpha * L_SFT(yw) to anchor the</text>
  <text x="525" y="307" class="sm">absolute likelihood of chosen responses.</text>
</svg>