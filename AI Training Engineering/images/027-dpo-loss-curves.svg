<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Left Chart: SFT Cross-Entropy Loss -->
  <rect x="35" y="30" width="345" height="260" rx="8" class="group"/>
  <text x="50" y="55" class="b">Stage 1: SFT Cross-Entropy Loss</text>
  <text x="50" y="72" class="sm gray">(Illustrative)</text>

  <!-- Axes -->
  <line x1="75" y1="240" x2="350" y2="240" stroke="#000" stroke-width="1.2"/>
  <line x1="75" y1="240" x2="75" y2="85" stroke="#000" stroke-width="1.2"/>

  <!-- Ticks and Labels -->
  <text x="40" y="95" class="sm">2.4</text>
  <text x="40" y="145" class="sm">1.8</text>
  <text x="40" y="195" class="sm">1.2</text>
  <text x="40" y="245" class="sm">0.6</text>
  <text x="75" y="258" class="sm">0</text>
  <text x="195" y="258" class="sm">1,000</text>
  <text x="320" y="258" class="sm">2,000</text>
  <text x="180" y="278" class="sm">Training Steps</text>

  <!-- Curve: Training Loss -->
  <path d="M75,95 Q140,165 200,190 T345,210" fill="none" stroke="#d79b00" stroke-width="2.5"/>
  <text x="235" y="175" class="sm b" fill="#d79b00">Train Loss</text>

  <!-- Curve: Validation Loss -->
  <path d="M75,105 Q145,175 210,198 T345,218" fill="none" stroke="#6c8ebf" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="245" y="232" class="sm b" fill="#6c8ebf">Val Loss</text>

  <!-- Right Chart: DPO Reward Margin & Accuracy -->
  <rect x="420" y="30" width="345" height="260" rx="8" class="group"/>
  <text x="435" y="55" class="b">Stage 2: DPO Reward Margin &amp; Accuracy</text>
  <text x="435" y="72" class="sm gray">(Illustrative)</text>

  <!-- Axes -->
  <line x1="460" y1="240" x2="735" y2="240" stroke="#000" stroke-width="1.2"/>
  <line x1="460" y1="240" x2="460" y2="85" stroke="#000" stroke-width="1.2"/>

  <!-- Ticks and Labels -->
  <text x="425" y="95" class="sm">+1.5</text>
  <text x="425" y="145" class="sm">+0.8</text>
  <text x="425" y="195" class="sm"> 0.0</text>
  <text x="425" y="245" class="sm">-0.5</text>
  <text x="460" y="258" class="sm">0</text>
  <text x="580" y="258" class="sm">500</text>
  <text x="700" y="258" class="sm">1,000</text>
  <text x="560" y="278" class="sm">DPO Steps</text>

  <!-- Curve: Implicit Reward Margin (Chosen - Rejected) -->
  <path d="M460,195 Q520,150 580,125 T730,100" fill="none" stroke="#82b366" stroke-width="2.5"/>
  <text x="590" y="112" class="sm b" fill="#82b366">Reward Margin (r_w - r_l)</text>

  <!-- Curve: Accuracy (% chosen > rejected) -->
  <path d="M460,210 Q530,170 600,150 T730,135" fill="none" stroke="#9673a6" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="615" y="160" class="sm b" fill="#9673a6">Accuracy (78%)</text>
</svg>
