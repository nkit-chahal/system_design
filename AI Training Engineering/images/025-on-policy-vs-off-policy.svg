<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="28" class="title">Data Distribution: Off-Policy vs On-Policy Preference Optimization</text>
  <text x="25" y="48" class="sm" fill="#555">Why iterative online sampling outperforms static offline datasets (Tajwar et al. 2024)</text>

  <!-- Left: Off-Policy Static Pairs -->
  <rect x="25" y="70" width="370" height="215" rx="6" class="gray"/>
  <rect x="35" y="80" width="350" height="30" rx="3" class="red"/>
  <text x="210" y="100" text-anchor="middle" class="b">Off-Policy Alignment (Static Pairs)</text>

  <text x="45" y="130" class="sm b">Pre-collected static pairs (x, yw, yl):</text>
  <text x="45" y="150" class="sm">• Generated by earlier checkpoint or external model</text>
  <text x="45" y="170" class="sm">• Policy drifts during training: pi_theta != pi_data</text>
  <text x="45" y="190" class="sm">• Penalizes errors the model would never generate</text>
  <text x="45" y="210" class="sm">• Fails to correct new edge-case mistakes</text>
  
  <rect x="45" y="228" width="330" height="42" rx="4" class="white"/>
  <text x="210" y="247" text-anchor="middle" class="sm b" fill="#b85450">Distribution Shift Limit</text>
  <text x="210" y="263" text-anchor="middle" class="sm">Plateaus early on out-of-distribution prompts</text>

  <!-- Right: On-Policy Iterative Pairs -->
  <rect x="425" y="70" width="370" height="215" rx="6" class="gray"/>
  <rect x="435" y="80" width="350" height="30" rx="3" class="green"/>
  <text x="610" y="100" text-anchor="middle" class="b">On-Policy Alignment (Iterative / Online)</text>

  <text x="445" y="130" class="sm b">Sampled dynamically from current pi_theta:</text>
  <text x="445" y="150" class="sm">• Policy generates fresh candidate responses y</text>
  <text x="445" y="170" class="sm">• Judged on-the-fly by reward model or LLM judge</text>
  <text x="445" y="190" class="sm">• Gradients target the exact current policy frontier</text>
  <text x="445" y="210" class="sm">• Mode-seeking gradient relocates probability mass faster</text>

  <rect x="445" y="228" width="330" height="42" rx="4" class="white"/>
  <text x="610" y="247" text-anchor="middle" class="sm b" fill="#2d662d">Higher Final Benchmark Win Rate</text>
  <text x="610" y="263" text-anchor="middle" class="sm">Trade-off: requires active rollout generation compute</text>

  <!-- Bottom Banner -->
  <rect x="25" y="295" width="770" height="42" rx="4" class="purple"/>
  <text x="410" y="321" text-anchor="middle" class="b">Engineering Trade-off: Offline DPO is fast and simple; Iterative DPO gives 5-15% higher win rates</text>
</svg>