<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}.mid{text-anchor:middle}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .axis{stroke:#000;stroke-width:1.2}
    .grid{stroke:#e0e0e0;stroke-width:1;stroke-dasharray:3 3}
    .curve1{fill:none;stroke:#1b3e6b;stroke-width:2.5}
    .curve2{fill:none;stroke:#d79b00;stroke-width:2.5}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="25" y="30" class="lg b">MinHash LSH S-Curve: Collision Probability vs Jaccard Similarity</text>
  <text x="25" y="52" class="sm" fill="#555">Analytical collision probability P = 1 − (1 − s^r)^b across different band and row partitions</text>

  <!-- Plot Area: x in [70, 430] (width 360), y in [90, 290] (height 200) -->
  <!-- Grid lines -->
  <line x1="70" y1="290" x2="430" y2="290" class="axis"/>
  <line x1="70" y1="90" x2="70" y2="290" class="axis"/>

  <line x1="70" y1="250" x2="430" y2="250" class="grid"/>
  <line x1="70" y1="210" x2="430" y2="210" class="grid"/>
  <line x1="70" y1="170" x2="430" y2="170" class="grid"/>
  <line x1="70" y1="130" x2="430" y2="130" class="grid"/>
  <line x1="70" y1="90" x2="430" y2="90" class="grid"/>

  <line x1="142" y1="90" x2="142" y2="290" class="grid"/>
  <line x1="214" y1="90" x2="214" y2="290" class="grid"/>
  <line x1="286" y1="90" x2="286" y2="290" class="grid"/>
  <line x1="358" y1="90" x2="358" y2="290" class="grid"/>
  <line x1="430" y1="90" x2="430" y2="290" class="grid"/>

  <!-- Y axis ticks and labels -->
  <text x="60" y="294" class="sm" text-anchor="end">0.0</text>
  <text x="60" y="254" class="sm" text-anchor="end">0.2</text>
  <text x="60" y="214" class="sm" text-anchor="end">0.4</text>
  <text x="60" y="174" class="sm" text-anchor="end">0.6</text>
  <text x="60" y="134" class="sm" text-anchor="end">0.8</text>
  <text x="60" y="94" class="sm" text-anchor="end">1.0</text>

  <!-- X axis ticks and labels -->
  <text x="70" y="310" class="sm mid">0.0</text>
  <text x="142" y="310" class="sm mid">0.2</text>
  <text x="214" y="310" class="sm mid">0.4</text>
  <text x="286" y="310" class="sm mid">0.6</text>
  <text x="358" y="310" class="sm mid">0.8</text>
  <text x="430" y="310" class="sm mid">1.0</text>

  <text x="250" y="335" class="b mid">Jaccard Similarity (s)</text>
  <text x="25" y="190" class="b mid" transform="rotate(-90 25 190)">Collision Prob P(s)</text>

  <!-- Curve 1: b=16, r=8 (Blue)
       s=0.0: 70, 290
       s=0.2: 142, 290
       s=0.4: 214, 288 (P=0.010)
       s=0.5: 250, 278 (P=0.061)
       s=0.6: 286, 243 (P=0.237)
       s=0.7: 322, 167 (P=0.613)
       s=0.8: 358, 101 (P=0.947)
       s=0.9: 394, 90  (P=1.000)
       s=1.0: 430, 90
  -->
  <path d="M 70 290 L 142 290 Q 214 290 232 284 T 286 243 T 322 167 T 358 101 T 430 90" class="curve1"/>

  <!-- Curve 2: b=20, r=5 (Orange)
       s=0.0: 70, 290
       s=0.2: 142, 289 (P=0.006)
       s=0.4: 214, 253 (P=0.186)
       s=0.5: 250, 196 (P=0.470)
       s=0.6: 286, 130 (P=0.802)
       s=0.7: 322, 95  (P=0.975)
       s=0.8: 358, 90  (P=1.000)
       s=1.0: 430, 90
  -->
  <path d="M 70 290 L 142 289 Q 178 280 214 253 T 250 196 T 286 130 T 322 95 T 430 90" class="curve2"/>

  <!-- Legend in plot -->
  <line x1="85" y1="110" x2="115" y2="110" class="curve1"/>
  <text x="122" y="114" class="sm b" fill="#1b3e6b">b=16, r=8 (s* ≈ 0.707)</text>

  <line x1="85" y1="130" x2="115" y2="130" class="curve2"/>
  <text x="122" y="134" class="sm b" fill="#b35900">b=20, r=5 (s* ≈ 0.549)</text>

  <!-- Right side: Worked Table and Explanation -->
  <rect x="460" y="80" width="335" height="255" rx="5" class="gray"/>
  <text x="627" y="105" class="b mid">Worked Collision Table (b=16, r=8)</text>

  <text x="475" y="132" class="sm b">Similarity (s)</text>
  <text x="580" y="132" class="sm b">Prob P(s)</text>
  <text x="680" y="132" class="sm b">Action</text>

  <line x1="475" y1="140" x2="780" y2="140" stroke="#bbb" stroke-width="1"/>

  <text x="475" y="160" class="sm">s = 0.20</text>
  <text x="580" y="160" class="sm">0.0000</text>
  <text x="680" y="160" class="sm" fill="#2d572c">Keep (No match)</text>

  <text x="475" y="182" class="sm">s = 0.40</text>
  <text x="580" y="182" class="sm">0.0104</text>
  <text x="680" y="182" class="sm" fill="#2d572c">Keep (1% match)</text>

  <text x="475" y="204" class="sm">s = 0.60</text>
  <text x="580" y="204" class="sm">0.2374</text>
  <text x="680" y="204" class="sm" fill="#b35900">Transition band</text>

  <text x="475" y="226" class="sm">s = 0.70</text>
  <text x="580" y="226" class="sm">0.6133</text>
  <text x="680" y="226" class="sm" fill="#b35900">Threshold zone</text>

  <text x="475" y="248" class="sm">s = 0.80</text>
  <text x="580" y="248" class="sm">0.9470</text>
  <text x="680" y="248" class="sm" fill="#900">Drop duplicate</text>

  <text x="475" y="270" class="sm">s = 0.90</text>
  <text x="580" y="270" class="sm">0.9999</text>
  <text x="680" y="270" class="sm" fill="#900">Drop duplicate</text>

  <text x="475" y="302" class="sm" fill="#555">Threshold formula: s* = (1 / b)^(1 / r) = (1/16)^(1/8) ≈ 0.707</text>
  <text x="475" y="322" class="sm" fill="#555">Documents with s &gt; 0.80 collide with &gt;94.7% probability.</text>
</svg>