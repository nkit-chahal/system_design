<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .b { font-weight: bold; }
    .title { font-size: 16px; font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .axis { stroke: #333; stroke-width: 1.5; }
    .grid { stroke: #eee; stroke-width: 1; }
    .bus-curve { stroke: #d79b00; stroke-width: 2.5; fill: none; }
    .alg-curve { stroke: #6c8ebf; stroke-width: 2.5; fill: none; }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="24" class="title">Algorithm Bandwidth vs Bus Bandwidth in nccl-tests (Illustrative)</text>
  <text x="25" y="42" class="sm" fill="#555">All-Reduce on 8 × H100 SXM (NVLink): Bus BW = 1.75 × Alg BW. Links saturate at ~380 GB/s above 64 MB.</text>

  <!-- Plot area -->
  <!-- Origin at (90, 270). Width 480, Height 200. Max Y = 400 GB/s at Y = 70 -->
  <!-- Horizontal grid lines -->
  <line x1="90" y1="270" x2="570" y2="270" class="axis"/>
  <line x1="90" y1="220" x2="570" y2="220" class="grid"/>
  <text x="80" y="224" text-anchor="end" class="sm">100</text>
  <line x1="90" y1="170" x2="570" y2="170" class="grid"/>
  <text x="80" y="174" text-anchor="end" class="sm">200</text>
  <line x1="90" y1="120" x2="570" y2="120" class="grid"/>
  <text x="80" y="124" text-anchor="end" class="sm">300</text>
  <line x1="90" y1="70" x2="570" y2="70" class="grid"/>
  <text x="80" y="74" text-anchor="end" class="sm">400</text>
  <text x="80" y="274" text-anchor="end" class="sm">0</text>

  <!-- Vertical axis -->
  <line x1="90" y1="70" x2="90" y2="270" class="axis"/>
  <text x="35" y="150" class="sm b" transform="rotate(-90 35 150)" text-anchor="middle">Bandwidth (GB/s)</text>

  <!-- X ticks (Log scale message sizes): 64KB, 512KB, 4MB, 32MB, 256MB, 1GB -->
  <!-- x positions: 90, 186, 282, 378, 474, 570 -->
  <line x1="186" y1="270" x2="186" y2="275" class="axis"/>
  <text x="186" y="290" text-anchor="middle" class="sm">512 KB</text>
  <line x1="282" y1="270" x2="282" y2="275" class="axis"/>
  <text x="282" y="290" text-anchor="middle" class="sm">4 MB</text>
  <line x1="378" y1="270" x2="378" y2="275" class="axis"/>
  <text x="378" y="290" text-anchor="middle" class="sm">32 MB</text>
  <line x1="474" y1="270" x2="474" y2="275" class="axis"/>
  <text x="474" y="290" text-anchor="middle" class="sm">256 MB</text>
  <line x1="570" y1="270" x2="570" y2="275" class="axis"/>
  <text x="570" y="290" text-anchor="middle" class="sm">1 GB</text>
  <text x="90" y="290" text-anchor="middle" class="sm">64 KB</text>
  <text x="330" y="310" text-anchor="middle" class="sm b">Message Buffer Size (S)</text>

  <!-- Curve: Bus Bandwidth (saturates near 380 GB/s -> y = 80) -->
  <!-- 64K: y=265; 512K: y=250; 4M: y=200; 32M: y=120; 64M: y=90; 256M: y=80; 1G: y=80 -->
  <path d="M90,265 C140,260 200,240 282,190 C330,150 378,95 440,82 L570,80" class="bus-curve"/>

  <!-- Curve: Algorithm Bandwidth (saturates near 380 / 1.75 = 217 GB/s -> y = 161) -->
  <path d="M90,267 C140,264 200,252 282,225 C330,200 378,172 440,163 L570,161" class="alg-curve"/>

  <!-- Annotations / Callouts on Graph -->
  <!-- Latency bound zone -->
  <rect x="92" y="75" width="130" height="48" rx="3" class="purple"/>
  <text x="157" y="93" text-anchor="middle" class="sm b">Latency-Bound</text>
  <text x="157" y="109" text-anchor="middle" class="sm">Kernel &amp; sync overhead</text>

  <!-- Bandwidth saturated zone -->
  <rect x="420" y="190" width="140" height="50" rx="3" class="green"/>
  <text x="490" y="208" text-anchor="middle" class="sm b">Bandwidth-Bound</text>
  <text x="490" y="224" text-anchor="middle" class="sm">Physical links full</text>

  <!-- Right side explanation panel -->
  <rect x="595" y="70" width="220" height="235" rx="5" class="gray"/>
  <text x="605" y="92" class="b sm">Reading nccl-tests:</text>
  <text x="605" y="112" class="sm"><tspan class="b" fill="#d79b00">Bus BW</tspan> (Orange Curve):</text>
  <text x="605" y="128" class="sm">• Normalized link utilization</text>
  <text x="605" y="144" class="sm">• Peak ≈ 380 GB/s on NVLink</text>
  <text x="605" y="160" class="sm">• Peak ≈ 43 GB/s on NDR IB</text>

  <text x="605" y="185" class="sm"><tspan class="b" fill="#6c8ebf">Alg BW</tspan> (Blue Curve):</text>
  <text x="605" y="201" class="sm">• Perceived data rate: S / time</text>
  <text x="605" y="217" class="sm">• For 8 GPUs: factor = 1.75</text>
  <text x="605" y="233" class="sm">• Alg BW = Bus BW / 1.75</text>

  <text x="605" y="258" class="sm b">Takeaway:</text>
  <text x="605" y="274" class="sm">Small tensors waste network.</text>
  <text x="605" y="290" class="sm">Bucket parameters to ≥ 32 MB.</text>

  <!-- Bottom illustrative note -->
  <text x="25" y="340" class="sm" fill="#555">Illustrative curves showing typical transition from latency overhead to link saturation as measured by all_reduce_perf.</text>
</svg>
