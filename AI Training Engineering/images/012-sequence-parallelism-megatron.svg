<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #000; }
    .sm { font-size: 12px; }
    .lg { font-size: 16px; }
    .b { font-weight: bold; }
    .orange { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.2; }
    .blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.2; }
    .green { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .purple { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.2; }
    .yellow { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.2; }
    .red { fill: #f8cecc; stroke: #b85450; stroke-width: 1.2; }
    .gray { fill: #f5f5f5; stroke: #666; stroke-width: 1.2; }
    .white { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .group { fill: none; stroke: #000; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .edge { fill: none; stroke: #000; stroke-width: 1.2; marker-end: url(#arrow); }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="410" y="24" text-anchor="middle" class="lg b">Megatron-LM Sequence Parallelism: Sharding Activations along Sequence Dimension</text>

  <!-- Left: Standard TP -->
  <rect x="30" y="45" width="365" height="225" rx="6" class="gray"/>
  <text x="212" y="68" text-anchor="middle" class="b">Standard Tensor Parallelism</text>

  <rect x="50" y="80" width="325" height="40" rx="3" class="red"/>
  <text x="212" y="98" text-anchor="middle" class="sm b">LayerNorm &amp; Dropout (Replicated)</text>
  <text x="212" y="114" text-anchor="middle" class="sm">Full sequence activations [s, b, h] duplicated on each GPU</text>

  <rect x="50" y="130" width="325" height="35" rx="3" class="orange"/>
  <text x="212" y="152" text-anchor="middle" class="sm">ColumnParallel Linear Projections</text>

  <rect x="50" y="175" width="325" height="35" rx="3" class="blue"/>
  <text x="212" y="197" text-anchor="middle" class="sm">RowParallel Linear Projection</text>

  <rect x="50" y="220" width="325" height="40" rx="3" class="purple"/>
  <text x="212" y="238" text-anchor="middle" class="sm b">All-Reduce (produces [s, b, h])</text>
  <text x="212" y="254" text-anchor="middle" class="sm">Traffic: 2 * (TP - 1) / TP * M</text>

  <!-- Right: Sequence Parallelism -->
  <rect x="425" y="45" width="365" height="225" rx="6" class="gray"/>
  <text x="607" y="68" text-anchor="middle" class="b">Megatron Sequence Parallelism (SP)</text>

  <rect x="445" y="80" width="325" height="40" rx="3" class="green"/>
  <text x="607" y="98" text-anchor="middle" class="sm b">LayerNorm &amp; Dropout (Sharded)</text>
  <text x="607" y="114" text-anchor="middle" class="sm">Sequence sharded [s / TP, b, h] -- cuts memory by TP!</text>

  <rect x="445" y="130" width="325" height="35" rx="3" class="purple"/>
  <text x="607" y="148" text-anchor="middle" class="sm b">All-Gather (fwd): [s/TP, b, h] --&gt; [s, b, h]</text>
  <text x="607" y="162" text-anchor="middle" class="sm">Traffic: (TP - 1) / TP * M</text>

  <rect x="445" y="175" width="325" height="35" rx="3" class="orange"/>
  <text x="607" y="197" text-anchor="middle" class="sm">Column &amp; Row Parallel Projections</text>

  <rect x="445" y="220" width="325" height="40" rx="3" class="purple"/>
  <text x="607" y="238" text-anchor="middle" class="sm b">Reduce-Scatter (fwd): [s, b, h] --&gt; [s/TP, b, h]</text>
  <text x="607" y="254" text-anchor="middle" class="sm">Traffic: (TP - 1) / TP * M</text>

  <!-- Bottom Callout -->
  <rect x="30" y="280" width="760" height="32" rx="4" class="yellow"/>
  <text x="410" y="301" text-anchor="middle" class="sm b">Total Communication: All-Gather + Reduce-Scatter = 2 * (TP-1)/TP * M (Identical traffic to All-Reduce, zero network penalty!)</text>
</svg>