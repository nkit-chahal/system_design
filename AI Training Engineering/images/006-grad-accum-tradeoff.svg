<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.title{font-size:16px;font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Title -->
  <text x="25" y="26" class="title">Physical Batch Size vs Gradient Accumulation</text>
  <text x="25" y="46" class="sm" fill="#555">Achieving identical effective batch size 8 with different peak activation footprints</text>

  <!-- Left: Case A - Physical Batch 8 -->
  <g transform="translate(25, 65)">
    <rect x="0" y="0" width="370" height="215" rx="6" class="gray"/>
    <text x="185" y="24" text-anchor="middle" class="b" fill="#b85450">Case A: Batch Size 8 (Grad Accum = 1)</text>
    <text x="185" y="42" text-anchor="middle" class="sm" fill="#555">Single forward/backward pass per optimizer update</text>

    <!-- Visual Box -->
    <rect x="25" y="55" width="320" height="42" rx="4" class="blue"/>
    <text x="185" y="80" text-anchor="middle" class="sm b">Physical Micro-Batch b = 8 (Act: 2,567 MB)</text>

    <!-- Breakdown -->
    <g transform="translate(25, 110)">
      <text x="0" y="16" class="sm"><tspan class="b">• Model &amp; Adam States:</tspan> 1,991 MB</text>
      <text x="0" y="34" class="sm"><tspan class="b">• Dynamic Activations:</tspan> 2,567 MB</text>
      <text x="0" y="52" class="sm"><tspan class="b">• Logits Projection:</tspan> 1,647 MB</text>
      <text x="0" y="70" class="sm b" fill="#900">• Peak Memory: 6.47 GB</text>
      <text x="0" y="90" class="sm" fill="#555">High arithmetic intensity; risks OOM on 6 GB / 8 GB cards</text>
    </g>
  </g>

  <!-- Right: Case B - Micro-batch 2 with Accum 4 -->
  <g transform="translate(425, 65)">
    <rect x="0" y="0" width="370" height="215" rx="6" class="gray"/>
    <text x="185" y="24" text-anchor="middle" class="b" fill="#274e13">Case B: Micro-Batch 2 (Grad Accum = 4)</text>
    <text x="185" y="42" text-anchor="middle" class="sm" fill="#555">4 consecutive micro-steps accumulate gradients locally</text>

    <!-- Visual 4 Micro-steps -->
    <g transform="translate(25, 55)">
      <rect x="0" y="0" width="72" height="42" rx="4" class="green"/>
      <text x="36" y="25" text-anchor="middle" class="sm b">u-Step 1</text>

      <rect x="80" y="0" width="72" height="42" rx="4" class="green"/>
      <text x="116" y="25" text-anchor="middle" class="sm b">u-Step 2</text>

      <rect x="160" y="0" width="72" height="42" rx="4" class="green"/>
      <text x="196" y="25" text-anchor="middle" class="sm b">u-Step 3</text>

      <rect x="240" y="0" width="80" height="42" rx="4" class="green"/>
      <text x="280" y="25" text-anchor="middle" class="sm b">u-Step 4</text>
    </g>

    <!-- Breakdown -->
    <g transform="translate(25, 110)">
      <text x="0" y="16" class="sm"><tspan class="b">• Model &amp; Adam States:</tspan> 1,991 MB (unchanged)</text>
      <text x="0" y="34" class="sm"><tspan class="b">• Dynamic Activations:</tspan> 642 MB (4x reduction!)</text>
      <text x="0" y="52" class="sm"><tspan class="b">• Logits Projection:</tspan> 412 MB (4x reduction!)</text>
      <text x="0" y="70" class="sm b" fill="#274e13">• Peak Memory: 3.31 GB (saves 3.16 GB!)</text>
      <text x="0" y="90" class="sm" fill="#555">Identical mathematical gradient update at 51% less VRAM</text>
    </g>
  </g>

  <!-- Bottom Annotation Bar -->
  <rect x="25" y="295" width="770" height="35" rx="4" class="white"/>
  <text x="35" y="317" class="sm"><tspan class="b">Core Principle:</tspan> Gradient accumulation cuts activation and logits memory linearly with micro-batch size without altering optimizer states.</text>
</svg>
