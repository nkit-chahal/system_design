<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .badge{fill:#000}
    .bt{fill:#fff;font-size:12px;font-weight:bold}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <rect x="10" y="10" width="530" height="330" rx="4" class="group"/>
  <text x="24" y="32" class="lg b">Region</text>
  <rect x="24" y="46" width="160" height="200" rx="4" class="group"/>
  <text x="36" y="66" class="b">Zone A</text>
  <rect x="36" y="80" width="136" height="120" rx="6" class="white"/>
  <text x="104" y="98" text-anchor="middle" class="sm">8-GPU node</text>
  <rect x="48" y="110" width="24" height="24" rx="3" class="red"/>
  <rect x="78" y="110" width="24" height="24" rx="3" class="orange"/>
  <rect x="108" y="110" width="24" height="24" rx="3" class="orange"/>
  <rect x="138" y="110" width="24" height="24" rx="3" class="orange"/>
  <rect x="48" y="142" width="24" height="24" rx="3" class="gray"/>
  <rect x="78" y="142" width="24" height="24" rx="3" class="gray"/>
  <rect x="108" y="142" width="24" height="24" rx="3" class="gray"/>
  <rect x="138" y="142" width="24" height="24" rx="3" class="gray"/>
  <text x="104" y="222" text-anchor="middle" class="sm">orange: 4 chat replicas</text>
  <text x="104" y="238" text-anchor="middle" class="sm">gray: batch work</text>
  <rect x="196" y="46" width="160" height="200" rx="4" class="group"/>
  <text x="208" y="66" class="b">Zone B</text>
  <rect x="208" y="80" width="136" height="120" rx="6" class="red"/>
  <text x="276" y="98" text-anchor="middle" class="sm">8-GPU node</text>
  <rect x="220" y="110" width="24" height="24" rx="3" class="orange"/>
  <rect x="250" y="110" width="24" height="24" rx="3" class="orange"/>
  <rect x="280" y="110" width="24" height="24" rx="3" class="orange"/>
  <rect x="310" y="110" width="24" height="24" rx="3" class="orange"/>
  <rect x="220" y="142" width="24" height="24" rx="3" class="gray"/>
  <rect x="250" y="142" width="24" height="24" rx="3" class="gray"/>
  <rect x="280" y="142" width="24" height="24" rx="3" class="gray"/>
  <rect x="310" y="142" width="24" height="24" rx="3" class="gray"/>
  <text x="276" y="222" text-anchor="middle" class="sm">orange: 4 chat replicas</text>
  <text x="276" y="238" text-anchor="middle" class="sm">gray: batch work</text>
  <rect x="368" y="46" width="160" height="200" rx="4" class="group"/>
  <text x="380" y="66" class="b">Zone C</text>
  <rect x="380" y="80" width="136" height="120" rx="6" class="white"/>
  <text x="448" y="98" text-anchor="middle" class="sm">8-GPU node</text>
  <rect x="392" y="110" width="24" height="24" rx="3" class="orange"/>
  <rect x="422" y="110" width="24" height="24" rx="3" class="orange"/>
  <rect x="452" y="110" width="24" height="24" rx="3" class="orange"/>
  <rect x="482" y="110" width="24" height="24" rx="3" class="orange"/>
  <rect x="392" y="142" width="24" height="24" rx="3" class="gray"/>
  <rect x="422" y="142" width="24" height="24" rx="3" class="gray"/>
  <rect x="452" y="142" width="24" height="24" rx="3" class="gray"/>
  <rect x="482" y="142" width="24" height="24" rx="3" class="gray"/>
  <text x="448" y="222" text-anchor="middle" class="sm">orange: 4 chat replicas</text>
  <text x="448" y="238" text-anchor="middle" class="sm">gray: batch work</text>
  <circle cx="60" cy="122" r="10" class="badge"/><text x="60" y="126" text-anchor="middle" class="bt">1</text>
  <circle cx="342" cy="80" r="10" class="badge"/><text x="342" y="84" text-anchor="middle" class="bt">2</text>
  <circle cx="518" cy="56" r="10" class="badge"/><text x="518" y="60" text-anchor="middle" class="bt">3</text>
  <circle cx="530" cy="20" r="10" class="badge"/><text x="530" y="24" text-anchor="middle" class="bt">4</text>
  <rect x="24" y="262" width="500" height="64" rx="6" class="purple"/>
  <text x="274" y="288" text-anchor="middle" class="b">A release: weights, tokenizer, engine, flags</text>
  <text x="274" y="308" text-anchor="middle" class="sm">reaches every replica in every zone unless it is rolled out gradually</text>
  <circle cx="36" cy="262" r="10" class="badge"/><text x="36" y="266" text-anchor="middle" class="bt">5</text>
  <rect x="560" y="12" width="290" height="58" rx="6" class="gray"/>
  <circle cx="578" cy="30" r="10" class="badge"/><text x="578" y="34" text-anchor="middle" class="bt">1</text>
  <text x="596" y="35" class="b">GPU fault</text><text x="840" y="35" text-anchor="end" class="sm">1 replica lost</text>
  <text x="596" y="56" class="sm">Defense: health checks, prober, N+1</text>
  <rect x="560" y="78" width="290" height="58" rx="6" class="gray"/>
  <circle cx="578" cy="96" r="10" class="badge"/><text x="578" y="100" text-anchor="middle" class="bt">2</text>
  <text x="596" y="101" class="b">Node failure</text><text x="840" y="101" text-anchor="end" class="sm">up to 8 replicas lost</text>
  <text x="596" y="122" class="sm">Defense: spread replicas over nodes</text>
  <rect x="560" y="144" width="290" height="58" rx="6" class="gray"/>
  <circle cx="578" cy="162" r="10" class="badge"/><text x="578" y="166" text-anchor="middle" class="bt">3</text>
  <text x="596" y="167" class="b">Zone outage</text><text x="840" y="167" text-anchor="end" class="sm">a third of the fleet</text>
  <text x="596" y="188" class="sm">Defense: one node per zone</text>
  <rect x="560" y="210" width="290" height="58" rx="6" class="gray"/>
  <circle cx="578" cy="228" r="10" class="badge"/><text x="578" y="232" text-anchor="middle" class="bt">4</text>
  <text x="596" y="233" class="b">Region outage</text><text x="840" y="233" text-anchor="end" class="sm">the whole fleet</text>
  <text x="596" y="254" class="sm">Defense: second region or fallback API</text>
  <rect x="560" y="276" width="290" height="58" rx="6" class="gray"/>
  <circle cx="578" cy="294" r="10" class="badge"/><text x="578" y="298" text-anchor="middle" class="bt">5</text>
  <text x="596" y="299" class="b">Bad release</text><text x="840" y="299" text-anchor="end" class="sm">every replica at once</text>
  <text x="596" y="320" class="sm">Defense: canary, gates, rollback</text>
  <rect x="24" y="226" width="0" height="0"/>
  </svg>
