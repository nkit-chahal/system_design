<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .p50{fill:none;stroke:#6c8ebf;stroke-width:2}
    .p95{fill:none;stroke:#b85450;stroke-width:2;stroke-dasharray:7 5}
    .d50{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.5}
    .d95{fill:#f8cecc;stroke:#b85450;stroke-width:1.5}
    .tick{stroke:#000;stroke-width:1}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Legend -->
  <path d="M80,14 L114,14" class="p50"/><circle cx="97" cy="14" r="4" class="d50"/>
  <text x="122" y="18" class="sm">p50 TTFT</text>
  <path d="M200,14 L234,14" class="p95"/><rect x="213" y="10" width="8" height="8" class="d95"/>
  <text x="242" y="18" class="sm">p95 TTFT</text>
  <text x="330" y="18" class="sm">Both panels are illustrative shapes, not measurements.</text>

  <!-- Panel 1 -->
  <text x="210" y="46" text-anchor="middle" class="b">Engine batches every request</text>
  <path d="M80,60 L80,260 L340,260" class="axis"/>
  <text transform="translate(66,160) rotate(-90)" text-anchor="middle" class="sm">TTFT</text>
  <path d="M100,260 L100,264 M175,260 L175,264 M250,260 L250,264 M325,260 L325,264" class="tick"/>
  <text x="100" y="278" text-anchor="middle" class="sm">1</text>
  <text x="175" y="278" text-anchor="middle" class="sm">4</text>
  <text x="250" y="278" text-anchor="middle" class="sm">16</text>
  <text x="325" y="278" text-anchor="middle" class="sm">64</text>
  <text x="210" y="296" text-anchor="middle" class="sm">concurrent requests (log scale)</text>
  <polyline points="100,235 175,228 250,212 325,180" class="p50"/>
  <circle cx="100" cy="235" r="4" class="d50"/><circle cx="175" cy="228" r="4" class="d50"/>
  <circle cx="250" cy="212" r="4" class="d50"/><circle cx="325" cy="180" r="4" class="d50"/>
  <polyline points="100,229 175,214 250,184 325,118" class="p95"/>
  <rect x="96" y="225" width="8" height="8" class="d95"/><rect x="171" y="210" width="8" height="8" class="d95"/>
  <rect x="246" y="180" width="8" height="8" class="d95"/><rect x="321" y="114" width="8" height="8" class="d95"/>
  <text x="96" y="98" class="sm">p95 pulls away: a new prompt</text>
  <text x="96" y="114" class="sm">shares each step with up to 63</text>
  <text x="96" y="130" class="sm">other requests and their prefills</text>

  <!-- Panel 2 -->
  <text x="630" y="46" text-anchor="middle" class="b">Server capped at 4 parallel requests</text>
  <path d="M500,60 L500,260 L760,260" class="axis"/>
  <text transform="translate(486,160) rotate(-90)" text-anchor="middle" class="sm">TTFT</text>
  <path d="M520,260 L520,264 M595,260 L595,264 M670,260 L670,264 M745,260 L745,264" class="tick"/>
  <text x="520" y="278" text-anchor="middle" class="sm">1</text>
  <text x="595" y="278" text-anchor="middle" class="sm">4</text>
  <text x="670" y="278" text-anchor="middle" class="sm">16</text>
  <text x="745" y="278" text-anchor="middle" class="sm">64</text>
  <text x="630" y="296" text-anchor="middle" class="sm">concurrent requests (log scale)</text>
  <path d="M595,70 L595,260" stroke="#666" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="590" y="82" text-anchor="end" class="sm">parallel limit</text>
  <polyline points="520,235 595,228 670,150 745,78" class="p50"/>
  <circle cx="520" cy="235" r="4" class="d50"/><circle cx="595" cy="228" r="4" class="d50"/>
  <circle cx="670" cy="150" r="4" class="d50"/><circle cx="745" cy="78" r="4" class="d50"/>
  <polyline points="520,229 595,214 670,122 745,64" class="p95"/>
  <rect x="516" y="225" width="8" height="8" class="d95"/><rect x="591" y="210" width="8" height="8" class="d95"/>
  <rect x="666" y="118" width="8" height="8" class="d95"/><rect x="741" y="60" width="8" height="8" class="d95"/>
  <text x="700" y="222" text-anchor="middle" class="sm">requests beyond 4</text>
  <text x="700" y="238" text-anchor="middle" class="sm">wait in a queue</text>

  <text x="16" y="320" class="sm">Ollama's default OLLAMA_NUM_PARALLEL is 1, so without changing it the queue starts at the second concurrent request.</text>
</svg>
