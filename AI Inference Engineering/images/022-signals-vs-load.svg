  <polyline points="520.0,288.0 549.1,285.6 578.2,277.6 607.3,260.0 650.9,236.0 694.5,208.0 738.2,172.0 767.3,136.0 787.6,100.0 799.3,60.0" fill="none" stroke="#d79b00" stroke-width="2.8"/>
  <line x1="520" y1="260.0" x2="840" y2="260.0" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="525.8" y="254.0" class="sm">SLO: 500 ms</text>
  <text x="688.7" y="194.0" class="sm" text-anchor="end">p95 TTFT</text>
  <text x="240.0" y="340" text-anchor="middle" class="sm">offered load (requests/min to one replica)</text>
  <text x="680.0" y="340" text-anchor="middle" class="sm">offered load (requests/min to one replica)</text>
  <text x="16" y="388" class="sm">Illustrative shapes for one H100 replica serving Llama 3.1 8B chat requests (about 10.6 s each, so 300 requests/min ≈ 53 in flight).</text>
