<svg xmlns="http://www.w3.org/2000/svg" width="820" height="256" viewBox="0 0 820 256" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}.it{font-style:italic}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .line{fill:none;stroke:#000;stroke-width:1.2}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .grid{fill:none;stroke:#e6e6e6;stroke-width:1}
    .dash{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:6 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="20" y="22" class="b">GPU time that belongs to one request (one H100, Llama 3.1 8B)</text>
  <text x="20" y="50" class="b">Short answer</text>
  <text x="20" y="66" class="sm">100 output tokens</text>
  <rect x="150" y="36" width="292.5" height="34" class="orange"/>
  <text x="296.25" y="58" text-anchor="middle">prefill 65.0 ms</text>
  <rect x="442.5" y="36" width="51.75" height="34" class="blue"/>
  <text x="468.375" y="58" text-anchor="middle" class="sm">11.5</text>
  <text x="150" y="88" class="sm">w = 76.4 ms of GPU time per request → saturates at 1 ÷ 76.4 ms = 13.1 req/s</text>
  <text x="20" y="126" class="b">Streamed chat</text>
  <text x="20" y="142" class="sm">500 output tokens</text>
  <rect x="150" y="112" width="292.5" height="34" class="orange"/>
  <text x="296.25" y="134" text-anchor="middle">prefill 65.0 ms</text>
  <rect x="442.5" y="112" width="283.05" height="34" class="blue"/>
  <text x="584.025" y="134" text-anchor="middle" class="sm">KV reads: 500 × 0.126 ms = 62.9 ms</text>
  <text x="150" y="164" class="sm">w = 127.8 ms of GPU time per request → saturates at 1 ÷ 127.8 ms = 7.8 req/s</text>
  <text x="500.25" y="58" class="sm">← KV reads: 100 × 0.115 ms</text>
  <rect x="150" y="192" width="560" height="50" rx="6" class="gray"/>
  <text x="430" y="213" text-anchor="middle">Shared by the whole batch: each decode step reads 16.06 GB of weights</text>
  <text x="430" y="231" text-anchor="middle">in 6.85 ms (70% of 3.35 TB/s). This sets the floor of TPOT.</text>
</svg>
