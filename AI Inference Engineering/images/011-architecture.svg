<svg xmlns="http://www.w3.org/2000/svg" width="840" height="372" viewBox="0 0 840 372" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .both{fill:none;stroke:#000;stroke-width:1.2;marker-start:url(#arrow);marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Client -->
  <rect x="12" y="66" width="80" height="204" rx="6" class="white"/>
  <text x="52" y="164" text-anchor="middle">Client</text>
  <text x="52" y="184" text-anchor="middle" class="sm">OpenAI SDK</text>

  <!-- trtllm-serve process -->
  <rect x="116" y="30" width="200" height="290" rx="4" class="group"/>
  <text x="126" y="52" class="b">trtllm-serve process</text>
  <rect x="130" y="66" width="172" height="44" rx="6" class="gray"/>
  <text x="216" y="84" text-anchor="middle">HTTP server</text>
  <text x="216" y="102" text-anchor="middle" class="sm">OpenAI-compatible API</text>
  <rect x="130" y="146" width="172" height="44" rx="6" class="gray"/>
  <text x="216" y="164" text-anchor="middle">LLM API</text>
  <text x="216" y="182" text-anchor="middle" class="sm">tokenize, detokenize</text>
  <rect x="130" y="226" width="172" height="44" rx="6" class="gray"/>
  <text x="216" y="244" text-anchor="middle">Executor proxy</text>
  <text x="216" y="262" text-anchor="middle" class="sm">IPC to the workers</text>
  <path d="M216,112 L216,144" class="both"/>
  <path d="M216,192 L216,224" class="both"/>

  <!-- Worker process -->
  <rect x="356" y="30" width="472" height="290" rx="4" class="group"/>
  <text x="366" y="52" class="b">Worker process for GPU rank 0: the PyExecutor loop</text>
  <rect x="370" y="72" width="110" height="46" rx="6" class="purple"/>
  <text x="425" y="91" text-anchor="middle">Request</text>
  <text x="425" y="109" text-anchor="middle" class="sm">queue</text>
  <rect x="500" y="72" width="150" height="46" rx="6" class="orange"/>
  <text x="575" y="91" text-anchor="middle">Schedulers</text>
  <text x="575" y="109" text-anchor="middle" class="sm">capacity, micro-batch</text>
  <rect x="670" y="72" width="144" height="46" rx="6" class="blue"/>
  <text x="742" y="91" text-anchor="middle">KV cache manager</text>
  <text x="742" y="109" text-anchor="middle" class="sm">32-token blocks</text>
  <rect x="670" y="160" width="144" height="46" rx="6" class="orange"/>
  <text x="742" y="179" text-anchor="middle">Model engine</text>
  <text x="742" y="197" text-anchor="middle" class="sm">kernels, CUDA graphs</text>
  <rect x="500" y="160" width="150" height="46" rx="6" class="orange"/>
  <text x="575" y="179" text-anchor="middle">Sampler</text>
  <text x="575" y="197" text-anchor="middle" class="sm">next token</text>
  <rect x="370" y="160" width="110" height="46" rx="6" class="gray"/>
  <text x="425" y="179" text-anchor="middle">Responses</text>
  <text x="425" y="197" text-anchor="middle" class="sm">tokens out</text>
  <path d="M480,95 L498,95" class="edge"/>
  <path d="M650,95 L668,95" class="edge"/>
  <path d="M742,118 L742,158" class="edge"/>
  <path d="M670,183 L652,183" class="edge"/>
  <path d="M500,183 L482,183" class="edge"/>
  <rect x="370" y="236" width="444" height="52" rx="6" class="gray" stroke-dasharray="5 4"/>
  <text x="592" y="257" text-anchor="middle" class="sm">Ranks 1 to N-1 run the same loop on their own GPUs;</text>
  <text x="592" y="275" text-anchor="middle" class="sm">tensor-parallel ranks exchange activations over NCCL</text>
  <text x="592" y="308" text-anchor="middle" class="sm">workers are started with MPI by default, or with Ray</text>

  <!-- Request path -->
  <path d="M92,88 L128,88" class="both"/>
  <path d="M302,248 L336,248 L336,95 L368,95" class="edge"/>
  <rect x="322" y="164" width="28" height="14" fill="#fff"/>
  <text x="336" y="175" text-anchor="middle" class="sm">IPC</text>
  <path d="M370,183 L346,183 L346,262 L304,262" class="edge"/>

  <!-- Step numbers -->
  <circle cx="110" cy="72" r="8" class="purple"/><text x="110" y="76" text-anchor="middle" class="sm b">1</text>
  <circle cx="232" cy="128" r="8" class="purple"/><text x="232" y="132" text-anchor="middle" class="sm b">2</text>
  <circle cx="346" cy="140" r="8" class="purple"/><text x="346" y="144" text-anchor="middle" class="sm b">3</text>
  <circle cx="490" cy="138" r="8" class="purple"/><text x="490" y="142" text-anchor="middle" class="sm b">4</text>
  <circle cx="110" cy="106" r="8" class="purple"/><text x="110" y="110" text-anchor="middle" class="sm b">5</text>

  <!-- Legend -->
  <rect x="12" y="344" width="20" height="14" rx="3" class="orange"/><text x="40" y="356" class="sm">scheduling and GPU work</text>
  <rect x="204" y="344" width="20" height="14" rx="3" class="blue"/><text x="232" y="356" class="sm">KV cache memory</text>
  <rect x="356" y="344" width="20" height="14" rx="3" class="gray"/><text x="384" y="356" class="sm">CPU-side processing</text>
  <circle cx="530" cy="351" r="8" class="purple"/><text x="546" y="356" class="sm">order of the request path</text>
</svg>
