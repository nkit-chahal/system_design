<svg xmlns="http://www.w3.org/2000/svg" width="820" height="304" viewBox="0 0 820 304" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .unused{fill:url(#hatch);stroke:#999;stroke-width:1}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Scale: 780 px = 8,192 tokens (about 10.5 tokens per px) -->
  <text x="16" y="26" class="b">Default budget: 8,192 tokens per step (vllm serve on an H100)</text>
  <rect x="16" y="40" width="5" height="40" class="purple"/>
  <rect x="21" y="40" width="96" height="40" class="orange"/><text x="69" y="65" text-anchor="middle" class="sm">1,008</text>
  <rect x="117" y="40" width="96" height="40" class="orange"/><text x="165" y="65" text-anchor="middle" class="sm">1,008</text>
  <rect x="213" y="40" width="96" height="40" class="orange"/><text x="261" y="65" text-anchor="middle" class="sm">1,008</text>
  <rect x="309" y="40" width="96" height="40" class="orange"/><text x="357" y="65" text-anchor="middle" class="sm">1,008</text>
  <rect x="405" y="40" width="96" height="40" class="orange"/><text x="453" y="65" text-anchor="middle" class="sm">1,008</text>
  <rect x="501" y="40" width="96" height="40" class="orange"/><text x="549" y="65" text-anchor="middle" class="sm">1,008</text>
  <rect x="597" y="40" width="96" height="40" class="orange"/><text x="645" y="65" text-anchor="middle" class="sm">1,008</text>
  <rect x="693" y="40" width="96" height="40" class="orange"/><text x="741" y="65" text-anchor="middle" class="sm">1,008</text>
  <rect x="789" y="40" width="7" height="40" class="unused"/>
  <path d="M18,80 L18,94" stroke="#000"/>
  <text x="16" y="108" class="sm">50 decode tokens</text>
  <path d="M793,80 L793,94" stroke="#000"/>
  <text x="796" y="108" text-anchor="end" class="sm">78 unused</text>
  <text x="408" y="108" text-anchor="middle" class="sm">8 new prompts × 1,008 uncached tokens = 8,064</text>
  <rect x="16" y="118" width="520" height="28" rx="4" class="red"/>
  <text x="26" y="137">Compute floor ≥ 2 × 8.03B × 8,192 ÷ 989 TFLOPS ≈ <tspan class="b">133 ms</tspan> per step</text>

  <line x1="16" y1="164" x2="804" y2="164" stroke="#999" stroke-dasharray="5 4"/>

  <text x="16" y="190" class="b">Budget lowered to 2,048 tokens per step (same scale)</text>
  <rect x="16" y="204" width="5" height="40" class="purple"/>
  <rect x="21" y="204" width="96" height="40" class="orange"/><text x="69" y="229" text-anchor="middle" class="sm">1,008</text>
  <rect x="117" y="204" width="94" height="40" class="orange" stroke-dasharray="4 3"/><text x="164" y="229" text-anchor="middle" class="sm">990</text>
  <path d="M18,244 L18,258" stroke="#000"/>
  <text x="16" y="272" class="sm">50 decode tokens</text>
  <text x="122" y="272" class="sm">one prompt, then 990 tokens of the next</text>
  <rect x="236" y="208" width="404" height="28" rx="4" class="green"/>
  <text x="246" y="227">Compute floor ≥ 2 × 8.03B × 2,048 ÷ 989 TFLOPS ≈ <tspan class="b">33 ms</tspan></text>

  <rect x="16" y="282" width="16" height="12" class="purple"/><text x="38" y="293" class="sm">decode (1 token per user)</text>
  <rect x="210" y="282" width="16" height="12" class="orange"/><text x="232" y="293" class="sm">prompt (prefill) chunk</text>
  <rect x="390" y="282" width="16" height="12" class="unused"/><text x="412" y="293" class="sm">unused budget</text>
  <text x="804" y="293" text-anchor="end" class="sm">Scale: 1 px ≈ 10.5 tokens</text>
</svg>
