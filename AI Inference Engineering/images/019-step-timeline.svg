  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Scenario labels -->
  <text x="16" y="52" class="b">A: eager mode</text>
  <text x="16" y="70" class="sm">no CUDA graphs</text>
  <text x="16" y="86" class="sm">≈ 7.5 ms per step</text>
  <text x="16" y="132" class="b">B: CUDA graphs</text>
  <text x="16" y="150" class="sm">one launch per step</text>
  <text x="16" y="166" class="sm">≈ 6.2 ms per step</text>
  <text x="16" y="212" class="b">C: graphs + async</text>
  <text x="16" y="230" class="sm">CPU runs a step ahead</text>
  <text x="16" y="246" class="sm">≈ 4.1 ms per step</text>

