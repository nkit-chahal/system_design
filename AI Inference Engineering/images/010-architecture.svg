<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .both{fill:none;stroke:#000;stroke-width:1.2;marker-start:url(#arrow);marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Client -->
  <rect x="12" y="60" width="80" height="210" rx="6" class="white"/>
  <text x="52" y="160" text-anchor="middle">Client</text>
  <text x="52" y="180" text-anchor="middle" class="sm">OpenAI SDK</text>

  <!-- Main process -->
  <rect x="116" y="30" width="190" height="270" rx="4" class="group"/>
  <text x="126" y="52" class="b">Main process</text>
  <rect x="128" y="72" width="166" height="46" rx="6" class="gray"/>
  <text x="211" y="91" text-anchor="middle">HTTP server</text>
  <text x="211" y="109" text-anchor="middle" class="sm">OpenAI API, /generate</text>
  <rect x="128" y="212" width="166" height="46" rx="6" class="gray"/>
  <text x="211" y="231" text-anchor="middle">TokenizerManager</text>
  <text x="211" y="249" text-anchor="middle" class="sm">tokenize; stream out</text>

  <!-- Scheduler process -->
  <rect x="366" y="30" width="220" height="270" rx="4" class="group"/>
  <text x="376" y="52" class="b">Scheduler process</text>
  <rect x="380" y="72" width="192" height="46" rx="6" class="orange"/>
  <text x="476" y="91" text-anchor="middle">Scheduler</text>
  <text x="476" y="109" text-anchor="middle" class="sm">batching, admission policy</text>
  <rect x="404" y="142" width="168" height="46" rx="6" class="blue"/>
  <text x="488" y="161" text-anchor="middle">Radix cache</text>
  <text x="488" y="179" text-anchor="middle" class="sm">tree of cached prefixes</text>
  <rect x="380" y="212" width="192" height="46" rx="6" class="orange"/>
  <text x="476" y="231" text-anchor="middle">Model worker</text>
  <text x="476" y="249" text-anchor="middle" class="sm">forward pass on the GPU</text>
  <path d="M488,120 L488,140" class="both"/>
  <path d="M488,190 L488,210" class="both"/>
  <path d="M392,118 L392,210" class="edge"/>
  <text x="476" y="286" text-anchor="middle" class="sm">one per GPU rank</text>

  <!-- Detokenizer process -->
  <rect x="626" y="30" width="202" height="270" rx="4" class="group"/>
  <text x="636" y="52" class="b">Detokenizer process</text>
  <rect x="640" y="142" width="174" height="46" rx="6" class="gray"/>
  <text x="727" y="161" text-anchor="middle">DetokenizerManager</text>
  <text x="727" y="179" text-anchor="middle" class="sm">token IDs to text</text>

  <!-- Request path -->
  <path d="M92,95 L126,95" class="edge"/>
  <path d="M211,118 L211,210" class="edge"/>
  <path d="M294,235 L336,235 L336,95 L378,95" class="edge"/>
  <rect x="322" y="152" width="28" height="14" fill="#fff"/>
  <text x="336" y="163" text-anchor="middle" class="sm">ZMQ</text>
  <path d="M572,235 L606,235 L606,165 L638,165" class="edge"/>
  <rect x="592" y="192" width="28" height="14" fill="#fff"/>
  <text x="606" y="203" text-anchor="middle" class="sm">ZMQ</text>
  <path d="M727,188 L727,320 L211,320 L211,260" class="edge"/>
  <text x="470" y="338" text-anchor="middle" class="sm">text back over ZMQ</text>
  <path d="M128,235 L94,235" class="edge"/>

  <!-- Step numbers -->
  <circle cx="104" cy="80" r="8" class="purple"/><text x="104" y="84" text-anchor="middle" class="sm b">1</text>
  <circle cx="226" cy="164" r="8" class="purple"/><text x="226" y="168" text-anchor="middle" class="sm b">2</text>
  <circle cx="321" cy="252" r="8" class="purple"/><text x="321" y="256" text-anchor="middle" class="sm b">3</text>
  <circle cx="606" cy="252" r="8" class="purple"/><text x="606" y="256" text-anchor="middle" class="sm b">4</text>
  <circle cx="104" cy="252" r="8" class="purple"/><text x="104" y="256" text-anchor="middle" class="sm b">5</text>

  <!-- Legend -->
  <rect x="12" y="354" width="20" height="14" rx="3" class="orange"/><text x="40" y="366" class="sm">scheduling and GPU work</text>
  <rect x="204" y="354" width="20" height="14" rx="3" class="blue"/><text x="232" y="366" class="sm">radix cache (KV memory)</text>
  <rect x="406" y="354" width="20" height="14" rx="3" class="gray"/><text x="434" y="366" class="sm">CPU-side processing</text>
  <circle cx="586" cy="361" r="8" class="purple"/><text x="602" y="366" class="sm">order of the request path</text>
</svg>
