<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .mono{font-family:Consolas, Menlo, monospace;font-size:14px}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="16" y="26">Output so far:</text>
  <rect x="120" y="10" width="330" height="24" rx="4" class="blue"/>
  <text x="128" y="27" class="mono">{"category": "billing", "priority": </text>
  <text x="470" y="26">Schema: priority ∈ {1, 2, 3, 4}</text>

  <!-- Header -->
  <text x="30" y="70" class="b">token</text>
  <text x="170" y="70" class="b" text-anchor="middle">logit</text>
  <text x="270" y="70" class="b" text-anchor="middle">mask</text>
  <text x="380" y="70" class="b" text-anchor="middle">masked logit</text>
  <text x="500" y="70" class="b" text-anchor="middle">probability</text>
  <line x1="20" y1="80" x2="560" y2="80" stroke="#999"/>

  <!-- Rows: y step 34 -->
  <rect x="20" y="88" width="540" height="28" class="red"/>
  <text x="30" y="107" class="mono">"</text><text x="170" y="107" text-anchor="middle">2.1</text><text x="270" y="107" text-anchor="middle">blocked</text><text x="380" y="107" text-anchor="middle">−∞</text><text x="500" y="107" text-anchor="middle">0</text>
  <rect x="20" y="122" width="540" height="28" class="green"/>
  <text x="30" y="141" class="mono">3</text><text x="170" y="141" text-anchor="middle">1.8</text><text x="270" y="141" text-anchor="middle">allowed</text><text x="380" y="141" text-anchor="middle">1.8</text><text x="500" y="141" text-anchor="middle" class="b">0.65</text>
  <rect x="20" y="156" width="540" height="28" class="red"/>
  <text x="30" y="175" class="mono">high</text><text x="170" y="175" text-anchor="middle">1.5</text><text x="270" y="175" text-anchor="middle">blocked</text><text x="380" y="175" text-anchor="middle">−∞</text><text x="500" y="175" text-anchor="middle">0</text>
  <rect x="20" y="190" width="540" height="28" class="green"/>
  <text x="30" y="209" class="mono">2</text><text x="170" y="209" text-anchor="middle">1.2</text><text x="270" y="209" text-anchor="middle">allowed</text><text x="380" y="209" text-anchor="middle">1.2</text><text x="500" y="209" text-anchor="middle" class="b">0.35</text>
  <rect x="20" y="224" width="540" height="28" class="red"/>
  <text x="30" y="243" class="mono">5</text><text x="170" y="243" text-anchor="middle">0.9</text><text x="270" y="243" text-anchor="middle">blocked</text><text x="380" y="243" text-anchor="middle">−∞</text><text x="500" y="243" text-anchor="middle">0</text>
  <rect x="20" y="258" width="540" height="28" class="red"/>
  <text x="30" y="277" class="mono">null</text><text x="170" y="277" text-anchor="middle">0.4</text><text x="270" y="277" text-anchor="middle">blocked</text><text x="380" y="277" text-anchor="middle">−∞</text><text x="500" y="277" text-anchor="middle">0</text>

  <!-- Right: sample and advance -->
  <path d="M560,136 L608,136" class="edge"/>
  <rect x="610" y="110" width="190" height="52" rx="6" class="orange"/>
  <text x="705" y="132" text-anchor="middle" class="b">sample → "3"</text>
  <text x="705" y="151" text-anchor="middle" class="sm">softmax over allowed tokens</text>
  <path d="M705,162 L705,198" class="edge"/>
  <rect x="610" y="200" width="190" height="52" rx="6" class="gray"/>
  <text x="705" y="222" text-anchor="middle" class="b">grammar advances</text>
  <text x="705" y="241" text-anchor="middle" class="sm">next: "," or "}" only</text>

  <text x="20" y="314" class="sm">Six of Llama 3.1's 128,256 tokens shown; logits are illustrative. e^1.8 ÷ (e^1.8 + e^1.2) ≈ 0.65.</text>
</svg>
