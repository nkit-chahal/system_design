<svg xmlns="http://www.w3.org/2000/svg" width="820" height="240" viewBox="0 0 820 240" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}.it{font-style:italic}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .line{fill:none;stroke:#000;stroke-width:1.2}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .grid{fill:none;stroke:#e6e6e6;stroke-width:1}
    .dash{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:6 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="20" y="28" class="b">Short answers (2 s end-to-end)</text>
  <rect x="20" y="40" width="130" height="56" rx="6" class="purple"/>
  <text x="85" y="64" text-anchor="middle">λ = 16.7 req/s</text>
  <text x="85" y="82" text-anchor="middle" class="sm">arrival rate</text>
  <text x="165" y="74" text-anchor="middle" class="lg">×</text>
  <rect x="180" y="40" width="190" height="56" rx="6" class="gray"/>
  <text x="275" y="64" text-anchor="middle">W ≈ 1.1 s</text>
  <text x="275" y="82" text-anchor="middle" class="sm">0.1 s + 100 tokens × 10 ms</text>
  <text x="385" y="74" text-anchor="middle" class="lg">=</text>
  <rect x="400" y="40" width="160" height="56" rx="6" class="orange"/>
  <text x="480" y="64" text-anchor="middle">L ≈ 18</text>
  <text x="480" y="82" text-anchor="middle" class="sm">requests in flight</text>
  <path d="M560,68 L588,68" class="edge"/>
  <rect x="590" y="40" width="210" height="56" rx="6" class="green"/>
  <text x="695" y="64" text-anchor="middle">KV cache ≈ 4.6 GiB</text>
  <text x="695" y="82" text-anchor="middle" class="sm">9% of one H100's cache</text>
  <text x="20" y="128" class="b">Streamed chat (2 s TTFT)</text>
  <rect x="20" y="140" width="130" height="56" rx="6" class="purple"/>
  <text x="85" y="164" text-anchor="middle">λ = 16.7 req/s</text>
  <text x="85" y="182" text-anchor="middle" class="sm">arrival rate</text>
  <text x="165" y="174" text-anchor="middle" class="lg">×</text>
  <rect x="180" y="140" width="190" height="56" rx="6" class="gray"/>
  <text x="275" y="164" text-anchor="middle">W ≈ 12.6 s</text>
  <text x="275" y="182" text-anchor="middle" class="sm">0.1 s + 500 tokens × 25 ms</text>
  <text x="385" y="174" text-anchor="middle" class="lg">=</text>
  <rect x="400" y="140" width="160" height="56" rx="6" class="orange"/>
  <text x="480" y="164" text-anchor="middle">L ≈ 210</text>
  <text x="480" y="182" text-anchor="middle" class="sm">requests in flight</text>
  <path d="M560,168 L588,168" class="edge"/>
  <rect x="590" y="140" width="210" height="56" rx="6" class="red"/>
  <text x="695" y="164" text-anchor="middle">KV cache ≈ 58 GiB</text>
  <text x="695" y="182" text-anchor="middle" class="sm">1.1 H100s' worth of cache</text>
  <text x="410" y="226" text-anchor="middle" class="sm">Same arrival rate, 11 times the concurrency. KV at 128 KiB per token; 52 GiB of cache per H100.</text>
</svg>
