<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .axis{stroke:#000;stroke-width:1.2}
    .grid{stroke:#ccc;stroke-width:1;stroke-dasharray:4 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="16" y="26" class="b">KV cache held by one request (Llama 3.1 8B, BF16, 128 KiB per token)</text>

  <!-- scale: 0.1 px per MiB, bars start at x=260 -->
  <line x1="260" y1="44" x2="260" y2="214" class="axis"/>
  <line x1="460" y1="44" x2="460" y2="214" class="grid"/>
  <line x1="660" y1="44" x2="660" y2="214" class="grid"/>
  <line x1="260" y1="214" x2="700" y2="214" class="axis"/>
  <text x="260" y="232" text-anchor="middle" class="sm">0</text>
  <text x="460" y="232" text-anchor="middle" class="sm">2,000 MiB</text>
  <text x="660" y="232" text-anchor="middle" class="sm">4,000 MiB</text>

  <!-- Short question -->
  <text x="16" y="70" class="b">Short question</text>
  <text x="16" y="88" class="sm">100 prompt + 50 output tokens</text>
  <rect x="260" y="60" width="2" height="30" class="blue"/>
  <text x="272" y="80" class="sm">≈ 19 MiB · prefill ≈ 3 ms</text>

  <!-- Chat turn -->
  <text x="16" y="124" class="b">Chat turn</text>
  <text x="16" y="142" class="sm">2,000 prompt + 500 output tokens</text>
  <rect x="260" y="114" width="31" height="30" class="blue"/>
  <text x="301" y="134" class="sm">≈ 313 MiB · prefill ≈ 65 ms</text>

  <!-- Document question -->
  <text x="16" y="178" class="b">Document question</text>
  <text x="16" y="196" class="sm">30,000 prompt + 2,000 output</text>
  <rect x="260" y="168" width="400" height="30" class="red"/>
  <text x="272" y="188" class="sm">≈ 3.9 GiB of KV cache · prefill ≈ 1 s</text>

  <text x="16" y="262">One document request holds as much cache as 13 chat turns or 213 short questions.</text>
  <text x="16" y="281" class="sm">Prefill times assume about 30,800 prompt tokens per second on one H100 (half of its peak BF16 throughput).</text>
</svg>
