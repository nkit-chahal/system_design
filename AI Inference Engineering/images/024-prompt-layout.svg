<svg xmlns="http://www.w3.org/2000/svg" width="860" height="270" viewBox="0 0 860 270" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
    <pattern id="redhatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#e0a8a6" stroke-width="3"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .dedge{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4;marker-end:url(#arrow)}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .tick{stroke:#000;stroke-width:1}
    .grid{stroke:#e3e3e3;stroke-width:1}
    .guide{stroke:#666;stroke-width:1;stroke-dasharray:5 4;fill:none}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="66" class="b">Dynamic first</text>
  <rect x="150.0" y="46" width="5.6" height="32" class="red"/>
  <rect x="155.6" y="46" width="168.0" height="32" class="orange"/>
  <text x="239.6" y="66.5" text-anchor="middle" class="sm">instructions</text>
  <rect x="323.6" y="46" width="140.0" height="32" class="orange"/>
  <text x="393.6" y="66.5" text-anchor="middle" class="sm">tool definitions</text>
  <rect x="463.6" y="46" width="112.0" height="32" class="orange"/>
  <text x="519.6" y="66.5" text-anchor="middle" class="sm">few-shot examples</text>
  <rect x="575.6" y="46" width="134.4" height="32" class="orange"/>
  <text x="642.8" y="66.5" text-anchor="middle" class="sm">user message</text>
  <path d="M153,44 L153,30" stroke="#000" stroke-width="1"/>
  <text x="150" y="26" class="sm">"Now: 2026-10-23 14:02:17. User: Priya." (20 tokens)</text>
  <text x="725" y="66" class="sm b">0 tokens cached</text>
  <text x="150" y="98" class="sm">Block 0 differs for every request, so every hash after it differs too.</text>
  <text x="16" y="156" class="b">Static first</text>
  <rect x="150.0" y="136" width="168.0" height="32" class="blue"/>
  <text x="234.0" y="156.5" text-anchor="middle" class="sm">instructions</text>
  <rect x="318.0" y="136" width="140.0" height="32" class="blue"/>
  <text x="388.0" y="156.5" text-anchor="middle" class="sm">tool definitions</text>
  <rect x="458.0" y="136" width="112.0" height="32" class="blue"/>
  <text x="514.0" y="156.5" text-anchor="middle" class="sm">few-shot examples</text>
  <rect x="570.0" y="136" width="5.6" height="32" class="red"/>
  <rect x="575.6" y="136" width="134.4" height="32" class="orange"/>
  <text x="642.8" y="156.5" text-anchor="middle" class="sm">user message</text>
  <path d="M573.0,170 L573.0,186" stroke="#000" stroke-width="1"/>
  <text x="568.0" y="200" class="sm">time and user name moved into the user turn</text>
  <text x="725" y="156" class="sm b">1,488 tokens cached</text>
  <text x="150" y="226" class="sm">The 1,500-token system prompt is identical for every user of the tenant: 93 full blocks match.</text>
  <rect x="150" y="244" width="16" height="12" class="blue"/><text x="172" y="255" class="sm">reused from cache</text>
  <rect x="300" y="244" width="16" height="12" class="orange"/><text x="322" y="255" class="sm">computed</text>
  <rect x="410" y="244" width="16" height="12" class="red"/><text x="432" y="255" class="sm">changes on every request</text>
</svg>
