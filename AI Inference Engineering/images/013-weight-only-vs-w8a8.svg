<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Lane 1: weight-only -->
  <text x="16" y="24" class="b">Weight-only (W4A16)</text>
  <rect x="16" y="40" width="160" height="48" rx="6" class="blue"/>
  <text x="96" y="60" text-anchor="middle">4-bit weights</text>
  <text x="96" y="78" text-anchor="middle" class="sm">+ group scales (HBM)</text>
  <path d="M176,64 L214,64" class="edge"/>
  <rect x="216" y="40" width="180" height="48" rx="6" class="orange"/>
  <text x="306" y="60" text-anchor="middle">convert to BF16</text>
  <text x="306" y="78" text-anchor="middle" class="sm">inside registers</text>
  <path d="M396,64 L434,64" class="edge"/>
  <rect x="436" y="40" width="170" height="48" rx="6" class="gray"/>
  <text x="521" y="60" text-anchor="middle">BF16 matmul</text>
  <text x="521" y="78" text-anchor="middle" class="sm">H100: 989 TFLOPS peak</text>
  <path d="M606,64 L644,64" class="edge"/>
  <rect x="646" y="40" width="170" height="48" rx="6" class="green"/>
  <text x="731" y="69" text-anchor="middle">BF16 output</text>

  <rect x="16" y="100" width="160" height="40" rx="6" class="purple"/>
  <text x="96" y="125" text-anchor="middle">BF16 activations</text>
  <path d="M176,120 L521,120 L521,90" class="edge"/>

  <text x="16" y="166">Reads about 4× fewer weight bytes per step, but the arithmetic still runs at BF16 speed.</text>

  <line x1="16" y1="184" x2="824" y2="184" stroke="#999" stroke-dasharray="5 4"/>

  <!-- Lane 2: W8A8 FP8 -->
  <text x="16" y="212" class="b">Weights and activations (W8A8 FP8)</text>
  <rect x="16" y="228" width="160" height="48" rx="6" class="blue"/>
  <text x="96" y="248" text-anchor="middle">FP8 weights</text>
  <text x="96" y="266" text-anchor="middle" class="sm">+ channel scales (HBM)</text>
  <path d="M176,252 L434,252" class="edge"/>
  <rect x="436" y="228" width="170" height="48" rx="6" class="orange"/>
  <text x="521" y="248" text-anchor="middle">FP8 matmul</text>
  <text x="521" y="266" text-anchor="middle" class="sm">H100: 1,979 TFLOPS peak</text>
  <path d="M606,252 L644,252" class="edge"/>
  <rect x="646" y="228" width="170" height="48" rx="6" class="green"/>
  <text x="731" y="248" text-anchor="middle">rescale by s_w × s_x</text>
  <text x="731" y="266" text-anchor="middle" class="sm">→ BF16 output</text>

  <rect x="16" y="290" width="160" height="44" rx="6" class="purple"/>
  <text x="96" y="317" text-anchor="middle">BF16 activations</text>
  <path d="M176,312 L214,312" class="edge"/>
  <rect x="216" y="290" width="180" height="44" rx="6" class="orange"/>
  <text x="306" y="308" text-anchor="middle">quantize per token</text>
  <text x="306" y="325" text-anchor="middle" class="sm">to FP8, scale s_x at run time</text>
  <path d="M396,312 L521,312 L521,278" class="edge"/>

  <text x="16" y="364">Reads 2× fewer weight bytes per step and runs the arithmetic at twice the BF16 rate.</text>
</svg>
