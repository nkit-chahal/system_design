<svg xmlns="http://www.w3.org/2000/svg" width="840" height="345" viewBox="0 0 840 345" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="40" y="28" class="b">One second of H100 time at 5 requests per second (2,000 input + 500 output tokens each)</text>

  <!-- 760 px = 1 s -->
  <rect x="40" y="44" width="237.5" height="60" class="orange"/>
  <text x="158.75" y="69" text-anchor="middle" class="b">prefill: 0.31 s</text>
  <text x="158.75" y="89" text-anchor="middle">10,000 input tokens</text>
  <rect x="277.5" y="44" width="522.5" height="60" class="blue"/>
  <text x="538.75" y="69" text-anchor="middle" class="b">decode: 0.69 s</text>
  <text x="538.75" y="89" text-anchor="middle">2,500 output tokens</text>

  <path d="M158.75,104 L158.75,148" class="edge"/>
  <path d="M538.75,104 L538.75,148" class="edge"/>

  <rect x="40" y="150" width="300" height="96" rx="6" class="orange"/>
  <text x="190" y="174" text-anchor="middle">$0.94 of each $3.00 GPU-hour</text>
  <text x="190" y="196" text-anchor="middle">÷ 36M input tokens per hour</text>
  <text x="190" y="226" text-anchor="middle" class="b">= $0.026 per 1M input tokens</text>

  <rect x="389" y="150" width="300" height="96" rx="6" class="blue"/>
  <text x="539" y="174" text-anchor="middle">$2.06 of each $3.00 GPU-hour</text>
  <text x="539" y="196" text-anchor="middle">÷ 9M output tokens per hour</text>
  <text x="539" y="226" text-anchor="middle" class="b">= $0.23 per 1M output tokens</text>

  <text x="40" y="280">An output token uses about 275 µs of GPU time and an input token about 31 µs: roughly 9× more.</text>
  <text x="40" y="304">Per request: 2,000 × $0.026 + 500 × $0.23 per 1M ≈ $0.000052 + $0.000115 = $0.000167.</text>
  <text x="40" y="330" class="sm">Prefill share uses Lesson 19's example prefill speed: 10,000 ÷ 32,000 prompt tokens/s = 31% of GPU time. GPU price is an assumption.</text>
</svg>
