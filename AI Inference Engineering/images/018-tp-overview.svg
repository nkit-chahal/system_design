<svg xmlns="http://www.w3.org/2000/svg" width="820" height="304" viewBox="0 0 820 304" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.lg{font-size:16px}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .both{fill:none;stroke:#000;stroke-width:1.2;marker-start:url(#arrow);marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- One GPU -->
  <rect x="10" y="10" width="270" height="284" rx="4" class="group"/>
  <text x="145" y="36" text-anchor="middle" class="lg b">One H100 (80 GB)</text>
  <rect x="50" y="52" width="190" height="156" rx="6" class="white"/>
  <rect x="65" y="64" width="160" height="24" class="orange"/>
  <text x="145" y="81" text-anchor="middle" class="sm">layer 1 (all of it)</text>
  <rect x="65" y="96" width="160" height="24" class="orange"/>
  <text x="145" y="113" text-anchor="middle" class="sm">layer 2 (all of it)</text>
  <text x="145" y="145" text-anchor="middle" class="b">…</text>
  <rect x="65" y="166" width="160" height="24" class="orange"/>
  <text x="145" y="183" text-anchor="middle" class="sm">layer 80 (all of it)</text>
  <rect x="40" y="226" width="210" height="50" rx="6" class="red"/>
  <text x="145" y="247" text-anchor="middle">needs 141 GB of weights</text>
  <text x="145" y="266" text-anchor="middle" class="b">does not fit</text>

  <!-- Tensor parallel -->
  <rect x="296" y="10" width="514" height="284" rx="4" class="group"/>
  <text x="553" y="36" text-anchor="middle" class="lg b">Tensor parallelism, TP = 4</text>

  <rect x="312" y="52" width="114" height="156" rx="6" class="white"/>
  <text x="369" y="70" text-anchor="middle" class="sm b">GPU 0 · 35 GB</text>
  <rect x="322" y="80" width="94" height="22" class="orange"/><text x="369" y="96" text-anchor="middle" class="sm">¼ of layer 1</text>
  <rect x="322" y="110" width="94" height="22" class="orange"/><text x="369" y="126" text-anchor="middle" class="sm">¼ of layer 2</text>
  <text x="369" y="156" text-anchor="middle" class="b">…</text>
  <rect x="322" y="174" width="94" height="22" class="orange"/><text x="369" y="190" text-anchor="middle" class="sm">¼ of layer 80</text>

  <rect x="436" y="52" width="114" height="156" rx="6" class="white"/>
  <text x="493" y="70" text-anchor="middle" class="sm b">GPU 1 · 35 GB</text>
  <rect x="446" y="80" width="94" height="22" class="orange"/><text x="493" y="96" text-anchor="middle" class="sm">¼ of layer 1</text>
  <rect x="446" y="110" width="94" height="22" class="orange"/><text x="493" y="126" text-anchor="middle" class="sm">¼ of layer 2</text>
  <text x="493" y="156" text-anchor="middle" class="b">…</text>
  <rect x="446" y="174" width="94" height="22" class="orange"/><text x="493" y="190" text-anchor="middle" class="sm">¼ of layer 80</text>

  <rect x="560" y="52" width="114" height="156" rx="6" class="white"/>
  <text x="617" y="70" text-anchor="middle" class="sm b">GPU 2 · 35 GB</text>
  <rect x="570" y="80" width="94" height="22" class="orange"/><text x="617" y="96" text-anchor="middle" class="sm">¼ of layer 1</text>
  <rect x="570" y="110" width="94" height="22" class="orange"/><text x="617" y="126" text-anchor="middle" class="sm">¼ of layer 2</text>
  <text x="617" y="156" text-anchor="middle" class="b">…</text>
  <rect x="570" y="174" width="94" height="22" class="orange"/><text x="617" y="190" text-anchor="middle" class="sm">¼ of layer 80</text>

  <rect x="684" y="52" width="114" height="156" rx="6" class="white"/>
  <text x="741" y="70" text-anchor="middle" class="sm b">GPU 3 · 35 GB</text>
  <rect x="694" y="80" width="94" height="22" class="orange"/><text x="741" y="96" text-anchor="middle" class="sm">¼ of layer 1</text>
  <rect x="694" y="110" width="94" height="22" class="orange"/><text x="741" y="126" text-anchor="middle" class="sm">¼ of layer 2</text>
  <text x="741" y="156" text-anchor="middle" class="b">…</text>
  <rect x="694" y="174" width="94" height="22" class="orange"/><text x="741" y="190" text-anchor="middle" class="sm">¼ of layer 80</text>

  <path d="M369,210 V242" class="both"/>
  <path d="M493,210 V242" class="both"/>
  <path d="M617,210 V242" class="both"/>
  <path d="M741,210 V242" class="both"/>
  <rect x="312" y="244" width="486" height="38" rx="6" class="purple"/>
  <text x="555" y="262" text-anchor="middle">NVLink: two all-reduces per layer combine</text>
  <text x="555" y="277" text-anchor="middle" class="sm">the partial results, so every GPU works on the same token</text>
</svg>
