<svg xmlns="http://www.w3.org/2000/svg" width="820" height="318" viewBox="0 0 820 318" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .wait{fill:url(#hatch);stroke:#999;stroke-width:1}
    .barrier{stroke:#000;stroke-width:1;stroke-dasharray:4 3}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="10" y="22" class="b">One transformer layer on four GPUs (TP = 4): compute, all-reduce, compute, all-reduce</text>

  <text x="200" y="48" text-anchor="middle" class="sm b">attention (own heads)</text>
  <text x="330" y="48" text-anchor="middle" class="sm b">all-reduce 1</text>
  <text x="485" y="48" text-anchor="middle" class="sm b">MLP (own columns)</text>
  <text x="640" y="48" text-anchor="middle" class="sm b">all-reduce 2</text>
  <text x="730" y="48" text-anchor="middle" class="sm b">next layer</text>

  <!-- barriers -->
  <line x1="300" y1="54" x2="300" y2="200" class="barrier"/>
  <line x1="610" y1="54" x2="610" y2="200" class="barrier"/>

  <!-- GPU 0 -->
  <text x="20" y="79" class="sm b">GPU 0</text>
  <rect x="100" y="60" width="186" height="28" class="orange"/>
  <rect x="286" y="60" width="14" height="28" class="wait"/>
  <rect x="300" y="60" width="60" height="28" class="purple"/>
  <rect x="360" y="60" width="244" height="28" class="orange"/>
  <rect x="604" y="60" width="6" height="28" class="wait"/>
  <rect x="610" y="60" width="60" height="28" class="purple"/>
  <rect x="670" y="60" width="120" height="28" class="gray"/>
  <!-- GPU 1 -->
  <text x="20" y="115" class="sm b">GPU 1</text>
  <rect x="100" y="96" width="192" height="28" class="orange"/>
  <rect x="292" y="96" width="8" height="28" class="wait"/>
  <rect x="300" y="96" width="60" height="28" class="purple"/>
  <rect x="360" y="96" width="250" height="28" class="orange"/>
  <rect x="610" y="96" width="60" height="28" class="purple"/>
  <rect x="670" y="96" width="120" height="28" class="gray"/>
  <!-- GPU 2 -->
  <text x="20" y="151" class="sm b">GPU 2</text>
  <rect x="100" y="132" width="200" height="28" class="orange"/>
  <rect x="300" y="132" width="60" height="28" class="purple"/>
  <rect x="360" y="132" width="240" height="28" class="orange"/>
  <rect x="600" y="132" width="10" height="28" class="wait"/>
  <rect x="610" y="132" width="60" height="28" class="purple"/>
  <rect x="670" y="132" width="120" height="28" class="gray"/>
  <!-- GPU 3 -->
  <text x="20" y="187" class="sm b">GPU 3</text>
  <rect x="100" y="168" width="190" height="28" class="orange"/>
  <rect x="290" y="168" width="10" height="28" class="wait"/>
  <rect x="300" y="168" width="60" height="28" class="purple"/>
  <rect x="360" y="168" width="246" height="28" class="orange"/>
  <rect x="606" y="168" width="4" height="28" class="wait"/>
  <rect x="610" y="168" width="60" height="28" class="purple"/>
  <rect x="670" y="168" width="120" height="28" class="gray"/>

  <path d="M100,214 H790" class="edge"/>
  <text x="796" y="218" class="sm">time</text>

  <!-- what moves -->
  <rect x="120" y="232" width="670" height="74" rx="6" class="white"/>
  <text x="134" y="254">Each all-reduce adds up a T × 8,192 BF16 tensor: <tspan class="b">16 KiB per token</tspan>.</text>
  <text x="134" y="274">A ring all-reduce makes every GPU send and receive 2(N − 1)/N of that, 1.5× for N = 4.</text>
  <text x="134" y="294">Llama 3.1 70B has 80 layers, so one forward pass runs <tspan class="b">160 all-reduces</tspan>.</text>

  <!-- legend -->
  <rect x="20" y="236" width="16" height="12" class="orange"/><text x="42" y="247" class="sm">compute</text>
  <rect x="20" y="256" width="16" height="12" class="purple"/><text x="42" y="267" class="sm">all-reduce</text>
  <rect x="20" y="276" width="16" height="12" class="wait"/><text x="42" y="287" class="sm">waiting</text>
</svg>
