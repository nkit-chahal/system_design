<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .axis{stroke:#000;stroke-width:1.2}
    .bad{fill:#b85450}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <!-- x(t) = 80 + 350 * minutes -->

  <!-- Fixed window -->
  <text x="16" y="26" class="b">Fixed window: at most 100 requests per calendar minute</text>
  <rect x="80" y="40" width="350" height="72" class="group"/>
  <rect x="430" y="40" width="350" height="72" class="group"/>
  <text x="90" y="58" class="sm">window 1 count: 100, allowed</text>
  <text x="440" y="58" class="sm">window 2 count: 100, allowed</text>
  <rect x="371.7" y="72" width="58.3" height="30" class="purple"/>
  <text x="400.8" y="92" text-anchor="middle" class="sm">100</text>
  <rect x="430" y="72" width="58.3" height="30" class="purple"/>
  <text x="459.2" y="92" text-anchor="middle" class="sm">100</text>
  <text x="500" y="92" class="sm b bad">200 requests in 20 s: twice the limit</text>
  <line x1="80" y1="124" x2="780" y2="124" class="axis"/>
  <g class="sm" text-anchor="middle">
    <line x1="80" y1="120" x2="80" y2="128" class="axis"/><text x="80" y="142">0:00</text>
    <line x1="255" y1="120" x2="255" y2="128" class="axis"/><text x="255" y="142">0:30</text>
    <line x1="430" y1="120" x2="430" y2="128" class="axis"/><text x="430" y="142">1:00</text>
    <line x1="605" y1="120" x2="605" y2="128" class="axis"/><text x="605" y="142">1:30</text>
    <line x1="780" y1="120" x2="780" y2="128" class="axis"/><text x="780" y="142">2:00</text>
  </g>

  <!-- Sliding window -->
  <text x="16" y="184" class="b">Sliding window: at most 100 requests in any 60 seconds</text>
  <rect x="138.3" y="198" width="350" height="72" class="group"/>
  <text x="148" y="216" class="sm">the 60 s before 1:10 already hold 100</text>
  <rect x="371.7" y="230" width="58.3" height="30" class="green"/>
  <text x="400.8" y="250" text-anchor="middle" class="sm">100</text>
  <rect x="430" y="230" width="58.3" height="30" class="red"/>
  <text x="459.2" y="250" text-anchor="middle" class="sm">100</text>
  <text x="500" y="250" class="sm b bad">second burst rejected with 429</text>
  <line x1="80" y1="282" x2="780" y2="282" class="axis"/>
  <g class="sm" text-anchor="middle">
    <line x1="80" y1="278" x2="80" y2="286" class="axis"/><text x="80" y="300">0:00</text>
    <line x1="255" y1="278" x2="255" y2="286" class="axis"/><text x="255" y="300">0:30</text>
    <line x1="430" y1="278" x2="430" y2="286" class="axis"/><text x="430" y="300">1:00</text>
    <line x1="605" y1="278" x2="605" y2="286" class="axis"/><text x="605" y="300">1:30</text>
    <line x1="780" y1="278" x2="780" y2="286" class="axis"/><text x="780" y="300">2:00</text>
  </g>

  <rect x="80" y="316" width="16" height="12" class="purple"/><text x="102" y="327" class="sm">burst of requests</text>
  <rect x="230" y="316" width="16" height="12" class="green"/><text x="252" y="327" class="sm">admitted</text>
  <rect x="330" y="316" width="16" height="12" class="red"/><text x="352" y="327" class="sm">rejected</text>
</svg>
