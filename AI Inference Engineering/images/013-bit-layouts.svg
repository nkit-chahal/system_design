  <rect x="324" y="318" width="18" height="14" class="yellow"/><text x="350" y="330" class="sm">integer bits</text>
  <text x="16" y="358">NVFP4 = FP4 E2M1 values + one FP8 (E4M3) scale per 16 values + one FP32 scale per tensor: ≈ 4.5 bits per value.</text>
  <text x="16" y="378">MXFP4 = FP4 E2M1 values + one power-of-two (E8M0) scale per 32 values: ≈ 4.25 bits per value.</text>
