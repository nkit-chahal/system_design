  <text x="554" y="100">max 65,504</text>
  <text x="16" y="132" class="b">FP8 E4M3</text><text x="16" y="147" class="sm">8 bits</text>
  <rect x="150" y="120" width="24" height="26" class="gray"/><text x="162" y="138" text-anchor="middle" class="sm">S</text>
  <rect x="174" y="120" width="24" height="26" class="blue"/><text x="186" y="138" text-anchor="middle" class="sm">E</text>
