  <rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="24" class="b">One cell per bit. Exponent bits buy range; mantissa bits buy precision.</text>
  <text x="16" y="56" class="b">BF16</text><text x="16" y="71" class="sm">16 bits</text>
  <rect x="150" y="44" width="24" height="26" class="gray"/><text x="162" y="62" text-anchor="middle" class="sm">S</text>
