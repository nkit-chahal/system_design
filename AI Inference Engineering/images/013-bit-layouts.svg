  <text x="554" y="62">range of FP32 (max ≈ 3.4 × 10³⁸)</text>
  <text x="16" y="94" class="b">FP16</text><text x="16" y="109" class="sm">16 bits</text>
  <rect x="150" y="82" width="24" height="26" class="gray"/><text x="162" y="100" text-anchor="middle" class="sm">S</text>
