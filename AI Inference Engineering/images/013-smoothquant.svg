  <path d="M432,130 L486,130" class="edge"/>
  <text x="459" y="120" text-anchor="middle" class="b">smooth</text>
  <text x="459" y="150" text-anchor="middle" class="sm">α = 0.5</text>
  <text x="20" y="252">Y = X W = (X diag(s)⁻¹)(diag(s) W),  with  s_j = √(max|X_j| / max|W_j|), for example √(40 / 0.4) = 10.</text>
  <text x="20" y="274" class="sm">Illustrative values. All four charts share the same vertical scale (0 to 40).</text>
</svg>
