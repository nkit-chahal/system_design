<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .on{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .off{fill:#fff;stroke:#999;stroke-width:1}
    .k{fill:#ffe6cc;stroke:#d79b00;stroke-width:1}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Panel A -->
  <rect x="10" y="10" width="404" height="300" rx="4" class="group"/>
  <text x="212" y="36" text-anchor="middle" class="lg b">Small decode kernels (batch 1)</text>
  <text x="26" y="66" class="sm">132 SMs in 12 groups of 11; shaded = busy during a typical kernel</text>
  <g>
    <rect x="26" y="78" width="26" height="26" class="on"/><rect x="58" y="78" width="26" height="26" class="on"/><rect x="90" y="78" width="26" height="26" class="on"/>
    <rect x="122" y="78" width="26" height="26" class="off"/><rect x="154" y="78" width="26" height="26" class="off"/><rect x="186" y="78" width="26" height="26" class="off"/>
    <rect x="218" y="78" width="26" height="26" class="off"/><rect x="250" y="78" width="26" height="26" class="off"/><rect x="282" y="78" width="26" height="26" class="off"/>
    <rect x="314" y="78" width="26" height="26" class="off"/><rect x="346" y="78" width="26" height="26" class="off"/><rect x="378" y="78" width="26" height="26" class="off"/>
  </g>
  <text x="26" y="140" class="sm">One second of the GPU timeline: some kernel is always running</text>
  <g>
    <rect x="26" y="150" width="30" height="24" class="k"/><rect x="58" y="150" width="22" height="24" class="k"/><rect x="82" y="150" width="34" height="24" class="k"/><rect x="118" y="150" width="26" height="24" class="k"/><rect x="146" y="150" width="30" height="24" class="k"/><rect x="178" y="150" width="20" height="24" class="k"/><rect x="200" y="150" width="34" height="24" class="k"/><rect x="236" y="150" width="28" height="24" class="k"/><rect x="266" y="150" width="24" height="24" class="k"/><rect x="292" y="150" width="32" height="24" class="k"/><rect x="326" y="150" width="26" height="24" class="k"/><rect x="354" y="150" width="22" height="24" class="k"/><rect x="378" y="150" width="26" height="24" class="k"/>
  </g>
  <rect x="26" y="200" width="378" height="44" rx="6" class="red"/>
  <text x="215" y="218" text-anchor="middle">GPU_UTIL = 100%</text>
  <text x="215" y="236" text-anchor="middle" class="b">SM_ACTIVE ≈ 0.25</text>
  <text x="215" y="274" text-anchor="middle" class="sm">"Busy", but three quarters of the SMs sit idle</text>

  <!-- Panel B -->
  <rect x="426" y="10" width="404" height="300" rx="4" class="group"/>
  <text x="628" y="36" text-anchor="middle" class="lg b">Large batch</text>
  <text x="442" y="66" class="sm">132 SMs in 12 groups of 11; shaded = busy during a typical kernel</text>
  <g>
    <rect x="442" y="78" width="26" height="26" class="on"/><rect x="474" y="78" width="26" height="26" class="on"/><rect x="506" y="78" width="26" height="26" class="on"/>
    <rect x="538" y="78" width="26" height="26" class="on"/><rect x="570" y="78" width="26" height="26" class="on"/><rect x="602" y="78" width="26" height="26" class="on"/>
    <rect x="634" y="78" width="26" height="26" class="on"/><rect x="666" y="78" width="26" height="26" class="on"/><rect x="698" y="78" width="26" height="26" class="on"/>
    <rect x="730" y="78" width="26" height="26" class="on"/><rect x="762" y="78" width="26" height="26" class="on"/><rect x="794" y="78" width="26" height="26" class="off"/>
  </g>
  <text x="442" y="140" class="sm">One second of the GPU timeline: some kernel is always running</text>
  <g>
    <rect x="442" y="150" width="70" height="24" class="k"/><rect x="514" y="150" width="58" height="24" class="k"/><rect x="574" y="150" width="76" height="24" class="k"/><rect x="652" y="150" width="62" height="24" class="k"/><rect x="716" y="150" width="56" height="24" class="k"/><rect x="774" y="150" width="46" height="24" class="k"/>
  </g>
  <rect x="442" y="200" width="378" height="44" rx="6" class="green"/>
  <text x="631" y="218" text-anchor="middle">GPU_UTIL = 100%</text>
  <text x="631" y="236" text-anchor="middle" class="b">SM_ACTIVE ≈ 0.9</text>
  <text x="631" y="274" text-anchor="middle" class="sm">Same utilization, nearly all SMs doing work</text>
</svg>
