<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="20" y="24" class="b">Naive attention: three kernels, with two N × N matrices parked in HBM between them</text>

  <!-- compute band -->
  <rect x="20" y="44" width="780" height="80" rx="4" class="group"/>
  <text x="30" y="62" class="sm">SMs</text>
  <rect x="110" y="62" width="160" height="44" rx="6" class="orange"/>
  <text x="190" y="89" text-anchor="middle">1: S = Q Kᵀ / √d</text>
  <rect x="360" y="62" width="120" height="44" rx="6" class="orange"/>
  <text x="420" y="89" text-anchor="middle">2: P = softmax(S)</text>
  <rect x="600" y="62" width="150" height="44" rx="6" class="orange"/>
  <text x="675" y="89" text-anchor="middle">3: O = P V</text>

  <!-- HBM band -->
  <rect x="20" y="184" width="780" height="80" rx="4" class="group"/>
  <text x="30" y="258" class="sm">HBM</text>
  <rect x="40" y="200" width="80" height="44" rx="4" class="blue"/>
  <text x="80" y="227" text-anchor="middle">Q, K</text>
  <rect x="230" y="200" width="130" height="44" rx="4" class="red"/>
  <text x="295" y="219" text-anchor="middle">S: N × N</text>
  <text x="295" y="236" text-anchor="middle" class="sm">128 MiB</text>
  <rect x="440" y="200" width="130" height="44" rx="4" class="red"/>
  <text x="505" y="219" text-anchor="middle">P: N × N</text>
  <text x="505" y="236" text-anchor="middle" class="sm">128 MiB</text>
  <rect x="600" y="200" width="50" height="44" rx="4" class="blue"/>
  <text x="625" y="227" text-anchor="middle">V</text>
  <rect x="720" y="200" width="60" height="44" rx="4" class="blue"/>
  <text x="750" y="227" text-anchor="middle">O</text>

  <!-- traffic -->
  <path d="M80,200 L80,84 L108,84" class="edge"/>
  <path d="M230,106 L270,198" class="edge"/><text x="212" y="160" class="sm">write</text>
  <path d="M320,198 L380,108" class="edge"/><text x="356" y="160" class="sm">read</text>
  <path d="M450,106 L490,198" class="edge"/><text x="432" y="160" class="sm">write</text>
  <path d="M540,198 L630,108" class="edge"/><text x="528" y="160" class="sm">read</text>
  <path d="M625,198 L660,108" class="edge"/>
  <path d="M720,106 L745,198" class="edge"/><text x="740" y="160" class="sm">write</text>

  <text x="20" y="292" class="sm">Per head and layer, N = 8,192, BF16: writing and reading S and P moves 512 MiB; Q, K, V and O together are only 8 MiB.</text>
  <text x="20" y="312" class="sm">All 32 heads × 32 layers of Llama 3.1 8B: 512 GiB of traffic, ≥ 164 ms at 3.35 TB/s, for math that needs ≈ 36 ms at peak.</text>
  <text x="20" y="332" class="sm">Arithmetic intensity: 64 FLOPs per byte, far below the H100 ridge point of 295. The kernels wait on memory.</text>
</svg>
