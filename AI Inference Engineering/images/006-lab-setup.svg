<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Load generators -->
  <rect x="20" y="30" width="210" height="56" rx="6" class="gray"/>
  <text x="125" y="53" text-anchor="middle" class="b">vllm bench serve</text>
  <text x="125" y="72" text-anchor="middle" class="sm">cross-check (Step 6)</text>

  <rect x="20" y="130" width="210" height="56" rx="6" class="orange"/>
  <text x="125" y="153" text-anchor="middle" class="b">measure.py</text>
  <text x="125" y="172" text-anchor="middle" class="sm">streaming client (Steps 2-4)</text>

  <!-- HTTP traffic -->
  <path d="M230,58 L458,58" class="edge"/>
  <text x="344" y="50" text-anchor="middle" class="sm">POST /v1/completions</text>
  <path d="M230,146 L458,146" class="edge"/>
  <text x="344" y="138" text-anchor="middle" class="sm">POST /v1/chat/completions</text>
  <path d="M460,172 L232,172" class="edge"/>
  <text x="344" y="190" text-anchor="middle" class="sm">tokens streamed back (SSE)</text>

  <!-- Server machine -->
  <rect x="440" y="16" width="360" height="290" rx="4" class="group"/>
  <text x="452" y="34" class="sm">server machine (Linux, WSL2, or Windows for Ollama)</text>
  <rect x="460" y="44" width="320" height="160" rx="6" class="white"/>
  <text x="620" y="100" text-anchor="middle" class="b">vLLM on port 8000</text>
  <text x="620" y="124" text-anchor="middle">or Ollama on port 11434</text>
  <text x="620" y="150" text-anchor="middle" class="sm">OpenAI-compatible HTTP API</text>
  <path d="M620,204 L620,232" stroke="#000" stroke-width="1.2"/>
  <rect x="460" y="232" width="320" height="56" rx="6" class="gray"/>
  <text x="620" y="255" text-anchor="middle" class="b">GPU</text>
  <text x="620" y="274" text-anchor="middle" class="sm">H100 (full path) or consumer GPU (small path)</text>

  <!-- Results pipeline -->
  <path d="M125,186 L125,316" class="edge"/>
  <path d="M45,328 L45,376 A80,10 0 0,0 205,376 L205,328" class="blue"/>
  <ellipse cx="125" cy="328" rx="80" ry="10" class="blue"/>
  <text x="125" y="356" text-anchor="middle" class="sm">requests.csv</text>
  <text x="125" y="372" text-anchor="middle" class="sm">levels.csv</text>

  <path d="M205,352 L258,352" class="edge"/>
  <rect x="260" y="330" width="120" height="44" rx="6" class="gray"/>
  <text x="320" y="357" text-anchor="middle">plot.py</text>

  <path d="M380,352 L438,352" class="edge"/>
  <rect x="440" y="322" width="230" height="60" rx="6" class="green"/>
  <text x="555" y="346" text-anchor="middle" class="sm">prompt_sweep.png</text>
  <text x="555" y="366" text-anchor="middle" class="sm">concurrency_sweep.png</text>
</svg>
