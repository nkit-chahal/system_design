<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Axis arrow -->
  <path d="M40,394 L40,24" class="edge"/>
  <text x="26" y="210" text-anchor="middle" transform="rotate(-90 26 210)" class="sm">more load than the fleet can serve</text>

  <!-- Rung 1 -->
  <rect x="64" y="330" width="220" height="60" rx="6" class="green"/>
  <text x="174" y="355" text-anchor="middle" class="b">wait below 0.2 s</text>
  <text x="174" y="375" text-anchor="middle" class="sm">within the TTFT budget</text>
  <text x="304" y="355">Normal. The autoscaler tracks in-flight requests</text>
  <text x="304" y="375">per replica, target 40 (Lesson 22).</text>

  <!-- Rung 2 -->
  <rect x="64" y="256" width="220" height="60" rx="6" class="yellow"/>
  <text x="174" y="281" text-anchor="middle" class="b">requests waiting in</text>
  <text x="174" y="299" text-anchor="middle" class="b">one engine</text>
  <text x="304" y="281">That replica is at its limit of 53; the router steers</text>
  <text x="304" y="301">new requests to less loaded replicas (Lesson 25).</text>

  <!-- Rung 3 -->
  <rect x="64" y="182" width="220" height="60" rx="6" class="yellow"/>
  <text x="174" y="207" text-anchor="middle" class="b">wait above 0.2 s for 2 min</text>
  <text x="174" y="227" text-anchor="middle" class="sm">or growing for 3 min</text>
  <text x="304" y="207">Warn the team channel. Check that new replicas</text>
  <text x="304" y="227">are starting (Lesson 23) and why traffic rose.</text>

  <!-- Rung 4 -->
  <rect x="64" y="108" width="220" height="60" rx="6" class="orange"/>
  <text x="174" y="133" text-anchor="middle" class="b">router queue above 250 ms</text>
  <text x="174" y="153" text-anchor="middle" class="sm">half the TTFT budget</text>
  <text x="304" y="133">Shed free-tier and batch requests first with 503 and</text>
  <text x="304" y="153">Retry-After; paid traffic is still admitted (Lesson 26).</text>

  <!-- Rung 5 -->
  <rect x="64" y="34" width="220" height="60" rx="6" class="red"/>
  <text x="174" y="59" text-anchor="middle" class="b">engine cap reached</text>
  <text x="174" y="79" text-anchor="middle" class="sm">about 58 in flight</text>
  <text x="304" y="59">Backstop: the engine rejects new requests with 503</text>
  <text x="304" y="79">instead of queueing them for a minute.</text>

  <!-- Side note -->
  <rect x="304" y="400" width="500" height="24" rx="4" class="purple"/>
  <text x="316" y="417" class="sm">Paging is reserved for the TTFT SLO burn rate (Lesson 28); these rungs drive automation.</text>
</svg>
