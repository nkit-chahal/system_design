<svg xmlns="http://www.w3.org/2000/svg" width="860" height="262" viewBox="0 0 860 262" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.lg{font-size:16px}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .axis{stroke:#000;stroke-width:1.2;fill:none}
    .grid{stroke:#ddd;stroke-width:1;fill:none}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="190" y="24" text-anchor="middle" class="b">Draft q and target p</text>
  <path d="M50,60 L50,200 L340,200" class="axis"/>
  <line x1="46" y1="200" x2="50" y2="200" stroke="#000" stroke-width="1"/>
  <text x="42" y="204" text-anchor="end" class="sm">0</text>
  <line x1="46" y1="135" x2="50" y2="135" stroke="#000" stroke-width="1"/>
  <text x="42" y="139" text-anchor="end" class="sm">0.25</text>
  <line x1="46" y1="70" x2="50" y2="70" stroke="#000" stroke-width="1"/>
  <text x="42" y="74" text-anchor="end" class="sm">0.5</text>
  <rect x="64" y="70.0" width="24" height="130.0" class="orange"/>
  <text x="76" y="66.0" text-anchor="middle" class="sm">0.5</text>
  <rect x="90" y="96.0" width="24" height="104.0" class="blue"/>
  <text x="102" y="92.0" text-anchor="middle" class="sm">0.4</text>
  <text x="89" y="216" text-anchor="middle">cat</text>
  <rect x="134" y="122.0" width="24" height="78.0" class="orange"/>
  <text x="146" y="118.0" text-anchor="middle" class="sm">0.3</text>
  <rect x="160" y="148.0" width="24" height="52.0" class="blue"/>
  <text x="172" y="144.0" text-anchor="middle" class="sm">0.2</text>
  <text x="159" y="216" text-anchor="middle">dog</text>
  <rect x="204" y="174.0" width="24" height="26.0" class="orange"/>
  <text x="216" y="170.0" text-anchor="middle" class="sm">0.1</text>
  <rect x="230" y="122.0" width="24" height="78.0" class="blue"/>
  <text x="242" y="118.0" text-anchor="middle" class="sm">0.3</text>
  <text x="229" y="216" text-anchor="middle">fox</text>
  <rect x="274" y="174.0" width="24" height="26.0" class="orange"/>
  <text x="286" y="170.0" text-anchor="middle" class="sm">0.1</text>
  <rect x="300" y="174.0" width="24" height="26.0" class="blue"/>
  <text x="312" y="170.0" text-anchor="middle" class="sm">0.1</text>
  <text x="299" y="216" text-anchor="middle">owl</text>
  <rect x="60" y="232" width="16" height="12" class="orange"/><text x="82" y="243" class="sm">draft q</text>
  <rect x="150" y="232" width="16" height="12" class="blue"/><text x="172" y="243" class="sm">target p</text>
  <text x="370" y="24" class="b">Accept, or resample on rejection</text>
  <text x="370" y="54" class="sm b">token</text>
  <text x="422" y="54" class="sm b">accept min(1, p/q)</text>
  <text x="555" y="54" class="sm b">min(p, q)</text>
  <text x="645" y="54" class="sm b">max(0, p − q)</text>
  <text x="755" y="54" class="sm b">output</text>
  <line x1="370" y1="62" x2="845" y2="62" stroke="#999"/>
  <text x="370" y="86">cat</text>
  <text x="422" y="86">0.8</text>
  <text x="555" y="86">0.4</text>
  <text x="645" y="86">0</text>
  <text x="755" y="86">0.4</text>
  <text x="370" y="114">dog</text>
  <text x="422" y="114">0.67</text>
  <text x="555" y="114">0.2</text>
  <text x="645" y="114">0</text>
  <text x="755" y="114">0.2</text>
  <text x="370" y="142">fox</text>
  <text x="422" y="142">1</text>
  <text x="555" y="142">0.1</text>
  <text x="645" y="142">0.2</text>
  <text x="755" y="142">0.1 + 0.2 = 0.3</text>
  <text x="370" y="170">owl</text>
  <text x="422" y="170">1</text>
  <text x="555" y="170">0.1</text>
  <text x="645" y="170">0</text>
  <text x="755" y="170">0.1</text>
  <line x1="370" y1="182" x2="845" y2="182" stroke="#999"/>
  <text x="370" y="204">sum</text><text x="555" y="204" class="b">0.8 = α</text><text x="645" y="204">0.2</text><text x="755" y="204">1.0</text>
  <text x="370" y="232" class="sm">A draft token survives with probability 0.8. On rejection (0.2), the replacement</text>
  <text x="370" y="248" class="sm">comes from max(0, p − q), which is all on fox. Output = p exactly.</text>
</svg>
