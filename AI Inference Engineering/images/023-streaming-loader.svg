<svg xmlns="http://www.w3.org/2000/svg" width="860" height="290" viewBox="0 0 860 290" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
    <pattern id="redhatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#e0a8a6" stroke-width="3"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .dedge{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4;marker-end:url(#arrow)}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .tick{stroke:#000;stroke-width:1}
    .grid{stroke:#e3e3e3;stroke-width:1}
    .guide{stroke:#666;stroke-width:1;stroke-dasharray:5 4;fill:none}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="66" class="b">Download, then load</text>
  <text x="16" y="84" class="sm">one stream at 0.5 GB/s</text>
  <rect x="200.0" y="50" width="496.0" height="32" class="blue"/>
  <text x="448.0" y="71.0" text-anchor="middle" class="sm">download 16 GB to local disk</text>
  <rect x="696.0" y="50" width="82.1" height="32" class="orange"/>
  <text x="737.1" y="71.0" text-anchor="middle" class="sm">read</text>
  <rect x="778.1" y="50" width="4.7" height="32" class="orange"/>
  <path d="M782.8,46 L782.8,86" stroke="#82b366" stroke-width="3"/>
  <text x="782.8" y="40.0" class="sm b" text-anchor="end">weights on GPU: 37.6 s</text>
  <text x="16" y="146" class="b">Streamed</text>
  <text x="16" y="164" class="sm">16 readers, 2 GB/s in total</text>
  <rect x="200.0" y="122" width="119.4" height="8" class="blue"/>
  <rect x="201.6" y="133" width="119.3" height="8" class="blue"/>
  <rect x="203.1" y="144" width="119.3" height="8" class="blue"/>
  <rect x="204.7" y="155" width="119.3" height="8" class="blue"/>
  <rect x="204.7" y="168" width="124.0" height="20" class="orange"/>
  <text x="266.6" y="183.0" text-anchor="middle" class="sm">copy to GPU</text>
  <path d="M328.6,118 L328.6,192" stroke="#82b366" stroke-width="3"/>
  <text x="328.6" y="112.0" class="sm b" text-anchor="start">weights on GPU: 8.3 s</text>
  <text x="339.5" y="134" class="sm"></text>
  <path d="M200,230 L826,230" class="axis"/>
  <line x1="200.0" y1="230" x2="200.0" y2="235" class="tick"/>
  <text x="200.0" y="249" text-anchor="middle" class="sm">0 s</text>
  <line x1="277.5" y1="230" x2="277.5" y2="235" class="tick"/>
  <text x="277.5" y="249" text-anchor="middle" class="sm">5 s</text>
  <line x1="355.0" y1="230" x2="355.0" y2="235" class="tick"/>
  <text x="355.0" y="249" text-anchor="middle" class="sm">10 s</text>
  <line x1="432.5" y1="230" x2="432.5" y2="235" class="tick"/>
  <text x="432.5" y="249" text-anchor="middle" class="sm">15 s</text>
  <line x1="510.0" y1="230" x2="510.0" y2="235" class="tick"/>
  <text x="510.0" y="249" text-anchor="middle" class="sm">20 s</text>
  <line x1="587.5" y1="230" x2="587.5" y2="235" class="tick"/>
  <text x="587.5" y="249" text-anchor="middle" class="sm">25 s</text>
  <line x1="665.0" y1="230" x2="665.0" y2="235" class="tick"/>
  <text x="665.0" y="249" text-anchor="middle" class="sm">30 s</text>
  <line x1="742.5" y1="230" x2="742.5" y2="235" class="tick"/>
  <text x="742.5" y="249" text-anchor="middle" class="sm">35 s</text>
  <line x1="820.0" y1="230" x2="820.0" y2="235" class="tick"/>
  <text x="820.0" y="249" text-anchor="middle" class="sm">40 s</text>
  <text x="16" y="278" class="sm">Illustrative: 16 GB of weights from the same bucket. Concurrent range reads raise throughput, and copies to the GPU overlap the reads.</text>
</svg>
