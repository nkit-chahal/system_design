<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Clients -->
  <rect x="14" y="60" width="150" height="56" rx="6" class="purple"/>
  <text x="89" y="84" text-anchor="middle" class="b">Chat users</text>
  <text x="89" y="103" text-anchor="middle" class="sm">priority 0 (default)</text>
  <rect x="14" y="170" width="150" height="70" rx="6" class="gray"/>
  <text x="89" y="194" text-anchor="middle" class="b">Batch client</text>
  <text x="89" y="212" text-anchor="middle" class="sm">priority 10</text>
  <text x="89" y="229" text-anchor="middle" class="sm">at most 8 in flight</text>
  <path d="M164,88 L218,120" class="edge"/>
  <path d="M164,205 L218,160" class="edge"/>

  <!-- Replica -->
  <rect x="220" y="20" width="370" height="250" rx="4" class="group"/>
  <text x="236" y="42" class="b">vLLM replica, --scheduling-policy priority</text>

  <text x="300" y="70" text-anchor="middle" class="sm">waiting queue</text>
  <text x="300" y="84" text-anchor="middle" class="sm">(lowest value first)</text>
  <rect x="244" y="94" width="112" height="26" rx="4" class="purple"/><text x="300" y="112" text-anchor="middle" class="sm">chat, 0</text>
  <rect x="244" y="124" width="112" height="26" rx="4" class="purple"/><text x="300" y="142" text-anchor="middle" class="sm">chat, 0</text>
  <rect x="244" y="154" width="112" height="26" rx="4" class="gray"/><text x="300" y="172" text-anchor="middle" class="sm">batch, 10</text>
  <rect x="244" y="184" width="112" height="26" rx="4" class="gray"/><text x="300" y="202" text-anchor="middle" class="sm">batch, 10</text>
  <path d="M356,140 L398,140" class="edge"/>
  <text x="377" y="132" text-anchor="middle" class="sm">admit</text>

  <rect x="400" y="60" width="174" height="136" rx="6" class="orange"/>
  <text x="487" y="82" text-anchor="middle" class="b">Running batch</text>
  <text x="487" y="99" text-anchor="middle" class="sm">≈ 53 slots</text>
  <g>
    <rect x="414" y="110" width="20" height="16" class="purple"/><rect x="438" y="110" width="20" height="16" class="purple"/><rect x="462" y="110" width="20" height="16" class="purple"/><rect x="486" y="110" width="20" height="16" class="purple"/><rect x="510" y="110" width="20" height="16" class="purple"/><rect x="534" y="110" width="20" height="16" class="purple"/>
    <rect x="414" y="130" width="20" height="16" class="purple"/><rect x="438" y="130" width="20" height="16" class="purple"/><rect x="462" y="130" width="20" height="16" class="purple"/><rect x="486" y="130" width="20" height="16" class="purple"/><rect x="510" y="130" width="20" height="16" class="gray"/><rect x="534" y="130" width="20" height="16" class="gray"/>
    <rect x="414" y="150" width="20" height="16" class="gray"/><rect x="438" y="150" width="20" height="16" class="gray"/>
  </g>
  <text x="487" y="186" text-anchor="middle" class="sm">chat and batch mixed</text>

  <rect x="400" y="214" width="174" height="42" rx="6" class="blue"/>
  <text x="487" y="240" text-anchor="middle" class="sm">KV cache blocks</text>
  <path d="M487,196 L487,212" class="edge"/>

  <!-- Rules -->
  <rect x="610" y="30" width="236" height="64" rx="6" class="green"/>
  <text x="728" y="52" text-anchor="middle" class="sm">A waiting chat request is</text>
  <text x="728" y="68" text-anchor="middle" class="sm">admitted before any waiting</text>
  <text x="728" y="84" text-anchor="middle" class="sm">batch request.</text>
  <rect x="610" y="110" width="236" height="64" rx="6" class="green"/>
  <text x="728" y="132" text-anchor="middle" class="sm">Out of KV blocks: preempt the</text>
  <text x="728" y="148" text-anchor="middle" class="sm">running request with the largest</text>
  <text x="728" y="164" text-anchor="middle" class="sm">priority value (a batch request).</text>
  <rect x="610" y="190" width="236" height="80" rx="6" class="red"/>
  <text x="728" y="212" text-anchor="middle" class="sm">A full batch does not evict</text>
  <text x="728" y="228" text-anchor="middle" class="sm">running batch work to admit chat,</text>
  <text x="728" y="244" text-anchor="middle" class="sm">so the batch client must cap</text>
  <text x="728" y="260" text-anchor="middle" class="sm">its requests in flight.</text>

  <!-- Legend -->
  <rect x="220" y="300" width="18" height="14" class="purple"/><text x="244" y="312" class="sm">chat request (interactive)</text>
  <rect x="430" y="300" width="18" height="14" class="gray"/><text x="454" y="312" class="sm">batch request</text>
  <text x="220" y="340" class="sm">Behavior of the current vLLM V1 scheduler; check the version you run.</text>
</svg>
