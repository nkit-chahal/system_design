<svg xmlns="http://www.w3.org/2000/svg" width="860" height="402" viewBox="0 0 860 402" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .thick{fill:none;stroke:#000;stroke-width:2.4;marker-end:url(#arrow)}
    .dash{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:4 3;marker-end:url(#arrow)}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .grid{fill:none;stroke:#ddd;stroke-width:1}
    .ref{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:5 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="20" y="26" class="b">Memory of one GPU for DeepSeek-V3 in FP8 (--gpu-memory-utilization 0.90 set explicitly)</text>
  <text x="20" y="72" class="sm b">8 × H100, TP = 8</text>
  <rect x="230" y="50" width="318.4" height="34" fill="none" stroke="#000" stroke-width="1.2"/>
  <rect x="230" y="50" width="312.4" height="34" class="red"/>
  <text x="386.2" y="72" text-anchor="middle" class="sm">weights 78.1</text>
  <line x1="516.6" y1="44" x2="516.6" y2="90" stroke="#000" stroke-width="2"/>
  <text x="558.4" y="66" class="sm">the 90% limit (black line)</text>
  <text x="558.4" y="82" class="sm">is below the weights alone</text>
  <text x="230" y="102" class="sm">does not fit: 78.1 GiB of weights, 71.6 GiB usable</text>
  <text x="20" y="148" class="sm b">8 × H200, TP = 8</text>
  <rect x="230" y="126" width="312.4" height="34" class="orange"/>
  <text x="386.2" y="148" text-anchor="middle" class="sm">weights 78.1</text>
  <rect x="542.4" y="126" width="20.0" height="34" class="gray"/>
  <rect x="562.4" y="126" width="140.4" height="34" class="blue"/>
  <text x="632.6" y="148" text-anchor="middle" class="sm">KV 35</text>
  <rect x="702.8" y="126" width="52.4" height="34" fill="url(#hatch)" stroke="#666" stroke-width="1.2"/>
  <text x="230" y="178" class="sm">0.54M tokens in all: the same latents on all 8 GPUs</text>
  <text x="20" y="224" class="sm b">8 × H200, DP attn + EP = 8</text>
  <rect x="230" y="202" width="368.0" height="34" class="orange"/>
  <text x="414.0" y="224" text-anchor="middle" class="sm">weights 92.0</text>
  <rect x="598.0" y="202" width="20.0" height="34" class="gray"/>
  <rect x="618.0" y="202" width="84.8" height="34" class="blue"/>
  <text x="660.4" y="224" text-anchor="middle" class="sm">KV 21</text>
  <rect x="702.8" y="202" width="52.4" height="34" fill="url(#hatch)" stroke="#666" stroke-width="1.2"/>
  <text x="230" y="254" class="sm">2.6M tokens in all: each GPU holds its own requests</text>
  <text x="20" y="300" class="sm b">16 × H100, DP attn + EP = 16</text>
  <rect x="230" y="278" width="215.6" height="34" class="orange"/>
  <text x="337.8" y="300" text-anchor="middle" class="sm">weights 53.9</text>
  <rect x="445.6" y="278" width="20.0" height="34" class="gray"/>
  <rect x="465.6" y="278" width="50.8" height="34" class="blue"/>
  <text x="491.0" y="300" text-anchor="middle" class="sm">KV 13</text>
  <rect x="516.4" y="278" width="32.0" height="34" fill="url(#hatch)" stroke="#666" stroke-width="1.2"/>
  <text x="230" y="330" class="sm">3.1M tokens in all; the all-to-all crosses servers</text>
  <rect x="20" y="354" width="18" height="12" rx="0" class="orange"/>
  <text x="44" y="365" class="sm">weights (GiB)</text>
  <rect x="160" y="354" width="18" height="12" rx="0" class="gray"/>
  <text x="184" y="365" class="sm">activations, CUDA graphs ≈ 5 GiB (assumed)</text>
  <rect x="470" y="354" width="18" height="12" rx="0" class="blue"/>
  <text x="494" y="365" class="sm">KV cache (GiB)</text>
  <rect x="610" y="354" width="18" height="12" fill="url(#hatch)" stroke="#666" stroke-width="1.2"/>
  <text x="634" y="365" class="sm">10% held back</text>
  <text x="20" y="388" class="sm">H100 ≈ 79.6 GiB visible; H200 counted conservatively as 141 × 10⁹ bytes ≈ 131 GiB. MLA cache ≈ 68.6 KiB per token.</text>
</svg>
