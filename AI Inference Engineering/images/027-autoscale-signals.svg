<svg xmlns="http://www.w3.org/2000/svg" width="860" height="262" viewBox="0 0 860 262" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}.it{font-style:italic}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .line{fill:none;stroke:#000;stroke-width:1.2}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .grid{fill:none;stroke:#e6e6e6;stroke-width:1}
    .dash{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:6 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <rect x="10" y="90" width="150" height="60" rx="6" class="purple"/>
  <text x="85" y="116" text-anchor="middle">offered load</text>
  <text x="85" y="134" text-anchor="middle" class="sm">167 req/s</text>
  <rect x="200" y="80" width="150" height="80" rx="6" class="orange"/>
  <text x="275" y="107" text-anchor="middle">gateway</text>
  <text x="275" y="125" text-anchor="middle" class="sm">admits 60 req/s</text>
  <text x="275" y="143" text-anchor="middle" class="sm">sheds 107 req/s</text>
  <rect x="390" y="90" width="150" height="60" rx="6" class="blue"/>
  <text x="465" y="116" text-anchor="middle">12 replicas</text>
  <text x="465" y="134" text-anchor="middle" class="sm">see 60 req/s</text>
  <path d="M160,120 L198,120" class="edge"/>
  <path d="M350,120 L388,120" class="edge"/>
  <rect x="580" y="20" width="270" height="74" rx="6" class="red"/>
  <text x="715" y="44" text-anchor="middle" class="b">Scale on vLLM load only</text>
  <text x="715" y="62" text-anchor="middle" class="sm">ceil(60 ÷ 4.5) = 14 replicas</text>
  <text x="715" y="80" text-anchor="middle" class="sm">shedding hides 107 req/s of demand</text>
  <rect x="580" y="146" width="270" height="74" rx="6" class="green"/>
  <text x="715" y="170" text-anchor="middle" class="b">Scale on offered load</text>
  <text x="715" y="188" text-anchor="middle" class="sm">ceil(167 ÷ 4.5) = 38 replicas</text>
  <text x="715" y="206" text-anchor="middle" class="sm">counted before the gateway sheds</text>
  <path d="M540,110 L578,66" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M85,150 L85,230 L715,230 L715,222" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="400" y="248" text-anchor="middle" class="sm">the gateway counts every request it receives, admitted or shed: gateway_requests_total</text>
</svg>
