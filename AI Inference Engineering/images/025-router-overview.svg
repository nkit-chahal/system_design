<svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .dash{fill:none;stroke:#999;stroke-width:1.2;stroke-dasharray:5 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Incoming request -->
  <rect x="16" y="130" width="186" height="70" rx="6" class="purple"/>
  <text x="109" y="154" text-anchor="middle" class="b">new request</text>
  <text x="109" y="173" text-anchor="middle" class="sm">prefix: sys S1 + chat 42</text>
  <text x="109" y="190" text-anchor="middle" class="sm">8,000 tokens of history</text>
  <path d="M202,165 L234,165" class="edge"/>

  <!-- Router -->
  <rect x="236" y="120" width="150" height="90" rx="6" class="orange"/>
  <text x="311" y="152" text-anchor="middle" class="b">Router</text>
  <text x="311" y="172" text-anchor="middle" class="sm">scores every replica</text>
  <text x="311" y="189" text-anchor="middle" class="sm">picks one</text>
  <text x="311" y="100" text-anchor="middle" class="sm">reads: queue, KV usage,</text>
  <text x="311" y="114" text-anchor="middle" class="sm">cached prefixes</text>

  <!-- Routes -->
  <path d="M386,136 L428,136 L428,63 L466,63" class="dash"/>
  <path d="M386,165 L466,165" class="edge" style="stroke-width:2"/>
  <path d="M386,194 L428,194 L428,267 L466,267" class="dash"/>
  <text x="404" y="158" class="sm b">route</text>

  <!-- Replica 1 -->
  <rect x="470" y="24" width="334" height="78" rx="6" class="gray"/>
  <text x="484" y="46" class="b">Replica 1</text>
  <rect x="584" y="33" width="206" height="18" rx="3" class="red"/>
  <text x="687" y="46" text-anchor="middle" class="sm">9 waiting · KV cache 91%</text>
  <text x="484" y="83" class="sm">cached:</text>
  <rect x="534" y="70" width="64" height="20" rx="3" class="blue"/><text x="566" y="84" text-anchor="middle" class="sm">sys S2</text>
  <rect x="606" y="70" width="64" height="20" rx="3" class="blue"/><text x="638" y="84" text-anchor="middle" class="sm">sys S3</text>

  <!-- Replica 2 (chosen) -->
  <rect x="470" y="126" width="334" height="78" rx="6" class="green" style="stroke-width:2"/>
  <text x="484" y="148" class="b">Replica 2</text>
  <text x="687" y="148" text-anchor="middle" class="sm">1 waiting · KV cache 55%</text>
  <text x="484" y="185" class="sm">cached:</text>
  <rect x="534" y="172" width="64" height="20" rx="3" class="blue"/><text x="566" y="186" text-anchor="middle" class="sm">sys S1</text>
  <rect x="606" y="172" width="74" height="20" rx="3" class="blue"/><text x="643" y="186" text-anchor="middle" class="sm">chat 42</text>
  <text x="790" y="186" text-anchor="end" class="sm b">match: 7,800</text>

  <!-- Replica 3 -->
  <rect x="470" y="228" width="334" height="78" rx="6" class="gray"/>
  <text x="484" y="250" class="b">Replica 3</text>
  <text x="687" y="250" text-anchor="middle" class="sm">0 waiting · KV cache 20%</text>
  <text x="484" y="287" class="sm">cached:</text>
  <rect x="534" y="274" width="64" height="20" rx="3" class="blue"/><text x="566" y="288" text-anchor="middle" class="sm">sys S4</text>
  <text x="790" y="288" text-anchor="end" class="sm">match: 0</text>
  <text x="790" y="84" text-anchor="end" class="sm">match: 0</text>

  <text x="16" y="336">Replica 2 wins: it already holds 7,800 of the 8,000 prompt tokens and has room to spare.</text>
  <text x="16" y="356">Replica 3 is idler, but it would have to prefill all 8,000 tokens again (about 260 ms).</text>
</svg>
