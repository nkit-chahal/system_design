<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .dash{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Request path -->
  <rect x="16" y="40" width="90" height="50" rx="6" class="white"/>
  <text x="61" y="70" text-anchor="middle">client</text>
  <path d="M106,58 L156,58" class="edge"/>
  <path d="M156,74 L106,74" class="edge"/>

  <rect x="158" y="24" width="190" height="84" rx="6" class="orange"/>
  <text x="253" y="46" text-anchor="middle" class="b">API gateway</text>
  <text x="253" y="64" text-anchor="middle" class="sm">assigns request ID, tenant</text>
  <text x="253" y="80" text-anchor="middle" class="sm">times TTFT and end-to-end</text>
  <text x="253" y="96" text-anchor="middle" class="sm">reads the usage chunk</text>

  <path d="M348,58 L398,58" class="edge"/>
  <path d="M398,74 L348,74" class="edge"/>
  <rect x="400" y="40" width="96" height="50" rx="6" class="gray"/>
  <text x="448" y="70" text-anchor="middle">router</text>
  <path d="M496,58 L598,58" class="edge"/>
  <path d="M598,74 L496,74" class="edge"/>
  <text x="547" y="50" text-anchor="middle" class="sm">X-Request-Id</text>
  <text x="547" y="92" text-anchor="middle" class="sm">tokens + usage</text>

  <rect x="600" y="30" width="150" height="70" rx="6" class="purple"/>
  <text x="675" y="56" text-anchor="middle">vLLM replica</text>
  <text x="675" y="76" text-anchor="middle" class="sm">usage, finish reason</text>
  <text x="675" y="92" text-anchor="middle" class="sm">engine counters, traces</text>

  <!-- Event path -->
  <path d="M253,108 L253,160" class="edge"/>
  <text x="262" y="140" class="sm">one event per request</text>
  <rect x="158" y="162" width="190" height="50" rx="6" class="gray"/>
  <text x="253" y="184" text-anchor="middle">event log (Kafka)</text>
  <text x="253" y="201" text-anchor="middle" class="sm">at-least-once delivery</text>
  <path d="M253,212 L253,248" class="edge"/>

  <!-- Warehouse cylinder -->
  <path d="M188,262 a65,12 0 0 0 130,0 a65,12 0 0 0 -130,0 Z" class="blue"/>
  <path d="M188,262 L188,320 a65,12 0 0 0 130,0 L318,262" class="blue"/>
  <path d="M188,262 a65,12 0 0 0 130,0" fill="none" stroke="#6c8ebf" stroke-width="1.2"/>
  <text x="253" y="296" text-anchor="middle">warehouse</text>
  <text x="253" y="313" text-anchor="middle" class="sm">1.44M rows a day</text>

  <rect x="16" y="268" width="140" height="64" rx="6" class="green"/>
  <text x="86" y="290" text-anchor="middle" class="sm">invoices, cost</text>
  <text x="86" y="306" text-anchor="middle" class="sm">reports, capacity,</text>
  <text x="86" y="322" text-anchor="middle" class="sm">investigations</text>
  <path d="M188,296 L158,296" class="edge"/>

  <!-- Prometheus path -->
  <path d="M348,100 L430,170" class="edge"/>
  <text x="400" y="122" class="sm">counters by tenant,</text>
  <text x="400" y="137" class="sm">model, token kind</text>
  <path d="M450,182 a50,11 0 0 0 100,0 a50,11 0 0 0 -100,0 Z" class="blue"/>
  <path d="M450,182 L450,232 a50,11 0 0 0 100,0 L550,182" class="blue"/>
  <path d="M450,182 a50,11 0 0 0 100,0" fill="none" stroke="#6c8ebf" stroke-width="1.2"/>
  <text x="500" y="214" text-anchor="middle">Prometheus</text>
  <path d="M675,100 L560,184" class="edge"/>
  <text x="640" y="150" class="sm">vllm:prompt_tokens_total,</text>
  <text x="640" y="165" class="sm">vllm:generation_tokens_total</text>
  <rect x="610" y="212" width="130" height="44" rx="6" class="gray"/>
  <text x="675" y="231" text-anchor="middle" class="sm">dashboards and</text>
  <text x="675" y="247" text-anchor="middle" class="sm">alerts</text>
  <path d="M550,226 L608,232" class="edge"/>

  <!-- Reconciliation -->
  <rect x="400" y="282" width="200" height="50" rx="6" class="orange"/>
  <text x="500" y="303" text-anchor="middle">daily reconciliation</text>
  <text x="500" y="320" text-anchor="middle" class="sm">warehouse vs engine counters</text>
  <path d="M318,307 L398,307" class="dash"/>
  <path d="M500,243 L500,280" class="dash"/>
</svg>
