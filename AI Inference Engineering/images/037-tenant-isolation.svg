<svg xmlns="http://www.w3.org/2000/svg" width="840" height="370" viewBox="0 0 840 370" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Tenants -->
  <rect x="16" y="56" width="140" height="36" rx="4" class="purple"/><text x="86" y="79" text-anchor="middle" class="sm">tenant acme + key</text>
  <rect x="16" y="108" width="140" height="36" rx="4" class="purple"/><text x="86" y="131" text-anchor="middle" class="sm">tenant globex + key</text>
  <rect x="16" y="160" width="140" height="36" rx="4" class="purple"/><text x="86" y="183" text-anchor="middle" class="sm">tenant initech + key</text>
  <path d="M156,74 L188,74" class="edge"/>
  <path d="M156,126 L188,126" class="edge"/>
  <path d="M156,178 L188,178" class="edge"/>

  <!-- Gateway -->
  <rect x="190" y="40" width="240" height="180" rx="6" class="orange"/>
  <text x="310" y="64" text-anchor="middle" class="b">Gateway</text>
  <text x="204" y="92" class="sm">1. authenticate the API key</text>
  <text x="204" y="116" class="sm">2. map tenant to its allowed adapter</text>
  <text x="204" y="140" class="sm">3. overwrite the model field</text>
  <text x="204" y="164" class="sm">4. token buckets, concurrency caps</text>
  <text x="204" y="188" class="sm">5. record usage per tenant, adapter</text>
  <path d="M310,220 L310,250" class="edge"/>
  <rect x="190" y="252" width="240" height="36" rx="4" class="blue"/>
  <text x="310" y="275" text-anchor="middle" class="sm">usage records (Lesson 31)</text>

  <!-- Router -->
  <path d="M430,130 L466,130" class="edge"/>
  <rect x="468" y="100" width="116" height="60" rx="6" class="purple"/>
  <text x="526" y="125" text-anchor="middle" class="b">Router</text>
  <text x="526" y="145" text-anchor="middle" class="sm">adapter home group</text>
  <path d="M584,130 L610,130" class="edge"/>

  <!-- Replica -->
  <rect x="612" y="30" width="212" height="240" rx="4" class="group"/>
  <text x="624" y="50" class="b">Replica</text>
  <rect x="624" y="62" width="188" height="40" rx="4" class="orange"/>
  <text x="718" y="87" text-anchor="middle" class="sm">base model (shared)</text>
  <rect x="624" y="112" width="188" height="40" rx="4" class="blue"/>
  <text x="718" y="137" text-anchor="middle" class="sm">adapter slots</text>
  <rect x="624" y="162" width="188" height="58" rx="4" class="blue"/>
  <text x="718" y="185" text-anchor="middle" class="sm">KV cache: prefix blocks</text>
  <text x="718" y="203" text-anchor="middle" class="sm">keyed by adapter and salt</text>
  <text x="718" y="246" text-anchor="middle" class="sm">admin endpoints: load, unload</text>

  <!-- Control plane -->
  <rect x="468" y="306" width="200" height="50" rx="6" class="gray"/>
  <text x="568" y="327" text-anchor="middle" class="b">Control plane</text>
  <text x="568" y="345" text-anchor="middle" class="sm">vetted adapter registry</text>
  <path d="M668,331 L718,331 L718,272" class="edge"/>

  <rect x="16" y="306" width="420" height="50" rx="6" class="red"/>
  <text x="226" y="327" text-anchor="middle" class="sm">Tenants never reach the admin endpoints or choose an</text>
  <text x="226" y="345" text-anchor="middle" class="sm">adapter by name: the gateway decides which adapter runs.</text>
</svg>
