<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .grid{fill:none;stroke:#ddd;stroke-width:1}
    .dash{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:5 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="26" class="b">One chat request (2,000 tokens in, 500 out) on an H100 decoding at batch 170</text>
  <text x="16" y="75" class="b">Tokens</text>
  <rect x="200" y="54" width="448.0" height="32" class="orange"/>
  <rect x="648.0" y="54" width="112.0" height="32" class="green"/>
  <text x="424.0" y="75" text-anchor="middle" class="sm">2,000 input tokens (80%)</text>
  <text x="704.0" y="75" text-anchor="middle" class="sm">500 out (20%)</text>
  <text x="16" y="127" class="b">FLOPs</text>
  <rect x="200" y="106" width="444.8" height="32" class="orange"/>
  <rect x="644.8" y="106" width="115.2" height="32" class="green"/>
  <text x="422.4" y="127" text-anchor="middle" class="sm">prefill: 33.2 TFLOP (79%)</text>
  <text x="702.4" y="127" text-anchor="middle" class="sm">8.6 TFLOP (21%)</text>
  <text x="16" y="179" class="b">Wall-clock time</text>
  <rect x="200" y="158" width="3.5" height="32" class="orange"/>
  <rect x="203.5" y="158" width="556.5" height="32" class="green"/>
  <text x="481.7" y="179" text-anchor="middle" class="sm">decode: 499 steps × 21.4 ms ≈ 10.7 s</text>
  <path d="M202,192 L202,212 L230,212" class="edge"/>
  <text x="236" y="216" class="sm">prefill: ≈ 67 ms (0.6%), during which the GPU reads ≈ 30,000 input tokens/s</text>
  <rect x="16" y="234" width="16" height="12" class="orange"/><text x="38" y="245" class="sm">prompt / prefill</text>
  <rect x="160" y="234" width="16" height="12" class="green"/><text x="182" y="245" class="sm">output / decode</text>
  <text x="16" y="270" class="sm">Input tokens are fast to process but not free: for this traffic they account for about four fifths of the GPU's arithmetic.</text>
</svg>
