<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <rect x="20" y="115" width="250" height="70" rx="10" class="yellow"/>
  <text x="145" y="144" text-anchor="middle" class="b">Drop ≤ 1.0 point</text>
  <text x="145" y="164" text-anchor="middle" class="b">on every eval?</text>

  <path d="M270,135 L300,135 L300,62 L338,62" class="edge"/>
  <text x="308" y="52" class="sm">yes</text>
  <rect x="340" y="30" width="240" height="64" rx="6" class="green"/>
  <text x="460" y="57" text-anchor="middle" class="b">ACCEPT</text>
  <text x="460" y="77" text-anchor="middle" class="sm">ship it, then re-check speed</text>

  <path d="M270,165 L300,165 L300,218 L338,218" class="edge"/>
  <text x="308" y="236" class="sm">no</text>
  <rect x="340" y="185" width="240" height="66" rx="10" class="yellow"/>
  <text x="460" y="212" text-anchor="middle" class="b">95% CI of the change</text>
  <text x="460" y="232" text-anchor="middle" class="b">entirely below zero?</text>

  <path d="M580,205 L600,205 L600,150 L618,150" class="edge"/>
  <text x="604" y="198" class="sm">yes</text>
  <rect x="620" y="118" width="185" height="64" rx="6" class="red"/>
  <text x="712" y="145" text-anchor="middle" class="b">REJECT</text>
  <text x="712" y="165" text-anchor="middle" class="sm">try the next method</text>

  <path d="M580,235 L600,235 L600,262 L618,262" class="edge"/>
  <text x="604" y="254" class="sm">no</text>
  <rect x="620" y="232" width="185" height="60" rx="6" class="gray"/>
  <text x="712" y="257" text-anchor="middle" class="b">INCONCLUSIVE</text>
  <text x="712" y="277" text-anchor="middle" class="sm">add items, then rerun</text>

  <text x="16" y="24" class="sm">Applied to each eval separately; the variant must pass every one.</text>
</svg>
