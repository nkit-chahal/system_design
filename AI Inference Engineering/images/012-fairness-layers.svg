<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="20" y="22" class="b">Hold everything equal except the engine</text>

  <rect x="20" y="36" width="170" height="56" rx="6" class="blue"/>
  <text x="105" y="69" text-anchor="middle" class="b">Model</text>
  <rect x="200" y="36" width="600" height="56" rx="6" class="white"/>
  <text x="214" y="59" class="sm">same weight files (one local copy), same dtype (BF16),</text>
  <text x="214" y="77" class="sm">same tokenizer and chat template, same max context (8,192 tokens)</text>

  <rect x="20" y="102" width="170" height="56" rx="6" class="orange"/>
  <text x="105" y="135" text-anchor="middle" class="b">Engine settings</text>
  <rect x="200" y="102" width="600" height="56" rx="6" class="white"/>
  <text x="214" y="125" class="sm">memory fraction 0.90 on both (check KV capacity in the logs), prefix caching off,</text>
  <text x="214" y="143" class="sm">batch limits above 50, same GPU, nothing else running on it</text>

  <rect x="20" y="168" width="170" height="56" rx="6" class="purple"/>
  <text x="105" y="201" text-anchor="middle" class="b">Workload</text>
  <rect x="200" y="168" width="600" height="56" rx="6" class="white"/>
  <text x="214" y="191" class="sm">same prompts (fixed seed), exactly 2,000 tokens in and 500 out,</text>
  <text x="214" y="209" class="sm">temperature 0 and ignore_eos, untimed warmup run first</text>

  <rect x="20" y="234" width="170" height="56" rx="6" class="gray"/>
  <text x="105" y="267" text-anchor="middle" class="b">Measurement</text>
  <rect x="200" y="234" width="600" height="56" rx="6" class="white"/>
  <text x="214" y="257" class="sm">same load generator and version, same network path (localhost),</text>
  <text x="214" y="275" class="sm">50 requests in flight, three or more runs per engine, record versions</text>
</svg>
