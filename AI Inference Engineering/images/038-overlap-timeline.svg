<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- 9 px per ms, x0 = 110 -->
  <text x="16" y="26" class="b">Serialized: masks computed after each forward pass</text>
  <text x="16" y="62">GPU</text>
  <text x="16" y="96">CPU</text>
  <rect x="110" y="42" width="189" height="28" class="orange"/><text x="204" y="61" text-anchor="middle" class="sm">forward, 21 ms</text>
  <rect x="323.3" y="42" width="189" height="28" class="orange"/><text x="418" y="61" text-anchor="middle" class="sm">forward, 21 ms</text>
  <rect x="536.6" y="42" width="189" height="28" class="orange"/><text x="631" y="61" text-anchor="middle" class="sm">forward, 21 ms</text>
  <rect x="299" y="76" width="24.3" height="28" class="purple"/>
  <rect x="512.3" y="76" width="24.3" height="28" class="purple"/>
  <rect x="725.6" y="76" width="24.3" height="28" class="purple"/>
  <text x="311" y="120" text-anchor="middle" class="sm">masks, 2.7 ms</text>
  <text x="760" y="96" class="sm b">≈ 71 ms</text>

  <line x1="16" y1="138" x2="804" y2="138" stroke="#999" stroke-dasharray="5 4"/>

  <text x="16" y="164" class="b">Overlapped: masks for a step computed during its forward pass</text>
  <text x="16" y="198">GPU</text>
  <text x="16" y="232">CPU</text>
  <rect x="110" y="178" width="189" height="28" class="orange"/><text x="204" y="197" text-anchor="middle" class="sm">forward, 21 ms</text>
  <rect x="299" y="178" width="189" height="28" class="orange"/><text x="393" y="197" text-anchor="middle" class="sm">forward, 21 ms</text>
  <rect x="488" y="178" width="189" height="28" class="orange"/><text x="582" y="197" text-anchor="middle" class="sm">forward, 21 ms</text>
  <rect x="110" y="212" width="24.3" height="28" class="purple"/>
  <rect x="299" y="212" width="24.3" height="28" class="purple"/>
  <rect x="488" y="212" width="24.3" height="28" class="purple"/>
  <text x="140" y="231" class="sm">masks ready in time</text>
  <text x="686" y="232" class="sm b">= 63 ms</text>
  <line x1="110" y1="250" x2="677" y2="250" stroke="#000" stroke-width="1"/>
  <path d="M110,250 v5 M299,250 v5 M488,250 v5 M677,250 v5" stroke="#000" stroke-width="1"/>
  <text x="110" y="268" text-anchor="middle" class="sm">0</text><text x="299" y="268" text-anchor="middle" class="sm">21</text><text x="488" y="268" text-anchor="middle" class="sm">42</text><text x="677" y="268" text-anchor="middle" class="sm">63 ms</text>

  <!-- Compile once per schema -->
  <text x="16" y="302" class="sm">new schema</text>
  <rect x="110" y="288" width="150" height="22" class="gray"/><text x="185" y="303" text-anchor="middle" class="sm">compile grammar (once)</text>
  <rect x="260" y="288" width="90" height="22" class="orange"/><text x="305" y="303" text-anchor="middle" class="sm">prefill</text>
  <text x="16" y="334" class="sm">cached schema</text>
  <rect x="110" y="320" width="90" height="22" class="orange"/><text x="155" y="335" text-anchor="middle" class="sm">prefill</text>
  <text x="380" y="303" class="sm">compile cost lands in TTFT, once per new schema</text>
  <text x="380" y="335" class="sm">53 streams × ≈ 50 µs ≈ 2.7 ms per step (illustrative)</text>
</svg>
