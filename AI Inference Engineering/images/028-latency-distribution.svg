<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:0.8}
    .axis{stroke:#000;stroke-width:1.2}
    .mk{stroke-width:1.5;stroke-dasharray:5 3}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="24" class="b">Time to first token for 100,000 requests (illustrative, synthetic data)</text>

  <rect x="80.0" y="169.0" width="17.5" height="81.0" class="blue"/><rect x="97.5" y="88.1" width="17.5" height="161.9" class="blue"/><rect x="115.0" y="131.0" width="17.5" height="119.0" class="blue"/><rect x="132.5" y="172.7" width="17.5" height="77.3" class="blue"/><rect x="150.0" y="200.7" width="17.5" height="49.3" class="blue"/><rect x="167.5" y="218.9" width="17.5" height="31.1" class="blue"/><rect x="185.0" y="228.7" width="17.5" height="21.3" class="blue"/><rect x="202.5" y="235.9" width="17.5" height="14.1" class="blue"/><rect x="220.0" y="240.2" width="17.5" height="9.8" class="blue"/><rect x="237.5" y="242.8" width="17.5" height="7.2" class="blue"/><rect x="255.0" y="245.0" width="17.5" height="5.0" class="blue"/><rect x="272.5" y="246.2" width="17.5" height="3.8" class="blue"/><rect x="290.0" y="247.2" width="17.5" height="2.9" class="blue"/><rect x="307.5" y="247.7" width="17.5" height="2.3" class="blue"/><rect x="325.0" y="248.4" width="17.5" height="1.6" class="blue"/><rect x="342.5" y="248.9" width="17.5" height="1.1" class="blue"/><rect x="360.0" y="249.1" width="17.5" height="0.9" class="blue"/><rect x="377.5" y="249.2" width="17.5" height="0.8" class="blue"/><rect x="395.0" y="249.3" width="17.5" height="0.7" class="blue"/><rect x="412.5" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="430.0" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="447.5" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="465.0" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="482.5" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="500.0" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="517.5" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="535.0" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="552.5" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="570.0" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="587.5" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="605.0" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="622.5" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="640.0" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="657.5" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="675.0" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="692.5" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="710.0" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="727.5" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="745.0" y="249.4" width="17.5" height="0.6" class="blue"/><rect x="762.5" y="249.4" width="17.5" height="0.6" class="blue"/>
  <line x1="80" y1="250" x2="785" y2="250" class="axis"/>
  <line x1="80" y1="70" x2="80" y2="250" class="axis"/>
  <g class="sm" text-anchor="middle">
    <text x="80" y="268">0</text><text x="255.0" y="268">0.5 s</text>
    <text x="430.0" y="268">1.0 s</text><text x="605.0" y="268">1.5 s</text>
    <text x="780.0" y="268">2.0 s</text>
  </g>
  <text x="24" y="160" class="sm" transform="rotate(-90 24 160)" text-anchor="middle">requests per 50 ms bin</text>

  <line x1="122.3" y1="56" x2="122.3" y2="250" class="mk" stroke="#000"/>
  <text x="118.3" y="52" text-anchor="end" class="sm b">p50 121 ms</text>
  <line x1="147.9" y1="76" x2="147.9" y2="250" class="mk" stroke="#9673a6"/>
  <text x="151.9" y="72" class="sm b" style="fill:#7a5a8c">mean 194 ms</text>
  <line x1="249.4" y1="110" x2="249.4" y2="250" class="mk" stroke="#d79b00"/>
  <text x="253.4" y="106" class="sm b" style="fill:#a06f00">p95 484 ms</text>
  <line x1="573.2" y1="150" x2="573.2" y2="250" class="mk" stroke="#b85450"/>
  <text x="577.2" y="146" class="sm b" style="fill:#b85450">p99 1.41 s</text>
  <text x="577.2" y="200" class="sm">1.4% of requests wait over 1 s;</text>
  <text x="577.2" y="216" class="sm">0.8% over 2 s, up to 5 s</text>

  <text x="16" y="300">The mean sits above the median but far below the tail: it says 194 ms while 1 request in 100</text>
  <text x="16" y="320">waits more than 1.4 s. The tail is nearly invisible in the histogram, yet users feel it.</text>
</svg>
