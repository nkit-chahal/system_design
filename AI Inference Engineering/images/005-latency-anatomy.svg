<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .grid{fill:none;stroke:#ddd;stroke-width:1}
    .dash{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:5 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="26" class="b">Anatomy of one streamed request</text>
  <line x1="60" y1="150" x2="800" y2="150" class="axis"/>
  <path d="M60,120 L60,170" stroke="#9673a6" stroke-width="2.4"/>
  <text x="60" y="186" text-anchor="middle" class="sm">sent</text>
  <rect x="60" y="136" width="170" height="28" class="purple"/>
  <text x="145" y="155" text-anchor="middle" class="sm">queue + prefill</text>
  <line x1="230" y1="130" x2="230" y2="170" stroke="#82b366" stroke-width="3"/>
  <line x1="262" y1="130" x2="262" y2="170" stroke="#82b366" stroke-width="3"/>
  <line x1="294" y1="130" x2="294" y2="170" stroke="#82b366" stroke-width="3"/>
  <line x1="326" y1="130" x2="326" y2="170" stroke="#82b366" stroke-width="3"/>
  <line x1="358" y1="130" x2="358" y2="170" stroke="#82b366" stroke-width="3"/>
  <line x1="430" y1="130" x2="430" y2="170" stroke="#82b366" stroke-width="3"/>
  <line x1="462" y1="130" x2="462" y2="170" stroke="#82b366" stroke-width="3"/>
  <line x1="494" y1="130" x2="494" y2="170" stroke="#82b366" stroke-width="3"/>
  <text x="230" y="186" text-anchor="middle" class="sm">token 1</text>
  <text x="262" y="186" text-anchor="middle" class="sm">2</text>
  <text x="294" y="186" text-anchor="middle" class="sm">3</text>
  <text x="580" y="155" text-anchor="middle">⋯</text>
  <line x1="640" y1="130" x2="640" y2="170" stroke="#82b366" stroke-width="3"/>
  <line x1="672" y1="130" x2="672" y2="170" stroke="#82b366" stroke-width="3"/>
  <line x1="704" y1="130" x2="704" y2="170" stroke="#82b366" stroke-width="3"/>
  <line x1="736" y1="130" x2="736" y2="170" stroke="#82b366" stroke-width="3"/>
  <text x="736" y="186" text-anchor="middle" class="sm">token N</text>
  <path d="M232,112 L260,112" class="edge" style="marker-start:url(#arrow)"/>
  <text x="246" y="104" text-anchor="middle" class="sm">ITL</text>
  <path d="M360,112 L428,112" class="edge" style="marker-start:url(#arrow)"/>
  <text x="394" y="104" text-anchor="middle" class="sm">a longer ITL (stall)</text>
  <path d="M60,62 L60,54 L230,54 L230,62" class="axis"/>
  <text x="145.0" y="46" text-anchor="middle" class="sm b">TTFT</text>
  <path d="M230,210 L230,218 L736,218 L736,210" class="axis"/>
  <text x="483" y="236" text-anchor="middle" class="sm b">decode time = TPOT × (N − 1)</text>
  <path d="M60,246 L60,254 L736,254 L736,246" class="axis"/>
  <text x="398.0" y="272" text-anchor="middle" class="sm b">end-to-end latency = TTFT + TPOT × (N − 1)</text>
  <text x="16" y="294" class="sm">ITL: each individual gap. TPOT: the average gap of one request, excluding the first token. Example: 0.2 s + 21.4 ms × 499 ≈ 10.9 s.</text>
</svg>
