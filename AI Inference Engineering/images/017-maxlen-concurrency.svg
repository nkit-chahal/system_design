<svg xmlns="http://www.w3.org/2000/svg" width="760" height="362" viewBox="0 0 760 362" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .axis{stroke:#000;stroke-width:1.2;fill:none}
    .grid{stroke:#ddd;stroke-width:1}
    .good{stroke:#82b366;stroke-width:2;stroke-dasharray:6 4}
    .bad{font-size:12px;fill:#b85450}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="20" y="24" class="b">Llama 3.1 8B on one H100 (426K cached tokens): vLLM's "Maximum concurrency"</text>

  <!-- grid and axes: y = 270 - 1.1667 * value -->
  <line x1="100" y1="200" x2="700" y2="200" class="grid"/>
  <line x1="100" y1="130" x2="700" y2="130" class="grid"/>
  <line x1="100" y1="60" x2="700" y2="60" class="grid"/>
  <path d="M100,56 V270 H700" class="axis"/>
  <text x="92" y="274" text-anchor="end" class="sm">0</text>
  <text x="92" y="204" text-anchor="end" class="sm">60</text>
  <text x="92" y="134" text-anchor="end" class="sm">120</text>
  <text x="92" y="64" text-anchor="end" class="sm">180</text>
  <text x="40" y="165" text-anchor="middle" class="sm" transform="rotate(-90 40 165)">requests that fit at full length</text>

  <!-- chat line at 170 -->
  <line x1="100" y1="71.7" x2="700" y2="71.7" class="good"/>
  <text x="696" y="90" text-anchor="end" class="sm">real chat traffic (2,500 tokens each): ≈ 170 fit under every limit shown</text>

  <!-- bars -->
  <rect x="135" y="148.7" width="80" height="121.3" class="purple"/>
  <text x="175" y="141" text-anchor="middle" class="b">104×</text>
  <rect x="285" y="209.3" width="80" height="60.7" class="purple"/>
  <text x="325" y="202" text-anchor="middle" class="b">52×</text>
  <rect x="435" y="254.8" width="80" height="15.2" class="purple"/>
  <text x="475" y="247" text-anchor="middle" class="b">13×</text>
  <rect x="585" y="266.2" width="80" height="3.8" class="purple"/>
  <text x="625" y="258" text-anchor="middle" class="b">3.25×</text>

  <text x="175" y="290" text-anchor="middle" class="sm">4,096</text>
  <text x="325" y="290" text-anchor="middle" class="sm">8,192</text>
  <text x="475" y="290" text-anchor="middle" class="sm">32,768</text>
  <text x="625" y="290" text-anchor="middle" class="sm">131,072</text>
  <text x="400" y="312" text-anchor="middle" class="sm">--max-model-len (tokens)</text>

  <!-- L4 row -->
  <text x="20" y="344" class="sm b">L4 (≈ 27K):</text>
  <text x="175" y="344" text-anchor="middle" class="sm">6.6×</text>
  <text x="325" y="344" text-anchor="middle" class="sm">3.3×</text>
  <text x="475" y="344" text-anchor="middle" class="bad">fails at startup</text>
  <text x="625" y="344" text-anchor="middle" class="bad">fails at startup</text>
</svg>
