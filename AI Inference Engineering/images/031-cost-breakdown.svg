<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .grid{fill:none;stroke:#e6e6e6;stroke-width:1}
    .thr{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:6 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="26" class="b">Chat request: 2,000 prompt tokens (1,500 cached) and 500 output tokens</text>
  <text x="16" y="70">By tokens</text><text x="16" y="86" class="sm">2,500 tokens</text>
  <rect x="190.0" y="50" width="360.0" height="38" class="blue"/>
  <text x="370.0" y="74" text-anchor="middle" class="sm">1,500 cached input</text>
  <rect x="550.0" y="50" width="120.0" height="38" class="orange"/>
  <text x="610.0" y="74" text-anchor="middle" class="sm">500 input</text>
  <rect x="670.0" y="50" width="120.0" height="38" class="red"/>
  <text x="730.0" y="74" text-anchor="middle" class="sm">500 output</text>
  <text x="16" y="140">By cost</text><text x="16" y="156" class="sm">$0.000132</text>
  <rect x="190.0" y="120" width="17.7" height="38" class="blue"/>
  <rect x="207.7" y="120" width="59.1" height="38" class="orange"/>
  <rect x="266.9" y="120" width="523.1" height="38" class="red"/>
  <text x="528.4" y="144" text-anchor="middle" class="sm">output: $0.000115 (87%)</text>
  <text x="190" y="178" class="sm">cached input $0.0000039 + uncached input $0.000013</text>
  <path d="M200,166 L200,160" stroke="#000"/>
  <line x1="16" y1="200" x2="804" y2="200" stroke="#999" stroke-dasharray="5 4"/>
  <text x="16" y="228" class="b">Document request: 30,000 uncached prompt tokens and 300 output tokens</text>
  <text x="16" y="270">By cost</text><text x="16" y="286" class="sm">$0.000849</text>
  <rect x="190.0" y="250" width="551.2" height="38" class="orange"/>
  <text x="465.6" y="274" text-anchor="middle" class="sm">input: $0.00078</text>
  <rect x="741.2" y="250" width="48.8" height="38" class="red"/>
  <text x="190" y="314" class="sm">output $0.000069; about 6.4 times the chat request. Rates $0.026, $0.0026 and $0.23 per million (Lesson 20)</text>
  
</svg>
