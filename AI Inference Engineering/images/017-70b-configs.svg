<svg xmlns="http://www.w3.org/2000/svg" width="850" height="384" viewBox="0 0 850 384" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .held{fill:url(#hatch);stroke:#666;stroke-width:1.2}
    .ref{stroke:#000;stroke-width:1;stroke-dasharray:4 3}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="20" y="22" class="b">Llama 3.1 70B on H100s: memory per GPU at --gpu-memory-utilization 0.90</text>

  <!-- 6 px per GiB from x=150. Budget line at 71.6 GiB, GPU edge at 79.6 GiB -->
  <text x="150" y="48" class="sm">0</text>
  <text x="575" y="48" text-anchor="end" class="sm">budget 71.6</text>
  <text x="631" y="48" class="sm">GPU 79.6 GiB</text>
  <line x1="579.8" y1="54" x2="579.8" y2="340" class="ref"/>

  <!-- TP=1 BF16 -->
  <text x="20" y="77">TP=1 · BF16</text>
  <rect x="150" y="60" width="477.6" height="24" class="orange"/>
  <text x="389" y="77" text-anchor="middle" class="sm">weights 131.4 GiB per GPU</text>
  <rect x="627.6" y="60" width="10" height="24" class="red"/>
  <text x="648" y="77" class="sm">does not load: weights &gt; GPU</text>

  <!-- TP=1 FP8 -->
  <text x="20" y="113">TP=1 · FP8</text>
  <rect x="150" y="96" width="406" height="24" class="orange"/>
  <text x="353" y="113" text-anchor="middle" class="sm">67.7 GiB</text>
  <rect x="556" y="96" width="30" height="24" class="red"/>
  <rect x="586" y="96" width="41.6" height="24" class="held"/>
  <text x="648" y="113" class="sm">no room for the KV cache</text>

  <!-- TP=2 BF16 -->
  <text x="20" y="149">TP=2 · BF16</text>
  <rect x="150" y="132" width="394.3" height="24" class="orange"/>
  <text x="347" y="149" text-anchor="middle" class="sm">65.7 GiB</text>
  <rect x="544.3" y="132" width="30" height="24" class="gray"/>
  <rect x="574.3" y="132" width="5.6" height="24" class="blue"/>
  <rect x="579.9" y="132" width="47.7" height="24" class="held"/>
  <text x="648" y="149" class="sm">≈ 6K tokens: not usable</text>

  <!-- TP=2 FP8 -->
  <text x="20" y="185">TP=2 · FP8</text>
  <rect x="150" y="168" width="203" height="24" class="orange"/>
  <text x="251" y="185" text-anchor="middle" class="sm">33.8 GiB</text>
  <rect x="353" y="168" width="30" height="24" class="gray"/>
  <rect x="383" y="168" width="196.9" height="24" class="blue"/>
  <text x="481" y="185" text-anchor="middle" class="sm">32.8 GiB</text>
  <rect x="579.9" y="168" width="47.7" height="24" class="held"/>
  <text x="648" y="185" class="sm">215K tokens · 85 chats</text>

  <!-- TP=4 BF16 -->
  <text x="20" y="221">TP=4 · BF16</text>
  <rect x="150" y="204" width="197.1" height="24" class="orange"/>
  <text x="249" y="221" text-anchor="middle" class="sm">32.9 GiB</text>
  <rect x="347.1" y="204" width="30" height="24" class="gray"/>
  <rect x="377.1" y="204" width="202.8" height="24" class="blue"/>
  <text x="478" y="221" text-anchor="middle" class="sm">33.8 GiB</text>
  <rect x="579.9" y="204" width="47.7" height="24" class="held"/>
  <text x="648" y="221" class="sm">443K tokens · 177 chats</text>

  <!-- TP=4 FP8 -->
  <text x="20" y="257">TP=4 · FP8</text>
  <rect x="150" y="240" width="101.5" height="24" class="orange"/>
  <text x="201" y="257" text-anchor="middle" class="sm">16.9 GiB</text>
  <rect x="251.5" y="240" width="30" height="24" class="gray"/>
  <rect x="281.5" y="240" width="298.4" height="24" class="blue"/>
  <text x="431" y="257" text-anchor="middle" class="sm">49.7 GiB</text>
  <rect x="579.9" y="240" width="47.7" height="24" class="held"/>
  <text x="648" y="257" class="sm">652K tokens · 260 chats</text>

  <!-- TP=8 BF16 -->
  <text x="20" y="293">TP=8 · BF16</text>
  <rect x="150" y="276" width="98.6" height="24" class="orange"/>
  <text x="199" y="293" text-anchor="middle" class="sm">16.4 GiB</text>
  <rect x="248.6" y="276" width="30" height="24" class="gray"/>
  <rect x="278.6" y="276" width="301.3" height="24" class="blue"/>
  <text x="429" y="293" text-anchor="middle" class="sm">50.2 GiB</text>
  <rect x="579.9" y="276" width="47.7" height="24" class="held"/>
  <text x="648" y="293" class="sm">1.32M tokens · 526 chats</text>

  <!-- TP=8 FP8 -->
  <text x="20" y="329">TP=8 · FP8</text>
  <rect x="150" y="312" width="50.8" height="24" class="orange"/>
  <text x="175" y="329" text-anchor="middle" class="sm">8.5</text>
  <rect x="200.8" y="312" width="30" height="24" class="gray"/>
  <rect x="230.8" y="312" width="349.1" height="24" class="blue"/>
  <text x="405" y="329" text-anchor="middle" class="sm">58.2 GiB</text>
  <rect x="579.9" y="312" width="47.7" height="24" class="held"/>
  <text x="648" y="329" class="sm">1.53M tokens · 610 chats</text>

  <!-- Legend -->
  <rect x="20" y="358" width="16" height="12" class="orange"/><text x="42" y="369" class="sm">weights per GPU</text>
  <rect x="160" y="358" width="16" height="12" class="gray"/><text x="182" y="369" class="sm">runtime, 5 GiB assumed</text>
  <rect x="340" y="358" width="16" height="12" class="blue"/><text x="362" y="369" class="sm">KV cache</text>
  <rect x="440" y="358" width="16" height="12" class="held"/><text x="462" y="369" class="sm">held back</text>
  <rect x="550" y="358" width="16" height="12" class="red"/><text x="572" y="369" class="sm">over the budget</text>
</svg>
