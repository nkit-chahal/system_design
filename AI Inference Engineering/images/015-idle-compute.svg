<svg xmlns="http://www.w3.org/2000/svg" width="840" height="318" viewBox="0 0 840 318" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.lg{font-size:16px}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .axis{stroke:#000;stroke-width:1.2;fill:none}
    .grid{stroke:#ddd;stroke-width:1;fill:none}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="56" class="b">1 token per step</text>
  <rect x="200" y="30" width="479.0" height="20" class="blue"/>
  <text x="687.0" y="45" class="sm">read weights 4.79 ms</text>
  <rect x="200" y="56" width="2.0" height="20" class="orange"/>
  <text x="210.0" y="71" class="sm">arithmetic 0.016 ms</text>
  <text x="16" y="130" class="b">5 tokens per step</text>
  <rect x="200" y="104" width="479.0" height="20" class="blue"/>
  <text x="687.0" y="119" class="sm">read weights 4.79 ms</text>
  <rect x="200" y="130" width="8.1" height="20" class="orange"/>
  <text x="216.1" y="145" class="sm">arithmetic 0.081 ms</text>
  <text x="16" y="204" class="b">≈ 295 tokens per step</text>
  <rect x="200" y="178" width="479.0" height="20" class="blue"/>
  <text x="687.0" y="193" class="sm">read weights 4.79 ms</text>
  <rect x="200" y="204" width="479.0" height="20" class="orange"/>
  <text x="687.0" y="219" class="sm">arithmetic 4.79 ms</text>
  <path d="M200,242 L700,242" class="axis"/>
  <line x1="200" y1="242" x2="200" y2="247" stroke="#000" stroke-width="1"/>
  <text x="200" y="262" text-anchor="middle" class="sm">0 ms</text>
  <line x1="300" y1="242" x2="300" y2="247" stroke="#000" stroke-width="1"/>
  <text x="300" y="262" text-anchor="middle" class="sm">1 ms</text>
  <line x1="400" y1="242" x2="400" y2="247" stroke="#000" stroke-width="1"/>
  <text x="400" y="262" text-anchor="middle" class="sm">2 ms</text>
  <line x1="500" y1="242" x2="500" y2="247" stroke="#000" stroke-width="1"/>
  <text x="500" y="262" text-anchor="middle" class="sm">3 ms</text>
  <line x1="600" y1="242" x2="600" y2="247" stroke="#000" stroke-width="1"/>
  <text x="600" y="262" text-anchor="middle" class="sm">4 ms</text>
  <line x1="700" y1="242" x2="700" y2="247" stroke="#000" stroke-width="1"/>
  <text x="700" y="262" text-anchor="middle" class="sm">5 ms</text>
  <text x="16" y="288" class="sm">Llama 3.1 8B in BF16 on one H100: 16.06 GB of weights ÷ 3.35 TB/s, and 16 GFLOPs per token ÷ 989 TFLOPS.</text>
  <text x="16" y="304" class="sm">The step takes the longer of the two, so extra tokens are almost free until about 295 tokens per step.</text>
</svg>
