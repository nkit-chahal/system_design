<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .held{fill:url(#hatch);stroke:#666;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="22" class="b">One H100 (≈ 79.6 GiB), vLLM with --gpu-memory-utilization 0.90 set explicitly (9 px per GiB)</text>

  <text x="40" y="54" class="b">BF16: weights 14.96 GiB</text>
  <rect x="40" y="62" width="134.6" height="40" class="orange"/>
  <rect x="174.6" y="62" width="41.4" height="40" class="gray"/>
  <rect x="216" y="62" width="468.9" height="40" class="blue"/>
  <text x="450" y="87" text-anchor="middle" class="sm">KV cache ≈ 52.1 GiB ≈ 426K tokens</text>
  <rect x="684.9" y="62" width="71.6" height="40" class="held"/>

  <text x="40" y="132" class="b">FP8 dynamic: weights 8.46 GiB</text>
  <rect x="40" y="140" width="76.1" height="40" class="orange"/>
  <rect x="116.1" y="140" width="41.4" height="40" class="gray"/>
  <rect x="157.5" y="140" width="527.4" height="40" class="blue"/>
  <text x="421" y="165" text-anchor="middle" class="sm">KV cache ≈ 58.6 GiB ≈ 480K tokens</text>
  <rect x="684.9" y="140" width="71.6" height="40" class="held"/>

  <text x="40" y="210" class="b">W4A16: weights 5.34 GiB</text>
  <rect x="40" y="218" width="48.1" height="40" class="orange"/>
  <rect x="88.1" y="218" width="41.4" height="40" class="gray"/>
  <rect x="129.5" y="218" width="555.4" height="40" class="blue"/>
  <text x="407" y="243" text-anchor="middle" class="sm">KV cache ≈ 61.7 GiB ≈ 505K tokens</text>
  <rect x="684.9" y="218" width="71.6" height="40" class="held"/>

  <rect x="40" y="272" width="18" height="12" class="orange"/><text x="64" y="283" class="sm">weights</text>
  <rect x="130" y="272" width="18" height="12" class="gray"/><text x="154" y="283" class="sm">activations and graphs (≈ 4.6 GiB, held fixed)</text>
  <rect x="440" y="272" width="18" height="12" class="blue"/><text x="464" y="283" class="sm">KV cache</text>
  <rect x="540" y="272" width="18" height="12" class="held"/><text x="564" y="283" class="sm">10% held back</text>
  <text x="16" y="312" class="sm">nvidia-smi reports about the same used memory for all three: the engine turns saved weight memory into cache.</text>
</svg>
