<svg xmlns="http://www.w3.org/2000/svg" width="830" height="300" viewBox="0 0 830 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Gateway pods -->
  <rect x="16" y="40" width="150" height="40" rx="6" class="orange"/><text x="91" y="65" text-anchor="middle">gateway pod 1</text>
  <rect x="16" y="100" width="150" height="40" rx="6" class="orange"/><text x="91" y="125" text-anchor="middle">gateway pod 2</text>
  <rect x="16" y="160" width="150" height="40" rx="6" class="orange"/><text x="91" y="185" text-anchor="middle">gateway pod 3</text>
  <rect x="16" y="220" width="150" height="40" rx="6" class="orange"/><text x="91" y="245" text-anchor="middle">gateway pod 4</text>
  <path d="M166,60 L298,140" class="edge"/>
  <path d="M166,120 L298,156" class="edge"/>
  <path d="M166,180 L298,172" class="edge"/>
  <path d="M166,240 L298,188" class="edge"/>
  <text x="200" y="276" class="sm">one round trip per request</text>

  <!-- Lua script -->
  <rect x="300" y="16" width="190" height="50" rx="6" class="gray"/>
  <text x="395" y="37" text-anchor="middle" class="sm b">token_bucket.lua</text>
  <text x="395" y="54" text-anchor="middle" class="sm">refill, check, take: atomic</text>
  <path d="M395,66 L395,98" class="edge"/>

  <!-- Redis cylinder -->
  <path d="M300,108 L300,230 A95,14 0 0 0 490,230 L490,108" class="blue"/>
  <ellipse cx="395" cy="108" rx="95" ry="14" class="blue"/>
  <text x="395" y="146" text-anchor="middle" class="b">Redis</text>
  <text x="395" y="170" text-anchor="middle" class="sm">rl:{acme}:req</text>
  <text x="395" y="188" text-anchor="middle" class="sm">rl:{acme}:in</text>
  <text x="395" y="206" text-anchor="middle" class="sm">rl:{acme}:out</text>

  <!-- Failure modes -->
  <text x="530" y="28" class="b">Failure modes</text>
  <rect x="530" y="40" width="284" height="50" rx="6" class="red"/>
  <text x="542" y="60" class="sm b">Redis unreachable</text>
  <text x="542" y="78" class="sm">fail open to a local limit of limit ÷ 4</text>
  <rect x="530" y="100" width="284" height="50" rx="6" class="red"/>
  <text x="542" y="120" class="sm b">Failover loses recent writes</text>
  <text x="542" y="138" class="sm">brief over-admission after promotion</text>
  <rect x="530" y="160" width="284" height="50" rx="6" class="red"/>
  <text x="542" y="180" class="sm b">Gateway crashes mid-stream</text>
  <text x="542" y="198" class="sm">reservation expires after a lease</text>
  <rect x="530" y="220" width="284" height="50" rx="6" class="red"/>
  <text x="542" y="240" class="sm b">One very busy tenant</text>
  <text x="542" y="258" class="sm">hot key: keep the script O(1)</text>
</svg>
