<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
    <pattern id="redhatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#e0a8a6" stroke-width="3"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .dedge{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4;marker-end:url(#arrow)}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .tick{stroke:#000;stroke-width:1}
    .grid{stroke:#e3e3e3;stroke-width:1}
    .guide{stroke:#666;stroke-width:1;stroke-dasharray:5 4;fill:none}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <rect x="10" y="8" width="270" height="404" rx="4" class="group"/>
  <text x="145" y="34" text-anchor="middle" class="lg b">HPA + Prometheus Adapter</text>
  <rect x="40" y="50" width="210" height="46" rx="6" class="orange"/>
  <text x="145.0" y="69.0" text-anchor="middle">vLLM pods</text>
  <text x="145.0" y="86.0" text-anchor="middle" class="sm">/metrics endpoint</text>
  <path d="M145,96 L145,112" class="edge"/>
  <path d="M45.0,122 v30 a100.0,8 0 0 0 200,0 v-30" class="blue"/>
  <ellipse cx="145" cy="122" rx="100.0" ry="8" class="blue"/>
  <text x="145" y="145.5" text-anchor="middle">Prometheus</text>
  <path d="M145,160 L145,176" class="edge"/>
  <rect x="40" y="178" width="210" height="46" rx="6" class="gray"/>
  <text x="145.0" y="197.0" text-anchor="middle">Prometheus Adapter</text>
  <text x="145.0" y="214.0" text-anchor="middle" class="sm">custom / external metrics API</text>
  <path d="M145,224 L145,240" class="edge"/>
  <rect x="40" y="242" width="210" height="46" rx="6" class="purple"/>
  <text x="145.0" y="261.0" text-anchor="middle">HorizontalPodAutoscaler</text>
  <text x="145.0" y="278.0" text-anchor="middle" class="sm">autoscaling/v2</text>
  <path d="M145,288 L145,304" class="edge"/>
  <rect x="40" y="306" width="210" height="46" rx="6" class="white"/>
  <text x="145.0" y="325.0" text-anchor="middle">Deployment</text>
  <text x="145.0" y="342.0" text-anchor="middle" class="sm">replicas = N</text>
  <text x="145" y="378" text-anchor="middle" class="sm">Signal: any PromQL you map</text>
  <text x="145" y="395" text-anchor="middle" class="sm">to a pods or external metric</text>
  <rect x="295" y="8" width="270" height="404" rx="4" class="group"/>
  <text x="430" y="34" text-anchor="middle" class="lg b">KEDA</text>
  <rect x="325" y="50" width="210" height="46" rx="6" class="orange"/>
  <text x="430.0" y="69.0" text-anchor="middle">vLLM pods</text>
  <text x="430.0" y="86.0" text-anchor="middle" class="sm">/metrics endpoint</text>
  <path d="M430,96 L430,112" class="edge"/>
  <path d="M330.0,122 v30 a100.0,8 0 0 0 200,0 v-30" class="blue"/>
  <ellipse cx="430" cy="122" rx="100.0" ry="8" class="blue"/>
  <text x="430" y="145.5" text-anchor="middle">Prometheus</text>
  <path d="M430,160 L430,176" class="edge"/>
  <rect x="325" y="178" width="210" height="46" rx="6" class="purple"/>
  <text x="430.0" y="197.0" text-anchor="middle">ScaledObject</text>
  <text x="430.0" y="214.0" text-anchor="middle" class="sm">prometheus + cron triggers</text>
  <path d="M430,224 L430,240" class="edge"/>
  <rect x="325" y="242" width="210" height="46" rx="6" class="purple"/>
  <text x="430.0" y="261.0" text-anchor="middle">HorizontalPodAutoscaler</text>
  <text x="430.0" y="278.0" text-anchor="middle" class="sm">created and fed by KEDA</text>
  <path d="M430,288 L430,304" class="edge"/>
  <rect x="325" y="306" width="210" height="46" rx="6" class="white"/>
  <text x="430.0" y="325.0" text-anchor="middle">Deployment</text>
  <text x="430.0" y="342.0" text-anchor="middle" class="sm">replicas = 0 or N</text>
  <text x="430" y="378" text-anchor="middle" class="sm">Signal: any PromQL query;</text>
  <text x="430" y="395" text-anchor="middle" class="sm">KEDA itself handles 0 ↔ 1</text>
  <rect x="580" y="8" width="270" height="404" rx="4" class="group"/>
  <text x="715" y="34" text-anchor="middle" class="lg b">Knative (KPA)</text>
  <rect x="610" y="50" width="210" height="46" rx="6" class="gray"/>
  <text x="715.0" y="69.0" text-anchor="middle">activator</text>
  <text x="715.0" y="86.0" text-anchor="middle" class="sm">holds requests at zero</text>
  <path d="M715,96 L715,112" class="edge"/>
  <rect x="610" y="114" width="210" height="46" rx="6" class="orange"/>
  <text x="715.0" y="133.0" text-anchor="middle">pod: queue-proxy + vLLM</text>
  <text x="715.0" y="150.0" text-anchor="middle" class="sm">counts in-flight requests</text>
  <path d="M715,160 L715,176" class="edge"/>
  <rect x="610" y="178" width="210" height="46" rx="6" class="purple"/>
  <text x="715.0" y="197.0" text-anchor="middle">Knative autoscaler</text>
  <text x="715.0" y="214.0" text-anchor="middle" class="sm">60 s stable, 6 s panic window</text>
  <path d="M715,224 L715,240" class="edge"/>
  <rect x="610" y="242" width="210" height="46" rx="6" class="white"/>
  <text x="715.0" y="261.0" text-anchor="middle">Revision</text>
  <text x="715.0" y="278.0" text-anchor="middle" class="sm">pods = 0 or N</text>
  <text x="715" y="378" text-anchor="middle" class="sm">Signal: in-flight HTTP requests</text>
  <text x="715" y="395" text-anchor="middle" class="sm">per pod (concurrency)</text>
</svg>
