<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="320" fill="#fff"/>

  <text x="20" y="24" class="b">Unfused: residual add and RMSNorm as separate kernels (simplified)</text>
  <path d="M175,60 L175,42 L470,42 L470,58" class="edge"/>
  <rect x="20" y="60" width="110" height="44" rx="6" class="orange"/>
  <text x="75" y="87" text-anchor="middle">h = x + res</text>
  <rect x="150" y="66" width="50" height="32" rx="4" class="blue"/>
  <text x="175" y="87" text-anchor="middle">h</text>
  <rect x="220" y="60" width="110" height="44" rx="6" class="orange"/>
  <text x="275" y="87" text-anchor="middle">mean of h²</text>
  <rect x="350" y="66" width="50" height="32" rx="4" class="blue"/>
  <text x="375" y="87" text-anchor="middle">var</text>
  <rect x="420" y="60" width="130" height="44" rx="6" class="orange"/>
  <text x="485" y="87" text-anchor="middle">normalize × w</text>
  <rect x="570" y="66" width="50" height="32" rx="4" class="blue"/>
  <text x="595" y="87" text-anchor="middle">y</text>
  <rect x="640" y="60" width="150" height="44" rx="6" class="gray"/>
  <text x="715" y="87" text-anchor="middle">QKV projection</text>
  <path d="M130,82 L148,82" class="edge"/>
  <path d="M200,82 L218,82" class="edge"/>
  <path d="M330,82 L348,82" class="edge"/>
  <path d="M400,82 L418,82" class="edge"/>
  <path d="M550,82 L568,82" class="edge"/>
  <path d="M620,82 L638,82" class="edge"/>
  <text x="20" y="128" class="sm">3 launches; h is written once and read twice, var written and read: every arrow into a blue box is an HBM round trip.</text>

  <text x="20" y="170" class="b">Fused: one kernel keeps h and var in registers</text>
  <rect x="20" y="184" width="250" height="44" rx="6" class="orange"/>
  <text x="145" y="211" text-anchor="middle">fused add + RMSNorm</text>
  <rect x="290" y="190" width="50" height="32" rx="4" class="blue"/>
  <text x="315" y="211" text-anchor="middle">y</text>
  <rect x="360" y="184" width="150" height="44" rx="6" class="gray"/>
  <text x="435" y="211" text-anchor="middle">QKV projection</text>
  <path d="M270,206 L288,206" class="edge"/>
  <path d="M340,206 L358,206" class="edge"/>
  <rect x="530" y="184" width="270" height="44" rx="6" class="green"/>
  <text x="665" y="203" text-anchor="middle" class="sm">1 launch instead of 3;</text>
  <text x="665" y="219" text-anchor="middle" class="sm">h and var never touch HBM</text>

  <rect x="20" y="248" width="780" height="56" rx="4" class="gray"/>
  <text x="34" y="270" class="sm">Prefill of 2,000 tokens: each tensor is 2,000 × 4,096 × 2 bytes = 16 MiB, so fusion saves memory traffic.</text>
  <text x="34" y="290" class="sm">Decode of 53 streams: each tensor is 0.4 MiB, so fusion mostly saves kernel launches and their fixed cost.</text>
</svg>
