<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .note{fill:#fff;stroke:#999;stroke-width:1}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .tie{fill:none;stroke:#999;stroke-width:1;stroke-dasharray:3 3}
    .link{fill:none;stroke:#000;stroke-width:2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="16" y="22" class="sm">Metric names without the DCGM_FI_ prefix; * = not in dcgm-exporter's default list</text>

  <!-- H100 package -->
  <rect x="250" y="44" width="360" height="300" rx="6" class="group"/>
  <text x="264" y="66" class="b">H100 SXM</text>

  <!-- SM array -->
  <rect x="270" y="78" width="200" height="150" rx="6" class="orange"/>
  <text x="370" y="98" text-anchor="middle" class="b">132 SMs</text>
  <g fill="#fff" stroke="#d79b00" stroke-width="1">
    <rect x="284" y="108" width="20" height="20"/><rect x="308" y="108" width="20" height="20"/><rect x="332" y="108" width="20" height="20"/><rect x="356" y="108" width="20" height="20"/><rect x="380" y="108" width="20" height="20"/><rect x="404" y="108" width="20" height="20"/><rect x="428" y="108" width="20" height="20"/>
    <rect x="284" y="132" width="20" height="20"/><rect x="308" y="132" width="20" height="20"/><rect x="332" y="132" width="20" height="20"/><rect x="356" y="132" width="20" height="20"/><rect x="380" y="132" width="20" height="20"/><rect x="404" y="132" width="20" height="20"/><rect x="428" y="132" width="20" height="20"/>
    <rect x="284" y="156" width="20" height="20"/><rect x="308" y="156" width="20" height="20"/><rect x="332" y="156" width="20" height="20"/><rect x="356" y="156" width="20" height="20"/><rect x="380" y="156" width="20" height="20"/><rect x="404" y="156" width="20" height="20"/><rect x="428" y="156" width="20" height="20"/>
  </g>
  <text x="370" y="200" text-anchor="middle" class="sm">each with 4 tensor cores</text>
  <text x="370" y="216" text-anchor="middle" class="sm">and warp schedulers</text>

  <!-- HBM -->
  <rect x="490" y="78" width="104" height="150" rx="6" class="blue"/>
  <text x="542" y="140" text-anchor="middle" class="b">HBM3</text>
  <text x="542" y="158" text-anchor="middle" class="sm">80 GB</text>
  <text x="542" y="174" text-anchor="middle" class="sm">3.35 TB/s</text>

  <!-- Power and thermal -->
  <rect x="270" y="246" width="324" height="40" rx="6" class="gray"/>
  <text x="432" y="271" text-anchor="middle">power and thermal control, clocks</text>
  <rect x="270" y="296" width="324" height="34" rx="6" class="gray"/>
  <text x="432" y="318" text-anchor="middle">driver (reports XID errors)</text>

  <!-- PCIe to host -->
  <rect x="40" y="138" width="110" height="46" rx="6" class="gray"/>
  <text x="95" y="166" text-anchor="middle">host CPU</text>
  <path d="M150,161 L250,161" class="link"/>
  <text x="200" y="154" text-anchor="middle" class="sm">PCIe</text>

  <!-- NVLink to peers -->
  <rect x="712" y="138" width="120" height="46" rx="6" class="gray"/>
  <text x="772" y="166" text-anchor="middle">peer GPUs</text>
  <path d="M610,161 L712,161" class="link"/>
  <text x="661" y="154" text-anchor="middle" class="sm">NVLink</text>

  <rect x="10" y="30" width="232" height="92" rx="4" class="note"/>
  <text x="20" y="50" class="sm">GPU_UTIL</text>
  <text x="20" y="66" class="sm">PROF_GR_ENGINE_ACTIVE</text>
  <text x="20" y="82" class="sm">PROF_SM_ACTIVE*</text>
  <text x="20" y="98" class="sm">PROF_SM_OCCUPANCY*</text>
  <text x="20" y="114" class="sm">PROF_PIPE_TENSOR_ACTIVE</text>
  <path d="M242,90 L270,100" class="tie"/>
  <rect x="612" y="30" width="244" height="92" rx="4" class="note"/>
  <text x="620" y="50" class="sm">PROF_DRAM_ACTIVE</text>
  <text x="620" y="66" class="sm">FB_USED, FB_FREE</text>
  <text x="620" y="82" class="sm">MEMORY_TEMP</text>
  <text x="620" y="98" class="sm">ECC_DBE_VOL_TOTAL*</text>
  <text x="620" y="114" class="sm">UNCORRECTABLE_REMAPPED_ROWS</text>
  <path d="M612,100 L594,110" class="tie"/>
  <rect x="10" y="196" width="232" height="60" rx="4" class="note"/>
  <text x="20" y="216" class="sm">PROF_PCIE_TX_BYTES</text>
  <text x="20" y="232" class="sm">PROF_PCIE_RX_BYTES</text>
  <text x="20" y="248" class="sm">PCIE_REPLAY_COUNTER</text>
  <path d="M200,196 L200,165" class="tie"/>
  <rect x="612" y="196" width="244" height="60" rx="4" class="note"/>
  <text x="620" y="216" class="sm">NVLINK_BANDWIDTH_TOTAL</text>
  <text x="620" y="232" class="sm">PROF_NVLINK_TX_BYTES*</text>
  <text x="620" y="248" class="sm">PROF_NVLINK_RX_BYTES*</text>
  <path d="M661,196 L661,165" class="tie"/>
  <!-- Notes: power (bottom) -->
  <rect x="16" y="356" width="560" height="56" rx="4" class="note"/>
  <text x="26" y="376" class="sm">POWER_USAGE, ENFORCED_POWER_LIMIT*, GPU_TEMP, SM_CLOCK</text>
  <text x="26" y="394" class="sm">POWER_VIOLATION*, THERMAL_VIOLATION* (time spent throttled)</text>
  <path d="M300,356 L300,286" class="tie"/>

  <!-- Notes: XID -->
  <rect x="612" y="356" width="244" height="56" rx="4" class="note"/>
  <text x="632" y="376" class="sm">XID_ERRORS</text>
  <text x="632" y="394" class="sm">(code of the last XID error)</text>
  <path d="M622,384 L594,318" class="tie"/>
</svg>
