<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .wh{fill:none;stroke:#000;stroke-width:1.5}
    .run{fill:#fff;stroke:#000;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Legend -->
  <rect x="60" y="10" width="18" height="12" class="orange"/><text x="84" y="21" class="sm">Engine A</text>
  <rect x="160" y="10" width="18" height="12" class="purple"/><text x="184" y="21" class="sm">Engine B</text>
  <text x="270" y="21" class="sm">Illustrative values, not measurements. Bar = median of 3 runs, whisker = min to max, dot = one run.</text>

  <!-- Panel 1: throughput, overlapping ranges -->
  <text x="210" y="50" text-anchor="middle" class="b">Output tokens/s (higher is better)</text>
  <path d="M60,60 L60,250 L360,250" class="axis"/>
  <rect x="130" y="136" width="60" height="114" class="orange"/>
  <rect x="230" y="132.2" width="60" height="117.8" class="purple"/>
  <path d="M160,145.5 L160,128.4 M152,145.5 L168,145.5 M152,128.4 L168,128.4" class="wh"/>
  <path d="M260,139.8 L260,124.6 M252,139.8 L268,139.8 M252,124.6 L268,124.6" class="wh"/>
  <circle cx="160" cy="145.5" r="3" class="run"/><circle cx="160" cy="136" r="3" class="run"/><circle cx="160" cy="128.4" r="3" class="run"/>
  <circle cx="260" cy="139.8" r="3" class="run"/><circle cx="260" cy="132.2" r="3" class="run"/><circle cx="260" cy="124.6" r="3" class="run"/>
  <text x="160" y="268" text-anchor="middle" class="sm">Engine A</text>
  <text x="260" y="268" text-anchor="middle" class="sm">Engine B</text>
  <text x="210" y="96" text-anchor="middle" class="sm">B's median is 3% higher,</text>
  <text x="210" y="112" text-anchor="middle" class="sm">but the run ranges overlap</text>
  <text x="210" y="296" text-anchor="middle" class="b">Overlapping ranges: call it a tie</text>

  <!-- Panel 2: p99 TTFT, separated ranges -->
  <text x="630" y="50" text-anchor="middle" class="b">p99 TTFT (lower is better)</text>
  <path d="M480,60 L480,250 L780,250" class="axis"/>
  <rect x="550" y="174" width="60" height="76" class="orange"/>
  <rect x="650" y="117" width="60" height="133" class="purple"/>
  <path d="M580,179.7 L580,168.3 M572,179.7 L588,179.7 M572,168.3 L588,168.3" class="wh"/>
  <path d="M680,124.6 L680,109.4 M672,124.6 L688,124.6 M672,109.4 L688,109.4" class="wh"/>
  <circle cx="580" cy="179.7" r="3" class="run"/><circle cx="580" cy="174" r="3" class="run"/><circle cx="580" cy="168.3" r="3" class="run"/>
  <circle cx="680" cy="124.6" r="3" class="run"/><circle cx="680" cy="117" r="3" class="run"/><circle cx="680" cy="109.4" r="3" class="run"/>
  <text x="580" y="268" text-anchor="middle" class="sm">Engine A</text>
  <text x="680" y="268" text-anchor="middle" class="sm">Engine B</text>
  <text x="580" y="140" text-anchor="middle" class="sm">gap far larger</text>
  <text x="580" y="156" text-anchor="middle" class="sm">than run spread</text>
  <text x="630" y="296" text-anchor="middle" class="b">Separated ranges: a real difference</text>
  <text x="20" y="322" class="sm">Confirm a separated result in a second session with the engine order reversed before reporting it.</text>
</svg>
