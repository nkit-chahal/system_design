<svg xmlns="http://www.w3.org/2000/svg" width="840" height="306" viewBox="0 0 840 306" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .both{fill:none;stroke:#000;stroke-width:1.2;marker-start:url(#arrow);marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- A: trtllm-serve -->
  <rect x="10" y="8" width="262" height="290" rx="4" class="group"/>
  <text x="141" y="30" text-anchor="middle" class="b">trtllm-serve alone</text>
  <rect x="40" y="44" width="202" height="30" rx="6" class="purple"/><text x="141" y="64" text-anchor="middle">Clients</text>
  <path d="M141,74 L141,94" class="edge"/>
  <rect x="40" y="96" width="202" height="40" rx="6" class="gray"/><text x="141" y="114" text-anchor="middle">trtllm-serve</text><text x="141" y="130" text-anchor="middle" class="sm">OpenAI-compatible API</text>
  <path d="M141,136 L141,156" class="edge"/>
  <rect x="40" y="158" width="202" height="52" rx="6" class="orange"/><text x="141" y="180" text-anchor="middle">TensorRT-LLM</text><text x="141" y="198" text-anchor="middle" class="sm">one model per server</text>
  <text x="141" y="244" text-anchor="middle" class="sm">Simplest. Scale with replicas</text>
  <text x="141" y="262" text-anchor="middle" class="sm">behind a Kubernetes service.</text>

  <!-- B: Triton -->
  <rect x="289" y="8" width="262" height="290" rx="4" class="group"/>
  <text x="420" y="30" text-anchor="middle" class="b">Triton Inference Server</text>
  <rect x="319" y="44" width="202" height="30" rx="6" class="purple"/><text x="420" y="64" text-anchor="middle">Clients</text>
  <path d="M420,74 L420,94" class="edge"/>
  <rect x="319" y="96" width="202" height="40" rx="6" class="gray"/><text x="420" y="114" text-anchor="middle">Triton server</text><text x="420" y="130" text-anchor="middle" class="sm">one endpoint, many models</text>
  <path d="M370,136 L360,156" class="edge"/>
  <path d="M470,136 L480,156" class="edge"/>
  <rect x="299" y="158" width="122" height="52" rx="6" class="orange"/><text x="360" y="180" text-anchor="middle" class="sm">TensorRT-LLM</text><text x="360" y="198" text-anchor="middle" class="sm">backend (LLM API)</text>
  <rect x="429" y="158" width="112" height="52" rx="6" class="gray"/><text x="485" y="180" text-anchor="middle" class="sm">other model</text><text x="485" y="198" text-anchor="middle" class="sm">backends</text>
  <text x="420" y="244" text-anchor="middle" class="sm">model.yaml keys map to the LLM API;</text>
  <text x="420" y="262" text-anchor="middle" class="sm">fits teams that already run Triton.</text>

  <!-- C: Dynamo -->
  <rect x="568" y="8" width="262" height="290" rx="4" class="group"/>
  <text x="699" y="30" text-anchor="middle" class="b">NVIDIA Dynamo</text>
  <rect x="598" y="44" width="202" height="30" rx="6" class="purple"/><text x="699" y="64" text-anchor="middle">Clients</text>
  <path d="M699,74 L699,94" class="edge"/>
  <rect x="598" y="96" width="202" height="40" rx="6" class="gray"/><text x="699" y="114" text-anchor="middle">Frontend + router</text><text x="699" y="130" text-anchor="middle" class="sm">KV-aware routing</text>
  <path d="M650,136 L640,156" class="edge"/>
  <path d="M748,136 L758,156" class="edge"/>
  <rect x="578" y="158" width="112" height="52" rx="6" class="orange"/><text x="634" y="180" text-anchor="middle" class="sm">Prefill pool</text><text x="634" y="198" text-anchor="middle" class="sm">workers</text>
  <rect x="708" y="158" width="112" height="52" rx="6" class="orange"/><text x="764" y="180" text-anchor="middle" class="sm">Decode pool</text><text x="764" y="198" text-anchor="middle" class="sm">workers</text>
  <path d="M692,184 L706,184" class="both"/>
  <rect x="598" y="222" width="202" height="40" rx="6" class="blue"/><text x="699" y="240" text-anchor="middle" class="sm">Planner scales the pools;</text><text x="699" y="256" text-anchor="middle" class="sm">KV block manager offloads</text>
  <text x="699" y="284" text-anchor="middle" class="sm">Workers: TensorRT-LLM, vLLM, or SGLang</text>
</svg>
