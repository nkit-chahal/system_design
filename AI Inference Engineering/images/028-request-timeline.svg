<svg xmlns="http://www.w3.org/2000/svg" width="820" height="310" viewBox="0 0 820 310" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .span{fill:none;stroke:#000;stroke-width:1.2;marker-start:url(#arrow);marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Spans above -->
  <path d="M62,40 L752,40" class="span"/>
  <text x="407" y="32" text-anchor="middle" class="sm b">end-to-end latency (E2E)</text>
  <path d="M62,72 L228,72" class="span"/>
  <text x="145" y="64" text-anchor="middle" class="sm b">time to first token (TTFT)</text>
  <path d="M62,104 L128,104" class="span"/>
  <text x="95" y="98" text-anchor="middle" class="sm">queue</text>

  <!-- Phases -->
  <rect x="60" y="118" width="70" height="30" class="gray"/>
  <rect x="130" y="118" width="100" height="30" class="orange"/>
  <text x="180" y="138" text-anchor="middle" class="sm">prefill</text>
  <line x1="230" y1="112" x2="230" y2="156" stroke="#000" stroke-width="2.5"/>
  <g class="blue">
    <rect x="252" y="124" width="8" height="18"/><rect x="278" y="124" width="8" height="18"/><rect x="304" y="124" width="8" height="18"/>
    <rect x="330" y="124" width="8" height="18"/><rect x="356" y="124" width="8" height="18"/><rect x="382" y="124" width="8" height="18"/>
    <rect x="408" y="124" width="8" height="18"/>
    <rect x="516" y="124" width="8" height="18"/><rect x="542" y="124" width="8" height="18"/><rect x="568" y="124" width="8" height="18"/>
    <rect x="594" y="124" width="8" height="18"/><rect x="620" y="124" width="8" height="18"/><rect x="646" y="124" width="8" height="18"/>
    <rect x="672" y="124" width="8" height="18"/><rect x="698" y="124" width="8" height="18"/><rect x="724" y="124" width="8" height="18"/>
    <rect x="748" y="124" width="8" height="18"/>
  </g>
  <line x1="40" y1="160" x2="790" y2="160" stroke="#000" stroke-width="1.2"/>
  <text x="60" y="178" class="sm">arrives</text>
  <text x="230" y="178" text-anchor="middle" class="sm">first token</text>
  <text x="752" y="178" text-anchor="middle" class="sm">last token</text>

  <!-- Spans below -->
  <path d="M284,198 L306,198" class="span"/>
  <text x="295" y="218" text-anchor="middle" class="sm b">ITL</text>
  <text x="295" y="232" text-anchor="middle" class="sm">one gap</text>
  <path d="M414,198 L518,198" class="span"/>
  <text x="466" y="218" text-anchor="middle" class="sm b">a stall</text>
  <text x="466" y="232" text-anchor="middle" class="sm">one slow ITL sample</text>

  <text x="16" y="270">TPOT = (E2E − TTFT) ÷ (output tokens − 1): one average gap per request, so a single stall barely moves it.</text>
  <text x="16" y="292">ITL is recorded per gap, TTFT and E2E per request. Each has its own distribution and its own percentiles.</text>
</svg>
