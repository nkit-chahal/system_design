<svg xmlns="http://www.w3.org/2000/svg" width="850" height="330" viewBox="0 0 850 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .idle{fill:url(#hatch);stroke:#999;stroke-width:1}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .axis{stroke:#000;stroke-width:1;fill:none}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- ===== Panel 1: padding ===== -->
  <rect x="10" y="10" width="265" height="250" rx="4" class="group"/>
  <text x="142" y="34" text-anchor="middle" class="b">1. Padding</text>
  <text x="24" y="60" class="sm">prompt lengths in tokens</text>
  <rect x="40" y="76" width="66" height="26" class="orange"/><rect x="106" y="76" width="154" height="26" class="idle"/>
  <rect x="40" y="112" width="154" height="26" class="orange"/><rect x="194" y="112" width="66" height="26" class="idle"/>
  <rect x="40" y="148" width="220" height="26" class="orange"/>
  <g class="sm"><text x="46" y="94">600</text><text x="46" y="130">1,400</text><text x="46" y="166">2,000</text></g>
  <text x="24" y="206" class="sm">Every prompt is padded to the longest.</text>
  <text x="24" y="222" class="sm">2,000 of 6,000 token slots are padding:</text>
  <text x="24" y="238" class="sm">computed and stored for nothing.</text>

  <!-- ===== Panel 2: waiting for the longest ===== -->
  <rect x="290" y="10" width="265" height="250" rx="4" class="group"/>
  <text x="422" y="34" text-anchor="middle" class="b">2. Waiting for the longest</text>
  <text x="304" y="56" class="sm">output tokens per request</text>
  <!-- 8 requests: 120, 250, 300, 400, 500, 600, 830, 1000 tokens at 0.2 px per token -->
  <rect x="342" y="64" width="24" height="14" class="orange"/><rect x="366" y="64" width="176" height="14" class="idle"/>
  <rect x="342" y="82" width="50" height="14" class="orange"/><rect x="392" y="82" width="150" height="14" class="idle"/>
  <rect x="342" y="100" width="60" height="14" class="orange"/><rect x="402" y="100" width="140" height="14" class="idle"/>
  <rect x="342" y="118" width="80" height="14" class="orange"/><rect x="422" y="118" width="120" height="14" class="idle"/>
  <rect x="342" y="136" width="100" height="14" class="orange"/><rect x="442" y="136" width="100" height="14" class="idle"/>
  <rect x="342" y="154" width="120" height="14" class="orange"/><rect x="462" y="154" width="80" height="14" class="idle"/>
  <rect x="342" y="172" width="166" height="14" class="orange"/><rect x="508" y="172" width="34" height="14" class="idle"/>
  <rect x="342" y="190" width="200" height="14" class="orange"/>
  <g class="sm" text-anchor="end">
    <text x="336" y="75">120</text><text x="336" y="93">250</text><text x="336" y="111">300</text><text x="336" y="129">400</text>
    <text x="336" y="147">500</text><text x="336" y="165">600</text><text x="336" y="183">830</text><text x="336" y="201">1,000</text>
  </g>
  <text x="304" y="226" class="sm">4,000 useful of 8,000 slot-steps:</text>
  <text x="304" y="242" class="sm">half of the decode work is wasted.</text>

  <!-- ===== Panel 3: head-of-line blocking ===== -->
  <rect x="570" y="10" width="270" height="250" rx="4" class="group"/>
  <text x="705" y="34" text-anchor="middle" class="b">3. Head-of-line blocking</text>
  <!-- time scale: 0 to 12 s over 220 px = 18.33 px per s, x0 = 600 -->
  <rect x="600" y="58" width="191" height="28" class="orange"/>
  <text x="695" y="77" text-anchor="middle" class="sm">batch 1: 1,000 steps</text>
  <rect x="791" y="58" width="29" height="28" class="gray"/>
  <text x="805" y="52" text-anchor="middle" class="sm">batch 2</text>
  <circle cx="604" cy="128" r="6" class="purple"/>
  <text x="614" y="112" class="sm">X arrives</text>
  <rect x="612" y="120" width="179" height="18" class="red"/>
  <text x="702" y="133" text-anchor="middle" class="sm">X waits ≈ 10.4 s</text>
  <path d="M791,129 L806,129 L806,89" class="edge"/>
  <path class="axis" d="M600,170 H820 M600,170 v5 M692,170 v5 M783,170 v5"/>
  <g class="sm" text-anchor="middle"><text x="600" y="189">0</text><text x="692" y="189">5 s</text><text x="783" y="189">10 s</text></g>
  <text x="584" y="222" class="sm">A request that arrives just after a</text>
  <text x="584" y="238" class="sm">batch starts waits for all of it.</text>

  <!-- Legend -->
  <rect x="16" y="284" width="18" height="12" class="orange"/><text x="40" y="295" class="sm">useful work</text>
  <rect x="140" y="284" width="18" height="12" class="idle"/><text x="164" y="295" class="sm">padding or idle slot</text>
  <rect x="310" y="284" width="18" height="12" class="red"/><text x="334" y="295" class="sm">time spent waiting</text>
  <circle cx="469" cy="290" r="6" class="purple"/><text x="482" y="295" class="sm">new request</text>
  <text x="16" y="318" class="sm">Panels 2 and 3 use the lesson's example: 8 answers averaging 500 tokens, and decode steps of about 10.4 ms.</text>
</svg>
