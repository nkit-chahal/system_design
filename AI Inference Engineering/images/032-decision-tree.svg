<svg xmlns="http://www.w3.org/2000/svg" width="860" height="526" viewBox="0 0 860 526" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}.it{font-style:italic}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .line{fill:none;stroke:#000;stroke-width:1.2}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .grid{fill:none;stroke:#e6e6e6;stroke-width:1}
    .dash{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:6 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <rect x="250" y="10" width="360" height="44" rx="6" class="red"/>
  <text x="430" y="37" text-anchor="middle" class="b">Symptom: p95 TTFT or TPOT above target</text>
  <path d="M430,54 L430,74" class="edge"/>
  <rect x="90" y="76" width="380" height="44" rx="6" class="purple"/>
  <text x="280" y="103" text-anchor="middle">Request rate up, prompt length unchanged?</text>
  <rect x="540" y="76" width="300" height="44" rx="6" class="green"/>
  <text x="690" y="94.5" text-anchor="middle" class="b">Traffic surge</text>
  <text x="690" y="111.5" text-anchor="middle" class="sm">scale out, shed (Lab 27)</text>
  <path d="M470,98 L538,98" class="edge"/>
  <text x="504" y="92" text-anchor="middle" class="sm">yes</text>
  <path d="M280,120 L280,138" class="edge"/>
  <text x="290" y="133" class="sm">no</text>
  <rect x="90" y="138" width="380" height="44" rx="6" class="purple"/>
  <text x="280" y="165" text-anchor="middle">Prompt length p95 up?</text>
  <rect x="540" y="138" width="300" height="44" rx="6" class="green"/>
  <text x="690" y="156.5" text-anchor="middle" class="b">Long prompts</text>
  <text x="690" y="173.5" text-anchor="middle" class="sm">Lesson 36, Long-Context Serving</text>
  <path d="M470,160 L538,160" class="edge"/>
  <text x="504" y="154" text-anchor="middle" class="sm">yes</text>
  <path d="M280,182 L280,200" class="edge"/>
  <text x="290" y="195" class="sm">no</text>
  <rect x="90" y="200" width="380" height="44" rx="6" class="purple"/>
  <text x="280" y="227" text-anchor="middle">Prefix hit rate down at the same rate?</text>
  <rect x="540" y="200" width="300" height="44" rx="6" class="green"/>
  <text x="690" y="218.5" text-anchor="middle" class="b">Prefix-cache miss</text>
  <text x="690" y="235.5" text-anchor="middle" class="sm">diff the prompt template</text>
  <path d="M470,222 L538,222" class="edge"/>
  <text x="504" y="216" text-anchor="middle" class="sm">yes</text>
  <path d="M280,244 L280,262" class="edge"/>
  <text x="290" y="257" class="sm">no</text>
  <rect x="90" y="262" width="380" height="44" rx="6" class="purple"/>
  <text x="280" y="289" text-anchor="middle">KV usage near 100%, preemptions > 0?</text>
  <rect x="540" y="262" width="300" height="44" rx="6" class="green"/>
  <text x="690" y="280.5" text-anchor="middle" class="b">Cache thrash</text>
  <text x="690" y="297.5" text-anchor="middle" class="sm">lower max-num-seqs, add replicas</text>
  <path d="M470,284 L538,284" class="edge"/>
  <text x="504" y="278" text-anchor="middle" class="sm">yes</text>
  <path d="M280,306 L280,324" class="edge"/>
  <text x="290" y="319" class="sm">no</text>
  <rect x="90" y="324" width="380" height="44" rx="6" class="purple"/>
  <text x="280" y="351" text-anchor="middle">One GPU slow; SM clock down or throttling?</text>
  <rect x="540" y="324" width="300" height="44" rx="6" class="green"/>
  <text x="690" y="342.5" text-anchor="middle" class="b">Slow or throttled GPU</text>
  <text x="690" y="359.5" text-anchor="middle" class="sm">drain it (Lesson 40)</text>
  <path d="M470,346 L538,346" class="edge"/>
  <text x="504" y="340" text-anchor="middle" class="sm">yes</text>
  <path d="M280,368 L280,386" class="edge"/>
  <text x="290" y="381" class="sm">no</text>
  <rect x="90" y="386" width="380" height="44" rx="6" class="purple"/>
  <text x="280" y="413" text-anchor="middle">Replica count just rose; slow only on new pods?</text>
  <rect x="540" y="386" width="300" height="44" rx="6" class="green"/>
  <text x="690" y="404.5" text-anchor="middle" class="b">Cold replicas</text>
  <text x="690" y="421.5" text-anchor="middle" class="sm">warm-up, load-aware routing</text>
  <path d="M470,408 L538,408" class="edge"/>
  <text x="504" y="402" text-anchor="middle" class="sm">yes</text>
  <path d="M280,430 L280,448" class="edge"/>
  <text x="290" y="443" class="sm">no</text>
  <rect x="90" y="448" width="380" height="44" rx="6" class="purple"/>
  <text x="280" y="475" text-anchor="middle">One tenant's token share jumped?</text>
  <rect x="540" y="448" width="300" height="44" rx="6" class="green"/>
  <text x="690" y="466.5" text-anchor="middle" class="b">Noisy tenant</text>
  <text x="690" y="483.5" text-anchor="middle" class="sm">rate-limit it (Lesson 26)</text>
  <path d="M470,470 L538,470" class="edge"/>
  <text x="504" y="464" text-anchor="middle" class="sm">yes</text>
  <text x="90" y="514" class="sm">No match: check the errors row, then the gateway and network outside vLLM.</text>
</svg>
