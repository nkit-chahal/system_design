<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
    <pattern id="redhatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#e0a8a6" stroke-width="3"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .dedge{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4;marker-end:url(#arrow)}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .tick{stroke:#000;stroke-width:1}
    .grid{stroke:#e3e3e3;stroke-width:1}
    .guide{stroke:#666;stroke-width:1;stroke-dasharray:5 4;fill:none}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="24" class="b">Workload</text>
  <text x="230" y="24" class="b">One request's prompt</text>
  <text x="650" y="24" class="b">Shared with</text>
  <text x="16" y="61">Chat with a system prompt</text>
  <rect x="230.0" y="40" width="300.0" height="32" class="blue"/>
  <text x="380.0" y="60.5" text-anchor="middle" class="sm">system prompt</text>
  <rect x="530.0" y="40" width="100.0" height="32" class="orange"/>
  <text x="580.0" y="60.5" text-anchor="middle" class="sm">user</text>
  <text x="650" y="61" class="sm">every user of the app</text>
  <text x="16" y="113">Few-shot classification</text>
  <rect x="230.0" y="92" width="340.0" height="32" class="blue"/>
  <text x="400.0" y="112.5" text-anchor="middle" class="sm">instructions + examples</text>
  <rect x="570.0" y="92" width="60.0" height="32" class="orange"/>
  <text x="600.0" y="112.5" text-anchor="middle" class="sm">input</text>
  <text x="650" y="113" class="sm">every input</text>
  <text x="16" y="165">Questions about a document</text>
  <rect x="230.0" y="144" width="360.0" height="32" class="blue"/>
  <text x="410.0" y="164.5" text-anchor="middle" class="sm">document</text>
  <rect x="590.0" y="144" width="40.0" height="32" class="orange"/>
  <text x="650" y="165" class="sm">everyone asking about it</text>
  <text x="16" y="217">Multi-turn chat, turn 3</text>
  <rect x="230.0" y="196" width="184.0" height="32" class="blue"/>
  <text x="322.0" y="216.5" text-anchor="middle" class="sm">system</text>
  <rect x="414.0" y="196" width="60.0" height="32" class="blue"/>
  <text x="444.0" y="216.5" text-anchor="middle" class="sm">turn 1</text>
  <rect x="474.0" y="196" width="60.0" height="32" class="blue"/>
  <text x="504.0" y="216.5" text-anchor="middle" class="sm">answer 1</text>
  <rect x="534.0" y="196" width="16.0" height="32" class="blue"/>
  <rect x="550.0" y="196" width="60.0" height="32" class="blue"/>
  <text x="580.0" y="216.5" text-anchor="middle" class="sm">answer 2</text>
  <rect x="610.0" y="196" width="20.0" height="32" class="orange"/>
  <text x="650" y="217" class="sm">earlier turns of the chat</text>
  <text x="16" y="269">Agent loop, step 6</text>
  <rect x="230.0" y="248" width="120.0" height="32" class="blue"/>
  <text x="290.0" y="268.5" text-anchor="middle" class="sm">system + tools</text>
  <rect x="350.0" y="248" width="240.0" height="32" class="blue"/>
  <text x="470.0" y="268.5" text-anchor="middle" class="sm">steps 1–5: calls, results</text>
  <rect x="590.0" y="248" width="40.0" height="32" class="orange"/>
  <text x="650" y="269" class="sm">earlier steps of the run</text>
  <rect x="230" y="310" width="16" height="12" class="blue"/><text x="252" y="321" class="sm">identical to the start of an earlier request</text>
  <rect x="530" y="310" width="16" height="12" class="orange"/><text x="552" y="321" class="sm">new tokens</text>
</svg>
