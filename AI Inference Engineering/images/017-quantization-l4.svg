<svg xmlns="http://www.w3.org/2000/svg" width="800" height="364" viewBox="0 0 800 364" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .note{font-size:12px;fill:#666}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .held{fill:url(#hatch);stroke:#666;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="20" y="24" class="b">One L4 (≈ 22 GiB), Llama 3.1 8B, --gpu-memory-utilization 0.90</text>

  <!-- 28 px per GiB from x=20; budget ends at 574.4, GPU at 636 -->
  <text x="20" y="52" class="sm b">BF16 weights, BF16 KV cache</text>
  <rect x="20" y="58" width="420" height="28" class="orange"/>
  <text x="230" y="77" text-anchor="middle" class="sm">weights 15 GiB</text>
  <rect x="440" y="58" width="42" height="28" class="gray"/>
  <rect x="482" y="58" width="92.4" height="28" class="blue"/>
  <text x="528" y="77" text-anchor="middle" class="sm">3.3 GiB</text>
  <rect x="574.4" y="58" width="61.6" height="28" class="held"/>
  <text x="650" y="70" class="b">27K tokens</text>
  <text x="650" y="86" class="sm">10 chats · ≤ 19 tok/s</text>

  <text x="20" y="122" class="sm b">FP8 weights, BF16 KV cache</text>
  <rect x="20" y="128" width="236.9" height="28" class="orange"/>
  <text x="138" y="147" text-anchor="middle" class="sm">8.5 GiB</text>
  <rect x="256.9" y="128" width="42" height="28" class="gray"/>
  <rect x="298.9" y="128" width="275.5" height="28" class="blue"/>
  <text x="437" y="147" text-anchor="middle" class="sm">9.8 GiB at 128 KiB per token</text>
  <rect x="574.4" y="128" width="61.6" height="28" class="held"/>
  <text x="650" y="140" class="b">81K tokens</text>
  <text x="650" y="156" class="sm">32 chats · ≤ 33 tok/s</text>

  <text x="20" y="192" class="sm b">FP8 weights, FP8 KV cache</text>
  <rect x="20" y="198" width="236.9" height="28" class="orange"/>
  <text x="138" y="217" text-anchor="middle" class="sm">8.5 GiB</text>
  <rect x="256.9" y="198" width="42" height="28" class="gray"/>
  <rect x="298.9" y="198" width="275.5" height="28" class="blue"/>
  <text x="437" y="217" text-anchor="middle" class="sm">9.8 GiB at 64 KiB per token</text>
  <rect x="574.4" y="198" width="61.6" height="28" class="held"/>
  <text x="650" y="210" class="b">161K tokens</text>
  <text x="650" y="226" class="sm">64 chats · ≤ 33 tok/s</text>

  <text x="20" y="262" class="sm b">INT4 weights (AWQ), FP8 KV cache</text>
  <rect x="20" y="268" width="149.4" height="28" class="orange"/>
  <text x="95" y="287" text-anchor="middle" class="sm">5.3 GiB</text>
  <rect x="169.4" y="268" width="42" height="28" class="gray"/>
  <rect x="211.4" y="268" width="363" height="28" class="blue"/>
  <text x="393" y="287" text-anchor="middle" class="sm">13.0 GiB at 64 KiB per token</text>
  <rect x="574.4" y="268" width="61.6" height="28" class="held"/>
  <text x="650" y="280" class="b">212K tokens</text>
  <text x="650" y="296" class="sm">84 chats · ≤ 52 tok/s</text>

  <text x="20" y="324" class="note">tok/s: single-stream upper bound from reading the weights once per step at 300 GB/s.</text>

  <!-- Legend -->
  <rect x="20" y="340" width="16" height="12" class="orange"/><text x="42" y="351" class="sm">weights</text>
  <rect x="110" y="340" width="16" height="12" class="gray"/><text x="132" y="351" class="sm">activations + CUDA graphs (≈ 1.5 GiB, assumed)</text>
  <rect x="440" y="340" width="16" height="12" class="blue"/><text x="462" y="351" class="sm">KV cache</text>
  <rect x="540" y="340" width="16" height="12" class="held"/><text x="562" y="351" class="sm">held back</text>
</svg>
