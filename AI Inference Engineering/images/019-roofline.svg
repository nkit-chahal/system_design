<svg xmlns="http://www.w3.org/2000/svg" width="840" height="450" viewBox="0 0 840 450" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .tick{stroke:#000;stroke-width:1}
    .gridl{stroke:#e3e3e3;stroke-width:1}
    .roof{fill:none;stroke:#b85450;stroke-width:2.2}
    .gap{stroke:#000;stroke-width:1;stroke-dasharray:3 3}
    .ptblue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.6}
    .ptorange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.6}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Region labels above the plot -->
  <text x="336" y="34" text-anchor="middle" class="b">memory-bound: judge by MBU</text>
  <text x="676" y="34" text-anchor="middle" class="b">compute-bound: judge by MFU</text>

  <!-- Grid lines -->
  <path d="M236,50V370M372,50V370M508,50V370M644,50V370M100,273.1H780M100,176.1H780M100,79.2H780" class="gridl"/>

  <!-- Axes -->
  <path d="M100,50 L100,370 L780,370" class="axis"/>
  <path d="M100,370V376M236,370V376M372,370V376M508,370V376M644,370V376M780,370V376" class="tick"/>
  <path d="M94,370H100M94,273.1H100M94,176.1H100M94,79.2H100" class="tick"/>
  <text x="100" y="391" text-anchor="middle" class="sm">0.1</text>
  <text x="236" y="391" text-anchor="middle" class="sm">1</text>
  <text x="372" y="391" text-anchor="middle" class="sm">10</text>
  <text x="508" y="391" text-anchor="middle" class="sm">100</text>
  <text x="644" y="391" text-anchor="middle" class="sm">1,000</text>
  <text x="780" y="391" text-anchor="middle" class="sm">10,000</text>
  <text x="88" y="374" text-anchor="end" class="sm">1</text>
  <text x="88" y="277" text-anchor="end" class="sm">10</text>
  <text x="88" y="180" text-anchor="end" class="sm">100</text>
  <text x="88" y="83" text-anchor="end" class="sm">1,000</text>
  <text x="440" y="414" text-anchor="middle">arithmetic intensity: FLOPs per byte moved (log scale)</text>
  <text x="40" y="210" text-anchor="middle" transform="rotate(-90 40 210)">achieved TFLOPS (log scale)</text>

  <!-- Roofline -->
  <path d="M164.6,370 L571.9,79.6 L780,79.6" class="roof"/>
  <line x1="571.9" y1="79.6" x2="571.9" y2="370" stroke="#999" stroke-dasharray="5 4"/>
  <text x="580" y="70" class="sm">compute roof: 989 TFLOPS dense BF16</text>
  <text x="268" y="281" class="sm" transform="rotate(-35.5 268 281)">memory roof: 3.35 TB/s</text>
  <text x="580" y="362" class="sm">ridge ≈ 295 FLOPs/byte</text>

  <!-- Decode, batch 1 -->
  <line x1="234.9" y1="335.9" x2="234.9" y2="319.9" class="gap"/>
  <circle cx="234.9" cy="335.9" r="5.5" class="ptblue"/>
  <text x="248" y="331" class="sm b">decode, batch 1</text>
  <text x="248" y="346" class="sm">2.2 TFLOPS</text>
  <text x="248" y="361" class="sm">MBU 68%, MFU 0.23%</text>

  <!-- Decode, batch 64 -->
  <line x1="435.7" y1="194.8" x2="435.7" y2="176.7" class="gap"/>
  <circle cx="435.7" cy="194.8" r="5.5" class="ptblue"/>
  <text x="404" y="220" class="sm b">decode, batch 64</text>
  <text x="404" y="235" class="sm">64 TFLOPS</text>
  <text x="404" y="250" class="sm">MBU 65%, MFU 6.5%</text>

  <!-- Prefill -->
  <line x1="684" y1="107.2" x2="684" y2="79.6" class="gap"/>
  <circle cx="684" cy="107.2" r="5.5" class="ptorange"/>
  <text x="696" y="113" class="sm b">prefill</text>
  <text x="696" y="128" class="sm">514 TFLOPS</text>
  <text x="696" y="143" class="sm">MFU 52%</text>

  <text x="100" y="440" class="sm">H100 SXM, Llama 3.1 8B in BF16. Points use this lesson's example measurements; dotted lines show the gap to the roof.</text>
</svg>
