<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .mono{font-family:Consolas, Menlo, monospace;font-size:13px}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Unconstrained -->
  <text x="16" y="28" class="lg b">Prompt only: "reply with JSON"</text>
  <rect x="30" y="44" width="340" height="34" rx="4" class="purple"/>
  <text x="200" y="66" text-anchor="middle" class="sm">"I was charged twice for order 8812."</text>
  <path d="M200,78 L200,100" class="edge"/>
  <rect x="30" y="102" width="340" height="110" rx="4" class="white"/>
  <text x="44" y="126" class="mono">Sure! Here is the JSON:</text>
  <text x="44" y="150" class="mono">{"category": "payments",</text>
  <text x="44" y="172" class="mono"> "priority": "high",</text>
  <text x="44" y="194" class="mono"> "summary": "Charged twice",}</text>
  <path d="M200,212 L200,234" class="edge"/>
  <rect x="30" y="236" width="340" height="44" rx="6" class="red"/>
  <text x="200" y="255" text-anchor="middle" class="b">parser fails</text>
  <text x="200" y="272" text-anchor="middle" class="sm">extra prose, unknown category, string priority, trailing comma</text>

  <line x1="410" y1="16" x2="410" y2="300" stroke="#999" stroke-dasharray="5 4"/>

  <!-- Constrained -->
  <text x="430" y="28" class="lg b">JSON schema enforced by the engine</text>
  <rect x="446" y="44" width="340" height="34" rx="4" class="purple"/>
  <text x="616" y="66" text-anchor="middle" class="sm">same prompt + response_format with the schema</text>
  <path d="M616,78 L616,100" class="edge"/>
  <rect x="446" y="102" width="340" height="110" rx="4" class="white"/>
  <rect x="456" y="110" width="320" height="24" rx="4" class="orange"/>
  <text x="616" y="127" text-anchor="middle" class="sm">grammar mask applied at every decode step</text>
  <text x="460" y="156" class="mono">{"category": "billing",</text>
  <text x="460" y="178" class="mono"> "priority": 2,</text>
  <text x="460" y="200" class="mono"> "summary": "Charged twice for order 8812"}</text>
  <path d="M616,212 L616,234" class="edge"/>
  <rect x="446" y="236" width="340" height="44" rx="6" class="green"/>
  <text x="616" y="255" text-anchor="middle" class="b">parses and matches the schema</text>
  <text x="616" y="272" text-anchor="middle" class="sm">category from the enum, integer priority</text>

  <text x="16" y="308" class="sm">Example outputs are illustrative.</text>
</svg>
