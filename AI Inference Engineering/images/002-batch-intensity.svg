  <line x1="90" y1="164.8" x2="730" y2="164.8" stroke="#6c8ebf" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="296" y="262" class="sm">blue levels off near 53 FLOPs/byte: every sequence</text>
  <text x="296" y="277" class="sm">reads its own 2,500-token KV cache at every step</text>
  <line x1="608.7" y1="50" x2="608.7" y2="320" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="614.7" y="236" class="sm">KV cache full</text>
  <text x="614.7" y="251" class="sm">on one H100:</text>
  <text x="614.7" y="266" class="sm">≈ 170 requests</text>
  <circle cx="608.7" cy="174.7" r="5" class="blue"/>
  <text x="600.7" y="196.7" text-anchor="end" class="sm b">≈ 41 at batch 170</text>
  <line x1="100" y1="300" x2="124" y2="300" stroke="#d79b00" stroke-width="2.4"/><text x="130" y="304" class="sm">linear layers, weights only (≈ batch size)</text>
  <line x1="390" y1="300" x2="414" y2="300" stroke="#6c8ebf" stroke-width="2.4"/><text x="420" y="304" class="sm">weights + KV cache reads</text>
</svg>
