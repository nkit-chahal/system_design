  <line x1="650.0" y1="320" x2="650.0" y2="325" class="axis"/><text x="650.0" y="340" text-anchor="middle" class="sm">256</text>
  <line x1="720.0" y1="50" x2="720.0" y2="320" class="grid"/>
  <line x1="720.0" y1="320" x2="720.0" y2="325" class="axis"/><text x="720.0" y="340" text-anchor="middle" class="sm">512</text>
  <line x1="90" y1="320.0" x2="730" y2="320.0" class="grid"/>
  <line x1="85" y1="320.0" x2="90" y2="320.0" class="axis"/><text x="80" y="324.0" text-anchor="end" class="sm">1</text>
  <line x1="90" y1="230.0" x2="730" y2="230.0" class="grid"/>
