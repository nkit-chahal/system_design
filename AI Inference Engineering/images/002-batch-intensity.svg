  <line x1="90" y1="50.0" x2="730" y2="50.0" class="grid"/>
  <line x1="85" y1="50.0" x2="90" y2="50.0" class="axis"/><text x="80" y="54.0" text-anchor="end" class="sm">1,000</text>
  <path d="M90,45 L90,320 L730,320" class="axis"/>
