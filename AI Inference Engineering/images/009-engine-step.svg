<svg xmlns="http://www.w3.org/2000/svg" width="830" height="312" viewBox="0 0 830 312" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Panel A: without async scheduling -->
  <text x="16" y="26" class="b">Without async scheduling: the GPU waits for the CPU</text>
  <text x="16" y="64">CPU</text>
  <text x="16" y="102">GPU</text>
  <line x1="66" y1="78" x2="816" y2="78" stroke="#ccc"/>
  <rect x="70" y="46" width="48" height="26" class="gray"/><text x="94" y="63" text-anchor="middle" class="sm">sched</text>
  <rect x="268" y="46" width="48" height="26" class="gray"/><text x="292" y="63" text-anchor="middle" class="sm">update</text>
  <rect x="316" y="46" width="48" height="26" class="gray"/><text x="340" y="63" text-anchor="middle" class="sm">sched</text>
  <rect x="514" y="46" width="48" height="26" class="gray"/><text x="538" y="63" text-anchor="middle" class="sm">update</text>
  <rect x="562" y="46" width="48" height="26" class="gray"/><text x="586" y="63" text-anchor="middle" class="sm">sched</text>
  <rect x="118" y="84" width="150" height="26" class="orange"/><text x="193" y="101" text-anchor="middle" class="sm">forward step n</text>
  <rect x="268" y="84" width="96" height="26" class="red"/><text x="316" y="101" text-anchor="middle" class="sm">GPU idle</text>
  <rect x="364" y="84" width="150" height="26" class="orange"/><text x="439" y="101" text-anchor="middle" class="sm">forward step n+1</text>
  <rect x="514" y="84" width="96" height="26" class="red"/><text x="562" y="101" text-anchor="middle" class="sm">GPU idle</text>
  <rect x="610" y="84" width="150" height="26" class="orange"/><text x="685" y="101" text-anchor="middle" class="sm">forward step n+2</text>

  <line x1="16" y1="134" x2="816" y2="134" stroke="#999" stroke-dasharray="5 4"/>

  <!-- Panel B: with async scheduling -->
  <text x="16" y="162" class="b">With async scheduling (vLLM default): the CPU works one step ahead</text>
  <text x="16" y="200">CPU</text>
  <text x="16" y="238">GPU</text>
  <line x1="66" y1="214" x2="816" y2="214" stroke="#ccc"/>
  <rect x="70" y="182" width="48" height="26" class="gray"/><text x="94" y="199" text-anchor="middle" class="sm">sched</text>
  <rect x="120" y="182" width="48" height="26" class="gray"/><text x="144" y="199" text-anchor="middle" class="sm">sched</text>
  <rect x="270" y="182" width="48" height="26" class="gray"/><text x="294" y="199" text-anchor="middle" class="sm">update</text>
  <rect x="320" y="182" width="48" height="26" class="gray"/><text x="344" y="199" text-anchor="middle" class="sm">sched</text>
  <rect x="420" y="182" width="48" height="26" class="gray"/><text x="444" y="199" text-anchor="middle" class="sm">update</text>
  <rect x="470" y="182" width="48" height="26" class="gray"/><text x="494" y="199" text-anchor="middle" class="sm">sched</text>
  <rect x="570" y="182" width="48" height="26" class="gray"/><text x="594" y="199" text-anchor="middle" class="sm">update</text>
  <rect x="620" y="182" width="48" height="26" class="gray"/><text x="644" y="199" text-anchor="middle" class="sm">sched</text>
  <rect x="118" y="220" width="150" height="26" class="orange"/><text x="193" y="237" text-anchor="middle" class="sm">forward step n</text>
  <rect x="268" y="220" width="150" height="26" class="orange"/><text x="343" y="237" text-anchor="middle" class="sm">forward step n+1</text>
  <rect x="418" y="220" width="150" height="26" class="orange"/><text x="493" y="237" text-anchor="middle" class="sm">forward step n+2</text>
  <rect x="568" y="220" width="150" height="26" class="orange"/><text x="643" y="237" text-anchor="middle" class="sm">forward step n+3</text>

  <path d="M70,272 L816,272" class="edge"/>
  <text x="816" y="292" text-anchor="end" class="sm">time</text>
  <text x="16" y="292" class="sm">Same work per step in both panels; durations are illustrative.</text>
</svg>
