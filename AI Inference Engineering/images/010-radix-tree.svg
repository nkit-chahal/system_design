<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .wire{stroke:#000;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Edges -->
  <line x1="410" y1="40" x2="240" y2="70" class="wire"/>
  <line x1="410" y1="40" x2="580" y2="70" class="wire"/>
  <line x1="240" y1="114" x2="125" y2="160" class="wire"/>
  <line x1="240" y1="114" x2="335" y2="160" class="wire"/>
  <line x1="125" y1="204" x2="125" y2="250" class="wire"/>
  <line x1="580" y1="114" x2="580" y2="160" class="wire"/>
  <line x1="580" y1="204" x2="525" y2="250" class="wire"/>
  <line x1="580" y1="204" x2="695" y2="250" class="wire"/>

  <!-- Root -->
  <rect x="380" y="14" width="60" height="26" rx="13" class="white"/>
  <text x="410" y="32" text-anchor="middle" class="sm">root</text>

  <!-- Level 1 -->
  <rect x="130" y="70" width="220" height="44" rx="6" class="orange"/>
  <text x="240" y="88" text-anchor="middle">System prompt</text>
  <text x="240" y="106" text-anchor="middle" class="sm">1,000 tokens · lock 2</text>
  <rect x="470" y="70" width="220" height="44" rx="6" class="orange"/>
  <text x="580" y="88" text-anchor="middle">Agent tool prompt</text>
  <text x="580" y="106" text-anchor="middle" class="sm">3,000 tokens · lock 1</text>

  <!-- Conversations -->
  <rect x="30" y="160" width="190" height="44" rx="6" class="orange"/>
  <text x="125" y="178" text-anchor="middle">Conv A, turn 1</text>
  <text x="125" y="196" text-anchor="middle" class="sm">500 tokens · lock 1</text>
  <rect x="240" y="160" width="190" height="44" rx="6" class="blue"/>
  <text x="335" y="178" text-anchor="middle">Conv B, turn 1</text>
  <text x="335" y="196" text-anchor="middle" class="sm">500 tokens · lock 0</text>
  <text x="335" y="222" text-anchor="middle" class="sm">evictable leaf</text>
  <rect x="30" y="250" width="190" height="44" rx="6" class="orange"/>
  <text x="125" y="268" text-anchor="middle">Conv A, turn 2</text>
  <text x="125" y="286" text-anchor="middle" class="sm">500 tokens · lock 1</text>

  <!-- Agent task -->
  <rect x="480" y="160" width="200" height="44" rx="6" class="orange"/>
  <text x="580" y="178" text-anchor="middle">Agent task context</text>
  <text x="580" y="196" text-anchor="middle" class="sm">600 tokens · lock 1</text>
  <rect x="450" y="250" width="150" height="44" rx="6" class="orange"/>
  <text x="525" y="268" text-anchor="middle">Branch 1</text>
  <text x="525" y="286" text-anchor="middle" class="sm">200 tokens · lock 1</text>
  <rect x="620" y="250" width="150" height="44" rx="6" class="blue"/>
  <text x="695" y="268" text-anchor="middle">Branch 2</text>
  <text x="695" y="286" text-anchor="middle" class="sm">200 tokens · lock 0</text>
  <text x="695" y="312" text-anchor="middle" class="sm">evictable leaf</text>

  <!-- Legend -->
  <rect x="30" y="326" width="20" height="14" rx="3" class="orange"/><text x="58" y="338" class="sm">on the path of a running request (locked)</text>
  <rect x="360" y="326" width="20" height="14" rx="3" class="blue"/><text x="388" y="338" class="sm">cached, no running request (unlocked)</text>
</svg>
