<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .cell{fill:#fff;stroke:#bbb;stroke-width:1}
    .head{fill:#f5f5f5;stroke:#bbb;stroke-width:1}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Header -->
  <rect x="10" y="10" width="140" height="34" class="head"/><text x="20" y="32" class="b">State</text>
  <rect x="150" y="10" width="250" height="34" class="head"/><text x="160" y="32" class="b">GPU metrics (DCGM)</text>
  <rect x="400" y="10" width="230" height="34" class="head"/><text x="410" y="32" class="b">Engine metrics</text>
  <rect x="630" y="10" width="220" height="34" class="head"/><text x="640" y="32" class="b">What to do</text>

  <!-- Row 1: compute-bound -->
  <rect x="10" y="44" width="140" height="84" class="orange"/><text x="20" y="80" class="b">Compute-</text><text x="20" y="98" class="b">bound</text>
  <rect x="150" y="44" width="250" height="84" class="cell"/>
  <text x="160" y="66" class="sm">SM activity high (≥ 0.8)</text>
  <text x="160" y="84" class="sm">tensor activity high</text>
  <text x="160" y="102" class="sm">DRAM activity moderate</text>
  <rect x="400" y="44" width="230" height="84" class="cell"/>
  <text x="410" y="66" class="sm">many prompt tokens per second</text>
  <text x="410" y="84" class="sm">TTFT grows with prompt length</text>
  <rect x="630" y="44" width="220" height="84" class="cell"/>
  <text x="640" y="66" class="sm">Normal for prefill-heavy load.</text>
  <text x="640" y="84" class="sm">Add GPUs, use FP8 (Lesson 13),</text>
  <text x="640" y="102" class="sm">cap prefill tokens per step.</text>

  <!-- Row 2: memory-bound -->
  <rect x="10" y="128" width="140" height="84" class="blue"/><text x="20" y="164" class="b">Memory-</text><text x="20" y="182" class="b">bound</text>
  <rect x="150" y="128" width="250" height="84" class="cell"/>
  <text x="160" y="150" class="sm">DRAM activity near 0.8</text>
  <text x="160" y="168" class="sm">tensor activity low to moderate</text>
  <text x="160" y="186" class="sm">SM activity high</text>
  <rect x="400" y="128" width="230" height="84" class="cell"/>
  <text x="410" y="150" class="sm">many running requests</text>
  <text x="410" y="168" class="sm">KV cache usage high</text>
  <text x="410" y="186" class="sm">TPOT grows with batch size</text>
  <rect x="630" y="128" width="220" height="84" class="cell"/>
  <text x="640" y="150" class="sm">Normal for busy decode.</text>
  <text x="640" y="168" class="sm">FP8 weights or KV cache,</text>
  <text x="640" y="186" class="sm">speculative decoding, replicas.</text>

  <!-- Row 3: idle -->
  <rect x="10" y="212" width="140" height="70" class="gray"/><text x="20" y="252" class="b">Idle</text>
  <rect x="150" y="212" width="250" height="70" class="cell"/>
  <text x="160" y="236" class="sm">all activity low</text>
  <text x="160" y="254" class="sm">GPU utilization low or bursty</text>
  <rect x="400" y="212" width="230" height="70" class="cell"/>
  <text x="410" y="236" class="sm">little running, nothing waiting</text>
  <rect x="630" y="212" width="220" height="70" class="cell"/>
  <text x="640" y="236" class="sm">Over-provisioned: scale down</text>
  <text x="640" y="254" class="sm">(Lesson 22).</text>

  <!-- Row 4: starved -->
  <rect x="10" y="282" width="140" height="84" class="yellow"/><text x="20" y="328" class="b">Starved</text>
  <rect x="150" y="282" width="250" height="84" class="cell"/>
  <text x="160" y="304" class="sm">SM activity low or bursty</text>
  <text x="160" y="322" class="sm">GPU utilization may still read high</text>
  <rect x="400" y="282" width="230" height="84" class="cell"/>
  <text x="410" y="304" class="sm">requests waiting</text>
  <text x="410" y="322" class="sm">few running, low tokens/s</text>
  <rect x="630" y="282" width="220" height="84" class="cell"/>
  <text x="640" y="304" class="sm">Bottleneck outside the GPU:</text>
  <text x="640" y="322" class="sm">CPU, tokenizer, launch overhead,</text>
  <text x="640" y="340" class="sm">network, or a hung worker.</text>

  <!-- Row 5: throttled -->
  <rect x="10" y="366" width="140" height="94" class="red"/><text x="20" y="418" class="b">Throttled</text>
  <rect x="150" y="366" width="250" height="94" class="cell"/>
  <text x="160" y="388" class="sm">activity looks normal</text>
  <text x="160" y="406" class="sm">SM clock below peers</text>
  <text x="160" y="424" class="sm">power at limit or temperature high</text>
  <text x="160" y="442" class="sm">violation counters growing</text>
  <rect x="400" y="366" width="230" height="94" class="cell"/>
  <text x="410" y="388" class="sm">lower throughput and higher</text>
  <text x="410" y="406" class="sm">TPOT than peer replicas</text>
  <text x="410" y="424" class="sm">at the same load</text>
  <rect x="630" y="366" width="220" height="94" class="cell"/>
  <text x="640" y="388" class="sm">Physical fix: cooling, power</text>
  <text x="640" y="406" class="sm">caps; drain the node if it</text>
  <text x="640" y="424" class="sm">persists (Lesson 40).</text>
</svg>
