<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .axis{stroke:#000;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <!-- y = 250 - 44.44 * seconds -->
  <text x="16" y="24" class="b">p99 TTFT per replica, equal traffic to each</text>

  <line x1="80" y1="40" x2="80" y2="250" class="axis"/>
  <line x1="80" y1="250" x2="560" y2="250" class="axis"/>
  <g class="sm" text-anchor="end">
    <text x="72" y="254">0</text><text x="72" y="165">2 s</text><text x="72" y="76">4 s</text>
  </g>
  <line x1="76" y1="161.1" x2="80" y2="161.1" class="axis"/>
  <line x1="76" y1="72.2" x2="80" y2="72.2" class="axis"/>

  <rect x="96" y="236.7" width="40" height="13.3" class="green"/>
  <rect x="152" y="236.7" width="40" height="13.3" class="green"/>
  <rect x="208" y="236.7" width="40" height="13.3" class="green"/>
  <rect x="264" y="236.7" width="40" height="13.3" class="green"/>
  <rect x="320" y="236.7" width="40" height="13.3" class="green"/>
  <rect x="376" y="236.7" width="40" height="13.3" class="green"/>
  <rect x="432" y="236.7" width="40" height="13.3" class="green"/>
  <rect x="488" y="72.2" width="40" height="177.8" class="red"/>
  <text x="284" y="233" text-anchor="middle" class="sm">0.3 s each</text>
  <g class="sm" text-anchor="middle">
    <text x="116" y="268">R1</text><text x="172" y="268">R2</text><text x="228" y="268">R3</text><text x="284" y="268">R4</text>
    <text x="340" y="268">R5</text><text x="396" y="268">R6</text><text x="452" y="268">R7</text><text x="508" y="268">R8</text>
  </g>

  <line x1="80" y1="216.1" x2="560" y2="216.1" stroke="#9673a6" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="96" y="208" class="sm b" style="fill:#7a5a8c">average of the p99s: 0.76 s (wrong)</text>
  <line x1="80" y1="72.2" x2="560" y2="72.2" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="96" y="64" class="sm b" style="fill:#b85450">true fleet p99: 4 s</text>

  <text x="590" y="90" class="sm b">Why the fleet p99 is 4 s</text>
  <text x="590" y="112" class="sm">R8 serves 1/8 of all requests,</text>
  <text x="590" y="128" class="sm">and 40% of its requests take</text>
  <text x="590" y="144" class="sm">about 4 s. That is 5% of the</text>
  <text x="590" y="160" class="sm">fleet's requests, far more than</text>
  <text x="590" y="176" class="sm">the 1% that defines the p99.</text>

  <text x="16" y="300">Percentiles cannot be averaged. Add up the histogram buckets across replicas, then take the quantile.</text>
</svg>
