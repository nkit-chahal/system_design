<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="300" y="30" text-anchor="middle" class="b">quantized right</text>
  <text x="500" y="30" text-anchor="middle" class="b">quantized wrong</text>
  <text x="190" y="80" text-anchor="end" class="b">baseline right</text>
  <text x="190" y="150" text-anchor="end" class="b">baseline wrong</text>

  <rect x="200" y="45" width="200" height="70" class="white"/>
  <text x="300" y="76" text-anchor="middle">both right</text>
  <text x="300" y="96" text-anchor="middle" class="sm">no change</text>
  <rect x="400" y="45" width="200" height="70" class="red"/>
  <text x="500" y="76" text-anchor="middle" class="b">lost: b items</text>
  <text x="500" y="96" text-anchor="middle" class="sm">quantization broke them</text>
  <rect x="200" y="115" width="200" height="70" class="green"/>
  <text x="300" y="146" text-anchor="middle" class="b">gained: c items</text>
  <text x="300" y="166" text-anchor="middle" class="sm">changed for the better</text>
  <rect x="400" y="115" width="200" height="70" class="white"/>
  <text x="500" y="146" text-anchor="middle">both wrong</text>
  <text x="500" y="166" text-anchor="middle" class="sm">no change</text>

  <text x="630" y="96">change = (c − b) ÷ n</text>
  <text x="630" y="146">flips = b + c</text>

  <text x="16" y="222" class="sm">Only the off-diagonal cells move the score, which is why a paired comparison is far tighter than comparing two accuracies.</text>
  <text x="16" y="246" class="sm">Hypothetical example: n = 1,319, b = 30, c = 17. Change = −13 ÷ 1,319 = −0.99 points, inside a 1-point threshold,</text>
  <text x="16" y="264" class="sm">yet 47 answers (3.6%) changed. Read the lost items: they show what quantization damaged.</text>
</svg>
