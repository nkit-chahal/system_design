<svg xmlns="http://www.w3.org/2000/svg" width="860" height="270" viewBox="0 0 860 270" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}.it{font-style:italic}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .line{fill:none;stroke:#000;stroke-width:1.2}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .grid{fill:none;stroke:#e6e6e6;stroke-width:1}
    .dash{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:6 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <rect x="20" y="70" width="150" height="40" class="gray"/>
  <text x="95" y="95" text-anchor="middle">gateway wait</text>
  <text x="95" y="128" text-anchor="middle" class="sm">Lab 27 gateway</text>
  <rect x="170" y="70" width="150" height="40" class="purple"/>
  <text x="245" y="95" text-anchor="middle">vLLM queue</text>
  <text x="245" y="128" text-anchor="middle" class="sm">request_queue_time</text>
  <rect x="320" y="70" width="170" height="40" class="orange"/>
  <text x="405" y="95" text-anchor="middle">prefill</text>
  <text x="405" y="128" text-anchor="middle" class="sm">request_prefill_time</text>
  <rect x="490" y="70" width="350" height="40" class="blue"/>
  <text x="665" y="95" text-anchor="middle"></text>
  <text x="665" y="128" text-anchor="middle" class="sm">request_decode_time</text>
  <text x="20" y="30" class="sm">One request's life, and the vLLM histogram that times each part (names omit the vllm: prefix and _seconds suffix)</text>
  <path d="M490,62 V118" stroke="#000" stroke-width="2"/>
  <text x="490" y="56" text-anchor="middle" class="sm">first token</text>
  <path d="M519,70 V110" stroke="#6c8ebf" stroke-width="0.8"/>
  <path d="M548,70 V110" stroke="#6c8ebf" stroke-width="0.8"/>
  <path d="M577,70 V110" stroke="#6c8ebf" stroke-width="0.8"/>
  <path d="M606,70 V110" stroke="#6c8ebf" stroke-width="0.8"/>
  <path d="M635,70 V110" stroke="#6c8ebf" stroke-width="0.8"/>
  <path d="M664,70 V110" stroke="#6c8ebf" stroke-width="0.8"/>
  <path d="M693,70 V110" stroke="#6c8ebf" stroke-width="0.8"/>
  <path d="M722,70 V110" stroke="#6c8ebf" stroke-width="0.8"/>
  <path d="M751,70 V110" stroke="#6c8ebf" stroke-width="0.8"/>
  <path d="M780,70 V110" stroke="#6c8ebf" stroke-width="0.8"/>
  <path d="M809,70 V110" stroke="#6c8ebf" stroke-width="0.8"/>
  <rect x="575" y="80" width="180" height="20" fill="#dae8fc"/>
  <text x="665" y="95" text-anchor="middle">decode: one token per step</text>
  <path d="M170,144 V150 H490 V144" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="330" y="166" text-anchor="middle" class="sm">time_to_first_token: queue + prefill</text>
  <path d="M490,144 V150 H840 V144" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="665" y="166" text-anchor="middle" class="sm">request_time_per_output_token and inter_token_latency</text>
  <path d="M170,190 V196 H840 V190" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="505" y="212" text-anchor="middle" class="sm">e2e_request_latency: everything vLLM sees</text>
  <path d="M20,236 V242 H840 V236" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="430" y="258" text-anchor="middle" class="sm">what the user feels: add the gateway wait and the network</text>
</svg>
