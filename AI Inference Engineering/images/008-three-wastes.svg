  <text x="16" y="26" class="b">Contiguous allocation: each request reserves its maximum length up front</text>
  <text x="264" y="66" text-anchor="middle">Request A: reserved for its maximum of 32 tokens</text>
  <text x="684" y="66" text-anchor="middle">Request B: maximum 16</text>
  <text x="103" y="134" text-anchor="middle" class="sm">9 tokens stored</text>
  <text x="348" y="134" text-anchor="middle" class="sm">20 slots never used: internal fragmentation</text>
  <text x="607" y="134" text-anchor="middle" class="sm">5 stored</text>
  <text x="733" y="134" text-anchor="middle" class="sm">9 never used</text>
  <path class="lead" d="M187,104 V150"/>
  <text x="187" y="166" text-anchor="middle" class="sm">3 reserved for tokens still to come</text>
  <path class="lead" d="M656,104 V150"/>
  <text x="656" y="166" text-anchor="middle" class="sm">2 reserved</text>
  <path class="lead" d="M530,104 V180"/>
  <text x="530" y="196" text-anchor="middle" class="sm">6-slot gap: external fragmentation, too small for a new 16-slot request</text>
  <text x="16" y="228">Only 14 of 54 slots hold tokens (26%). The PagedAttention paper measured 20.4% to 38.2% in such systems.</text>
  <rect x="16" y="256" width="18" height="12" class="blue"/><text x="40" y="267" class="sm">token stored</text>
  <rect x="140" y="256" width="18" height="12" class="yellow"/><text x="164" y="267" class="sm">reserved for future tokens</text>
  <rect x="330" y="256" width="18" height="12" class="red"/><text x="354" y="267" class="sm">never used (internal fragmentation)</text>
  <rect x="578" y="256" width="18" height="12" class="gap"/><text x="602" y="267" class="sm">gap (external fragmentation)</text>
