<svg xmlns="http://www.w3.org/2000/svg" width="840" height="270" viewBox="0 0 840 270" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .grid{fill:none;stroke:#ddd;stroke-width:1}
    .dash{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:5 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="26" class="b">One H100, Llama 3.1 8B, chat traffic at the planning point: three honest numbers</text>
  <rect x="16" y="44" width="256" height="170" rx="8" class="green"/>
  <text x="144" y="72" text-anchor="middle" class="b">Per-user speed</text>
  <text x="144" y="104" text-anchor="middle" class="lg b">≈ 48 tokens/s</text>
  <text x="144" y="136" text-anchor="middle" class="sm">one stream, output only</text>
  <text x="144" y="158" text-anchor="middle" class="sm">1 ÷ 21 ms per step</text>
  <text x="144" y="180" text-anchor="middle" class="sm">what a reader sees</text>
  <rect x="292" y="44" width="256" height="170" rx="8" class="orange"/>
  <text x="420" y="72" text-anchor="middle" class="b">Output throughput</text>
  <text x="420" y="104" text-anchor="middle" class="lg b">≈ 2,500 tokens/s</text>
  <text x="420" y="136" text-anchor="middle" class="sm">53 streams, output only</text>
  <text x="420" y="158" text-anchor="middle" class="sm">5 req/s × 500 tokens</text>
  <text x="420" y="180" text-anchor="middle" class="sm">what output pricing tracks</text>
  <rect x="568" y="44" width="256" height="170" rx="8" class="yellow"/>
  <text x="696" y="72" text-anchor="middle" class="b">Total throughput</text>
  <text x="696" y="104" text-anchor="middle" class="lg b">≈ 12,500 tokens/s</text>
  <text x="696" y="136" text-anchor="middle" class="sm">input + output tokens</text>
  <text x="696" y="158" text-anchor="middle" class="sm">5 req/s × 2,500 tokens</text>
  <text x="696" y="180" text-anchor="middle" class="sm">what a headline may quote</text>
  <text x="16" y="240" class="sm">Planning point from Lesson 19: about 5 requests/s per H100 at p95 TTFT ≤ 500 ms and p95 TPOT ≤ 25 ms.</text>
  <text x="16" y="260" class="sm">All three numbers describe the same GPU at the same moment; only the denominator differs.</text>
</svg>
