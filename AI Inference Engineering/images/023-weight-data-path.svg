<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
    <pattern id="redhatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#e0a8a6" stroke-width="3"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .dedge{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4;marker-end:url(#arrow)}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .tick{stroke:#000;stroke-width:1}
    .grid{stroke:#e3e3e3;stroke-width:1}
    .guide{stroke:#666;stroke-width:1;stroke-dasharray:5 4;fill:none}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <path d="M20.0,64 v58 a60.0,8 0 0 0 120,0 v-58" class="blue"/>
  <ellipse cx="80" cy="64" rx="60.0" ry="8" class="blue"/>
  <text x="80" y="93.0" text-anchor="middle">Object store</text>
  <text x="80" y="110.0" text-anchor="middle" class="sm">or model hub</text>
  <path d="M260.0,64 v58 a60.0,8 0 0 0 120,0 v-58" class="blue"/>
  <ellipse cx="320" cy="64" rx="60.0" ry="8" class="blue"/>
  <text x="320" y="93.0" text-anchor="middle">Local NVMe</text>
  <text x="320" y="110.0" text-anchor="middle" class="sm">SSD</text>
  <rect x="500" y="60" width="120" height="66" rx="6" class="gray"/>
  <text x="560.0" y="89.0" text-anchor="middle">Host RAM</text>
  <text x="560.0" y="106.0" text-anchor="middle" class="sm">page cache</text>
  <rect x="740" y="60" width="120" height="66" rx="6" class="orange"/>
  <text x="800.0" y="89.0" text-anchor="middle">GPU HBM</text>
  <text x="800.0" y="106.0" text-anchor="middle" class="sm">80 GB, 3.35 TB/s</text>
  <path d="M140,93 L258,93" class="edge"/>
  <text x="199.0" y="66" text-anchor="middle" class="sm b">network</text>
  <text x="199.0" y="82" text-anchor="middle" class="sm">0.1–12.5 GB/s</text>
  <text x="199.0" y="114" text-anchor="middle" class="sm">16 GB: 1.3–160 s</text>
  <path d="M380,93 L498,93" class="edge"/>
  <text x="439.0" y="66" text-anchor="middle" class="sm b">NVMe read</text>
  <text x="439.0" y="82" text-anchor="middle" class="sm">2–7 GB/s per drive</text>
  <text x="439.0" y="114" text-anchor="middle" class="sm">16 GB: 2.3–8 s</text>
  <path d="M620,93 L738,93" class="edge"/>
  <text x="679.0" y="66" text-anchor="middle" class="sm b">PCIe Gen5 x16</text>
  <text x="679.0" y="82" text-anchor="middle" class="sm">≈ 64 GB/s each way</text>
  <text x="679.0" y="114" text-anchor="middle" class="sm">16 GB: ≈ 0.25 s</text>
  <path d="M80,138 L80,186 L560,186 L560,128" class="dedge"/>
  <text x="320" y="206" text-anchor="middle" class="sm">streaming loaders read object storage straight into a CPU buffer and skip the disk</text>
  <text x="16" y="244">The slowest hop sets the load time. On a fresh node it is almost always the network;</text>
  <text x="16" y="264">PCIe and HBM are much faster than any network path.</text>
</svg>
