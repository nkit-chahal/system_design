<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="16" y="24" class="b">10,000 TTFT observations in histogram buckets (vLLM's default boundaries)</text>

  <!-- Bucket boxes: x = 16 + i * 114, width 108 -->
  <g text-anchor="middle">
    <text x="70" y="50" class="sm">0 to 0.1 s</text>
    <rect x="16" y="58" width="108" height="44" class="blue"/><text x="70" y="85">5,000</text>
    <text x="70" y="120" class="sm">le="0.1": 5,000</text>

    <text x="184" y="50" class="sm">0.1 to 0.25 s</text>
    <rect x="130" y="58" width="108" height="44" class="blue"/><text x="184" y="85">4,000</text>
    <text x="184" y="120" class="sm">le="0.25": 9,000</text>

    <text x="298" y="50" class="sm b">0.25 to 0.5 s</text>
    <rect x="244" y="58" width="108" height="44" class="orange"/><text x="298" y="85" class="b">600</text>
    <text x="298" y="120" class="sm">le="0.5": 9,600</text>

    <text x="412" y="50" class="sm">0.5 to 0.75 s</text>
    <rect x="358" y="58" width="108" height="44" class="blue"/><text x="412" y="85">200</text>
    <text x="412" y="120" class="sm">le="0.75": 9,800</text>

    <text x="526" y="50" class="sm">0.75 to 1 s</text>
    <rect x="472" y="58" width="108" height="44" class="blue"/><text x="526" y="85">80</text>
    <text x="526" y="120" class="sm">le="1.0": 9,880</text>

    <text x="640" y="50" class="sm b">1 to 2.5 s</text>
    <rect x="586" y="58" width="108" height="44" class="red"/><text x="640" y="85" class="b">110</text>
    <text x="640" y="120" class="sm">le="2.5": 9,990</text>

    <text x="754" y="50" class="sm">above 2.5 s</text>
    <rect x="700" y="58" width="108" height="44" class="blue"/><text x="754" y="85">10</text>
    <text x="754" y="120" class="sm">le="+Inf": 10,000</text>
  </g>
  <text x="16" y="146" class="sm">Each bucket stores only a count; the cumulative counts (le = "less than or equal") are what Prometheus scrapes.</text>

  <!-- Zoom into the p95 bucket -->
  <text x="16" y="182" class="b">p95 = observation number 9,500, which falls inside the 0.25 to 0.5 s bucket</text>
  <rect x="120" y="200" width="600" height="34" class="orange"/>
  <g stroke="#d79b00" stroke-width="1">
    <line x1="150" y1="204" x2="150" y2="230"/><line x1="180" y1="204" x2="180" y2="230"/><line x1="210" y1="204" x2="210" y2="230"/>
    <line x1="240" y1="204" x2="240" y2="230"/><line x1="270" y1="204" x2="270" y2="230"/><line x1="300" y1="204" x2="300" y2="230"/>
    <line x1="330" y1="204" x2="330" y2="230"/><line x1="360" y1="204" x2="360" y2="230"/><line x1="390" y1="204" x2="390" y2="230"/>
    <line x1="420" y1="204" x2="420" y2="230"/><line x1="450" y1="204" x2="450" y2="230"/><line x1="480" y1="204" x2="480" y2="230"/>
    <line x1="510" y1="204" x2="510" y2="230"/><line x1="540" y1="204" x2="540" y2="230"/><line x1="570" y1="204" x2="570" y2="230"/>
    <line x1="600" y1="204" x2="600" y2="230"/><line x1="630" y1="204" x2="630" y2="230"/><line x1="660" y1="204" x2="660" y2="230"/>
    <line x1="690" y1="204" x2="690" y2="230"/>
  </g>
  <line x1="620" y1="192" x2="620" y2="242" stroke="#000" stroke-width="2.5"/>
  <text x="120" y="254" text-anchor="middle" class="sm">0.25 s (9,000)</text>
  <text x="720" y="254" text-anchor="middle" class="sm">0.5 s (9,600)</text>
  <text x="620" y="272" text-anchor="middle" class="sm b">estimate 0.458 s</text>
  <text x="16" y="300">Prometheus assumes the 600 observations are spread evenly: 0.25 + (500 ÷ 600) × 0.25 = 0.458 s.</text>
  <text x="16" y="320">The true p95 can be anywhere from 0.25 to 0.5 s. The p99 (number 9,900) lands in the 1 to 2.5 s</text>
  <text x="16" y="340">bucket and is estimated at 1.27 s, with up to 1.5 s of uncertainty.</text>
</svg>
