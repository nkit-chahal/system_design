    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .thick{fill:none;stroke:#000;stroke-width:2.4;marker-end:url(#arrow)}
    .dash{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:4 3;marker-end:url(#arrow)}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .grid{fill:none;stroke:#ddd;stroke-width:1}
    .ref{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:5 4}
  </style>
