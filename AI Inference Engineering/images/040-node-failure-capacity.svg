<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .gridl{stroke:#e3e3e3;stroke-width:1}
    .peak{stroke:#9673a6;stroke-width:2;stroke-dasharray:8 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="440" y="28" text-anchor="middle" class="b">Capacity left after the worst single-node failure (7 replicas needed at peak)</text>
  <path d="M80,246.7H800M80,193.3H800M80,140.0H800M80,86.7H800" class="gridl"/>
  <path d="M80,52 L80,300 L800,300" class="axis"/>
  <text x="72" y="304.0" text-anchor="end" class="sm">0</text>
  <text x="72" y="250.7" text-anchor="end" class="sm">10</text>
  <text x="72" y="197.3" text-anchor="end" class="sm">20</text>
  <text x="72" y="144.0" text-anchor="end" class="sm">30</text>
  <text x="72" y="90.7" text-anchor="end" class="sm">40</text>
  <text x="30" y="180" text-anchor="middle" transform="rotate(-90 30 180)">requests per second left</text>
  <line x1="105" y1="299" x2="195" y2="299" stroke="#b85450" stroke-width="3"/>
  <text x="150" y="292.0" text-anchor="middle" class="b">0</text>
  <text x="150" y="320" text-anchor="middle" class="sm">1 node: 8</text>
  <text x="150" y="336" text-anchor="middle" class="sm">8 H100s</text>
  <rect x="245" y="193.3" width="90" height="106.7" class="red"/>
  <text x="290" y="185.3" text-anchor="middle" class="b">20</text>
  <text x="290" y="320" text-anchor="middle" class="sm">2 nodes: 4 + 4</text>
  <text x="290" y="336" text-anchor="middle" class="sm">8 H100s</text>
  <rect x="385" y="113.3" width="90" height="186.7" class="green"/>
  <text x="430" y="105.3" text-anchor="middle" class="b">35</text>
  <text x="430" y="320" text-anchor="middle" class="sm">2 nodes: 7 + 7</text>
  <text x="430" y="336" text-anchor="middle" class="sm">14 H100s</text>
  <rect x="525" y="86.7" width="90" height="213.3" class="green"/>
  <text x="570" y="78.7" text-anchor="middle" class="b">40</text>
  <text x="570" y="320" text-anchor="middle" class="sm b">3 zones: 4 + 4 + 4</text>
  <text x="570" y="336" text-anchor="middle" class="sm">12 H100s</text>
  <rect x="665" y="86.7" width="90" height="213.3" class="green"/>
  <text x="710" y="78.7" text-anchor="middle" class="b">40</text>
  <text x="710" y="320" text-anchor="middle" class="sm">5 nodes: 2 each</text>
  <text x="710" y="336" text-anchor="middle" class="sm">10 H100s</text>
  <line x1="80" y1="124.0" x2="800" y2="124.0" class="peak"/>
  <text x="90" y="118.0" class="sm">peak demand 33 req/s</text>
  <text x="80" y="368" class="sm">5 requests/s per H100, one replica per GPU, 8-GPU nodes. Spare GPUs on each node can run batch work.</text>
  <text x="80" y="386" class="sm">Replicas per node = ceil(N ÷ (k − 1)) for k nodes; the 3-zone layout also survives a zone outage.</text>
  </svg>
