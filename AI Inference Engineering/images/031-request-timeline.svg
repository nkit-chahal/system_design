<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .span{fill:none;stroke:#000;stroke-width:1.2;marker-start:url(#arrow);marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="16" y="24" class="sm">Time is not to scale: the first 0.31 s are stretched so the short phases are visible.</text>

  <!-- Lane labels -->
  <text x="16" y="78" class="b">Gateway</text>
  <text x="16" y="148" class="b">Engine</text>

  <!-- Gateway lane -->
  <line x1="110" y1="74" x2="820" y2="74" stroke="#999"/>
  <!-- Engine lane -->
  <line x1="110" y1="144" x2="820" y2="144" stroke="#999"/>

  <!-- Events -->
  <circle cx="120" cy="74" r="6" fill="#000"/>
  <text x="120" y="56" text-anchor="middle" class="sm">arrives, t = 0</text>
  <path d="M124,80 L146,136" class="edge"/>
  <rect x="150" y="132" width="70" height="24" class="gray"/>
  <text x="185" y="149" text-anchor="middle" class="sm">waiting</text>
  <rect x="220" y="132" width="90" height="24" class="orange"/>
  <text x="265" y="149" text-anchor="middle" class="sm">prefill</text>
  <rect x="310" y="132" width="440" height="24" class="blue"/>
  <text x="530" y="149" text-anchor="middle" class="sm">decode: 500 tokens streamed</text>
  <rect x="750" y="132" width="40" height="24" class="purple"/>
  <text x="770" y="149" text-anchor="middle" class="sm">usage</text>

  <path d="M312,132 L330,80" class="edge"/>
  <circle cx="332" cy="74" r="6" fill="#000"/>
  <text x="332" y="56" text-anchor="middle" class="sm">first token, 0.31 s</text>
  <path d="M792,132 L798,80" class="edge"/>
  <circle cx="800" cy="74" r="6" fill="#000"/>
  <text x="790" y="56" text-anchor="middle" class="sm">done, 10.8 s</text>

  <!-- Spans -->
  <path d="M150,180 L220,180" class="span"/>
  <text x="185" y="198" text-anchor="middle" class="sm">queue_time</text>
  <text x="185" y="213" text-anchor="middle" class="sm">0.04 s (engine)</text>
  <path d="M120,236 L332,236" class="span"/>
  <text x="226" y="254" text-anchor="middle" class="sm">ttft 0.31 s (gateway)</text>
  <path d="M120,276 L800,276" class="span"/>
  <text x="560" y="268" text-anchor="middle" class="sm">e2e_latency 10.8 s (gateway); the record is written after this</text>
</svg>
