<svg xmlns="http://www.w3.org/2000/svg" width="820" height="490" viewBox="0 0 820 490" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .held{fill:url(#hatch);stroke:#666;stroke-width:1.2}
    .lead{fill:none;stroke:#000;stroke-width:1}
    .brk{fill:none;stroke:#000;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="20" y="26" class="b">Everything that occupies one GPU while it serves a model (sizes not to scale)</text>

  <!-- The GPU: one stacked bar, top to bottom -->
  <rect x="190" y="44" width="170" height="60" class="held"/>
  <rect x="190" y="104" width="170" height="32" class="gray"/>
  <rect x="190" y="136" width="170" height="150" class="blue"/>
  <text x="275" y="206" text-anchor="middle" class="b">KV cache</text>
  <text x="275" y="224" text-anchor="middle" class="sm">gets the remainder</text>
  <rect x="190" y="286" width="170" height="28" class="purple"/>
  <rect x="190" y="314" width="170" height="18" class="red"/>
  <rect x="190" y="332" width="170" height="40" class="yellow"/>
  <rect x="190" y="372" width="170" height="80" class="orange"/>
  <text x="275" y="416" text-anchor="middle" class="b">Weights</text>
  <text x="275" y="474" text-anchor="middle" class="sm">M = total visible memory, U = --gpu-memory-utilization</text>

  <!-- Brackets on the left -->
  <path d="M180,46 H170 V134 H180" class="brk"/>
  <text x="160" y="80" text-anchor="end" class="sm">outside vLLM's</text>
  <text x="160" y="96" text-anchor="end" class="sm">budget:</text>
  <text x="160" y="112" text-anchor="end" class="sm b">(1 − U) × M</text>
  <path d="M180,138 H170 V450 H180" class="brk"/>
  <text x="160" y="284" text-anchor="end" class="sm">vLLM's budget:</text>
  <text x="160" y="300" text-anchor="end" class="sm b">U × M</text>

  <!-- Leader lines: segment centre to label -->
  <path d="M362,74 L395,65" class="lead"/>
  <path d="M362,120 L395,117" class="lead"/>
  <path d="M362,211 L395,187" class="lead"/>
  <path d="M362,300 L395,257" class="lead"/>
  <path d="M362,323 L395,301" class="lead"/>
  <path d="M362,352 L395,345" class="lead"/>
  <path d="M362,412 L395,397" class="lead"/>

  <!-- Labels with the sizing rule for each piece -->
  <text x="400" y="70" class="b">Free headroom</text>
  <text x="400" y="87" class="sm">spare room for spikes and other processes</text>
  <text x="400" y="122" class="b">CUDA context, cuBLAS, NCCL</text>
  <text x="400" y="139" class="sm">fixed cost per process, larger with TP</text>
  <text x="400" y="192" class="b">KV cache</text>
  <text x="400" y="209" class="sm">U × M minus every piece below it</text>
  <text x="400" y="225" class="sm">2 × L × H_kv × d × bytes per token (Lesson 3)</text>
  <text x="400" y="262" class="b">CUDA graphs</text>
  <text x="400" y="279" class="sm">grows with the number of captured batch sizes</text>
  <text x="400" y="306" class="b">Fragmentation</text>
  <text x="400" y="323" class="sm">allocator blocks reserved but not in use</text>
  <text x="400" y="350" class="b">Activations and workspace</text>
  <text x="400" y="367" class="sm">grows with max_num_batched_tokens and max_num_seqs</text>
  <text x="400" y="402" class="b">Weights</text>
  <text x="400" y="419" class="sm">parameters × bytes per parameter ÷ TP size</text>
</svg>
