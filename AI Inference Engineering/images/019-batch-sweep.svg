    .slo{stroke:#b85450;stroke-width:1.6;stroke-dasharray:7 4}
    .op{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.5}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="90" y="36" class="b">Throughput: output tokens per second, all requests</text>
  <path d="M90,50H730M90,87.5H730M90,125H730M90,162.5H730M218,50V200M218,240V390M346,50V200M346,240V390M474,50V200M474,240V390M602,50V200M602,240V390" class="gridl"/>
