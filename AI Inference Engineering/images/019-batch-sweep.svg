  <polyline points="94.0,358.7 122.0,354.8 154.0,350.2 218.0,341.2 346.0,323.2 474.0,305.1 602.0,287.0 730.0,269.0" class="lp"/>
  <circle cx="94.0" cy="358.7" r="3.5" class="mp"/><circle cx="122.0" cy="354.8" r="3.5" class="mp"/><circle cx="154.0" cy="350.2" r="3.5" class="mp"/><circle cx="218.0" cy="341.2" r="3.5" class="mp"/><circle cx="346.0" cy="323.2" r="3.5" class="mp"/><circle cx="474.0" cy="305.1" r="3.5" class="mp"/><circle cx="602.0" cy="287.0" r="3.5" class="mp"/><circle cx="730.0" cy="269.0" r="3.5" class="mp"/>
  <path d="M301.4,325.4 L301.4,308.9" class="edge"/>
  <circle cx="301.4" cy="301.9" r="5.5" class="op"/>
  <text x="286" y="306" text-anchor="end" class="sm">at 5 req/s, ≈ 53 decoding;</text>
  <text x="286" y="321" text-anchor="end" class="sm">prompt chunks → ≈ 21 ms</text>

  <path d="M90,390V396M218,390V396M346,390V396M474,390V396M602,390V396M730,390V396" stroke="#000"/>
  <text x="90" y="411" text-anchor="middle" class="sm">0</text>
  <text x="218" y="411" text-anchor="middle" class="sm">32</text>
  <text x="346" y="411" text-anchor="middle" class="sm">64</text>
  <text x="474" y="411" text-anchor="middle" class="sm">96</text>
  <text x="602" y="411" text-anchor="middle" class="sm">128</text>
