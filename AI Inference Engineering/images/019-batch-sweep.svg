  <text x="410" y="432" text-anchor="middle">concurrent decoding requests (batch size)</text>
  <text x="90" y="456" class="sm">Illustrative model: step time = (16.06 GB of weights + KV read) ÷ (65% of 3.35 TB/s), Llama 3.1 8B on one H100, 2,250 tokens per request.</text>
