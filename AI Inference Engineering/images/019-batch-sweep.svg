  <circle cx="94.0" cy="196.7" r="3.5" class="mt"/><circle cx="122.0" cy="176.4" r="3.5" class="mt"/><circle cx="154.0" cy="158.1" r="3.5" class="mt"/><circle cx="218.0" cy="131.7" r="3.5" class="mt"/><circle cx="346.0" cy="100.3" r="3.5" class="mt"/><circle cx="474.0" cy="82.2" r="3.5" class="mt"/><circle cx="602.0" cy="70.5" r="3.5" class="mt"/><circle cx="730.0" cy="62.3" r="3.5" class="mt"/>
  <line x1="99" y1="195" x2="134" y2="189" stroke="#000" stroke-width="0.8"/><text x="137" y="193" class="sm">MFU 0.2%</text>
  <text x="352" y="112" class="sm">MFU 6.5%</text>
  <text x="742" y="66" class="sm">MFU 9.0%</text>

  <text x="90" y="226" class="b">Time per output token (ms), pure decode</text>
  <path d="M90,240H730M90,277.5H730M90,315H730M90,352.5H730" class="gridl"/>
  <path d="M90,236 L90,390 L730,390" class="axis"/>
