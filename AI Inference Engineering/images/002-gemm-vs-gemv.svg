<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Prefill panel -->
  <rect x="10" y="10" width="396" height="270" rx="4" class="group"/>
  <text x="208" y="34" text-anchor="middle" class="lg b">Prefill: matrix × matrix</text>
  <rect x="40" y="56" width="70" height="150" class="purple"/>
  <text x="75" y="126" text-anchor="middle" class="sm">X</text>
  <text x="75" y="142" text-anchor="middle" class="sm">2,000 ×</text>
  <text x="75" y="156" text-anchor="middle" class="sm">4,096</text>
  <text x="126" y="136" text-anchor="middle" class="lg">×</text>
  <rect x="142" y="81" width="100" height="100" class="blue"/>
  <text x="192" y="128" text-anchor="middle" class="sm">W</text>
  <text x="192" y="144" text-anchor="middle" class="sm">4,096 × 4,096</text>
  <text x="258" y="136" text-anchor="middle" class="lg">=</text>
  <rect x="274" y="56" width="70" height="150" class="green"/>
  <text x="309" y="126" text-anchor="middle" class="sm">Y</text>
  <text x="309" y="142" text-anchor="middle" class="sm">2,000 ×</text>
  <text x="309" y="156" text-anchor="middle" class="sm">4,096</text>
  <text x="26" y="230">W read from memory once: 32 MiB</text>
  <text x="26" y="250">Math: 2 × 2,000 × 4,096² ≈ 67 GFLOP</text>
  <text x="26" y="270" class="b">≈ 1,000 FLOPs per byte moved</text>

  <!-- Decode panel -->
  <rect x="414" y="10" width="396" height="270" rx="4" class="group"/>
  <text x="612" y="34" text-anchor="middle" class="lg b">Decode: matrix × vector</text>
  <rect x="444" y="124" width="70" height="14" class="purple"/>
  <text x="479" y="158" text-anchor="middle" class="sm">x: 1 × 4,096</text>
  <text x="530" y="136" text-anchor="middle" class="lg">×</text>
  <rect x="546" y="81" width="100" height="100" class="blue"/>
  <text x="596" y="128" text-anchor="middle" class="sm">W</text>
  <text x="596" y="144" text-anchor="middle" class="sm">4,096 × 4,096</text>
  <text x="662" y="136" text-anchor="middle" class="lg">=</text>
  <rect x="678" y="124" width="70" height="14" class="green"/>
  <text x="713" y="158" text-anchor="middle" class="sm">y: 1 × 4,096</text>
  <text x="430" y="230">W read from memory once: 32 MiB</text>
  <text x="430" y="250">Math: 2 × 4,096² ≈ 34 MFLOP</text>
  <text x="430" y="270" class="b">≈ 1 FLOP per byte moved</text>

  <text x="16" y="310">Both phases stream the same weights from HBM. Prefill does 2,000 times more math with them,</text>
  <text x="16" y="330">so its time is set by the tensor cores; decode's time is set by memory bandwidth.</text>
</svg>
