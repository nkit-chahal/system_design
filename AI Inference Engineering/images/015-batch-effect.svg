  <text x="16" y="340" class="sm">Modeled roofline bound for Llama 3.1 8B on one H100 with a Llama 3.2 1B draft, α = 0.8, k = 4. Each step reads weights and KV cache;</text>
  <text x="16" y="356" class="sm">verification is compute-bound once B × (k + 1) tokens pass the ridge. Real engines cross over earlier. The long-context curve stops near the memory limit.</text>
