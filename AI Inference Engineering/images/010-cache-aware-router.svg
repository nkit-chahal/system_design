<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Left panel: round robin -->
  <rect x="10" y="8" width="400" height="284" rx="4" class="group"/>
  <text x="22" y="30" class="b">Round robin</text>
  <g class="sm">
    <rect x="152" y="38" width="26" height="20" rx="3" class="purple"/><text x="165" y="52" text-anchor="middle">A</text>
    <rect x="182" y="38" width="26" height="20" rx="3" class="purple"/><text x="195" y="52" text-anchor="middle">B</text>
    <rect x="212" y="38" width="26" height="20" rx="3" class="purple"/><text x="225" y="52" text-anchor="middle">C</text>
    <rect x="242" y="38" width="26" height="20" rx="3" class="purple"/><text x="255" y="52" text-anchor="middle">D</text>
  </g>
  <path d="M210,58 L210,70" class="edge"/>
  <rect x="80" y="72" width="260" height="40" rx="6" class="gray"/>
  <text x="210" y="90" text-anchor="middle">Round-robin load balancer</text>
  <text x="210" y="106" text-anchor="middle" class="sm">next replica in turn</text>
  <path d="M150,112 L65,158" class="edge"/>
  <path d="M190,112 L161,158" class="edge"/>
  <path d="M230,112 L257,158" class="edge"/>
  <path d="M270,112 L353,158" class="edge"/>
  <g class="sm">
    <rect x="22" y="160" width="86" height="70" rx="6" class="white"/><text x="65" y="178" text-anchor="middle">Replica 0</text>
    <rect x="118" y="160" width="86" height="70" rx="6" class="white"/><text x="161" y="178" text-anchor="middle">Replica 1</text>
    <rect x="214" y="160" width="86" height="70" rx="6" class="white"/><text x="257" y="178" text-anchor="middle">Replica 2</text>
    <rect x="310" y="160" width="86" height="70" rx="6" class="white"/><text x="353" y="178" text-anchor="middle">Replica 3</text>
  </g>
  <g class="sm">
    <rect x="27" y="194" width="16" height="16" class="blue"/><text x="35" y="207" text-anchor="middle">A</text>
    <rect x="47" y="194" width="16" height="16" class="blue"/><text x="55" y="207" text-anchor="middle">B</text>
    <rect x="67" y="194" width="16" height="16" class="blue"/><text x="75" y="207" text-anchor="middle">C</text>
    <rect x="87" y="194" width="16" height="16" class="blue"/><text x="95" y="207" text-anchor="middle">D</text>
    <rect x="123" y="194" width="16" height="16" class="blue"/><text x="131" y="207" text-anchor="middle">A</text>
    <rect x="143" y="194" width="16" height="16" class="blue"/><text x="151" y="207" text-anchor="middle">B</text>
    <rect x="163" y="194" width="16" height="16" class="blue"/><text x="171" y="207" text-anchor="middle">C</text>
    <rect x="183" y="194" width="16" height="16" class="blue"/><text x="191" y="207" text-anchor="middle">D</text>
    <rect x="219" y="194" width="16" height="16" class="blue"/><text x="227" y="207" text-anchor="middle">A</text>
    <rect x="239" y="194" width="16" height="16" class="blue"/><text x="247" y="207" text-anchor="middle">B</text>
    <rect x="259" y="194" width="16" height="16" class="blue"/><text x="267" y="207" text-anchor="middle">C</text>
    <rect x="279" y="194" width="16" height="16" class="blue"/><text x="287" y="207" text-anchor="middle">D</text>
    <rect x="315" y="194" width="16" height="16" class="blue"/><text x="323" y="207" text-anchor="middle">A</text>
    <rect x="335" y="194" width="16" height="16" class="blue"/><text x="343" y="207" text-anchor="middle">B</text>
    <rect x="355" y="194" width="16" height="16" class="blue"/><text x="363" y="207" text-anchor="middle">C</text>
    <rect x="375" y="194" width="16" height="16" class="blue"/><text x="383" y="207" text-anchor="middle">D</text>
  </g>
  <text x="22" y="256" class="sm">Every replica computes and caches every prefix:</text>
  <text x="22" y="274" class="sm">40 prefixes × 500 MiB ≈ <tspan class="b">19.5 GiB</tspan> per replica</text>

  <!-- Right panel: cache-aware -->
  <rect x="430" y="8" width="400" height="284" rx="4" class="group"/>
  <text x="442" y="30" class="b">Cache-aware (SGLang Model Gateway)</text>
  <g class="sm">
    <rect x="572" y="38" width="26" height="20" rx="3" class="purple"/><text x="585" y="52" text-anchor="middle">A</text>
    <rect x="602" y="38" width="26" height="20" rx="3" class="purple"/><text x="615" y="52" text-anchor="middle">B</text>
    <rect x="632" y="38" width="26" height="20" rx="3" class="purple"/><text x="645" y="52" text-anchor="middle">C</text>
    <rect x="662" y="38" width="26" height="20" rx="3" class="purple"/><text x="675" y="52" text-anchor="middle">D</text>
  </g>
  <path d="M630,58 L630,70" class="edge"/>
  <rect x="500" y="72" width="260" height="40" rx="6" class="orange"/>
  <text x="630" y="90" text-anchor="middle">Gateway: approx. tree per worker</text>
  <text x="630" y="106" text-anchor="middle" class="sm">longest match, else shortest queue</text>
  <path d="M570,112 L485,158" class="edge"/>
  <path d="M610,112 L581,158" class="edge"/>
  <path d="M650,112 L677,158" class="edge"/>
  <path d="M690,112 L773,158" class="edge"/>
  <g class="sm">
    <text x="518" y="136" text-anchor="middle">A</text>
    <text x="588" y="136" text-anchor="middle">B</text>
    <text x="672" y="136" text-anchor="middle">C</text>
    <text x="742" y="136" text-anchor="middle">D</text>
  </g>
  <g class="sm">
    <rect x="442" y="160" width="86" height="70" rx="6" class="white"/><text x="485" y="178" text-anchor="middle">Replica 0</text>
    <rect x="538" y="160" width="86" height="70" rx="6" class="white"/><text x="581" y="178" text-anchor="middle">Replica 1</text>
    <rect x="634" y="160" width="86" height="70" rx="6" class="white"/><text x="677" y="178" text-anchor="middle">Replica 2</text>
    <rect x="730" y="160" width="86" height="70" rx="6" class="white"/><text x="773" y="178" text-anchor="middle">Replica 3</text>
    <rect x="477" y="194" width="16" height="16" class="blue"/><text x="485" y="207" text-anchor="middle">A</text>
    <rect x="573" y="194" width="16" height="16" class="blue"/><text x="581" y="207" text-anchor="middle">B</text>
    <rect x="669" y="194" width="16" height="16" class="blue"/><text x="677" y="207" text-anchor="middle">C</text>
    <rect x="765" y="194" width="16" height="16" class="blue"/><text x="773" y="207" text-anchor="middle">D</text>
  </g>
  <text x="442" y="256" class="sm">Each prefix is computed once and lives on one replica:</text>
  <text x="442" y="274" class="sm">about 10 prefixes ≈ <tspan class="b">4.9 GiB</tspan> per replica</text>
</svg>
