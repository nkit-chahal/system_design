<svg xmlns="http://www.w3.org/2000/svg" width="838" height="350" viewBox="0 0 838 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.lg{font-size:16px}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .axis{stroke:#000;stroke-width:1.2;fill:none}
    .grid{stroke:#ddd;stroke-width:1;fill:none}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="26" class="b">Distill, then quantize</text>
  <rect x="16" y="38" width="170" height="50" rx="6" class="gray"/>
  <text x="101" y="68" text-anchor="middle">70B teacher</text>
  <path d="M186,63 L282,63" class="edge"/>
  <text x="234" y="55" text-anchor="middle" class="sm">distill</text>
  <rect x="284" y="38" width="170" height="50" rx="6" class="orange"/>
  <text x="369" y="59" text-anchor="middle">8B student</text>
  <text x="369" y="77" text-anchor="middle" class="sm">BF16</text>
  <path d="M454,63 L550,63" class="edge"/>
  <text x="502" y="55" text-anchor="middle" class="sm">quantize</text>
  <rect x="552" y="38" width="270" height="50" rx="6" class="green"/>
  <text x="687" y="59" text-anchor="middle" class="b">8B student, FP8</text>
  <text x="687" y="77" text-anchor="middle" class="sm">serves most traffic</text>
  <line x1="16" y1="108" x2="822" y2="108" stroke="#999" stroke-dasharray="5 4"/>
  <text x="16" y="134" class="b">Quantize the teacher too</text>
  <rect x="16" y="146" width="170" height="50" rx="6" class="gray"/>
  <text x="101" y="176" text-anchor="middle">70B teacher</text>
  <path d="M186,171 L550,171" class="edge"/>
  <text x="368" y="163" text-anchor="middle" class="sm">quantize (Lesson 13)</text>
  <rect x="552" y="146" width="270" height="50" rx="6" class="green"/>
  <text x="687" y="167" text-anchor="middle" class="b">70B, FP8</text>
  <text x="687" y="185" text-anchor="middle" class="sm">hard requests from the router</text>
  <line x1="16" y1="216" x2="822" y2="216" stroke="#999" stroke-dasharray="5 4"/>
  <text x="16" y="242" class="b">Distilled draft model for speculative decoding (Lesson 15)</text>
  <rect x="16" y="254" width="170" height="56" rx="6" class="orange"/>
  <text x="101" y="278" text-anchor="middle">small draft</text>
  <text x="101" y="296" text-anchor="middle" class="sm">e.g. Llama 3.2 1B</text>
  <path d="M186,282 L550,282" class="edge"/>
  <text x="368" y="274" text-anchor="middle" class="sm">proposes several tokens per step</text>
  <rect x="552" y="254" width="270" height="56" rx="6" class="green"/>
  <text x="687" y="278" text-anchor="middle" class="b">target verifies in one pass</text>
  <text x="687" y="296" text-anchor="middle" class="sm">same tokenizer as the draft</text>
  <text x="16" y="336" class="sm">Distilling the draft on the target's outputs raises its acceptance rate; DistillSpec reports 10–45% more speedup than an undistilled draft.</text>
</svg>
