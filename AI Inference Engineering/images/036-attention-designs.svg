<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="kv" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="12" height="12" rx="2" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/></pattern>
    <pattern id="empty" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="12" height="12" rx="2" fill="#fff" stroke="#bbb" stroke-width="1"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="20" y="22" class="b">What each kind of layer keeps per sequence as the context grows</text>

  <!-- panel 1: full -->
  <rect x="14" y="36" width="190" height="282" rx="4" class="group"/>
  <text x="109" y="58" text-anchor="middle" class="b">Full attention</text>
  <text x="24" y="84" class="sm">every layer</text>
  <rect x="24" y="92" width="168" height="14" fill="url(#kv)"/>
  <rect x="24" y="110" width="168" height="14" fill="url(#kv)"/>
  <text x="24" y="156" class="sm">Cache grows with every</text>
  <text x="24" y="172" class="sm">token in every layer.</text>
  <text x="24" y="204" class="sm">Llama 3.1 8B at 128K:</text>
  <text x="24" y="220" class="sm b">16 GiB per sequence</text>

  <!-- panel 2: local + global -->
  <rect x="214" y="36" width="190" height="282" rx="4" class="group"/>
  <text x="309" y="58" text-anchor="middle" class="b">Local + global</text>
  <text x="224" y="84" class="sm">global layers</text>
  <rect x="224" y="92" width="168" height="14" fill="url(#kv)"/>
  <text x="224" y="124" class="sm">local (window) layers</text>
  <rect x="224" y="132" width="126" height="14" fill="url(#empty)"/>
  <rect x="350" y="132" width="42" height="14" fill="url(#kv)"/>
  <text x="224" y="172" class="sm">Local layers keep only the</text>
  <text x="224" y="188" class="sm">last w tokens.</text>
  <text x="224" y="220" class="sm">gpt-oss-120b: half the layers</text>
  <text x="224" y="236" class="sm">use a 128-token window:</text>
  <text x="224" y="252" class="sm b">4.5 GiB at 128K</text>
  <text x="224" y="278" class="sm">Gemma 3: 5 local per global,</text>
  <text x="224" y="294" class="sm">1,024-token window</text>

  <!-- panel 3: linear hybrids -->
  <rect x="414" y="36" width="190" height="282" rx="4" class="group"/>
  <text x="509" y="58" text-anchor="middle" class="b">Linear-attention hybrid</text>
  <text x="424" y="84" class="sm">few softmax layers</text>
  <rect x="424" y="92" width="168" height="14" fill="url(#kv)"/>
  <text x="424" y="124" class="sm">linear / recurrent layers</text>
  <rect x="424" y="132" width="60" height="14" rx="2" class="purple"/>
  <text x="492" y="143" class="sm">fixed-size state</text>
  <text x="424" y="172" class="sm">Most layers carry a state</text>
  <text x="424" y="188" class="sm">that does not grow.</text>
  <text x="424" y="220" class="sm">MiniMax-01 (lightning</text>
  <text x="424" y="236" class="sm">attention), Kimi Linear:</text>
  <text x="424" y="252" class="sm b">up to 75% less KV cache</text>

  <!-- panel 4: sparse -->
  <rect x="614" y="36" width="190" height="282" rx="4" class="group"/>
  <text x="709" y="58" text-anchor="middle" class="b">Sparse selection</text>
  <text x="624" y="84" class="sm">every layer stores all,</text>
  <rect x="624" y="92" width="168" height="14" fill="url(#kv)"/>
  <text x="624" y="124" class="sm">but each query reads a few</text>
  <rect x="624" y="132" width="168" height="14" fill="url(#empty)"/>
  <rect x="639" y="132" width="14" height="14" class="orange"/>
  <rect x="681" y="132" width="14" height="14" class="orange"/>
  <rect x="723" y="132" width="14" height="14" class="orange"/>
  <rect x="765" y="132" width="14" height="14" class="orange"/>
  <text x="624" y="172" class="sm">Memory still grows; reads</text>
  <text x="624" y="188" class="sm">and FLOPs per token do not.</text>
  <text x="624" y="220" class="sm">DeepSeek-V3.2 (DSA),</text>
  <text x="624" y="236" class="sm">Native Sparse Attention</text>
</svg>
