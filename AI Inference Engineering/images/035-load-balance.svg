<svg xmlns="http://www.w3.org/2000/svg" width="820" height="328" viewBox="0 0 820 328" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .thick{fill:none;stroke:#000;stroke-width:2.4;marker-end:url(#arrow)}
    .dash{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:4 3;marker-end:url(#arrow)}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .grid{fill:none;stroke:#ddd;stroke-width:1}
    .ref{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:5 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="20" y="40" class="b">Before: GPU 3 holds two hot experts</text>
  <path d="M50,250 L380,250" class="axis"/>
  <rect x="64" y="142.0" width="30" height="108.0" class="orange"/>
  <text x="79" y="268" text-anchor="middle" class="sm">G0</text>
  <rect x="104" y="130.0" width="30" height="120.0" class="orange"/>
  <text x="119" y="268" text-anchor="middle" class="sm">G1</text>
  <rect x="144" y="148.0" width="30" height="102.0" class="orange"/>
  <text x="159" y="268" text-anchor="middle" class="sm">G2</text>
  <rect x="184" y="58.0" width="30" height="192.0" class="red"/>
  <text x="199" y="268" text-anchor="middle" class="sm">G3</text>
  <rect x="224" y="136.0" width="30" height="114.0" class="orange"/>
  <text x="239" y="268" text-anchor="middle" class="sm">G4</text>
  <rect x="264" y="154.0" width="30" height="96.0" class="orange"/>
  <text x="279" y="268" text-anchor="middle" class="sm">G5</text>
  <rect x="304" y="130.0" width="30" height="120.0" class="orange"/>
  <text x="319" y="268" text-anchor="middle" class="sm">G6</text>
  <rect x="344" y="142.0" width="30" height="108.0" class="orange"/>
  <text x="359" y="268" text-anchor="middle" class="sm">G7</text>
  <line x1="50" y1="130.0" x2="380" y2="130.0" class="ref"/>
  <text x="20" y="134" class="sm">1.0×</text>
  <line x1="50" y1="58.0" x2="380" y2="58.0" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="320" y="52.0" class="sm">max 1.60×</text>
  <text x="440" y="40" class="b">After EPLB replicates the hot experts</text>
  <path d="M470,250 L800,250" class="axis"/>
  <rect x="484" y="124.0" width="30" height="126.0" class="orange"/>
  <text x="499" y="268" text-anchor="middle" class="sm">G0</text>
  <rect x="524" y="130.0" width="30" height="120.0" class="orange"/>
  <text x="539" y="268" text-anchor="middle" class="sm">G1</text>
  <rect x="564" y="133.6" width="30" height="116.4" class="orange"/>
  <text x="579" y="268" text-anchor="middle" class="sm">G2</text>
  <rect x="604" y="120.4" width="30" height="129.6" class="orange"/>
  <text x="619" y="268" text-anchor="middle" class="sm">G3</text>
  <rect x="644" y="130.0" width="30" height="120.0" class="orange"/>
  <text x="659" y="268" text-anchor="middle" class="sm">G4</text>
  <rect x="684" y="136.0" width="30" height="114.0" class="orange"/>
  <text x="699" y="268" text-anchor="middle" class="sm">G5</text>
  <rect x="724" y="130.0" width="30" height="120.0" class="orange"/>
  <text x="739" y="268" text-anchor="middle" class="sm">G6</text>
  <rect x="764" y="136.0" width="30" height="114.0" class="orange"/>
  <text x="779" y="268" text-anchor="middle" class="sm">G7</text>
  <line x1="470" y1="130.0" x2="800" y2="130.0" class="ref"/>
  <text x="440" y="134" class="sm">1.0×</text>
  <line x1="470" y1="120.4" x2="800" y2="120.4" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="740" y="114.39999999999998" class="sm">max 1.08×</text>
  <text x="20" y="296" class="sm">Tokens received per GPU in one MoE layer, relative to the average (gray line). The step lasts as long as the busiest GPU (red line).</text>
  <text x="20" y="314" class="sm">Illustrative numbers; measure real loads with the engine's balancedness log.</text>
</svg>
