<svg xmlns="http://www.w3.org/2000/svg" width="840" height="372" viewBox="0 0 840 372" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .both{fill:none;stroke:#000;stroke-width:1.2;marker-start:url(#arrow);marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Client -->
  <rect x="12" y="78" width="84" height="208" rx="6" class="white"/>
  <text x="54" y="176" text-anchor="middle">Client</text>
  <text x="54" y="196" text-anchor="middle" class="sm">OpenAI SDK</text>

  <!-- API server process -->
  <rect x="120" y="36" width="184" height="290" rx="4" class="group"/>
  <text x="130" y="58" class="b">API server process</text>
  <rect x="134" y="78" width="156" height="48" rx="6" class="gray"/>
  <text x="212" y="98" text-anchor="middle">HTTP server</text>
  <text x="212" y="116" text-anchor="middle" class="sm">OpenAI API, tokenize</text>
  <rect x="134" y="238" width="156" height="48" rx="6" class="gray"/>
  <text x="212" y="258" text-anchor="middle">Detokenize</text>
  <text x="212" y="276" text-anchor="middle" class="sm">stream to client</text>

  <!-- Engine core process -->
  <rect x="344" y="36" width="216" height="290" rx="4" class="group"/>
  <text x="354" y="58" class="b">Engine core process</text>
  <rect x="358" y="78" width="188" height="48" rx="6" class="orange"/>
  <text x="452" y="98" text-anchor="middle">Scheduler</text>
  <text x="452" y="116" text-anchor="middle" class="sm">tokens per request this step</text>
  <rect x="358" y="158" width="188" height="48" rx="6" class="blue"/>
  <text x="452" y="178" text-anchor="middle">KV cache manager</text>
  <text x="452" y="196" text-anchor="middle" class="sm">block pool, prefix hashes</text>
  <rect x="358" y="238" width="188" height="48" rx="6" class="gray"/>
  <text x="452" y="258" text-anchor="middle">Update requests</text>
  <text x="452" y="276" text-anchor="middle" class="sm">append tokens, check stop</text>
  <path d="M452,128 L452,156" class="both"/>
  <path d="M452,208 L452,236" class="both"/>

  <!-- GPU worker processes -->
  <rect x="600" y="36" width="228" height="290" rx="4" class="group"/>
  <text x="610" y="58" class="b">GPU worker processes</text>
  <rect x="614" y="78" width="200" height="86" rx="6" class="orange"/>
  <text x="714" y="100" text-anchor="middle" class="b">Worker 0 · GPU 0</text>
  <text x="714" y="122" text-anchor="middle" class="sm">model runner: forward pass</text>
  <text x="714" y="140" text-anchor="middle" class="sm">CUDA graphs, sampling</text>
  <rect x="614" y="200" width="200" height="86" rx="6" class="orange"/>
  <text x="714" y="222" text-anchor="middle" class="b">Worker 1 · GPU 1</text>
  <text x="714" y="244" text-anchor="middle" class="sm">model runner: forward pass</text>
  <text x="714" y="262" text-anchor="middle" class="sm">CUDA graphs, sampling</text>
  <path d="M714,166 L714,198" class="both"/>
  <text x="724" y="186" class="sm">NCCL</text>
  <text x="714" y="312" text-anchor="middle" class="sm">one process per GPU (TP = 2 here)</text>

  <!-- Request path: in (top lane) -->
  <path d="M96,102 L132,102" class="edge"/>
  <path d="M290,102 L356,102" class="edge"/>
  <text x="324" y="94" text-anchor="middle" class="sm">ZMQ</text>
  <path d="M546,102 L612,102" class="edge"/>
  <path d="M580,102 L580,222 L612,222" class="edge"/>
  <!-- Request path: out (bottom lane) -->
  <path d="M612,262 L548,262" class="edge"/>
  <path d="M358,262 L292,262" class="edge"/>
  <text x="324" y="254" text-anchor="middle" class="sm">ZMQ</text>
  <path d="M134,262 L98,262" class="edge"/>

  <!-- Step numbers -->
  <circle cx="108" cy="86" r="8" class="purple"/><text x="108" y="90" text-anchor="middle" class="sm b">1</text>
  <circle cx="324" cy="118" r="8" class="purple"/><text x="324" y="122" text-anchor="middle" class="sm b">2</text>
  <circle cx="580" cy="86" r="8" class="purple"/><text x="580" y="90" text-anchor="middle" class="sm b">3</text>
  <circle cx="580" cy="278" r="8" class="purple"/><text x="580" y="282" text-anchor="middle" class="sm b">4</text>
  <circle cx="324" cy="278" r="8" class="purple"/><text x="324" y="282" text-anchor="middle" class="sm b">5</text>
  <circle cx="108" cy="278" r="8" class="purple"/><text x="108" y="282" text-anchor="middle" class="sm b">6</text>

  <!-- Legend -->
  <rect x="12" y="344" width="20" height="14" rx="3" class="orange"/><text x="40" y="356" class="sm">scheduling and GPU work</text>
  <rect x="204" y="344" width="20" height="14" rx="3" class="blue"/><text x="232" y="356" class="sm">KV cache memory</text>
  <rect x="356" y="344" width="20" height="14" rx="3" class="gray"/><text x="384" y="356" class="sm">CPU-side processing</text>
  <circle cx="530" cy="351" r="8" class="purple"/><text x="546" y="356" class="sm">order of the request path</text>
</svg>
