<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}.lg{font-size:16px}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .wire{stroke:#000;stroke-width:1}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Panel 1: MHA -->
  <rect x="10" y="10" width="256" height="190" rx="4" class="group"/>
  <text x="138" y="34" text-anchor="middle" class="lg b">Multi-head (MHA)</text>
  <g>
    <rect x="25" y="52" width="22" height="22" rx="3" class="purple"/><rect x="53" y="52" width="22" height="22" rx="3" class="purple"/><rect x="81" y="52" width="22" height="22" rx="3" class="purple"/><rect x="109" y="52" width="22" height="22" rx="3" class="purple"/>
    <rect x="145" y="52" width="22" height="22" rx="3" class="purple"/><rect x="173" y="52" width="22" height="22" rx="3" class="purple"/><rect x="201" y="52" width="22" height="22" rx="3" class="purple"/><rect x="229" y="52" width="22" height="22" rx="3" class="purple"/>
    <line x1="36" y1="74" x2="36" y2="140" class="wire"/><line x1="64" y1="74" x2="64" y2="140" class="wire"/><line x1="92" y1="74" x2="92" y2="140" class="wire"/><line x1="120" y1="74" x2="120" y2="140" class="wire"/>
    <line x1="156" y1="74" x2="156" y2="140" class="wire"/><line x1="184" y1="74" x2="184" y2="140" class="wire"/><line x1="212" y1="74" x2="212" y2="140" class="wire"/><line x1="240" y1="74" x2="240" y2="140" class="wire"/>
    <rect x="25" y="140" width="22" height="22" rx="3" class="orange"/><rect x="53" y="140" width="22" height="22" rx="3" class="orange"/><rect x="81" y="140" width="22" height="22" rx="3" class="orange"/><rect x="109" y="140" width="22" height="22" rx="3" class="orange"/>
    <rect x="145" y="140" width="22" height="22" rx="3" class="orange"/><rect x="173" y="140" width="22" height="22" rx="3" class="orange"/><rect x="201" y="140" width="22" height="22" rx="3" class="orange"/><rect x="229" y="140" width="22" height="22" rx="3" class="orange"/>
  </g>
  <text x="138" y="188" text-anchor="middle">8 KV heads</text>
  <text x="138" y="226" text-anchor="middle" class="b">KV cache: 100%</text>
  <text x="138" y="248" text-anchor="middle" class="sm">e.g., Llama 2 7B</text>

  <!-- Panel 2: GQA -->
  <rect x="282" y="10" width="256" height="190" rx="4" class="group"/>
  <text x="410" y="34" text-anchor="middle" class="lg b">Grouped-query (GQA)</text>
  <g>
    <rect x="297" y="52" width="22" height="22" rx="3" class="purple"/><rect x="325" y="52" width="22" height="22" rx="3" class="purple"/><rect x="353" y="52" width="22" height="22" rx="3" class="purple"/><rect x="381" y="52" width="22" height="22" rx="3" class="purple"/>
    <rect x="417" y="52" width="22" height="22" rx="3" class="purple"/><rect x="445" y="52" width="22" height="22" rx="3" class="purple"/><rect x="473" y="52" width="22" height="22" rx="3" class="purple"/><rect x="501" y="52" width="22" height="22" rx="3" class="purple"/>
    <line x1="308" y1="74" x2="350" y2="140" class="wire"/><line x1="336" y1="74" x2="350" y2="140" class="wire"/><line x1="364" y1="74" x2="350" y2="140" class="wire"/><line x1="392" y1="74" x2="350" y2="140" class="wire"/>
    <line x1="428" y1="74" x2="470" y2="140" class="wire"/><line x1="456" y1="74" x2="470" y2="140" class="wire"/><line x1="484" y1="74" x2="470" y2="140" class="wire"/><line x1="512" y1="74" x2="470" y2="140" class="wire"/>
    <rect x="339" y="140" width="22" height="22" rx="3" class="orange"/><rect x="459" y="140" width="22" height="22" rx="3" class="orange"/>
  </g>
  <text x="410" y="188" text-anchor="middle">2 KV heads, 4 queries each</text>
  <text x="410" y="226" text-anchor="middle" class="b">KV cache: 25%</text>
  <text x="410" y="248" text-anchor="middle" class="sm">e.g., Llama 3.1 8B (32 query : 8 KV heads)</text>

  <!-- Panel 3: MQA -->
  <rect x="554" y="10" width="256" height="190" rx="4" class="group"/>
  <text x="682" y="34" text-anchor="middle" class="lg b">Multi-query (MQA)</text>
  <g>
    <rect x="569" y="52" width="22" height="22" rx="3" class="purple"/><rect x="597" y="52" width="22" height="22" rx="3" class="purple"/><rect x="625" y="52" width="22" height="22" rx="3" class="purple"/><rect x="653" y="52" width="22" height="22" rx="3" class="purple"/>
    <rect x="689" y="52" width="22" height="22" rx="3" class="purple"/><rect x="717" y="52" width="22" height="22" rx="3" class="purple"/><rect x="745" y="52" width="22" height="22" rx="3" class="purple"/><rect x="773" y="52" width="22" height="22" rx="3" class="purple"/>
    <line x1="580" y1="74" x2="682" y2="140" class="wire"/><line x1="608" y1="74" x2="682" y2="140" class="wire"/><line x1="636" y1="74" x2="682" y2="140" class="wire"/><line x1="664" y1="74" x2="682" y2="140" class="wire"/>
    <line x1="700" y1="74" x2="682" y2="140" class="wire"/><line x1="728" y1="74" x2="682" y2="140" class="wire"/><line x1="756" y1="74" x2="682" y2="140" class="wire"/><line x1="784" y1="74" x2="682" y2="140" class="wire"/>
    <rect x="671" y="140" width="22" height="22" rx="3" class="orange"/>
  </g>
  <text x="682" y="188" text-anchor="middle">1 KV head shared by all</text>
  <text x="682" y="226" text-anchor="middle" class="b">KV cache: 12.5%</text>
  <text x="682" y="248" text-anchor="middle" class="sm">e.g., PaLM, Falcon-7B</text>

  <!-- Legend -->
  <rect x="10" y="264" width="18" height="14" rx="3" class="purple"/><text x="34" y="276" class="sm">query head (not cached)</text>
  <rect x="200" y="264" width="18" height="14" rx="3" class="orange"/><text x="224" y="276" class="sm">key/value head (cached for every token)</text>
</svg>
