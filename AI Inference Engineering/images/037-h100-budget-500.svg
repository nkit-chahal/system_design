<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="30" y="24" class="b">One H100 replica (≈ 79.6 GiB), Llama 3.1 8B BF16, --gpu-memory-utilization 0.90, --max-loras 64</text>

  <!-- 9.55 px per GiB: weights 15, runtime 4.6, adapters 5, KV 47, held back 8 -->
  <path d="M241,58 L241,70" stroke="#000" stroke-width="1"/>
  <text x="241" y="52" text-anchor="middle" class="sm">64 adapter slots × 80 MiB = 5 GiB</text>
  <rect x="30" y="70" width="143" height="52" class="gray"/>
  <text x="101" y="92" text-anchor="middle" class="b">Weights</text>
  <text x="101" y="110" text-anchor="middle">15 GiB</text>
  <rect x="173" y="70" width="44" height="52" class="white"/>
  <rect x="217" y="70" width="48" height="52" class="orange"/>
  <rect x="265" y="70" width="449" height="52" class="blue"/>
  <text x="490" y="92" text-anchor="middle" class="b">KV cache</text>
  <text x="490" y="110" text-anchor="middle">≈ 47 GiB</text>
  <rect x="714" y="70" width="76" height="52" fill="url(#hatch)" stroke="#666" stroke-width="1.2"/>
  <text x="752" y="140" text-anchor="middle" class="sm">10% held back</text>
  <text x="752" y="155" text-anchor="middle" class="sm">≈ 8 GiB</text>
  <path d="M195,122 L195,134" stroke="#000" stroke-width="1"/>
  <text x="195" y="148" text-anchor="middle" class="sm">activations + CUDA graphs</text>
  <text x="195" y="163" text-anchor="middle" class="sm">≈ 4.6 GiB</text>

  <path d="M490,122 L490,176" class="edge"/>
  <rect x="320" y="178" width="340" height="40" rx="6" class="white"/>
  <text x="490" y="203" text-anchor="middle">47 GiB ÷ 128 KiB per token ≈ <tspan class="b">385,000 tokens</tspan></text>
  <path d="M490,218 L490,240" class="edge"/>
  <rect x="320" y="242" width="340" height="44" rx="6" class="green"/>
  <text x="490" y="261" text-anchor="middle">≈ 154 chat requests of 2,500 tokens</text>
  <text x="490" y="278" text-anchor="middle" class="b">53 streams needed at the latency targets</text>

  <!-- Host memory -->
  <rect x="30" y="196" width="250" height="56" rx="6" class="blue"/>
  <text x="155" y="218" text-anchor="middle" class="b">Host memory: CPU cache</text>
  <text x="155" y="238" text-anchor="middle" class="sm">--max-cpu-loras 128 = 10 GiB</text>
  <text x="155" y="272" text-anchor="middle" class="sm">covers the replica's 125 home adapters</text>
  <text x="155" y="290" text-anchor="middle" class="sm">(500 adapters × 2 replicas ÷ 8 replicas)</text>
  <text x="30" y="324" class="sm">All other adapters stay on local disk and load in tens of milliseconds if the router sends one here.</text>
</svg>
