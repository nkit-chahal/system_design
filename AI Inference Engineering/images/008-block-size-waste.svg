<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .axis{stroke:#000;stroke-width:1.2;fill:none}
    .grid{stroke:#e5e5e5;stroke-width:1;fill:none}
    .muted{fill:#555}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="20" y="26" class="b">Memory lost in partly filled last blocks: 170 sequences, Llama 3.1 8B, 52 GiB cache</text>
  <path class="grid" d="M90,183.333 H760 M90,116.667 H760 M90,50 H760"/>
  <path class="axis" d="M90,50 V250 H760"/>
  <text x="82" y="254" text-anchor="end" class="sm">0 GiB</text>
  <text x="82" y="187.333" text-anchor="end" class="sm">2 GiB</text>
  <text x="82" y="120.667" text-anchor="end" class="sm">4 GiB</text>
  <text x="82" y="54" text-anchor="end" class="sm">6 GiB</text>
  <path d="M120,250 H180" stroke="#666" stroke-width="2"/>
  <text x="150" y="228.0" text-anchor="middle" class="sm b">0.00 GiB</text>
  <text x="150" y="242.0" text-anchor="middle" class="sm">0%</text>
  <text x="150" y="268" text-anchor="middle" class="b">1</text>
  <text x="150" y="284" text-anchor="middle" class="sm muted">128 KiB</text>
  <rect x="230" y="244.7" width="60" height="5.3" class="green"/>
  <text x="260" y="222.7" text-anchor="middle" class="sm b">0.16 GiB</text>
  <text x="260" y="236.7" text-anchor="middle" class="sm">0.3%</text>
  <text x="260" y="268" text-anchor="middle" class="b">16</text>
  <text x="260" y="284" text-anchor="middle" class="sm muted">2 MiB</text>
  <rect x="340" y="228.3" width="60" height="21.7" class="gray"/>
  <text x="370" y="206.3" text-anchor="middle" class="sm b">0.65 GiB</text>
  <text x="370" y="220.3" text-anchor="middle" class="sm">1.3%</text>
  <text x="370" y="268" text-anchor="middle" class="b">64</text>
  <text x="370" y="284" text-anchor="middle" class="sm muted">8 MiB</text>
  <rect x="450" y="206.0" width="60" height="44.0" class="gray"/>
  <text x="480" y="184.0" text-anchor="middle" class="sm b">1.32 GiB</text>
  <text x="480" y="198.0" text-anchor="middle" class="sm">2.5%</text>
  <text x="480" y="268" text-anchor="middle" class="b">128</text>
  <text x="480" y="284" text-anchor="middle" class="sm muted">16 MiB</text>
  <rect x="560" y="161.7" width="60" height="88.3" class="gray"/>
  <text x="590" y="139.7" text-anchor="middle" class="sm b">2.65 GiB</text>
  <text x="590" y="153.7" text-anchor="middle" class="sm">5.1%</text>
  <text x="590" y="268" text-anchor="middle" class="b">256</text>
  <text x="590" y="284" text-anchor="middle" class="sm muted">32 MiB</text>
  <rect x="670" y="73.3" width="60" height="176.7" class="red"/>
  <text x="700" y="51.3" text-anchor="middle" class="sm b">5.30 GiB</text>
  <text x="700" y="65.3" text-anchor="middle" class="sm">10.2%</text>
  <text x="700" y="268" text-anchor="middle" class="b">512</text>
  <text x="700" y="284" text-anchor="middle" class="sm muted">64 MiB</text>
  <text x="260" y="200" text-anchor="middle" class="sm b">vLLM default</text>
  <text x="425" y="304" text-anchor="middle" class="sm">block size in tokens (and bytes per block)</text>
  <text x="20" y="330" class="sm">Assumes lengths fall evenly across block boundaries: about (B − 1) ÷ 2 empty slots per sequence, at 128 KiB each.</text>
</svg>
