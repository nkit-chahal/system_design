<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="20" y="24" class="b">One query row, four keys, processed as two tiles of two</text>

  <!-- tile 1 -->
  <text x="210" y="50" text-anchor="middle" class="sm">tile 1 scores</text>
  <rect x="160" y="58" width="100" height="44" rx="4" class="group"/>
  <rect x="166" y="64" width="42" height="32" rx="3" class="white"/><text x="187" y="85" text-anchor="middle">2</text>
  <rect x="212" y="64" width="42" height="32" rx="3" class="white"/><text x="233" y="85" text-anchor="middle">1</text>
  <!-- tile 2 -->
  <text x="610" y="50" text-anchor="middle" class="sm">tile 2 scores</text>
  <rect x="560" y="58" width="100" height="44" rx="4" class="group"/>
  <rect x="566" y="64" width="42" height="32" rx="3" class="white"/><text x="587" y="85" text-anchor="middle">3</text>
  <rect x="612" y="64" width="42" height="32" rx="3" class="white"/><text x="633" y="85" text-anchor="middle">0</text>

  <path d="M210,102 L210,128" class="edge"/>
  <path d="M610,102 L610,128" class="edge"/>

  <rect x="20" y="130" width="380" height="92" rx="6" class="orange"/>
  <text x="34" y="152" class="b">After tile 1</text>
  <text x="34" y="174">max m = 2</text>
  <text x="34" y="194">sum l = exp(0) + exp(−1) = 1.368</text>
  <text x="34" y="214">O = 1 · v1 + 0.368 · v2</text>

  <rect x="420" y="130" width="380" height="92" rx="6" class="orange"/>
  <text x="434" y="152" class="b">After tile 2</text>
  <text x="434" y="174" class="sm">new max m = 3, so scale old l and O by exp(2 − 3) = 0.368</text>
  <text x="434" y="194">l = 1.368 × 0.368 + exp(0) + exp(−3) = 1.553</text>
  <text x="434" y="214">O = 0.368 · O + 1 · v3 + 0.050 · v4</text>
  <path d="M400,176 L418,176" class="edge"/>

  <path d="M610,222 L560,250" class="edge"/>
  <rect x="160" y="252" width="500" height="56" rx="6" class="green"/>
  <text x="410" y="275" text-anchor="middle">output = O / l: exactly softmax over 2, 1, 3, 0 applied to V</text>
  <text x="410" y="295" text-anchor="middle" class="sm">The kernel keeps only m, l and O per query row, never the full row of scores.</text>
</svg>
