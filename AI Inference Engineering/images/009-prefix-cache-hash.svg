<svg xmlns="http://www.w3.org/2000/svg" width="820" height="366" viewBox="0 0 820 366" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="16" y="22" class="sm">Each full 16-token block is named by hash(parent hash, its 16 token IDs, extra keys such as LoRA ID or cache_salt).</text>

  <!-- Request A block table -->
  <text x="16" y="62" class="b">Request A</text>
  <rect x="110" y="42" width="50" height="30" class="purple"/><text x="135" y="62" text-anchor="middle" class="sm">h1</text>
  <rect x="164" y="42" width="50" height="30" class="purple"/><text x="189" y="62" text-anchor="middle" class="sm">h2</text>
  <rect x="218" y="42" width="50" height="30" class="white"/><text x="243" y="62" text-anchor="middle" class="sm">…</text>
  <rect x="272" y="42" width="50" height="30" class="purple"/><text x="297" y="62" text-anchor="middle" class="sm">h62</text>
  <rect x="334" y="42" width="140" height="30" class="purple"/><text x="404" y="62" text-anchor="middle" class="sm">8 system + user A</text>
  <rect x="478" y="42" width="50" height="30" class="white"/><text x="503" y="62" text-anchor="middle" class="sm">…</text>
  <text x="540" y="62" class="sm">block table (logical blocks)</text>

  <!-- Physical pool -->
  <rect x="96" y="122" width="546" height="96" rx="4" class="group"/>
  <text x="632" y="140" text-anchor="end" class="sm">Physical KV blocks on the GPU</text>
  <rect x="110" y="150" width="212" height="54" rx="4" class="blue"/>
  <text x="216" y="173" text-anchor="middle" class="b">62 shared blocks</text>
  <text x="216" y="192" text-anchor="middle" class="sm">992 tokens · reference count 2</text>
  <rect x="334" y="150" width="140" height="54" rx="4" class="orange"/>
  <text x="404" y="173" text-anchor="middle">A's block 63</text>
  <text x="404" y="192" text-anchor="middle" class="sm">not shared</text>
  <rect x="488" y="150" width="140" height="54" rx="4" class="orange"/>
  <text x="558" y="173" text-anchor="middle">B's block 63</text>
  <text x="558" y="192" text-anchor="middle" class="sm">not shared</text>
  <text x="656" y="164" class="sm">The 8 trailing</text>
  <text x="656" y="181" class="sm">system tokens are</text>
  <text x="656" y="198" class="sm">recomputed per request</text>

  <!-- Request B block table -->
  <text x="16" y="290" class="b">Request B</text>
  <rect x="110" y="270" width="50" height="30" class="purple"/><text x="135" y="290" text-anchor="middle" class="sm">h1</text>
  <rect x="164" y="270" width="50" height="30" class="purple"/><text x="189" y="290" text-anchor="middle" class="sm">h2</text>
  <rect x="218" y="270" width="50" height="30" class="white"/><text x="243" y="290" text-anchor="middle" class="sm">…</text>
  <rect x="272" y="270" width="50" height="30" class="purple"/><text x="297" y="290" text-anchor="middle" class="sm">h62</text>
  <rect x="334" y="270" width="140" height="30" class="purple"/><text x="404" y="290" text-anchor="middle" class="sm">8 system + user B</text>
  <rect x="478" y="270" width="50" height="30" class="white"/><text x="503" y="290" text-anchor="middle" class="sm">…</text>

  <!-- Mapping arrows -->
  <path d="M216,72 L216,148" class="edge"/>
  <text x="224" y="104" class="sm">hits: same hashes</text>
  <path d="M216,270 L216,206" class="edge"/>
  <text x="224" y="246" class="sm">hits: same hashes</text>
  <path d="M404,72 L404,148" class="edge"/>
  <path d="M440,270 L530,206" class="edge"/>

  <!-- Free queue -->
  <line x1="16" y1="316" x2="804" y2="316" stroke="#999" stroke-dasharray="5 4"/>
  <text x="16" y="346" class="b">Free queue</text>
  <rect x="110" y="328" width="110" height="28" class="blue"/><text x="165" y="347" text-anchor="middle" class="sm">cached, LRU</text>
  <rect x="224" y="328" width="110" height="28" class="blue"/><text x="279" y="347" text-anchor="middle" class="sm">cached</text>
  <rect x="338" y="328" width="110" height="28" class="white"/><text x="393" y="347" text-anchor="middle" class="sm">empty</text>
  <rect x="452" y="328" width="110" height="28" class="white"/><text x="507" y="347" text-anchor="middle" class="sm">empty</text>
  <text x="576" y="347" class="sm">head = next to allocate (and evict)</text>
</svg>
