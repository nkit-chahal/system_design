<svg xmlns="http://www.w3.org/2000/svg" width="860" height="310" viewBox="0 0 860 310" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}.it{font-style:italic}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .line{fill:none;stroke:#000;stroke-width:1.2}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .grid{fill:none;stroke:#e6e6e6;stroke-width:1}
    .dash{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:6 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <rect x="10" y="20" width="250" height="250" rx="6" class="group"/>
  <text x="135" y="40" text-anchor="middle" class="b">GPU host</text>
  <rect x="30" y="56" width="210" height="70" rx="6" class="orange"/>
  <text x="135" y="78" text-anchor="middle" class="b">vLLM server</text>
  <text x="135" y="96" text-anchor="middle" class="sm">port 8000, /metrics</text>
  <text x="135" y="114" text-anchor="middle" class="sm">vllm:* engine metrics</text>
  <rect x="30" y="146" width="210" height="44" rx="6" class="gray"/>
  <text x="135" y="173" text-anchor="middle" class="b">H100 GPU</text>
  <rect x="30" y="208" width="210" height="50" rx="6" class="orange"/>
  <text x="135" y="229" text-anchor="middle" class="b">dcgm-exporter</text>
  <text x="135" y="247" text-anchor="middle" class="sm">port 9400, DCGM_FI_* metrics</text>
  <path d="M135,206 L135,192" class="edge"/>
  <text x="145" y="202" class="sm">reads</text>
  <path d="M340,105 a85,9 0 0,1 170,0 v92 a85,9 0 0,1 -170,0 z" class="blue"/>
  <path d="M340,105 a85,9 0 0,0 170,0" class="blue" fill="none"/>
  <text x="425" y="127" text-anchor="middle" class="b">Prometheus</text>
  <text x="425" y="143" text-anchor="middle" class="sm">scrapes every 5 s</text>
  <text x="425" y="159" text-anchor="middle" class="sm">rules.yml: alerts</text>
  <text x="425" y="175" text-anchor="middle" class="sm">and leading indicators</text>
  <path d="M240,91 C290,91 300,130 338,140" class="edge"/>
  <path d="M240,233 C290,233 300,175 338,170" class="edge"/>
  <text x="296" y="88" text-anchor="middle" class="sm">scrape</text>
  <text x="296" y="250" text-anchor="middle" class="sm">scrape</text>
  <rect x="600" y="60" width="240" height="96" rx="6" class="green"/>
  <text x="720" y="86" text-anchor="middle" class="b">Grafana</text>
  <text x="720" y="104" text-anchor="middle" class="sm">dashboard: latency, load,</text>
  <text x="720" y="122" text-anchor="middle" class="sm">saturation, GPU, errors</text>
  <text x="720" y="140" text-anchor="middle" class="sm">provisioned from files</text>
  <rect x="600" y="186" width="240" height="60" rx="6" class="gray"/>
  <text x="720" y="212" text-anchor="middle" class="b">Alertmanager (optional)</text>
  <text x="720" y="230" text-anchor="middle" class="sm">routes firing alerts to people</text>
  <path d="M510,130 L598,110" class="edge"/>
  <text x="552" y="108" text-anchor="middle" class="sm">PromQL</text>
  <path d="M510,180 L598,212" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="548" y="214" text-anchor="middle" class="sm">alerts</text>
  <text x="425" y="296" text-anchor="middle" class="sm">docker compose runs Prometheus, Grafana, and dcgm-exporter; vLLM runs on the host</text>
</svg>
