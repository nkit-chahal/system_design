<svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="20" y="24" class="b">Ring attention (pass-KV) for one prompt split over 4 GPUs</text>

  <!-- GPU boxes -->
  <rect x="40" y="50" width="190" height="84" rx="6" class="orange"/>
  <text x="135" y="72" text-anchor="middle" class="b">GPU 0</text>
  <rect x="52" y="82" width="80" height="40" rx="4" class="white"/><text x="92" y="98" text-anchor="middle" class="sm">Q chunks</text><text x="92" y="114" text-anchor="middle" class="sm">0 and 7</text>
  <rect x="138" y="82" width="80" height="40" rx="4" class="blue"/><text x="178" y="98" text-anchor="middle" class="sm">KV chunks</text><text x="178" y="114" text-anchor="middle" class="sm">0 and 7</text>

  <rect x="320" y="50" width="190" height="84" rx="6" class="orange"/>
  <text x="415" y="72" text-anchor="middle" class="b">GPU 1</text>
  <rect x="332" y="82" width="80" height="40" rx="4" class="white"/><text x="372" y="98" text-anchor="middle" class="sm">Q chunks</text><text x="372" y="114" text-anchor="middle" class="sm">1 and 6</text>
  <rect x="418" y="82" width="80" height="40" rx="4" class="blue"/><text x="458" y="98" text-anchor="middle" class="sm">KV chunks</text><text x="458" y="114" text-anchor="middle" class="sm">1 and 6</text>

  <rect x="320" y="220" width="190" height="84" rx="6" class="orange"/>
  <text x="415" y="242" text-anchor="middle" class="b">GPU 2</text>
  <rect x="332" y="252" width="80" height="40" rx="4" class="white"/><text x="372" y="268" text-anchor="middle" class="sm">Q chunks</text><text x="372" y="284" text-anchor="middle" class="sm">2 and 5</text>
  <rect x="418" y="252" width="80" height="40" rx="4" class="blue"/><text x="458" y="268" text-anchor="middle" class="sm">KV chunks</text><text x="458" y="284" text-anchor="middle" class="sm">2 and 5</text>

  <rect x="40" y="220" width="190" height="84" rx="6" class="orange"/>
  <text x="135" y="242" text-anchor="middle" class="b">GPU 3</text>
  <rect x="52" y="252" width="80" height="40" rx="4" class="white"/><text x="92" y="268" text-anchor="middle" class="sm">Q chunks</text><text x="92" y="284" text-anchor="middle" class="sm">3 and 4</text>
  <rect x="138" y="252" width="80" height="40" rx="4" class="blue"/><text x="178" y="268" text-anchor="middle" class="sm">KV chunks</text><text x="178" y="284" text-anchor="middle" class="sm">3 and 4</text>

  <!-- ring -->
  <path d="M230,92 L318,92" class="edge"/>
  <path d="M415,134 L415,218" class="edge"/>
  <path d="M320,262 L232,262" class="edge"/>
  <path d="M135,220 L135,136" class="edge"/>
  <text x="274" y="84" text-anchor="middle" class="sm">KV</text>
  <text x="424" y="180" class="sm">KV</text>
  <text x="276" y="280" text-anchor="middle" class="sm">KV</text>
  <text x="126" y="180" text-anchor="end" class="sm">KV</text>

  <!-- steps -->
  <rect x="550" y="50" width="250" height="254" rx="6" class="gray"/>
  <text x="566" y="74" class="b">Each step, on every GPU</text>
  <text x="566" y="100" class="sm">1. attend local queries to the KV</text>
  <text x="580" y="116" class="sm">block it holds (online softmax)</text>
  <text x="566" y="142" class="sm">2. at the same time, send that KV</text>
  <text x="580" y="158" class="sm">block on and receive the next one</text>
  <text x="566" y="184" class="sm">3. after 4 steps, every query has</text>
  <text x="580" y="200" class="sm">seen every earlier key: exact result</text>
  <text x="566" y="234" class="sm">Causal load balance: 8 chunks,</text>
  <text x="566" y="250" class="sm">GPU i holds chunks i and 7 − i, so</text>
  <text x="566" y="266" class="sm">early (cheap) and late (expensive)</text>
  <text x="566" y="282" class="sm">tokens are spread evenly</text>

  <rect x="40" y="320" width="760" height="38" rx="6" class="green"/>
  <text x="420" y="344" text-anchor="middle">128K-token prompt: ≈ 13.4 s on one H100 → ≈ 3.7 s on 4 GPUs (assuming 90% scaling efficiency)</text>
</svg>
