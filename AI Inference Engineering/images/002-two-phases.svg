<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .edge2{fill:none;stroke:#000;stroke-width:1.2;marker-start:url(#arrow);marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Prefill panel -->
  <text x="20" y="28" class="lg b">Prefill: once per request</text>
  <rect x="30" y="44" width="46" height="26" rx="4" class="purple"/><text x="53" y="62" text-anchor="middle" class="sm">t1</text>
  <rect x="82" y="44" width="46" height="26" rx="4" class="purple"/><text x="105" y="62" text-anchor="middle" class="sm">t2</text>
  <rect x="134" y="44" width="46" height="26" rx="4" class="purple"/><text x="157" y="62" text-anchor="middle" class="sm">t3</text>
  <text x="208" y="62" text-anchor="middle">⋯</text>
  <rect x="236" y="44" width="60" height="26" rx="4" class="purple"/><text x="266" y="62" text-anchor="middle" class="sm">t2000</text>
  <text x="310" y="62" class="sm">prompt</text>
  <path d="M53,70 L80,104" class="edge"/>
  <path d="M105,70 L118,104" class="edge"/>
  <path d="M157,70 L156,104" class="edge"/>
  <path d="M266,70 L232,104" class="edge"/>

  <rect x="30" y="106" width="300" height="60" rx="6" class="orange"/>
  <text x="180" y="131" text-anchor="middle" class="b">One forward pass over all</text>
  <text x="180" y="151" text-anchor="middle" class="b">2,000 prompt tokens at once</text>

  <path d="M330,136 L376,136" class="edge"/>
  <rect x="378" y="118" width="80" height="36" rx="6" class="green"/>
  <text x="418" y="141" text-anchor="middle">token 1</text>

  <!-- Decode panel -->
  <line x1="476" y1="14" x2="476" y2="200" stroke="#999" stroke-dasharray="5 4"/>
  <text x="490" y="28" class="lg b">Decode: once per output token</text>
  <path d="M458,136 L498,136" class="edge"/>
  <rect x="500" y="106" width="190" height="60" rx="6" class="orange"/>
  <text x="595" y="131" text-anchor="middle" class="b">One step: 1 new token</text>
  <text x="595" y="151" text-anchor="middle" class="b">per sequence</text>
  <!-- self loop -->
  <path d="M650,106 L650,82 L540,82 L540,104" class="edge"/>
  <text x="595" y="58" text-anchor="middle" class="sm">repeat 499 times: each new token</text>
  <text x="595" y="74" text-anchor="middle" class="sm">is the next step's input</text>
  <path d="M690,136 L718,136" class="edge"/>
  <rect x="720" y="118" width="88" height="36" rx="6" class="green"/>
  <text x="764" y="141" text-anchor="middle" class="sm">tokens 2–500</text>

  <!-- KV cache -->
  <rect x="30" y="232" width="776" height="44" rx="6" class="blue"/>
  <text x="418" y="252" text-anchor="middle" class="b">KV cache in GPU memory</text>
  <text x="418" y="269" text-anchor="middle" class="sm">prefill writes 2,000 tokens of keys and values; every decode step reads all of them and appends one more</text>
  <path d="M180,166 L180,230" class="edge"/>
  <text x="190" y="204" class="sm">write</text>
  <path d="M595,168 L595,230" class="edge2"/>
  <text x="605" y="204" class="sm">read all + append 1</text>

  <!-- Footer -->
  <text x="20" y="306"><tspan class="b">Prefill</tspan>: matrix × matrix, compute-bound. ≈ 65 ms for 2,000 tokens on one H100 (50% MFU).</text>
  <text x="20" y="330"><tspan class="b">Decode</tspan>: matrix × vector, memory-bound. ≥ 4.9 ms per step at batch 1, set by HBM bandwidth.</text>
</svg>
