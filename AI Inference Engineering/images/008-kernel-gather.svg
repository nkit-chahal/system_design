<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .free{fill:#fff;stroke:#999;stroke-width:1}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Inputs -->
  <rect x="16" y="44" width="180" height="44" rx="6" class="purple"/>
  <text x="106" y="63" text-anchor="middle">query q</text>
  <text x="106" y="80" text-anchor="middle" class="sm">request A, newest token</text>
  <text x="106" y="126" text-anchor="middle" class="b">Block table A</text>
  <rect x="46" y="134" width="120" height="24" class="white"/><text x="106" y="151" text-anchor="middle">0 → 7</text>
  <rect x="46" y="160" width="120" height="24" class="white"/><text x="106" y="177" text-anchor="middle">1 → 1</text>
  <rect x="46" y="186" width="120" height="24" class="white"/><text x="106" y="203" text-anchor="middle">2 → 4</text>
  <text x="106" y="230" text-anchor="middle" class="sm">context length: 9 tokens</text>
  <path d="M196,66 L222,66" class="edge"/>
  <path d="M166,172 L222,172" class="edge"/>
  <path d="M240,68 H226 V188 H240 M226,128 H240" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="194" y="164" text-anchor="middle" class="sm">walk</text>

  <!-- Per-block work -->
  <rect x="240" y="44" width="300" height="48" rx="6" class="gray"/>
  <text x="390" y="64" text-anchor="middle" class="b">Physical block 7 (logical 0)</text>
  <text x="390" y="82" text-anchor="middle" class="sm">tokens 0 to 3: scores q·K, weights · V</text>
  <rect x="240" y="104" width="300" height="48" rx="6" class="gray"/>
  <text x="390" y="124" text-anchor="middle" class="b">Physical block 1 (logical 1)</text>
  <text x="390" y="142" text-anchor="middle" class="sm">tokens 4 to 7: scores q·K, weights · V</text>
  <rect x="240" y="164" width="300" height="48" rx="6" class="gray"/>
  <text x="390" y="184" text-anchor="middle" class="b">Physical block 4 (logical 2)</text>
  <text x="390" y="202" text-anchor="middle" class="sm">token 8 only; 3 slots still empty</text>

  <!-- Merge and output -->
  <path d="M540,68 L598,112" class="edge"/>
  <path d="M540,128 L598,128" class="edge"/>
  <path d="M540,188 L598,144" class="edge"/>
  <rect x="600" y="96" width="220" height="64" rx="6" class="orange"/>
  <text x="710" y="120" text-anchor="middle">Merge partial results</text>
  <text x="710" y="138" text-anchor="middle" class="sm">running max and sum</text>
  <text x="710" y="152" text-anchor="middle" class="sm">(online softmax)</text>
  <path d="M710,160 L710,194" class="edge"/>
  <rect x="620" y="196" width="180" height="40" rx="6" class="green"/>
  <text x="710" y="221" text-anchor="middle">output for request A</text>

  <!-- KV pool -->
  <text x="210" y="290" text-anchor="end" class="sm b">KV block pool (one layer)</text>
  <rect x="219" y="272" width="38" height="26" class="free"/><text x="238" y="290" text-anchor="middle" class="sm">0</text>
  <rect x="257" y="272" width="38" height="26" class="blue"/><text x="276" y="290" text-anchor="middle" class="sm b">1</text>
  <rect x="295" y="272" width="38" height="26" class="free"/><text x="314" y="290" text-anchor="middle" class="sm">2</text>
  <rect x="333" y="272" width="38" height="26" class="free"/><text x="352" y="290" text-anchor="middle" class="sm">3</text>
  <rect x="371" y="272" width="38" height="26" class="blue"/><text x="390" y="290" text-anchor="middle" class="sm b">4</text>
  <rect x="409" y="272" width="38" height="26" class="free"/><text x="428" y="290" text-anchor="middle" class="sm">5</text>
  <rect x="447" y="272" width="38" height="26" class="free"/><text x="466" y="290" text-anchor="middle" class="sm">6</text>
  <rect x="485" y="272" width="38" height="26" class="blue"/><text x="504" y="290" text-anchor="middle" class="sm b">7</text>
  <rect x="523" y="272" width="38" height="26" class="free"/><text x="542" y="290" text-anchor="middle" class="sm">8</text>
  <path d="M390,270 L390,214" class="edge"/>
  <text x="398" y="246" class="sm">gather blocks 7, 1, 4</text>
  <text x="16" y="324" class="sm">Blue blocks belong to request A; the kernel reads them in logical order wherever they sit in the pool.</text>
</svg>
