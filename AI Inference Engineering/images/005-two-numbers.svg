<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .grid{fill:none;stroke:#ddd;stroke-width:1}
    .dash{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:5 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="26" class="b">One H100 decoding 170 chat requests: two very different "tokens per second"</text>
  <rect x="16" y="44" width="330" height="220" rx="4" class="group"/>
  <text x="181" y="68" text-anchor="middle" class="lg b">One user's view</text>
  <text x="30" y="128">user 1</text>
  <line x1="90.0" y1="112" x2="90.0" y2="134" stroke="#82b366" stroke-width="3"/>
  <line x1="115.7" y1="112" x2="115.7" y2="134" stroke="#82b366" stroke-width="3"/>
  <line x1="141.4" y1="112" x2="141.4" y2="134" stroke="#82b366" stroke-width="3"/>
  <line x1="167.1" y1="112" x2="167.1" y2="134" stroke="#82b366" stroke-width="3"/>
  <line x1="192.8" y1="112" x2="192.8" y2="134" stroke="#82b366" stroke-width="3"/>
  <line x1="218.5" y1="112" x2="218.5" y2="134" stroke="#82b366" stroke-width="3"/>
  <line x1="244.2" y1="112" x2="244.2" y2="134" stroke="#82b366" stroke-width="3"/>
  <line x1="269.9" y1="112" x2="269.9" y2="134" stroke="#82b366" stroke-width="3"/>
  <line x1="295.7" y1="112" x2="295.7" y2="134" stroke="#82b366" stroke-width="3"/>
  <line x1="321.4" y1="112" x2="321.4" y2="134" stroke="#82b366" stroke-width="3"/>
  <path d="M90.0,146 L115.7,146" class="edge" style="marker-start:url(#arrow)"/>
  <text x="102.9" y="164" text-anchor="middle" class="sm">≈ 21 ms between tokens</text>
  <rect x="40" y="190" width="282" height="56" rx="6" class="green"/>
  <text x="181" y="213" text-anchor="middle" class="b">≈ 47 tokens/s per user</text>
  <text x="181" y="233" text-anchor="middle" class="sm">1 ÷ step time; what the reader sees</text>
  <rect x="362" y="44" width="462" height="220" rx="4" class="group"/>
  <text x="593" y="68" text-anchor="middle" class="lg b">The GPU's view</text>
  <text x="376" y="97" class="sm">user 1</text>
