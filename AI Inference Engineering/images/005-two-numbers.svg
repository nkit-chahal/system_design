  <line x1="594.2" y1="165" x2="594.2" y2="179" stroke="#82b366" stroke-width="3"/>
  <line x1="619.9" y1="165" x2="619.9" y2="179" stroke="#82b366" stroke-width="3"/>
  <line x1="645.7" y1="165" x2="645.7" y2="179" stroke="#82b366" stroke-width="3"/>
  <line x1="671.4" y1="165" x2="671.4" y2="179" stroke="#82b366" stroke-width="3"/>
  <text x="400" y="157" text-anchor="middle">⋮</text>
  <path d="M690,84 L698,84 L698,180 L690,180" class="axis"/>
  <text x="706" y="128" class="sm">170 tokens</text>
  <text x="706" y="143" class="sm">every step</text>
  <rect x="386" y="190" width="414" height="56" rx="6" class="orange"/>
  <text x="593" y="213" text-anchor="middle" class="b">≈ 7,900 tokens/s in total (decode only)</text>
  <text x="593" y="233" text-anchor="middle" class="sm">batch size ÷ step time; what the operator pays for</text>
  <text x="16" y="290" class="sm">Both numbers come from the same 21.4 ms decode step: 16 GB of weights + 56 GB of KV cache read at 3.35 TB/s (an ideal lower bound).</text>
  <text x="16" y="310" class="sm">Raising the batch raises the right-hand number and lowers the left-hand one.</text>
</svg>
