  <line x1="671.4" y1="85" x2="671.4" y2="99" stroke="#82b366" stroke-width="3"/>
  <text x="376" y="117" class="sm">user 2</text>
  <line x1="440.0" y1="105" x2="440.0" y2="119" stroke="#82b366" stroke-width="3"/>
  <line x1="465.7" y1="105" x2="465.7" y2="119" stroke="#82b366" stroke-width="3"/>
  <line x1="491.4" y1="105" x2="491.4" y2="119" stroke="#82b366" stroke-width="3"/>
  <line x1="517.1" y1="105" x2="517.1" y2="119" stroke="#82b366" stroke-width="3"/>
  <line x1="542.8" y1="105" x2="542.8" y2="119" stroke="#82b366" stroke-width="3"/>
  <line x1="568.5" y1="105" x2="568.5" y2="119" stroke="#82b366" stroke-width="3"/>
  <line x1="594.2" y1="105" x2="594.2" y2="119" stroke="#82b366" stroke-width="3"/>
  <line x1="619.9" y1="105" x2="619.9" y2="119" stroke="#82b366" stroke-width="3"/>
  <line x1="645.7" y1="105" x2="645.7" y2="119" stroke="#82b366" stroke-width="3"/>
  <line x1="671.4" y1="105" x2="671.4" y2="119" stroke="#82b366" stroke-width="3"/>
  <text x="376" y="137" class="sm">user 3</text>
  <line x1="440.0" y1="125" x2="440.0" y2="139" stroke="#82b366" stroke-width="3"/>
  <line x1="465.7" y1="125" x2="465.7" y2="139" stroke="#82b366" stroke-width="3"/>
  <line x1="491.4" y1="125" x2="491.4" y2="139" stroke="#82b366" stroke-width="3"/>
  <line x1="517.1" y1="125" x2="517.1" y2="139" stroke="#82b366" stroke-width="3"/>
  <line x1="542.8" y1="125" x2="542.8" y2="139" stroke="#82b366" stroke-width="3"/>
  <line x1="568.5" y1="125" x2="568.5" y2="139" stroke="#82b366" stroke-width="3"/>
