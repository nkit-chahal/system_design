  <line x1="671.4" y1="125" x2="671.4" y2="139" stroke="#82b366" stroke-width="3"/>
  <text x="376" y="177" class="sm">user 170</text>
  <line x1="440.0" y1="165" x2="440.0" y2="179" stroke="#82b366" stroke-width="3"/>
  <line x1="465.7" y1="165" x2="465.7" y2="179" stroke="#82b366" stroke-width="3"/>
  <line x1="491.4" y1="165" x2="491.4" y2="179" stroke="#82b366" stroke-width="3"/>
