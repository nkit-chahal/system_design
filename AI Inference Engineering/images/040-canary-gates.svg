<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .dash{fill:none;stroke:#b85450;stroke-width:1.2;stroke-dasharray:4 3;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <rect x="20" y="30" width="118" height="64" rx="6" class="orange"/>
  <text x="79" y="54" text-anchor="middle" class="b">New release</text>
  <text x="79" y="72" text-anchor="middle" class="sm">pinned bundle</text>
  <path d="M138,62 L158,62" class="edge"/>
  <rect x="160" y="30" width="118" height="64" rx="6" class="gray"/>
  <text x="219" y="54" text-anchor="middle" class="b">Offline evals</text>
  <text x="219" y="72" text-anchor="middle" class="sm">accuracy, safety,</text>
  <text x="219" y="87" text-anchor="middle" class="sm">JSON format</text>
  <path d="M278,62 L298,62" class="edge"/>
  <path d="M219,94 L219,286" class="dash"/>
  <rect x="300" y="30" width="118" height="64" rx="6" class="gray"/>
  <text x="359" y="54" text-anchor="middle" class="b">Shadow</text>
  <text x="359" y="72" text-anchor="middle" class="sm">mirrored traffic:</text>
  <text x="359" y="87" text-anchor="middle" class="sm">errors, latency</text>
  <path d="M418,62 L438,62" class="edge"/>
  <path d="M359,94 L359,286" class="dash"/>
  <rect x="440" y="30" width="118" height="64" rx="6" class="gray"/>
  <text x="499" y="54" text-anchor="middle" class="b">Canary 12.5%</text>
  <text x="499" y="72" text-anchor="middle" class="sm">1 of 8 replicas,</text>
  <text x="499" y="87" text-anchor="middle" class="sm">30 minutes</text>
  <path d="M558,62 L578,62" class="edge"/>
  <line x1="499" y1="94" x2="499" y2="116" stroke="#000" stroke-width="1.2"/>
  <rect x="580" y="30" width="118" height="64" rx="6" class="gray"/>
  <text x="639" y="54" text-anchor="middle" class="b">Canary 50%</text>
  <text x="639" y="72" text-anchor="middle" class="sm">half the fleet</text>
  <path d="M698,62 L718,62" class="edge"/>
  <line x1="639" y1="94" x2="639" y2="116" stroke="#000" stroke-width="1.2"/>
  <rect x="720" y="30" width="118" height="64" rx="6" class="green"/>
  <text x="779" y="54" text-anchor="middle" class="b">100%</text>
  <text x="779" y="72" text-anchor="middle" class="sm">new stable</text>
  <rect x="160" y="118" width="680" height="1" fill="none"/>
  <rect x="440" y="116" width="400" height="66" rx="6" class="white"/>
  <text x="454" y="136" class="sm b">Quality, canary versus baseline</text>
  <text x="454" y="154" class="sm">refusal rate, output length, max_tokens hits,</text>
  <text x="454" y="170" class="sm">thumbs-down rate, judge score on paired samples</text>
  <rect x="440" y="192" width="400" height="66" rx="6" class="white"/>
  <text x="454" y="212" class="sm b">Latency and cost, at equal load</text>
  <text x="454" y="230" class="sm">p95 TTFT ≤ 500 ms, p95 TPOT ≤ 25 ms, error rate,</text>
  <text x="454" y="246" class="sm">tokens per request close to the baseline</text>
  <path d="M640,258 L640,286" class="dash"/>
  <rect x="160" y="288" width="680" height="48" rx="6" class="red"/>
  <text x="500" y="309" text-anchor="middle" class="b">Any failed check: automated rollback</text>
  <text x="500" y="327" text-anchor="middle" class="sm">shift all traffic back to the pinned previous release, then investigate</text>
  </svg>
