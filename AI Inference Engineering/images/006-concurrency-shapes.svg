<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .ceil{fill:none;stroke:#000;stroke-width:2}
    .meas{fill:none;stroke:#d79b00;stroke-width:2;stroke-dasharray:7 5}
    .dot{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.5}
    .cdot{fill:#000}
    .tick{stroke:#000;stroke-width:1}
    .grid{stroke:#ddd;stroke-width:1}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Legend -->
  <path d="M80,14 L114,14" class="ceil"/>
  <text x="122" y="18" class="sm">decode-only ceiling (derived)</text>
  <path d="M330,14 L364,14" class="meas"/>
  <circle cx="347" cy="14" r="4" class="dot"/>
  <text x="372" y="18" class="sm">typical measured shape (illustrative, not a measurement)</text>

  <!-- Panel 1: per-user speed -->
  <text x="210" y="46" text-anchor="middle" class="b">Per-user speed (tokens/s)</text>
  <path d="M80,180 L340,180 M80,100 L340,100" class="grid"/>
  <path d="M80,60 L80,260 L340,260" class="axis"/>
  <text x="72" y="264" text-anchor="end" class="sm">0</text>
  <text x="72" y="184" text-anchor="end" class="sm">100</text>
  <text x="72" y="104" text-anchor="end" class="sm">200</text>
  <path d="M100,260 L100,264 M175,260 L175,264 M250,260 L250,264 M325,260 L325,264" class="tick"/>
  <text x="100" y="278" text-anchor="middle" class="sm">1</text>
  <text x="175" y="278" text-anchor="middle" class="sm">4</text>
  <text x="250" y="278" text-anchor="middle" class="sm">16</text>
  <text x="325" y="278" text-anchor="middle" class="sm">64</text>
  <text x="210" y="296" text-anchor="middle" class="sm">concurrent requests (log scale)</text>

  <polyline points="100,96 175,104.8 250,131.2 325,183.2" class="ceil"/>
  <circle cx="100" cy="96" r="3.5" class="cdot"/><circle cx="175" cy="104.8" r="3.5" class="cdot"/>
  <circle cx="250" cy="131.2" r="3.5" class="cdot"/><circle cx="325" cy="183.2" r="3.5" class="cdot"/>
  <text x="100" y="86" text-anchor="middle" class="sm">205</text>
  <text x="175" y="94" text-anchor="middle" class="sm">194</text>
  <text x="250" y="120" text-anchor="middle" class="sm">161</text>
  <text x="325" y="172" text-anchor="middle" class="sm">96</text>
  <polyline points="100,120 175,132 250,164 325,216" class="meas"/>
  <circle cx="100" cy="120" r="4" class="dot"/><circle cx="175" cy="132" r="4" class="dot"/>
  <circle cx="250" cy="164" r="4" class="dot"/><circle cx="325" cy="216" r="4" class="dot"/>

  <!-- Panel 2: total throughput -->
  <text x="630" y="46" text-anchor="middle" class="b">Total throughput (output tokens/s)</text>
  <path d="M500,202.9 L760,202.9 M500,145.7 L760,145.7 M500,88.6 L760,88.6" class="grid"/>
  <path d="M500,60 L500,260 L760,260" class="axis"/>
  <text x="492" y="264" text-anchor="end" class="sm">0</text>
  <text x="492" y="207" text-anchor="end" class="sm">2,000</text>
  <text x="492" y="150" text-anchor="end" class="sm">4,000</text>
  <text x="492" y="93" text-anchor="end" class="sm">6,000</text>
  <path d="M520,260 L520,264 M595,260 L595,264 M670,260 L670,264 M745,260 L745,264" class="tick"/>
  <text x="520" y="278" text-anchor="middle" class="sm">1</text>
  <text x="595" y="278" text-anchor="middle" class="sm">4</text>
  <text x="670" y="278" text-anchor="middle" class="sm">16</text>
  <text x="745" y="278" text-anchor="middle" class="sm">64</text>
  <text x="630" y="296" text-anchor="middle" class="sm">concurrent requests (log scale)</text>

  <polyline points="520,254.1 595,237.8 670,186.3 745,84.7" class="ceil"/>
  <circle cx="520" cy="254.1" r="3.5" class="cdot"/><circle cx="595" cy="237.8" r="3.5" class="cdot"/>
  <circle cx="670" cy="186.3" r="3.5" class="cdot"/><circle cx="745" cy="84.7" r="3.5" class="cdot"/>
  <text x="520" y="242" text-anchor="middle" class="sm">205</text>
  <text x="590" y="226" text-anchor="middle" class="sm">777</text>
  <text x="652" y="176" text-anchor="middle" class="sm">2,580</text>
  <text x="727" y="76" text-anchor="middle" class="sm">6,137</text>
  <polyline points="520,255 595,241.7 670,205.1 745,159.4" class="meas"/>
  <circle cx="520" cy="255" r="4" class="dot"/><circle cx="595" cy="241.7" r="4" class="dot"/>
  <circle cx="670" cy="205.1" r="4" class="dot"/><circle cx="745" cy="159.4" r="4" class="dot"/>

  <!-- Derivation -->
  <text x="16" y="322" class="sm">Ceilings: step time = (16.06 GB + C × 2,250 tokens × 128 KiB) ÷ 3.35 TB/s, for 2,000 prompt and 500 output tokens.</text>
  <text x="16" y="340" class="sm">Prefill of new requests, scheduling and kernel efficiency keep real curves below the ceilings, most of all at 64 users.</text>
</svg>
