<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="16" y="24" class="b">Query projection of one layer of Llama 3.1 8B, LoRA rank 16</text>

  <rect x="20" y="125" width="80" height="50" rx="6" class="blue"/>
  <text x="60" y="146" text-anchor="middle" class="b">x</text>
  <text x="60" y="164" text-anchor="middle" class="sm">4,096</text>

  <path d="M100,150 L140,150 L140,80 L178,80" class="edge"/>
  <path d="M100,150 L140,150 L140,218 L178,218" class="edge"/>

  <!-- Frozen base path -->
  <rect x="180" y="45" width="230" height="70" rx="6" class="gray"/>
  <text x="295" y="70" text-anchor="middle" class="b">W (frozen)</text>
  <text x="295" y="90" text-anchor="middle" class="sm">4,096 × 4,096</text>
  <text x="295" y="106" text-anchor="middle" class="sm">16.8M parameters</text>

  <!-- LoRA path -->
  <rect x="180" y="190" width="120" height="56" rx="6" class="orange"/>
  <text x="240" y="213" text-anchor="middle" class="b">A (trained)</text>
  <text x="240" y="232" text-anchor="middle" class="sm">16 × 4,096</text>
  <path d="M300,218 L328,218" class="edge"/>
  <rect x="330" y="196" width="90" height="44" rx="6" class="blue"/>
  <text x="375" y="215" text-anchor="middle">Ax</text>
  <text x="375" y="232" text-anchor="middle" class="sm">16 numbers</text>
  <path d="M420,218 L448,218" class="edge"/>
  <rect x="450" y="190" width="120" height="56" rx="6" class="orange"/>
  <text x="510" y="213" text-anchor="middle" class="b">B (trained)</text>
  <text x="510" y="232" text-anchor="middle" class="sm">4,096 × 16</text>
  <text x="240" y="264" text-anchor="middle" class="sm">shrink: 4,096 → 16</text>
  <text x="510" y="264" text-anchor="middle" class="sm">expand: 16 → 4,096</text>

  <!-- Sum -->
  <path d="M410,80 L640,80 L640,148" class="edge"/>
  <path d="M570,218 L640,218 L640,184" class="edge"/>
  <text x="586" y="210" class="sm">× α/r</text>
  <circle cx="640" cy="166" r="16" class="white"/>
  <text x="640" y="172" text-anchor="middle" class="lg b">+</text>
  <path d="M656,166 L688,166" class="edge"/>
  <rect x="690" y="141" width="96" height="50" rx="6" class="blue"/>
  <text x="738" y="162" text-anchor="middle" class="b">h</text>
  <text x="738" y="180" text-anchor="middle" class="sm">4,096</text>

  <text x="470" y="146" text-anchor="middle">h = Wx + (α/r) BAx</text>

  <text x="16" y="290">A and B together: 16 × (4,096 + 4,096) = <tspan class="b">131,072 parameters, 0.8% of W</tspan></text>
</svg>
