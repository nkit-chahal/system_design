<svg xmlns="http://www.w3.org/2000/svg" width="860" height="326" viewBox="0 0 860 326" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}.it{font-style:italic}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .line{fill:none;stroke:#000;stroke-width:1.2}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .grid{fill:none;stroke:#e6e6e6;stroke-width:1}
    .dash{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:6 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <rect x="10" y="58" width="130" height="76" rx="6" class="purple"/>
  <text x="75" y="83" text-anchor="middle" class="b">spike.py</text>
  <text x="75" y="101" text-anchor="middle" class="sm">open-loop load</text>
  <text x="75" y="119" text-anchor="middle" class="sm">16.7 → 167 req/s</text>
  <rect x="170" y="38" width="170" height="116" rx="6" class="orange"/>
  <text x="255" y="63" text-anchor="middle" class="b">Admission gateway</text>
  <text x="255" y="82" text-anchor="middle" class="sm">per-tenant rate limits</text>
  <text x="255" y="101" text-anchor="middle" class="sm">priority queue</text>
  <text x="255" y="120" text-anchor="middle" class="sm">bounded wait</text>
  <text x="255" y="139" text-anchor="middle" class="sm">429 + Retry-After</text>
  <rect x="370" y="58" width="140" height="76" rx="6" class="orange"/>
  <text x="440" y="83" text-anchor="middle" class="b">Router</text>
  <text x="440" y="101" text-anchor="middle" class="sm">prefix-cache and</text>
  <text x="440" y="119" text-anchor="middle" class="sm">load scoring</text>
  <rect x="540" y="18" width="310" height="184" rx="6" class="group"/>
  <text x="695" y="36" text-anchor="middle" class="b">vLLM replicas, one H100 each</text>
  <rect x="556" y="48" width="62" height="34" rx="6" class="blue"/>
  <text x="587" y="70" text-anchor="middle" class="sm">vLLM</text>
  <rect x="628" y="48" width="62" height="34" rx="6" class="blue"/>
  <text x="659" y="70" text-anchor="middle" class="sm">vLLM</text>
  <rect x="700" y="48" width="62" height="34" rx="6" class="blue"/>
  <text x="731" y="70" text-anchor="middle" class="sm">vLLM</text>
  <rect x="772" y="48" width="62" height="34" rx="6" class="blue"/>
  <text x="803" y="70" text-anchor="middle" class="sm">vLLM</text>
  <rect x="556" y="90" width="62" height="34" rx="6" class="blue"/>
  <text x="587" y="112" text-anchor="middle" class="sm">vLLM</text>
  <rect x="628" y="90" width="62" height="34" rx="6" class="blue"/>
  <text x="659" y="112" text-anchor="middle" class="sm">vLLM</text>
  <rect x="700" y="90" width="62" height="34" rx="6" class="blue"/>
  <text x="731" y="112" text-anchor="middle" class="sm">vLLM</text>
  <rect x="772" y="90" width="62" height="34" rx="6" class="blue"/>
  <text x="803" y="112" text-anchor="middle" class="sm">vLLM</text>
  <rect x="556" y="132" width="62" height="34" rx="6" fill="url(#hatch)" stroke="#666" stroke-width="1.2"/>
  <rect x="628" y="132" width="62" height="34" rx="6" fill="url(#hatch)" stroke="#666" stroke-width="1.2"/>
  <rect x="700" y="132" width="62" height="34" rx="6" fill="url(#hatch)" stroke="#666" stroke-width="1.2"/>
  <rect x="772" y="132" width="62" height="34" rx="6" fill="url(#hatch)" stroke="#666" stroke-width="1.2"/>
  <text x="695" y="188" text-anchor="middle" class="sm">12 warm → up to 38; hatched: standby nodes</text>
  <path d="M140,96 L168,96" class="edge"/>
  <path d="M340,96 L368,96" class="edge"/>
  <path d="M510,96 L538,96" class="edge"/>
  <path d="M330,245 a75,9 0 0,1 150,0 v56 a75,9 0 0,1 -150,0 z" class="blue"/>
  <path d="M330,245 a75,9 0 0,0 150,0" class="blue" fill="none"/>
  <text x="405" y="267" text-anchor="middle" class="b">Prometheus</text>
  <text x="405" y="283" text-anchor="middle" class="sm">scrapes every 5 s</text>
  <rect x="600" y="246" width="180" height="60" rx="6" class="gray"/>
  <text x="690" y="272" text-anchor="middle" class="b">KEDA + HPA</text>
  <text x="690" y="290" text-anchor="middle" class="sm">12–38 replicas</text>
  <path d="M255,156 L352,240" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="232" y="210" text-anchor="middle" class="sm">metrics; replica</text>
  <text x="232" y="225" text-anchor="middle" class="sm">count for slots</text>
  <path d="M600,204 L470,248" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="572" y="240" text-anchor="middle" class="sm">scrape</text>
  <path d="M480,276 L598,276" class="edge"/>
  <text x="538" y="268" text-anchor="middle" class="sm">query</text>
  <path d="M690,246 L690,204" class="edge"/>
  <text x="698" y="230" class="sm">scale</text>
</svg>
