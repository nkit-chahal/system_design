<svg xmlns="http://www.w3.org/2000/svg" width="830" height="350" viewBox="0 0 830 350" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .axis{stroke:#000;stroke-width:1.2;fill:none}
    .grid{stroke:#e5e5e5;stroke-width:1;fill:none}
    .gline{fill:none;stroke:#82b366;stroke-width:2}
    .rline{fill:none;stroke:#b85450;stroke-width:2}
    .gpt{fill:#d5e8d4;stroke:#82b366;stroke-width:1.5}
    .rpt{fill:#f8cecc;stroke:#b85450;stroke-width:1.5}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- ===== Left chart: total throughput ===== -->
  <text x="230" y="30" text-anchor="middle" class="b">Total throughput (tokens/s)</text>
  <path class="grid" d="M80,210 H380 M80,160 H380 M80,110 H380 M80,60 H380"/>
  <path class="axis" d="M80,60 V260 H380"/>
  <g class="sm" text-anchor="end">
    <text x="72" y="264">0</text><text x="72" y="214">2,500</text><text x="72" y="164">5,000</text><text x="72" y="114">7,500</text><text x="72" y="64">10,000</text>
  </g>
  <g class="sm" text-anchor="middle">
    <text x="80" y="278">0</text><text x="163" y="278">50</text><text x="247" y="278">100</text><text x="330" y="278">150</text>
  </g>
  <path class="axis" d="M163,260 v4 M247,260 v4 M330,260 v4"/>
  <polyline class="gline" points="81.7,255.9 93.3,230.9 106.7,208.4 133.3,175.9 186.7,137.3 293.3,100.6 363.3,87.9"/>
  <g class="gpt">
    <circle cx="81.7" cy="255.9" r="4"/><circle cx="93.3" cy="230.9" r="4"/><circle cx="106.7" cy="208.4" r="4"/><circle cx="133.3" cy="175.9" r="4"/>
    <circle cx="186.7" cy="137.3" r="4"/><circle cx="293.3" cy="100.6" r="4"/><circle cx="363.3" cy="87.9" r="4"/>
  </g>
  <text x="100" y="254" class="sm b">205 (batch 1)</text>
  <text x="194" y="154" class="sm b">6,140 (batch 64)</text>
  <text x="358" y="76" text-anchor="end" class="sm b">8,600 (batch 170)</text>
  <text x="230" y="298" text-anchor="middle" class="sm">batch size (sequences)</text>

  <!-- ===== Right chart: per-user speed ===== -->
  <text x="650" y="30" text-anchor="middle" class="b">Per-user speed (tokens/s)</text>
  <path class="grid" d="M500,220 H800 M500,180 H800 M500,140 H800 M500,100 H800 M500,60 H800"/>
  <path class="axis" d="M500,60 V260 H800"/>
  <g class="sm" text-anchor="end">
    <text x="492" y="264">0</text><text x="492" y="224">50</text><text x="492" y="184">100</text><text x="492" y="144">150</text><text x="492" y="104">200</text><text x="492" y="64">250</text>
  </g>
  <g class="sm" text-anchor="middle">
    <text x="500" y="278">0</text><text x="583" y="278">50</text><text x="667" y="278">100</text><text x="750" y="278">150</text>
  </g>
  <path class="axis" d="M583,260 v4 M667,260 v4 M750,260 v4"/>
  <polyline class="rline" points="501.7,96.2 513.3,114.5 526.7,131.0 553.3,154.9 606.7,183.3 713.3,210.2 783.3,219.5"/>
  <g class="rpt">
    <circle cx="501.7" cy="96.2" r="4"/><circle cx="513.3" cy="114.5" r="4"/><circle cx="526.7" cy="131.0" r="4"/><circle cx="553.3" cy="154.9" r="4"/>
    <circle cx="606.7" cy="183.3" r="4"/><circle cx="713.3" cy="210.2" r="4"/><circle cx="783.3" cy="219.5" r="4"/>
  </g>
  <text x="512" y="90" class="sm b">205 (batch 1)</text>
  <text x="614" y="174" class="sm b">96 (batch 64)</text>
  <text x="798" y="240" text-anchor="end" class="sm b">51 (batch 170)</text>
  <text x="650" y="298" text-anchor="middle" class="sm">batch size (sequences)</text>

  <text x="16" y="326" class="sm">Lower bounds: step time ≥ (16.06 GB of weights + B × 295 MB of KV cache) ÷ 3.35 TB/s. Llama 3.1 8B in BF16 on one H100,</text>
  <text x="16" y="342" class="sm">chat requests at 2,250 tokens of average context. Points at batch 1, 8, 16, 32, 64, 128 and 170.</text>
</svg>
