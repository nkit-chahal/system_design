<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .tick{fill:#6c8ebf}
    .axis{stroke:#000;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <!-- x = 110 + 420 * seconds; a running chat stream's tokens are blue ticks -->
  <text x="16" y="24" class="b">Tokens of one running chat stream while a 30,000-token prompt is prefilled on the same GPU</text>

  <!-- Lane 1: no chunking -->
  <text x="16" y="66" class="b">One step</text>
  <text x="16" y="82" class="sm">whole prefill</text>
  <g class="tick">
    <rect x="118.4" y="56" width="3" height="20"/><rect x="126.8" y="56" width="3" height="20"/><rect x="135.2" y="56" width="3" height="20"/>
    <rect x="143.6" y="56" width="3" height="20"/><rect x="152.0" y="56" width="3" height="20"/><rect x="160.4" y="56" width="3" height="20"/>
    <rect x="168.8" y="56" width="3" height="20"/><rect x="177.2" y="56" width="3" height="20"/><rect x="185.6" y="56" width="3" height="20"/>
    <rect x="194.0" y="56" width="3" height="20"/><rect x="202.4" y="56" width="3" height="20"/><rect x="210.8" y="56" width="3" height="20"/>
    <rect x="219.2" y="56" width="3" height="20"/><rect x="227.6" y="56" width="3" height="20"/><rect x="236.0" y="56" width="3" height="20"/>
  </g>
  <rect x="236" y="56" width="420" height="20" class="orange"/>
  <text x="446" y="71" text-anchor="middle" class="sm">30,000-token prefill in one step: about 1 s with no token</text>
  <g class="tick">
    <rect x="656.0" y="56" width="3" height="20"/><rect x="664.4" y="56" width="3" height="20"/><rect x="672.8" y="56" width="3" height="20"/>
    <rect x="681.2" y="56" width="3" height="20"/><rect x="689.6" y="56" width="3" height="20"/><rect x="698.0" y="56" width="3" height="20"/>
    <rect x="706.4" y="56" width="3" height="20"/><rect x="714.8" y="56" width="3" height="20"/><rect x="723.2" y="56" width="3" height="20"/>
    <rect x="731.6" y="56" width="3" height="20"/><rect x="740.0" y="56" width="3" height="20"/><rect x="748.4" y="56" width="3" height="20"/>
    <rect x="756.8" y="56" width="3" height="20"/><rect x="765.2" y="56" width="3" height="20"/>
  </g>
  <text x="662" y="98" class="sm b" style="fill:#b85450">worst gap ≈ 1 s</text>

  <!-- Lane 2: chunked prefill, 2,048 tokens per step = about 86 ms per step -->
  <text x="16" y="146" class="b">Chunked</text>
  <text x="16" y="162" class="sm">2,048 per step</text>
  <g class="tick">
    <rect x="118.4" y="136" width="3" height="20"/><rect x="126.8" y="136" width="3" height="20"/><rect x="135.2" y="136" width="3" height="20"/>
    <rect x="143.6" y="136" width="3" height="20"/><rect x="152.0" y="136" width="3" height="20"/><rect x="160.4" y="136" width="3" height="20"/>
    <rect x="168.8" y="136" width="3" height="20"/><rect x="177.2" y="136" width="3" height="20"/><rect x="185.6" y="136" width="3" height="20"/>
    <rect x="194.0" y="136" width="3" height="20"/><rect x="202.4" y="136" width="3" height="20"/><rect x="210.8" y="136" width="3" height="20"/>
    <rect x="219.2" y="136" width="3" height="20"/><rect x="227.6" y="136" width="3" height="20"/><rect x="236.0" y="136" width="3" height="20"/>
  </g>
  <g>
    <rect x="236" y="140" width="36.1" height="12" class="orange"/><rect x="272.1" y="140" width="36.1" height="12" class="orange"/>
    <rect x="308.2" y="140" width="36.1" height="12" class="orange"/><rect x="344.3" y="140" width="36.1" height="12" class="orange"/>
    <rect x="380.4" y="140" width="36.1" height="12" class="orange"/><rect x="416.5" y="140" width="36.1" height="12" class="orange"/>
    <rect x="452.6" y="140" width="36.1" height="12" class="orange"/><rect x="488.7" y="140" width="36.1" height="12" class="orange"/>
    <rect x="524.8" y="140" width="36.1" height="12" class="orange"/><rect x="560.9" y="140" width="36.1" height="12" class="orange"/>
    <rect x="597.0" y="140" width="36.1" height="12" class="orange"/><rect x="633.1" y="140" width="36.1" height="12" class="orange"/>
    <rect x="669.2" y="140" width="36.1" height="12" class="orange"/><rect x="705.3" y="140" width="36.1" height="12" class="orange"/>
    <rect x="741.4" y="140" width="36.1" height="12" class="orange"/>
  </g>
  <g class="tick">
    <rect x="270.6" y="136" width="3" height="20"/><rect x="306.7" y="136" width="3" height="20"/><rect x="342.8" y="136" width="3" height="20"/>
    <rect x="378.9" y="136" width="3" height="20"/><rect x="415.0" y="136" width="3" height="20"/><rect x="451.1" y="136" width="3" height="20"/>
    <rect x="487.2" y="136" width="3" height="20"/><rect x="523.3" y="136" width="3" height="20"/><rect x="559.4" y="136" width="3" height="20"/>
    <rect x="595.5" y="136" width="3" height="20"/><rect x="631.6" y="136" width="3" height="20"/><rect x="667.7" y="136" width="3" height="20"/>
    <rect x="703.8" y="136" width="3" height="20"/><rect x="739.9" y="136" width="3" height="20"/><rect x="776.0" y="136" width="3" height="20"/>
  </g>
  <text x="662" y="178" class="sm b" style="fill:#3f7f3a">worst gap ≈ 86 ms</text>

  <!-- Axis -->
  <line x1="110" y1="196" x2="790" y2="196" class="axis"/>
  <g class="sm" text-anchor="middle">
    <text x="110" y="214">0</text><text x="320" y="214">0.5</text><text x="530" y="214">1.0</text><text x="740" y="214">1.5 s</text>
  </g>

  <text x="16" y="250">Assumes 20 ms per decode step and about 30,800 prefill tokens per second: a 2,048-token chunk adds</text>
  <text x="16" y="270">about 66 ms per step. The long prompt's own TTFT grows from about 1.0 s to about 1.3 s in exchange.</text>
</svg>
