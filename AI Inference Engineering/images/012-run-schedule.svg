<svg xmlns="http://www.w3.org/2000/svg" width="820" height="240" viewBox="0 0 820 240" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Session 1 -->
  <text x="20" y="73" class="b">Session 1</text>
  <text x="240" y="44" text-anchor="middle" class="b">vLLM</text>
  <rect x="100" y="52" width="70" height="34" class="gray"/><text x="135" y="74" text-anchor="middle" class="sm">start</text>
  <rect x="170" y="52" width="60" height="34" class="purple"/><text x="200" y="74" text-anchor="middle" class="sm">warmup</text>
  <rect x="230" y="52" width="50" height="34" class="orange"/><text x="255" y="74" text-anchor="middle" class="sm">run 1</text>
  <rect x="280" y="52" width="50" height="34" class="orange"/><text x="305" y="74" text-anchor="middle" class="sm">run 2</text>
  <rect x="330" y="52" width="50" height="34" class="orange"/><text x="355" y="74" text-anchor="middle" class="sm">run 3</text>
  <rect x="380" y="52" width="40" height="34" class="gray"/><text x="400" y="74" text-anchor="middle" class="sm">stop</text>
  <text x="560" y="44" text-anchor="middle" class="b">SGLang</text>
  <rect x="420" y="52" width="70" height="34" class="gray"/><text x="455" y="74" text-anchor="middle" class="sm">start</text>
  <rect x="490" y="52" width="60" height="34" class="purple"/><text x="520" y="74" text-anchor="middle" class="sm">warmup</text>
  <rect x="550" y="52" width="50" height="34" class="orange"/><text x="575" y="74" text-anchor="middle" class="sm">run 1</text>
  <rect x="600" y="52" width="50" height="34" class="orange"/><text x="625" y="74" text-anchor="middle" class="sm">run 2</text>
  <rect x="650" y="52" width="50" height="34" class="orange"/><text x="675" y="74" text-anchor="middle" class="sm">run 3</text>
  <rect x="700" y="52" width="40" height="34" class="gray"/><text x="720" y="74" text-anchor="middle" class="sm">stop</text>

  <!-- Session 2 -->
  <text x="20" y="143" class="b">Session 2</text>
  <text x="240" y="114" text-anchor="middle" class="b">SGLang</text>
  <rect x="100" y="122" width="70" height="34" class="gray"/><text x="135" y="144" text-anchor="middle" class="sm">start</text>
  <rect x="170" y="122" width="60" height="34" class="purple"/><text x="200" y="144" text-anchor="middle" class="sm">warmup</text>
  <rect x="230" y="122" width="50" height="34" class="orange"/><text x="255" y="144" text-anchor="middle" class="sm">run 4</text>
  <rect x="280" y="122" width="50" height="34" class="orange"/><text x="305" y="144" text-anchor="middle" class="sm">run 5</text>
  <rect x="330" y="122" width="50" height="34" class="orange"/><text x="355" y="144" text-anchor="middle" class="sm">run 6</text>
  <rect x="380" y="122" width="40" height="34" class="gray"/><text x="400" y="144" text-anchor="middle" class="sm">stop</text>
  <text x="560" y="114" text-anchor="middle" class="b">vLLM</text>
  <rect x="420" y="122" width="70" height="34" class="gray"/><text x="455" y="144" text-anchor="middle" class="sm">start</text>
  <rect x="490" y="122" width="60" height="34" class="purple"/><text x="520" y="144" text-anchor="middle" class="sm">warmup</text>
  <rect x="550" y="122" width="50" height="34" class="orange"/><text x="575" y="144" text-anchor="middle" class="sm">run 4</text>
  <rect x="600" y="122" width="50" height="34" class="orange"/><text x="625" y="144" text-anchor="middle" class="sm">run 5</text>
  <rect x="650" y="122" width="50" height="34" class="orange"/><text x="675" y="144" text-anchor="middle" class="sm">run 6</text>
  <rect x="700" y="122" width="40" height="34" class="gray"/><text x="720" y="144" text-anchor="middle" class="sm">stop</text>

  <!-- Legend -->
  <rect x="100" y="182" width="18" height="12" class="gray"/><text x="124" y="193" class="sm">start, wait for /health; stop</text>
  <rect x="320" y="182" width="18" height="12" class="purple"/><text x="344" y="193" class="sm">untimed warmup (100 prompts)</text>
  <rect x="540" y="182" width="18" height="12" class="orange"/><text x="564" y="193" class="sm">timed run (500 prompts)</text>
  <text x="20" y="226" class="sm">Session 2 is optional. Reversing the order keeps slow drift (heat, a noisy neighbor) from always favoring the same engine.</text>
</svg>
