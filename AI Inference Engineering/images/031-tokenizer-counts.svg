<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .grid{fill:none;stroke:#e6e6e6;stroke-width:1}
    .thr{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:6 4}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="28" class="b">The same 10,000 characters of English text</text>
  <text x="16" y="72">Llama 2 tokenizer</text><text x="16" y="90" class="sm">3.17 chars/token</text>
  <rect x="200" y="54" width="450.7" height="40" class="orange"/>
  <text x="660.7" y="79" class="b">3,155 tokens</text>
  <text x="16" y="142">Llama 3 tokenizer</text><text x="16" y="160" class="sm">3.94 chars/token</text>
  <rect x="200" y="124" width="362.6" height="40" class="blue"/>
  <text x="572.6" y="149" class="b">2,538 tokens</text>
  <line x1="200.0" y1="190" x2="200.0" y2="195" class="axis"/><text x="200.0" y="209" text-anchor="middle" class="sm">0</text>
  <line x1="342.9" y1="190" x2="342.9" y2="195" class="axis"/><text x="342.9" y="209" text-anchor="middle" class="sm">1,000</text>
  <line x1="485.7" y1="190" x2="485.7" y2="195" class="axis"/><text x="485.7" y="209" text-anchor="middle" class="sm">2,000</text>
  <line x1="628.6" y1="190" x2="628.6" y2="195" class="axis"/><text x="628.6" y="209" text-anchor="middle" class="sm">3,000</text>
  <line x1="200" y1="190" x2="700.0" y2="190" class="axis"/>
  <text x="16" y="240" class="sm">About 20% fewer tokens with Llama 3. The chat template then adds role headers and special tokens</text>
  <text x="16" y="256" class="sm">on top of the message text, which only the server counts. Compression rates from the Llama 3 paper.</text>
</svg>
