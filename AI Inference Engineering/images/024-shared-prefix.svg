<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
    <pattern id="redhatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#e0a8a6" stroke-width="3"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .yellow{fill:#fff2cc;stroke:#d6b656;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .dedge{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4;marker-end:url(#arrow)}
    .axis{fill:none;stroke:#000;stroke-width:1.2}
    .tick{stroke:#000;stroke-width:1}
    .grid{stroke:#e3e3e3;stroke-width:1}
    .guide{stroke:#666;stroke-width:1;stroke-dasharray:5 4;fill:none}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="26" class="b">Without prefix caching</text>
  <text x="16" y="61">Request A</text>
  <rect x="130.0" y="40" width="405.0" height="32" class="orange"/>
  <text x="332.5" y="60.5" text-anchor="middle" class="sm">system prompt: 1,500 tokens</text>
  <rect x="535.0" y="40" width="135.0" height="32" class="orange"/>
  <text x="602.5" y="60.5" text-anchor="middle" class="sm">user A: 500</text>
  <text x="682.0" y="61" class="sm">2,000 computed, ≈ 65 ms</text>
  <text x="16" y="103">Request B</text>
  <rect x="130.0" y="82" width="405.0" height="32" class="orange"/>
  <text x="332.5" y="102.5" text-anchor="middle" class="sm">system prompt: 1,500 tokens</text>
  <rect x="535.0" y="82" width="135.0" height="32" class="orange"/>
  <text x="602.5" y="102.5" text-anchor="middle" class="sm">user B: 500</text>
  <text x="682.0" y="103" class="sm">2,000 computed, ≈ 65 ms</text>
  <line x1="16" y1="134" x2="844" y2="134" stroke="#999" stroke-dasharray="5 4"/>
  <text x="16" y="162" class="b">With prefix caching</text>
  <text x="16" y="197">Request A</text>
  <rect x="130.0" y="176" width="405.0" height="32" class="orange"/>
  <text x="332.5" y="196.5" text-anchor="middle" class="sm">system prompt: computed, then kept</text>
  <rect x="535.0" y="176" width="135.0" height="32" class="orange"/>
  <text x="602.5" y="196.5" text-anchor="middle" class="sm">user A: 500</text>
  <text x="682.0" y="197" class="sm">2,000 computed, ≈ 65 ms</text>
  <text x="16" y="283">Request B</text>
  <rect x="130.0" y="262" width="401.8" height="32" class="blue"/>
  <text x="330.9" y="282.5" text-anchor="middle" class="sm">1,488 tokens (93 blocks) read from cache</text>
  <rect x="531.8" y="262" width="138.2" height="32" class="orange"/>
  <text x="600.9" y="282.5" text-anchor="middle" class="sm">512</text>
  <text x="682.0" y="283" class="sm">512 computed, ≈ 17 ms</text>
  <path d="M332.5,210 L332.5,258" class="dedge"/>
  <text x="340.5" y="240" class="sm">same tokens, same keys and values: reuse the blocks</text>
  <rect x="130" y="306" width="16" height="12" class="orange"/><text x="152" y="317" class="sm">computed in prefill</text>
  <rect x="290" y="306" width="16" height="12" class="blue"/><text x="312" y="317" class="sm">read from the KV cache</text>
  <text x="470" y="317" class="sm">Prefill times assume 50% of the H100's 989 dense BF16 TFLOPS.</text>
</svg>
