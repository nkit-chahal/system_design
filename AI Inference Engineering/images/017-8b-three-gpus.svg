<svg xmlns="http://www.w3.org/2000/svg" width="830" height="352" viewBox="0 0 830 352" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .held{fill:url(#hatch);stroke:#666;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="20" y="26" class="b">Llama 3.1 8B in BF16, --gpu-memory-utilization 0.90, three GPUs drawn to one scale</text>

  <!-- L4: 8.8 px per GiB. 15 | 1.5 | 3.3 | 2.2 -->
  <text x="20" y="72" class="b">L4</text>
  <text x="20" y="89" class="sm">≈ 22 GiB</text>
  <rect x="100" y="56" width="132" height="38" class="orange"/>
  <text x="166" y="80" text-anchor="middle">15 GiB</text>
  <rect x="232" y="56" width="13.2" height="38" class="gray"/>
  <rect x="245.2" y="56" width="29" height="38" class="blue"/>
  <rect x="274.2" y="56" width="19.4" height="38" class="held"/>
  <text x="310" y="72">KV ≈ 3.3 GiB → ≈ 27K tokens → <tspan class="b">10 chat requests</tspan></text>
  <text x="310" y="90" class="sm">full-cache decode step ≥ 65 ms, so at most ≈ 15 tokens/s per stream</text>

  <!-- A100: 15 | 4.6 | 51.7 | 7.9 -->
  <text x="20" y="162" class="b">A100</text>
  <text x="20" y="179" class="sm">≈ 79.2 GiB</text>
  <rect x="100" y="146" width="132" height="38" class="orange"/>
  <text x="166" y="170" text-anchor="middle">15 GiB</text>
  <rect x="232" y="146" width="40.5" height="38" class="gray"/>
  <rect x="272.5" y="146" width="454.8" height="38" class="blue"/>
  <text x="500" y="170" text-anchor="middle">KV cache ≈ 51.7 GiB</text>
  <rect x="727.3" y="146" width="69.7" height="38" class="held"/>
  <text x="100" y="206" class="sm">≈ 423K tokens → <tspan class="b">169 chat requests</tspan> or 12 at 32K · full-cache step ≥ 36 ms (≈ 28 tokens/s)</text>

  <!-- H100: 15 | 4.6 | 52 | 8 -->
  <text x="20" y="252" class="b">H100</text>
  <text x="20" y="269" class="sm">≈ 79.6 GiB</text>
  <rect x="100" y="236" width="132" height="38" class="orange"/>
  <text x="166" y="260" text-anchor="middle">15 GiB</text>
  <rect x="232" y="236" width="40.5" height="38" class="gray"/>
  <rect x="272.5" y="236" width="458" height="38" class="blue"/>
  <text x="501" y="260" text-anchor="middle">KV cache ≈ 52 GiB</text>
  <rect x="730.5" y="236" width="70" height="38" class="held"/>
  <text x="100" y="296" class="sm">≈ 426K tokens → <tspan class="b">170 chat requests</tspan> or 13 at 32K · full-cache step ≥ 21 ms (≈ 46 tokens/s)</text>

  <!-- Legend -->
  <rect x="20" y="326" width="16" height="12" class="orange"/><text x="42" y="337" class="sm">weights</text>
  <rect x="110" y="326" width="16" height="12" class="gray"/><text x="132" y="337" class="sm">activations + CUDA graphs (≈ 1.5 GiB assumed on L4, ≈ 4.6 GiB on 80 GB cards)</text>
  <rect x="590" y="326" width="16" height="12" class="blue"/><text x="612" y="337" class="sm">KV cache</text>
  <rect x="690" y="326" width="16" height="12" class="held"/><text x="712" y="337" class="sm">held back</text>
</svg>
