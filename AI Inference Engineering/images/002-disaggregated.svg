<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.lg{font-size:16px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Client and router -->
  <rect x="16" y="128" width="96" height="48" rx="6" class="purple"/>
  <text x="64" y="149" text-anchor="middle">requests</text>
  <text x="64" y="166" text-anchor="middle" class="sm">chat prompts</text>
  <path d="M112,152 L148,152" class="edge"/>
  <rect x="150" y="128" width="90" height="48" rx="6" class="gray"/>
  <text x="195" y="149" text-anchor="middle">router</text>
  <text x="195" y="166" text-anchor="middle" class="sm">picks a pair</text>

  <!-- Prefill pool -->
  <rect x="280" y="40" width="200" height="140" rx="4" class="group"/>
  <text x="380" y="62" text-anchor="middle" class="b">Prefill pool</text>
  <rect x="300" y="74" width="160" height="34" rx="6" class="orange"/>
  <text x="380" y="96" text-anchor="middle">GPU: prefill only</text>
  <rect x="300" y="116" width="160" height="34" rx="6" class="orange"/>
  <text x="380" y="138" text-anchor="middle">GPU: prefill only</text>
  <text x="380" y="170" text-anchor="middle" class="sm">compute-bound; sized for TTFT</text>
  <path d="M240,152 L260,152 L260,110 L278,110" class="edge"/>

  <!-- KV transfer -->
  <path d="M480,110 L590,110" class="edge" style="stroke-width:2.4"/>
  <rect x="490" y="30" width="96" height="70" rx="6" class="blue"/>
  <text x="538" y="52" text-anchor="middle" class="sm b">KV cache</text>
  <text x="538" y="68" text-anchor="middle" class="sm">262 MB per</text>
  <text x="538" y="84" text-anchor="middle" class="sm">2,000 tokens</text>

  <!-- Decode pool -->
  <rect x="592" y="40" width="232" height="140" rx="4" class="group"/>
  <text x="708" y="62" text-anchor="middle" class="b">Decode pool</text>
  <rect x="610" y="74" width="196" height="34" rx="6" class="orange"/>
  <text x="708" y="96" text-anchor="middle">GPU: decode only</text>
  <rect x="610" y="116" width="196" height="34" rx="6" class="orange"/>
  <text x="708" y="138" text-anchor="middle">GPU: decode only</text>
  <text x="708" y="170" text-anchor="middle" class="sm">memory-bound; sized for TPOT</text>

  <!-- Stream back -->
  <path d="M708,180 L708,236" class="edge"/>
  <rect x="578" y="238" width="260" height="40" rx="6" class="green"/>
  <text x="708" y="263" text-anchor="middle">tokens 2, 3, … stream to the user</text>
  <path d="M380,180 L380,236" class="edge"/>
  <rect x="270" y="238" width="220" height="40" rx="6" class="green"/>
  <text x="380" y="263" text-anchor="middle">first token can stream from here</text>

  <!-- Transfer cost note -->
  <text x="16" y="306" class="sm">KV transfer for a 2,000-token prompt: ≈ 0.6 ms at 450 GB/s (NVLink, one direction), ≈ 5 ms over a 400 Gb/s (50 GB/s) network link.</text>
  <text x="16" y="326" class="sm">Decode GPUs never run a prefill, so a long prompt cannot stall anyone's stream; each pool is scaled and tuned on its own.</text>
</svg>
