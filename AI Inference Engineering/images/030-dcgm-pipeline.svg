<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- GPU node -->
  <rect x="16" y="30" width="474" height="284" rx="4" class="group"/>
  <text x="30" y="52" class="b">GPU node (Kubernetes)</text>

  <!-- GPUs -->
  <rect x="40" y="76" width="90" height="34" rx="4" class="gray"/><text x="85" y="98" text-anchor="middle">H100</text>
  <rect x="40" y="116" width="90" height="34" rx="4" class="gray"/><text x="85" y="138" text-anchor="middle">H100</text>
  <rect x="40" y="156" width="90" height="34" rx="4" class="gray"/><text x="85" y="178" text-anchor="middle">H100</text>
  <text x="85" y="208" text-anchor="middle" class="sm">counters</text>

  <!-- DCGM host engine -->
  <path d="M130,133 L168,133" class="edge"/>
  <rect x="170" y="100" width="118" height="66" rx="6" class="orange"/>
  <text x="229" y="128" text-anchor="middle">DCGM</text>
  <text x="229" y="146" text-anchor="middle">host engine</text>

  <!-- Exporter -->
  <path d="M288,133 L318,133" class="edge"/>
  <rect x="320" y="94" width="150" height="78" rx="6" class="orange"/>
  <text x="395" y="118" text-anchor="middle" class="b">dcgm-exporter</text>
  <text x="395" y="138" text-anchor="middle" class="sm">DaemonSet pod</text>
  <text x="395" y="158" text-anchor="middle" class="sm">:9400/metrics</text>

  <!-- CSV -->
  <path d="M352,66 L352,92" class="edge"/>
  <path d="M320,46 L376,46 L386,56 L386,66 L320,66 Z" class="white"/>
  <text x="352" y="61" text-anchor="middle" class="sm">fields.csv</text>
  <text x="392" y="61" class="sm">which fields</text>

  <!-- pod-resources -->
  <rect x="320" y="206" width="150" height="44" rx="6" class="gray"/>
  <text x="395" y="225" text-anchor="middle" class="sm">kubelet</text>
  <text x="395" y="241" text-anchor="middle" class="sm">pod-resources socket</text>
  <path d="M395,206 L395,174" class="edge"/>
  <text x="404" y="194" class="sm">pod labels</text>

  <!-- vLLM pod -->
  <rect x="170" y="230" width="118" height="66" rx="6" class="purple"/>
  <text x="229" y="256" text-anchor="middle">vLLM pod</text>
  <text x="229" y="274" text-anchor="middle" class="sm">:8000/metrics</text>
  <text x="229" y="289" text-anchor="middle" class="sm">engine metrics</text>

  <!-- Prometheus cylinder -->
  <path d="M560,108 a46,12 0 0 0 92,0 a46,12 0 0 0 -92,0 Z" class="blue"/>
  <path d="M560,108 L560,182 a46,12 0 0 0 92,0 L652,108" class="blue"/>
  <path d="M560,108 a46,12 0 0 0 92,0" fill="none" stroke="#6c8ebf" stroke-width="1.2"/>
  <text x="606" y="148" text-anchor="middle">Prometheus</text>
  <text x="606" y="166" text-anchor="middle" class="sm">TSDB</text>
  <path d="M470,133 L558,133" class="edge"/>
  <path d="M288,263 L520,263 L520,170 L558,170" class="edge"/>
  <text x="514" y="106" text-anchor="middle" class="sm">scrape every</text>
  <text x="514" y="122" text-anchor="middle" class="sm">15–30 s</text>

  <!-- Consumers -->
  <rect x="696" y="56" width="130" height="50" rx="6" class="gray"/>
  <text x="761" y="78" text-anchor="middle">Grafana</text>
  <text x="761" y="95" text-anchor="middle" class="sm">dashboards</text>
  <rect x="696" y="160" width="130" height="50" rx="6" class="gray"/>
  <text x="761" y="182" text-anchor="middle">Alertmanager</text>
  <text x="761" y="199" text-anchor="middle" class="sm">routes alerts</text>
  <path d="M652,120 L694,88" class="edge"/>
  <path d="M652,160 L694,180" class="edge"/>
  <rect x="696" y="250" width="130" height="50" rx="6" class="green"/>
  <text x="761" y="272" text-anchor="middle" class="sm">page on-call or</text>
  <text x="761" y="288" text-anchor="middle" class="sm">drain the node</text>
  <path d="M761,210 L761,248" class="edge"/>
</svg>
