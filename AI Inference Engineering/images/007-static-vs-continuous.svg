<svg xmlns="http://www.w3.org/2000/svg" width="850" height="470" viewBox="0 0 850 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .purple{fill:#e1d5e7;stroke:#9673a6;stroke-width:1.2}
    .idle{fill:url(#hatch);stroke:#999;stroke-width:1}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .tick{stroke:#999;stroke-width:0.8;fill:none}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- ===== Static batching ===== -->
  <text x="16" y="26" class="b">Static batching: the batch runs until its longest request (B) finishes</text>
  <g class="sm" text-anchor="middle">
    <text x="104" y="50">1</text><text x="152" y="50">2</text><text x="200" y="50">3</text><text x="248" y="50">4</text>
    <text x="296" y="50">5</text><text x="344" y="50">6</text><text x="392" y="50">7</text><text x="440" y="50">8</text>
    <text x="488" y="50">9</text><text x="536" y="50">10</text><text x="584" y="50">11</text><text x="632" y="50">12</text>
  </g>
  <text x="16" y="50" class="sm">step</text>
  <text x="16" y="75">slot 1</text><text x="16" y="107">slot 2</text><text x="16" y="139">slot 3</text><text x="16" y="171">slot 4</text>
  <rect x="80" y="56" width="144" height="26" class="orange"/><rect x="224" y="56" width="432" height="26" class="idle"/>
  <rect x="80" y="88" width="576" height="26" class="orange"/>
  <rect x="80" y="120" width="240" height="26" class="orange"/><rect x="320" y="120" width="336" height="26" class="idle"/>
  <rect x="80" y="152" width="384" height="26" class="orange"/><rect x="464" y="152" width="192" height="26" class="idle"/>
  <path class="tick" d="M128,56 V82 M176,56 V82 M128,88 V114 M176,88 V114 M224,88 V114 M272,88 V114 M320,88 V114 M368,88 V114 M416,88 V114 M464,88 V114 M512,88 V114 M560,88 V114 M608,88 V114 M128,120 V146 M176,120 V146 M224,120 V146 M272,120 V146 M128,152 V178 M176,152 V178 M224,152 V178 M272,152 V178 M320,152 V178 M368,152 V178 M416,152 V178"/>
  <g class="b"><text x="88" y="74">A</text><text x="88" y="106">B</text><text x="88" y="138">C</text><text x="88" y="170">D</text></g>

  <!-- Waiting queue (static) -->
  <rect x="676" y="40" width="160" height="140" rx="4" class="group"/>
  <text x="756" y="58" text-anchor="middle" class="b">Waiting queue</text>
  <rect x="690" y="68" width="132" height="26" rx="4" class="purple"/><text x="756" y="86" text-anchor="middle" class="sm">E (arrived step 4)</text>
  <rect x="690" y="102" width="132" height="26" rx="4" class="purple"/><text x="756" y="120" text-anchor="middle" class="sm">F (arrived step 6)</text>
  <rect x="690" y="136" width="132" height="26" rx="4" class="purple"/><text x="756" y="154" text-anchor="middle" class="sm">G (arrived step 9)</text>
  <text x="16" y="206">20 of 48 slot-steps sit idle, and E, F and G cannot start until step 13.</text>

  <line x1="16" y1="224" x2="834" y2="224" stroke="#999" stroke-dasharray="5 4"/>

  <!-- ===== Continuous batching ===== -->
  <text x="16" y="252" class="b">Continuous batching: requests join and leave the batch at every step</text>
  <g class="sm" text-anchor="middle">
    <text x="104" y="276">1</text><text x="152" y="276">2</text><text x="200" y="276">3</text><text x="248" y="276">4</text>
    <text x="296" y="276">5</text><text x="344" y="276">6</text><text x="392" y="276">7</text><text x="440" y="276">8</text>
    <text x="488" y="276">9</text><text x="536" y="276">10</text><text x="584" y="276">11</text><text x="632" y="276">12</text>
  </g>
  <text x="16" y="276" class="sm">step</text>
  <text x="16" y="301">slot 1</text><text x="16" y="333">slot 2</text><text x="16" y="365">slot 3</text><text x="16" y="397">slot 4</text>
  <rect x="80" y="282" width="144" height="26" class="orange"/><rect x="224" y="282" width="432" height="26" class="green"/>
  <rect x="80" y="314" width="576" height="26" class="orange"/>
  <rect x="80" y="346" width="240" height="26" class="orange"/><rect x="320" y="346" width="336" height="26" class="green"/>
  <rect x="80" y="378" width="384" height="26" class="orange"/><rect x="464" y="378" width="192" height="26" class="green"/>
  <path class="tick" d="M128,282 V308 M176,282 V308 M272,282 V308 M320,282 V308 M368,282 V308 M416,282 V308 M464,282 V308 M512,282 V308 M560,282 V308 M608,282 V308 M128,314 V340 M176,314 V340 M224,314 V340 M272,314 V340 M320,314 V340 M368,314 V340 M416,314 V340 M464,314 V340 M512,314 V340 M560,314 V340 M608,314 V340 M128,346 V372 M176,346 V372 M224,346 V372 M272,346 V372 M368,346 V372 M416,346 V372 M464,346 V372 M512,346 V372 M560,346 V372 M608,346 V372 M128,378 V404 M176,378 V404 M224,378 V404 M272,378 V404 M320,378 V404 M368,378 V404 M416,378 V404 M512,378 V404 M560,378 V404 M608,378 V404"/>
  <g class="b"><text x="88" y="300">A</text><text x="232" y="300">E</text><text x="88" y="332">B</text><text x="88" y="364">C</text><text x="328" y="364">F</text><text x="88" y="396">D</text><text x="472" y="396">G</text></g>

  <!-- Waiting queue (continuous) -->
  <rect x="676" y="266" width="160" height="140" rx="4" class="group"/>
  <text x="756" y="284" text-anchor="middle" class="b">Waiting queue</text>
  <text x="756" y="330" text-anchor="middle" class="sm">empty: each request</text>
  <text x="756" y="346" text-anchor="middle" class="sm">starts in the step</text>
  <text x="756" y="362" text-anchor="middle" class="sm">a slot frees up</text>
  <text x="16" y="432">No idle slot-steps: E, F and G start at steps 4, 6 and 9, as soon as A, C and D finish.</text>

  <!-- Legend -->
  <rect x="80" y="448" width="18" height="12" class="orange"/><text x="104" y="459" class="sm">first batch (A to D)</text>
  <rect x="240" y="448" width="18" height="12" class="green"/><text x="264" y="459" class="sm">joined mid-flight</text>
  <rect x="390" y="448" width="18" height="12" class="idle"/><text x="414" y="459" class="sm">idle slot</text>
  <rect x="490" y="448" width="18" height="12" rx="3" class="purple"/><text x="514" y="459" class="sm">waiting request</text>
</svg>
