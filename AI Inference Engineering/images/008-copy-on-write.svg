<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" font-family="Helvetica, Arial, sans-serif">
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .white{fill:#fff;stroke:#000;stroke-width:1.2}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="24" class="b">Four samples of one 2,004-token prompt, each generating 500 tokens (16-token blocks)</text>
  <text x="210" y="54" text-anchor="middle" class="sm b">prompt: 125 full blocks</text>
  <text x="390" y="54" text-anchor="middle" class="sm b">last prompt block</text>
  <text x="600" y="54" text-anchor="middle" class="sm b">answer</text>
  <text x="785" y="54" text-anchor="middle" class="sm b">owned</text>
  <rect x="110" y="64" width="200" height="176" rx="4" class="blue"/>
  <text x="210" y="138" text-anchor="middle" class="b">125 shared blocks</text>
  <text x="210" y="158" text-anchor="middle" class="sm">reference count 4</text>
  <text x="210" y="174" text-anchor="middle" class="sm">250 MiB, stored once</text>
  <text x="16" y="87">sample 1</text>
  <rect x="330" y="64" width="120" height="38" rx="4" class="orange"/>
  <text x="390" y="80" text-anchor="middle" class="sm">copy, made on</text>
  <text x="390" y="95" text-anchor="middle" class="sm">first write</text>
  <rect x="470" y="64" width="260" height="38" rx="4" class="white"/>
  <text x="600" y="88" text-anchor="middle" class="sm">31 new blocks for its own 500 tokens</text>
  <text x="785" y="88" text-anchor="middle" class="sm">32 blocks</text>
  <text x="16" y="133">sample 2</text>
  <rect x="330" y="110" width="120" height="38" rx="4" class="orange"/>
  <text x="390" y="126" text-anchor="middle" class="sm">copy, made on</text>
  <text x="390" y="141" text-anchor="middle" class="sm">first write</text>
  <rect x="470" y="110" width="260" height="38" rx="4" class="white"/>
  <text x="600" y="134" text-anchor="middle" class="sm">31 new blocks for its own 500 tokens</text>
  <text x="785" y="134" text-anchor="middle" class="sm">32 blocks</text>
  <text x="16" y="179">sample 3</text>
  <rect x="330" y="156" width="120" height="38" rx="4" class="orange"/>
  <text x="390" y="172" text-anchor="middle" class="sm">copy, made on</text>
  <text x="390" y="187" text-anchor="middle" class="sm">first write</text>
  <rect x="470" y="156" width="260" height="38" rx="4" class="white"/>
  <text x="600" y="180" text-anchor="middle" class="sm">31 new blocks for its own 500 tokens</text>
  <text x="785" y="180" text-anchor="middle" class="sm">32 blocks</text>
  <text x="16" y="225">sample 4</text>
  <rect x="330" y="202" width="120" height="38" rx="4" class="blue"/>
  <text x="390" y="218" text-anchor="middle" class="sm">original block,</text>
  <text x="390" y="233" text-anchor="middle" class="sm">count 4 → 1</text>
  <rect x="470" y="202" width="260" height="38" rx="4" class="white"/>
  <text x="600" y="226" text-anchor="middle" class="sm">31 new blocks for its own 500 tokens</text>
  <text x="785" y="226" text-anchor="middle" class="sm">32 blocks</text>
  <text x="16" y="270" class="sm">Samples 1, 2 and 3 each copy the shared last block on their first write (count 4 → 3 → 2 → 1); sample 4 then writes in place.</text>
  <text x="16" y="296" class="b">125 shared + 4 × 32 owned = 253 blocks (506 MiB). Without sharing: 4 × 157 = 628 blocks (1,256 MiB).</text>
  <rect x="16" y="314" width="18" height="12" class="blue"/><text x="40" y="325" class="sm">shared, reference counted</text>
  <rect x="210" y="314" width="18" height="12" class="orange"/><text x="234" y="325" class="sm">copied on write</text>
  <rect x="350" y="314" width="18" height="12" class="white"/><text x="374" y="325" class="sm">private to one sample</text>
</svg>
