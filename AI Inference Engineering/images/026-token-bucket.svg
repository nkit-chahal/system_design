<svg xmlns="http://www.w3.org/2000/svg" width="820" height="310" viewBox="0 0 820 310" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .blue{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.2}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
    .axis{stroke:#000;stroke-width:1.2}
    .grid{stroke:#ccc;stroke-width:1;stroke-dasharray:4 4}
    .level{fill:none;stroke:#6c8ebf;stroke-width:2.5}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Bucket -->
  <text x="140" y="24" text-anchor="middle" class="sm b">refill r = 10,000 tokens/s</text>
  <path d="M140,32 L140,70" class="edge"/>
  <path d="M69,155 L211,155 L205,210 L75,210 Z" class="blue" style="stroke:none"/>
  <path d="M60,74 L75,210 L205,210 L220,74" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="140" y="98" text-anchor="middle" class="sm">capacity B = 600,000</text>
  <text x="140" y="114" text-anchor="middle" class="sm">tokens (one minute)</text>
  <text x="140" y="188" text-anchor="middle" class="sm">tokens available</text>
  <path d="M140,210 L140,238" class="edge"/>
  <text x="140" y="256" text-anchor="middle" class="sm">each request takes its cost</text>
  <text x="140" y="272" text-anchor="middle" class="sm">admit only if tokens ≥ cost</text>

  <!-- Chart: x = 340 + 7.5 t (s), y = 240 - 0.3 L (thousand tokens) -->
  <line x1="340" y1="50" x2="340" y2="240" class="axis"/>
  <line x1="340" y1="240" x2="795" y2="240" class="axis"/>
  <line x1="340" y1="60" x2="790" y2="60" class="grid"/>
  <line x1="340" y1="150" x2="790" y2="150" class="grid"/>
  <text x="332" y="244" text-anchor="end" class="sm">0</text>
  <text x="332" y="154" text-anchor="end" class="sm">300K</text>
  <text x="332" y="64" text-anchor="end" class="sm">600K</text>
  <g class="sm" text-anchor="middle">
    <text x="340" y="258">0</text><text x="490" y="258">20</text><text x="640" y="258">40</text><text x="790" y="258">60 s</text>
  </g>
  <path d="M340,60 L377.5,60 L377.5,240 L790,75" class="level"/>
  <text x="390" y="64" class="sm">at 5 s: burst of 20 requests × 30,000 tokens</text>

  <!-- Rejected request at t = 6 s, level 10K -->
  <path d="M381,233 L389,241 M389,233 L381,241" stroke="#b85450" stroke-width="2.5"/>
  <line x1="390" y1="231" x2="420" y2="146" stroke="#999" stroke-width="1"/>
  <text x="400" y="122" class="sm">at 6 s: needs 30,000, has 10,000</text>
  <text x="400" y="138" class="sm b" style="fill:#b85450">→ 429, Retry-After: 2</text>

  <text x="560" y="214" class="sm">refills at 10,000 tokens per second</text>

  <text x="16" y="300">Wait = (cost − tokens) ÷ r = (30,000 − 10,000) ÷ 10,000 = 2 s</text>
</svg>
