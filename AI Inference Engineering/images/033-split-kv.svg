<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <pattern id="idle" x="40" y="74" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="14" height="14" rx="2" fill="#f5f5f5" stroke="#666" stroke-width="1"/></pattern>
    <pattern id="busy" x="440" y="74" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="14" height="14" rx="2" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/></pattern>
  </defs>
  <style>
    text{font-size:14px;fill:#000}
    .sm{font-size:12px}.b{font-weight:bold}
    .orange{fill:#ffe6cc;stroke:#d79b00;stroke-width:1.2}
    .green{fill:#d5e8d4;stroke:#82b366;stroke-width:1.2}
    .red{fill:#f8cecc;stroke:#b85450;stroke-width:1.2}
    .gray{fill:#f5f5f5;stroke:#666;stroke-width:1.2}
    .group{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:5 4}
    .edge{fill:none;stroke:#000;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- left: no split -->
  <rect x="20" y="16" width="380" height="290" rx="4" class="group"/>
  <text x="34" y="40" class="b">One block per (request, KV head)</text>
  <text x="34" y="60" class="sm">1 request × 8 KV heads = 8 thread blocks</text>
  <rect x="40" y="74" width="216" height="198" fill="url(#idle)"/>
  <rect x="40" y="74" width="14" height="14" rx="2" class="orange"/>
  <rect x="58" y="74" width="14" height="14" rx="2" class="orange"/>
  <rect x="76" y="74" width="14" height="14" rx="2" class="orange"/>
  <rect x="94" y="74" width="14" height="14" rx="2" class="orange"/>
  <rect x="112" y="74" width="14" height="14" rx="2" class="orange"/>
  <rect x="130" y="74" width="14" height="14" rx="2" class="orange"/>
  <rect x="148" y="74" width="14" height="14" rx="2" class="orange"/>
  <rect x="166" y="74" width="14" height="14" rx="2" class="orange"/>
  <text x="270" y="110" class="sm">8 of 132 SMs</text>
  <text x="270" y="126" class="sm">busy; each one</text>
  <text x="270" y="142" class="sm">streams all</text>
  <text x="270" y="158" class="sm">32,768 tokens</text>
  <rect x="34" y="282" width="352" height="18" rx="3" class="red"/>
  <text x="210" y="295" text-anchor="middle" class="sm">94% of the GPU idle: bandwidth far below 3.35 TB/s</text>

  <!-- right: split-KV -->
  <rect x="420" y="16" width="380" height="290" rx="4" class="group"/>
  <text x="434" y="40" class="b">Split-KV (Flash-Decoding)</text>
  <text x="434" y="60" class="sm">32 chunks of 1,024 tokens × 8 KV heads = 256 blocks</text>
  <rect x="440" y="74" width="216" height="198" fill="url(#busy)"/>
  <path d="M658,173 L690,173" class="edge"/>
  <rect x="692" y="132" width="100" height="82" rx="6" class="gray"/>
  <text x="742" y="154" text-anchor="middle" class="sm">reduce kernel:</text>
  <text x="742" y="170" text-anchor="middle" class="sm">merge 32 partial</text>
  <text x="742" y="186" text-anchor="middle" class="sm">outputs with their</text>
  <text x="742" y="202" text-anchor="middle" class="sm">log-sum-exp</text>
  <rect x="434" y="282" width="352" height="18" rx="3" class="green"/>
  <text x="610" y="295" text-anchor="middle" class="sm">all 132 SMs pull from HBM at once</text>

  <!-- legend -->
  <rect x="20" y="320" width="20" height="14" rx="3" class="orange"/><text x="48" y="332" class="sm">SM running an attention block</text>
  <rect x="260" y="320" width="20" height="14" rx="3" class="gray"/><text x="288" y="332" class="sm">idle SM</text>
  <text x="400" y="332" class="sm">Decode step for one request with a 32,768-token context, one layer</text>
</svg>
